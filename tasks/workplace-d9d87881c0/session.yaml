    Mrs Ibbotson's no-telephone flag stays on her record, merge or no merge. A flag like that is a promise to the person, not a field to tidy; her letter asking for it is in the paper log and she has never taken it back. I will not clear it to make a file run. I am sorry it makes tonight harder, and I know the claim file is drawn tonight.
