        \ 'w') as f:\n    json.dump(all_todos, f, indent=2)\n\nprint(\"\\nSample TODOs:\")\nfor todo in\
        \ all_todos[:5]:\n    print(f\"  {todo['file']}:{todo['line']} - {todo['text'][:60]}...\")\n"
