  - tool: python_execute
    arguments:
      code: "import json\n\n# Simulated survey summary for 100 in-person attendees\nattendees = 100\n\
        simulated = {\n    'in_person': 100,\n    'vegan': 8,\n    'vegetarian_non_vegan': 12,\n    'gluten_free':\
        \ 7,\n    'allergies': {\n        'peanut': 5,\n        'tree_nut': 3,\n        'shellfish': 4,\n\
        \        'soy': 2\n    },\n    'cultural': {\n        'halal': 4,\n        'kosher': 1\n    },\n\
        \    'other_prefs': {\n        'low_sodium': 8,\n        'no_spicy': 12\n    },\n    'strict_separation':\
        \ 6\n}\n\n# Menu participation based on dietary needs and typical choices\n# Everyone: romaine,\
        \ fruit\n# Cucumber salad: 50% of attendees\n# Eggplant-potato: 60%\n# Pine nut corn: 40% (but\
        \ tree-nut allergic will avoid pine nuts)\n# Proteins: vegans+vegetarians get vegan/veg mains;\
        \ remaining choose chicken/fish\n\nveg_total = simulated['vegan'] + simulated['vegetarian_non_vegan']\n\
        # We'll provide vegan protein portions = veg_total + 2 buffer\nvegan_protein_portions = veg_total\
        \ + 2\n# Fish demand: set at 8\nfish_portions = 8\n# Chicken portions = remaining attendees -\
        \ fish - vegan_protein_portions\nchicken_portions = attendees - fish_portions - vegan_protein_portions\n\
        \nparticipation = {\n    'romaine': attendees,\n    'sesame_paste_on_salad_pct': 0.30,\n    'cucumber_pct':\
        \ 0.50,\n    'eggplant_pct': 0.60,\n    'pine_nut_corn_pct': 0.40,\n    'corn_pct': 0.40,\n  \
        \  'pine_nuts_allergy_avoid_pct': simulated['allergies']['tree_nut']/attendees, # fraction avoiding\n\
        \    'tofu_portions': round(vegan_protein_portions * 0.6),\n    'enoki_portions': round(vegan_protein_portions\
        \ * 0.4),\n    'chicken_portions': chicken_portions,\n    'black_cod_portions': fish_portions,\n\
        \    'fruit': attendees\n}\n\n# Per-portion grams (from workbook assumptions)\nper_portion = {\n\
        \    'romaine': 100,\n    'sesame_paste': 10,\n    'cucumber': 120,\n    'tofu': 160,\n    'corn':\
        \ 200,\n    'pine_nuts': 30,\n    'eggplant': 100,\n    'potato': 150,\n    'black_cod': 220,\n\
        \    'chicken': 250,\n    'enoki': 140,\n    'fruit': 120\n}\n\n# Unit costs per kg (same as before)\n\
        unit_costs = {\n    'romaine': 3.50,\n    'cucumber': 2.00,\n    'tofu': 1.80/0.25,  # $ per kg\n\
        \    'corn': 1.50/0.4,\n    'pine_nuts': 35.0,\n    'eggplant': 2.20,\n    'potato': 0.80,\n \
        \   'black_cod': 18.0,\n    'chicken': 4.50,\n    'enoki': 6.0,\n    'fruit': 2.50,\n    'sesame_paste':\
        \ 6.0 # assumed $6/kg for sesame paste\n}\n\n# Calculate totals in g\ntotals_g = {}\n# salads\n\
        totals_g['romaine'] = per_portion['romaine'] * participation['romaine']\ntotals_g['sesame_paste']\
        \ = per_portion['sesame_paste'] * participation['romaine'] * participation['sesame_paste_on_salad_pct']\n\
        totals_g['cucumber'] = per_portion['cucumber'] * attendees * participation['cucumber_pct']\n#\
        \ veg hot\ntotals_g['eggplant'] = per_portion['eggplant'] * attendees * participation['eggplant_pct']\n\
        totals_g['potato'] = per_portion['potato'] * attendees * participation['eggplant_pct']\n# pine\
        \ nut corn\n# reduce pine nuts consumption due to allergy avoidance (some of pine_nut_corn_pct\
        \ will avoid)\npine_nut_eaters = attendees * participation['pine_nut_corn_pct'] * (1 - participation['pine_nuts_allergy_avoid_pct'])\n\
        totals_g['corn'] = per_portion['corn'] * attendees * participation['pine_nut_corn_pct']\ntotals_g['pine_nuts']\
        \ = per_portion['pine_nuts'] * pine_nut_eaters\n# proteins\ntotals_g['chicken'] = per_portion['chicken']\
        \ * participation['chicken_portions']\ntotals_g['black_cod'] = per_portion['black_cod'] * participation['black_cod_portions']\n\
        # vegan proteins\ntotals_g['tofu'] = per_portion['tofu'] * participation['tofu_portions']\ntotals_g['enoki']\
        \ = per_portion['enoki'] * participation['enoki_portions']\n# fruit\ntotals_g['fruit'] = per_portion['fruit']\
        \ * participation['fruit']\n\n# Apply waste factor\nwaste = 1.10\nfor k in list(totals_g.keys()):\n\
        \    totals_g[k] = round(totals_g[k] * waste, 1)\n\n# Convert to kg\ntotals_kg = {k: round(v/1000.0,3)\
        \ for k,v in totals_g.items()}\n\n# Costs\ncosts = {}\ntotal_ingredient_cost = 0.0\nfor ing,kg\
        \ in totals_kg.items():\n    price = unit_costs.get(ing, 0.0)\n    cost = kg * price\n    costs[ing]\
        \ = round(cost,2)\n    total_ingredient_cost += cost\n\n# Staffing & delivery estimates (assumptions)\n\
        staffing = {\n    'chefs': {'count':4, 'rate':300},\n    'kitchen_assistants': {'count':6, 'rate':150},\n\
        \    'servers': {'count':8, 'rate':120},\n    'delivery_vehicles': {'count':2, 'rate':150},\n\
        \    'onsite_lead': {'count':1, 'rate':250}\n}\nstaffing_cost = sum([v['count']*v['rate'] for\
        \ v in staffing.values()])\n\n# Equipment rental, packaging, venue fee estimate\nequipment_and_misc\
        \ = 500.0\n\n# Contingency and admin (percentage)\ncontingency_pct = 0.10\nadmin_pct = 0.12\n\n\
        subtotal = total_ingredient_cost + staffing_cost + equipment_and_misc\ncontingency = subtotal\
        \ * contingency_pct\nadmin = subtotal * admin_pct\nfinal_total = subtotal + contingency + admin\n\
        \nsummary = {\n    'simulated_survey': simulated,\n    'participation': participation,\n    'totals_g':\
        \ totals_g,\n    'totals_kg': totals_kg,\n    'ingredient_costs': costs,\n    'total_ingredient_cost':\
        \ round(total_ingredient_cost,2),\n    'staffing_cost': staffing_cost,\n    'equipment_and_misc':\
        \ equipment_and_misc,\n    'contingency': round(contingency,2),\n    'admin_fee': round(admin,2),\n\
        \    'final_total_estimate': round(final_total,2)\n}\n\nprint(json.dumps(summary, indent=2))\n\
        \n# Save summary to JSON file for later writing to workbook\nwith open('procurement_summary.json','w')\
        \ as f:\n    json.dump(summary,f,indent=2)\n\n"
      filename: simulate_and_compute.py
      timeout: 120
