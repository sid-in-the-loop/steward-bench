  - tool: python_execute
    arguments:
      code: "import json\n\n# Define menu ingredient per-portion (g) mapping\ningredients_per_portion\
        \ = {\n    'romaine': 100,\n    'sesame_paste': 10,  # ml ~ g\n    'cucumber': 120,\n    'tofu':\
        \ 160,  # use Menu portion for tofu (160g)\n    'corn': 200,\n    'pine_nuts': 30,\n    'eggplant':\
        \ 100,\n    'potato': 150,\n    'black_cod': 220,\n    'chicken': 250,\n    'enoki': 140,\n  \
        \  'fruit': 120\n}\n\n# Unit costs (per kg) converted where needed\nunit_costs_per_kg = {\n  \
        \  'romaine': 3.50,\n    'cucumber': 2.00,\n    'tofu': 1.80/0.25,  # $1.80 per 250g\n    'corn':\
        \ 1.50/0.4,   # $1.50 per 400g can\n    'pine_nuts': 35.0,\n    'eggplant': 2.20,\n    'potato':\
        \ 0.80,\n    'black_cod': 18.0,\n    'chicken': 4.50,\n    'enoki': 6.0,\n    'fruit': 2.50\n\
        }\n\n# Assumptions for dish participation per attendee (each attendee receives salad and fruit)\n\
        # Protein split across attendees: chicken 60%, fish 10%, vegan protein 30%\nprotein_split = {'chicken':\
        \ 0.60, 'black_cod': 0.10, 'tofu/enoki': 0.30}\n\n# Scenarios\nscenarios = [100, 200, 300]\n\n\
        waste_factor = 1.10  # 10% overage for waste/spoilage\n\nresults = {}\nfor n in scenarios:\n \
        \   totals = {k: 0.0 for k in ingredients_per_portion.keys()}\n    # All attendees get romaine\
        \ (salad) and fruit\n    totals['romaine'] += ingredients_per_portion['romaine'] * n\n    # Assume\
        \ sesame paste used only on 30% of salads (some omit)\n    totals['sesame_paste'] += ingredients_per_portion['sesame_paste']\
        \ * n * 0.30\n    # Also include cucumber salad served to all as side? We'll assume half take\
        \ cucumber\n    totals['cucumber'] += ingredients_per_portion['cucumber'] * n * 0.5\n    # Vegetarian\
        \ hot (eggplant-potato-pepper) offered, assume 70% of attendees take a portion\n    totals['eggplant']\
        \ += ingredients_per_portion['eggplant'] * n * 0.70\n    totals['potato'] += ingredients_per_portion['potato']\
        \ * n * 0.70\n    # Pine nut corn offered, assume 40% take it\n    totals['corn'] += ingredients_per_portion['corn']\
        \ * n * 0.40\n    totals['pine_nuts'] += ingredients_per_portion['pine_nuts'] * n * 0.40\n   \
        \ # Proteins based on split\n    totals['chicken'] += ingredients_per_portion['chicken'] * n *\
        \ protein_split['chicken']\n    totals['black_cod'] += ingredients_per_portion['black_cod'] *\
        \ n * protein_split['black_cod']\n    # Vegan protein: split between tofu and enoki 60/40\n  \
        \  vegan_count = n * protein_split['tofu/enoki']\n    totals['tofu'] += ingredients_per_portion['tofu']\
        \ * vegan_count * 0.60\n    totals['enoki'] += ingredients_per_portion['enoki'] * vegan_count\
        \ * 0.40\n    # Fruit for all\n    totals['fruit'] += ingredients_per_portion['fruit'] * n\n\n\
        \    # Apply waste factor and convert to kg\n    totals_kg = {k: (v * waste_factor) / 1000.0 for\
        \ k, v in totals.items()}\n\n    # Compute costs\n    costs = {}\n    total_cost = 0.0\n    for\
        \ ing, kg in totals_kg.items():\n        price = unit_costs_per_kg.get(ing, 0.0)\n        cost\
        \ = kg * price\n        costs[ing] = round(cost, 2)\n        total_cost += cost\n\n    results[n]\
        \ = {\n        'totals_g': {k: round(v,1) for k,v in totals.items()},\n        'totals_kg': {k:\
        \ round(v,3) for k,v in totals_kg.items()},\n        'costs': costs,\n        'total_cost': round(total_cost,2)\n\
        \    }\n\nprint(json.dumps(results, indent=2))\n"
      filename: compute_procurement.py
      timeout: 120
