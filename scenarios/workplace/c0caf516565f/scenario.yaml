  - tool: python_execute
    arguments:
      code: "import json\nfrom math import ceil\n\n# Load procurement summary\nwith open('procurement_summary.json','r')\
        \ as f:\n    summary = json.load(f)\n\ntotals_kg = summary['totals_kg']\n\n# Supplier pack sizes\
        \ (kg) and base prices per kg (same as earlier)\nsuppliers = {\n    'romaine': {'pack_kg':5, 'price':3.50,\
        \ 'discounts':[(50,0.05),(100,0.10)]},\n    'cucumber': {'pack_kg':10, 'price':2.00, 'discounts':[(50,0.05)]},\n\
        \    'tofu': {'pack_kg':5, 'price': (1.80/0.25), 'discounts':[(20,0.10)]},\n    'corn': {'pack_kg':5,\
        \ 'price': (1.50/0.4), 'discounts':[(50,0.05)]},\n    'pine_nuts': {'pack_kg':1, 'price':35.0,\
        \ 'discounts':[(5,0.05),(10,0.10)]},\n    'eggplant': {'pack_kg':10, 'price':2.20, 'discounts':[(50,0.05)]},\n\
        \    'potato': {'pack_kg':10, 'price':0.80, 'discounts':[(100,0.05)]},\n    'black_cod': {'pack_kg':5,\
        \ 'price':18.0, 'discounts':[(10,0.05)]},\n    'chicken': {'pack_kg':10, 'price':4.50, 'discounts':[(50,0.05),(100,0.10)]},\n\
        \    'enoki': {'pack_kg':1, 'price':6.0, 'discounts':[(10,0.05)]},\n    'fruit': {'pack_kg':10,\
        \ 'price':2.50, 'discounts':[(50,0.05)]},\n    'sesame_paste': {'pack_kg':1, 'price':6.0, 'discounts':[(10,0.05)]}\n\
        }\n\norders = {}\n\nfor ing, need_kg in totals_kg.items():\n    if ing not in suppliers:\n   \
        \     continue\n    s = suppliers[ing]\n    pack = s['pack_kg']\n    packs_needed = ceil(need_kg\
        \ / pack)\n    order_qty = packs_needed * pack\n    # determine discount rate based on order_qty\n\
        \    discount = 0.0\n    for qty_threshold,disc in sorted(s['discounts']):\n        if order_qty\
        \ >= qty_threshold:\n            discount = disc\n    unit_price = s['price'] * (1 - discount)\n\
        \    cost = round(order_qty * unit_price,2)\n    savings = round(order_qty * s['price'] - cost,2)\n\
        \    orders[ing] = {\n        'needed_kg': round(need_kg,3),\n        'pack_kg': pack,\n     \
        \   'packs': packs_needed,\n        'order_kg': order_qty,\n        'base_price_per_kg': s['price'],\n\
        \        'discount': discount,\n        'price_per_kg_after_discount': round(unit_price,3),\n\
        \        'cost': cost,\n        'savings': savings\n    }\n\n# Totals\ntotal_order_cost = sum([v['cost']\
        \ for v in orders.values()])\n\nresult = {'orders': orders, 'total_order_cost': round(total_order_cost,2),\
        \ 'assumptions': {\n    'packaging_and_moq_assumptions': 'Pack sizes are typical; discounts applied\
        \ at thresholds. Adjust with real supplier MOQs.'\n}}\n\nwith open('optimized_orders.json','w')\
        \ as f:\n    json.dump(result,f,indent=2)\n\nprint(json.dumps(result,indent=2))\n"
      filename: optimize_orders.py
      timeout: 120
