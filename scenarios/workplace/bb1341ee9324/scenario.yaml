        , \"resource-monitor\"\n]\n\n# Generate template files for each task\ndef generate_task_files(task_name):\n\
        \    return [\n        {\"path\": f\"tasks/finalpool/{task_name}/docs/agent_system_prompt.md\"\
        , \"content\": f\"# Agent System Prompt\\n\\n## General Requirements\\nPlease complete the implementation\
        \ for {task_name} in a beautiful way!\\n\"},\n        {\"path\": f\"tasks/finalpool/{task_name}/docs/task.md\"\
        , \"content\": f\"# Task: {task_name}\\n\\n## Description\\nComplete the implementation for {task_name}\\\
        n\\n\"},\n        {\"path\": f\"tasks/finalpool/{task_name}/docs/user_system_prompt.md\", \"content\"\
        : f\"This is an user system prompt for {task_name}\\n\"},\n        {\"path\": f\"tasks/finalpool/{task_name}/evaluation/main.py\"\
        , \"content\": f\"# Evaluation script for {task_name}\\n\\ndef run_evaluation():\\n    # TODO:\
