        , \"backup-utility\", \"network-analyzer\", \"cms-builder\",\n    \"search-engine\", \"alert-system\"\
        , \"reminder-service\", \"payment-processor\",\n    \"data-analytics\", \"content-manager\", \"\
        email-campaign\", \"email-classification-system\",\n    \"social-publisher\", \"qr-generator\"\
        , \"monitoring-agent\", \"sentiment-analyzer\",\n    \"voice-processor\", \"content-scheduler\"\
        , \"follow-up-reminder\", \"expense-tracker\",\n    \"price-tracker\", \"activity-logger\", \"\
        blog-engine\", \"form-builder\",\n    \"error-tracker\", \"template-engine\", \"pdf-report-generator\"\
        , \"file-manager\",\n    \"personalization-service\", \"order-processor\", \"canvas-grade-automation\"\
        , \"deal-manager\",\n    \"calendar-sync\", \"canvas-automation\", \"image-processor\", \"asset-optimizer\"\
        ,\n    \"subtitle-generator\", \"product-catalog\", \"video-trimmer\", \"load-balancer\",\n  \
        \  \"data-validator\", \"invoice-generator\", \"task-scheduler\", \"shipment-tracker\",\n    \"\
        coupon-manager\", \"permission-manager\", \"feedback-collector\", \"chat-bot\",\n    \"security-scanner\"\
        , \"deployment-tool\", \"tag-manager\", \"robots-handler\",\n    \"media-organizer\", \"currency-converter\"\
        , \"social-connector\", \"client-portal\",\n    \"insights-engine\", \"health-monitor\", \"audit-logger\"\
        , \"resource-monitor\"\n]\n\n# Generate template files for each task\ndef generate_task_files(task_name):\n\
        \    return [\n        {\n            \"path\": f\"tasks/finalpool/{task_name}/docs/agent_system_prompt.md\"\
        ,\n            \"content\": f\"# Agent System Prompt\\n\\n## General Requirements\\nPlease complete\
        \ the implementation for {task_name} in a beautiful way!\\n\"\n        },\n        {\n       \
        \     \"path\": f\"tasks/finalpool/{task_name}/docs/task.md\",\n            \"content\": f\"#\
        \ Task: {task_name}\\n\\n## Description\\nComplete the implementation for {task_name}\\n\\n\"\n\
        \        },\n        {\n            \"path\": f\"tasks/finalpool/{task_name}/docs/user_system_prompt.md\"\
        ,\n            \"content\": f\"This is an user system prompt for {task_name}\\n\"\n        },\n\
        \        {\n            \"path\": f\"tasks/finalpool/{task_name}/evaluation/main.py\",\n     \
        \       \"content\": f\"# Evaluation script for {task_name}\\n\\ndef run_evaluation():\\n    #\
        \ TODO: Implement actual evaluation logic\\n    return True\\n\\nif __name__ == '__main__':\\\
        n    result = run_evaluation()\\n    if result:\\n        print('Evaluation passed')\\n    else:\\\
        n        print('Evaluation failed')\\n\"\n        },\n        {\n            \"path\": f\"tasks/finalpool/{task_name}/groundtruth_workspace/readme.txt\"\
        ,\n            \"content\": f\"Groundtruth data for {task_name}\\n\"\n        },\n        {\n\
        \            \"path\": f\"tasks/finalpool/{task_name}/initial_workspace/readme.txt\",\n      \
        \      \"content\": f\"Initial workspace for {task_name}\\n\"\n        },\n        {\n       \
        \     \"path\": f\"tasks/finalpool/{task_name}/preprocess/main.py\",\n            \"content\"\
        : \"# Preprocessing script\\nprint('Preprocessing completed')\\n\"\n        }\n    ]\n\n# Tasks\
        \ 11-20\nbatch2_tasks = all_implemented_tasks[10:20]\nbatch2_files = []\nfor task_name in batch2_tasks:\n\
        \    batch2_files.extend(generate_task_files(task_name))\n\nwith open('/workspace/dumps/workspace/batch2_files.json',\
        \ 'w') as f:\n    json.dump(batch2_files, f)\n\nprint(f\"Batch 2 tasks: {batch2_tasks}\")\nprint(f\"\
        Generated {len(batch2_files)} files\")\n"
