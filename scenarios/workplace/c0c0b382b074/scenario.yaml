      start_cell: A1
  - tool: create_worksheet
    arguments:
      filepath: /workspace/dumps/steward_run/SingleUserTurn-sf-sales-customer-loyalty/workspace/Customer_Loyalty_Report.xlsx
      sheet_name: Summary
  - tool: read_query
    arguments:
      query: "SELECT COUNT(*) AS total_combinations,\n       (SELECT CONCAT(segment, ' - ', region) FROM\
        \ (\n            SELECT segment, region, AVG(lifetime_value) AS avg_ltv\n            FROM \"SALES_DW\"\
        .\"PUBLIC\".\"CUSTOMERS\"\n            GROUP BY segment, region\n            ORDER BY avg_ltv\
        \ DESC\n            LIMIT 1\n       ) t) AS highest_ltv_group,\n       SUM(customers_count * avg_ltv_raw)\
        \ / SUM(customers_count) AS overall_avg_ltv\nFROM (\n    SELECT segment, region, COUNT(DISTINCT\
        \ customer_id) AS customers_count, AVG(lifetime_value) AS avg_ltv_raw\n    FROM \"SALES_DW\".\"\
        PUBLIC\".\"CUSTOMERS\"\n    GROUP BY segment, region\n) sub;"
  - tool: read_query
    arguments:
      query: "SELECT COUNT(*) AS total_combinations,\n       (SELECT CONCAT(\"SEGMENT\", ' - ', \"REGION\"\
        ) FROM (\n            SELECT \"SEGMENT\" AS segment, \"REGION\" AS region, AVG(\"LIFETIME_VALUE\"\
        ) AS avg_ltv\n            FROM \"SALES_DW\".\"PUBLIC\".\"CUSTOMERS\"\n            GROUP BY \"\
        SEGMENT\", \"REGION\"\n            ORDER BY avg_ltv DESC\n            LIMIT 1\n       ) t) AS\
        \ highest_ltv_group,\n       SUM(customers_count * avg_ltv_raw) / SUM(customers_count) AS overall_avg_ltv\n\
        FROM (\n    SELECT \"SEGMENT\", \"REGION\", COUNT(DISTINCT \"CUSTOMER_ID\") AS customers_count,\
        \ AVG(\"LIFETIME_VALUE\") AS avg_ltv_raw\n    FROM \"SALES_DW\".\"PUBLIC\".\"CUSTOMERS\"\n   \
        \ GROUP BY \"SEGMENT\", \"REGION\"\n) sub;"
  - tool: read_query
    arguments:
      query: "WITH agg AS (\n    SELECT \"SEGMENT\" AS segment, \"REGION\" AS region, COUNT(DISTINCT \"\
        CUSTOMER_ID\") AS customers_count, AVG(\"LIFETIME_VALUE\") AS avg_ltv\n    FROM \"SALES_DW\".\"\
        PUBLIC\".\"CUSTOMERS\"\n    GROUP BY \"SEGMENT\", \"REGION\"\n)\nSELECT (SELECT COUNT(*) FROM\
        \ agg) AS total_combinations,\n       (SELECT segment || ' - ' || region FROM agg ORDER BY avg_ltv\
        \ DESC LIMIT 1) AS highest_ltv_group,\n       ROUND((SELECT SUM(customers_count * avg_ltv) / SUM(customers_count)\
        \ FROM agg)::numeric, 2) AS overall_avg_ltv\n;"
  - tool: write_data_to_excel
    arguments:
      filepath: /workspace/dumps/steward_run/SingleUserTurn-sf-sales-customer-loyalty/workspace/Customer_Loyalty_Report.xlsx
      sheet_name: Summary
      data:
      - - Total_Combinations
        - Highest_LTV_Group
        - Overall_Avg_LTV
      - - '20'
        - Enterprise - Asia Pacific
        - '1455.52'
      start_cell: A1
  - tool: read_text_file
    arguments:
      path: /workspace/dumps/steward_run/SingleUserTurn-sf-sales-customer-loyalty/workspace/Customer_Loyalty_Report.xlsx
  - tool: send_email
    arguments:
      to: marketing@company.com
      subject: Customer Loyalty Analysis
      body: 'Hi team,


        Attached is the Customer Loyalty analysis by segment and region. The highest-value segment-region
        combinations are:


        - Enterprise - Asia Pacific (highest average LTV)

        - SMB - Middle East

        - Consumer - Latin America


        Please review and let me know if you need further breakdowns or a visualization.


        Best,

        Analytics Team'
      html_body: ''
      cc: ''
      bcc: ''
      attachments:
      - /workspace/dumps/steward_run/SingleUserTurn-sf-sales-customer-loyalty/workspace/Customer_Loyalty_Report.xlsx
  - tool: claim_done
    arguments:
      command: claim_done {}
