        \n    # Create a BOM dictionary for easier lookup\n    bom = {}\n    for item in bom_data['values'][1:]:\
        \  # Skip header row\n        product_sku, material_sku, quantity = item\n        if product_sku\
        \ not in bom:\n            bom[product_sku] = []\n        bom[product_sku].append({'material':\
        \ material_sku, 'quantity': float(quantity)})\n\n    # Create a raw materials dictionary\n   \
        \ raw_materials = {item[0]: int(item[1]) for item in raw_materials_data['values'][1:]}\n\n   \
        \ # Calculate raw material consumption from orders\n    consumption = {}\n    for order in orders:\n\
        \        for item in order['line_items']:\n            sku = item['sku']\n            quantity\
