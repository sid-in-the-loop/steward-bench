        \    LISTAGG(f.FILENAME, ', ') as OUTSTANDING_FILENAMES,\n    COUNT(*) as NUM_OUTSTANDING,\n \
        \   SUM(i.INVOICE_AMOUNT - p.PAYMENT_AMOUNT) as TOTAL_OUTSTANDING_AMOUNT\nFROM PURCHASE_INVOICE.PUBLIC.INVOICES\
