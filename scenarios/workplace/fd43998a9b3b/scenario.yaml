  - tool: canvas-canvas_submit_assignment_with_file
    arguments:
      assignment_id: 42
      course_id: 60
      file_path: /workspace/dumps/workspace/homeworks/mine/A6_Contemporary_Cinema_Answer.md
  - tool: emails-send_email
    arguments:
