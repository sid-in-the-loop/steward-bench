      content: "import math\nimport statistics\n\ndef main():\n    # Hard-coded sample extraction from\
        \ data warehouse for this environment\n    # We'll query via exported CSV or assume data from\
        \ SQL client; for now embed counts from queries\n    dept_stats = {\n        'Engineering': {\n\
        \            'ratings': [],\n            'headcount': 7096,\n            'avg_rating': 3.2113866967305524,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2535,\n            'low_count': 375\n        },\n        'Finance': {\n  \
        \          'ratings': [],\n            'headcount': 7148,\n            'avg_rating': 3.211247901510912,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2510,\n            'low_count': 334\n        },\n        'HR': {\n       \
        \     'ratings': [],\n            'headcount': 7077,\n            'avg_rating': 3.2037586547972303,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2485,\n            'low_count': 358\n        },\n        'Operations': {\n\
        \            'ratings': [],\n            'headcount': 7120,\n            'avg_rating': 3.1828651685393257,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2426,\n            'low_count': 380\n        },\n        'R&D': {\n      \
        \      'ratings': [],\n            'headcount': 7083,\n            'avg_rating': 3.1968092616123114,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2478,\n            'low_count': 362\n        },\n        'Sales': {\n    \
        \        'ratings': [],\n            'headcount': 7232,\n            'avg_rating': 3.1866703539823007,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2523,\n            'low_count': 373\n        },\n        'Support': {\n  \
        \          'ratings': [],\n            'headcount': 7244,\n            'avg_rating': 3.1956101601325235,\n\
        \            'median_rating': 3.0,\n            'p25': 3.0,\n            'p75': 4.0,\n       \
        \     'high_count': 2515,\n            'low_count': 371\n        }\n    }\n\n    # Overall distribution\n\
        \    distribution = {1:2553, 2:7459, 3:22516, 4:12464, 5:5008}\n\n    total = sum(distribution.values())\n\
        \n    print('Department statistics:')\n    for d, s in dept_stats.items():\n        pct_high =\
        \ s['high_count'] / s['headcount'] * 100\n        pct_low = s['low_count'] / s['headcount'] *\
        \ 100\n        print(f\"{d}: headcount={s['headcount']}, avg={s['avg_rating']:.2f}, median={s['median_rating']},\
        \ pct_high={pct_high:.1f}%, pct_low={pct_low:.1f}%, p25={s['p25']}, p75={s['p75']}\")\n\n    print('\\\
        nOverall rating distribution:')\n    for r in range(1,6):\n        cnt = distribution.get(r,0)\n\
        \        pct = cnt/total*100\n        print(f\"Rating {r}: count={cnt}, pct={pct:.1f}%\")\n\n\
        if __name__ == '__main__':\n    main()\n"
