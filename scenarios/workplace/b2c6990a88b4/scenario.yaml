  - tool: write_file
    arguments:
      path: ' /workspace/dumps/steward_run/SingleUserTurn-terminal-wc-pdf-excel-ppt-email/workspace/customer_impact.py'
      content: "import json\nimport os\nfrom collections import defaultdict\n\nWORKDIR = os.path.dirname(__file__)\n\
        \nwith open(os.path.join(WORKDIR, 'orders.json')) as f:\n    orders = json.load(f)\n\nwith open(os.path.join(WORKDIR,\
        \ 'products.json')) as f:\n    products = json.load(f)\n\n# Load recall impact to know which SKUs\
        \ are recalled\nrecall_impact_path = os.path.join(WORKDIR, 'recall_impact.json')\nwith open(recall_impact_path)\
        \ as f:\n    recall = json.load(f)\nrecalled_product_names = set(p['product_name'] for p in recall['products'])\n\
        \n# Map product names to SKUs from products.json\nname_to_sku = {p['product_name']: p['sku'] for\
        \ p in products}\nrecalled_skus = set()\nfor name in recalled_product_names:\n    sku = name_to_sku.get(name)\n\
        \    if sku:\n        recalled_skus.add(sku)\n# fallback: check SKUs in recall_impact products\n\
        if not recalled_skus:\n    for p in recall['products']:\n        recalled_skus.add(p['sku'])\n\
        \ncustomer_summary = defaultdict(lambda: {'products': set(), 'order_dates': set(), 'total_amount':\
        \ 0.0})\n\nfor order in orders:\n    email = order['billing_email']\n    for line in order['lines']:\n\
        \        if line['sku'] in recalled_skus:\n            customer_summary[email]['products'].add(line['product_name'])\n\
        \            customer_summary[email]['order_dates'].add(order['order_date'])\n            customer_summary[email]['total_amount']\
        \ += line['line_total']\n\n# Prepare output\noutput = []\nfor email, data in customer_summary.items():\n\
        \    output.append({\n        'customer_email': email,\n        'products_affected': ';'.join(sorted(data['products'])),\n\
        \        'order_dates': ';'.join(sorted(data['order_dates'])),\n        'total_amount': round(data['total_amount'],\
        \ 2)\n    })\n\n# Save to customer_impact.json\nwith open(os.path.join(WORKDIR, 'customer_impact.json'),\
        \ 'w') as f:\n    json.dump(output, f, indent=2)\n\nprint('customer_impact.json written to', WORKDIR)\n\
        print(json.dumps(output, indent=2))\n"
