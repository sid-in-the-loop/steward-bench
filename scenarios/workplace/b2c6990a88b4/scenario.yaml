        \ncustomer_summary = defaultdict(lambda: {'products': set(), 'order_dates': set(), 'total_amount':\
        \ 0.0})\n\nfor order in orders:\n    email = order['billing_email']\n    for line in order['lines']:\n\
        \        if line['sku'] in recalled_skus:\n            customer_summary[email]['products'].add(line['product_name'])\n\
        \            customer_summary[email]['order_dates'].add(order['order_date'])\n            customer_summary[email]['total_amount']\
