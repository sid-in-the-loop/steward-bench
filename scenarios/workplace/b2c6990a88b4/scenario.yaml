        \n# Map product names to SKUs from products.json\nname_to_sku = {p['product_name']: p['sku'] for\
        \ p in products}\nrecalled_skus = set()\nfor name in recalled_product_names:\n    sku = name_to_sku.get(name)\n\
        \    if sku:\n        recalled_skus.add(sku)\n# fallback: check SKUs in recall_impact products\n\
