        \    output.append({\n        'customer_email': email,\n        'products_affected': ';'.join(sorted(data['products'])),\n\
        \        'order_dates': ';'.join(sorted(data['order_dates'])),\n        'total_amount': round(data['total_amount'],\
        \ 2)\n    })\n\n# Save to customer_impact.json\nwith open(os.path.join(WORKDIR, 'customer_impact.json'),\
