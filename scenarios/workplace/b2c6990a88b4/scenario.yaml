        \ 0.0)\n            })\n    if order_has_recall:\n        affected_orders.append(order)\n\n# Build\
        \ results per recalled product\nresults = {\n    'products': [],\n    'overall': {}\n}\n\ntotal_units\
        \ = 0\ntotal_orders_set = set()\ntotal_revenue = 0.0\n\nfor sku, data in recalled_skus.items():\n\
