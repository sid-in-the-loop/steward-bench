  - tool: snowflake-read_query
    arguments:
      query: "\n    SELECT\n        st.ticket_number,\n        st.created_at,\n        st.first_response_at,\n\
        \        u.email AS user_email,\n        u.customer_manager,\n        u.service_level\n    FROM\n\
        \        SLA_MONITOR.PUBLIC.SUPPORT_TICKETS AS st\n    JOIN\n        SLA_MONITOR.PUBLIC.USERS\
        \ AS u ON st.user_id = u.id\n    WHERE\n        st.status = 'open' AND st.first_response_at IS\
        \ NULL;\n    "
