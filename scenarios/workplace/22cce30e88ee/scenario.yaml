    arguments:
      command: ls -la /workspace/dumps/workspace/Application_Materials_flat
  - tool: filesystem-move_file
    arguments:
      source: /workspace/dumps/workspace/Application_Materials_flat/Recommendation_Letter_1.pdf
      destination: /workspace/dumps/workspace/Application_Materials_MaryCastillo_2201210606/03_Recommendation_Letters/Recommendation_Letter_Professor1-1.pdf
  - tool: filesystem-move_file
    arguments:
      source: /workspace/dumps/workspace/Application_Materials_flat/Recommendation_Letter_1.pdf
      destination: /workspace/dumps/workspace/Application_Materials_MaryCastillo_2201210606/03_Recommendation_Letters/Recommendation_Letter_Professor1-1.pdf
  - tool: filesystem-move_file
