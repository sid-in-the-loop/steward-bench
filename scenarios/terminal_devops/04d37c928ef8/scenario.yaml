        a deliberate 12-major upgrade as well as a pin, not the no-op its one-line ticket framing implied.
        `install.sh` does download → verify → extract → export; that order is load-bearing, so an unverified
        archive never reaches an executable location. It exports `PROTOC` and `PROTOC_INCLUDE` via `$GITHUB_ENV`
        as well as prepending to `$GITHUB_PATH`, because `prost-build` resolves `PROTOC` **before** falling
        back to a `PATH` lookup — that makes the install authoritative regardless of `PATH` ordering,
        and moots the well-known-type `include/` tree having to sit beside the binary. **`verify.sh` must
        stay its own step**: `$GITHUB_PATH`/`$GITHUB_ENV` writes do not affect the step that makes them,
        so an assertion folded back into `install.sh` would validate a local `export PATH=` rather than
        the mechanism cargo sees, and would be structurally blind to the propagation failure it exists
        to catch. Only `Linux-X64`, `macOS-ARM64` and `Windows-X64` are supported; anything else exits
        non-zero naming the file to edit. `linux-aarch_64` is deliberately absent even though `agentcore-image`
        runs on `ubuntu-24.04-arm` (it has no protoc step) — an unexercised digest is an unexercised code
        path, and a wrong one reads as tampering rather than as a typo.


        **Nothing tracks the protoc pin — bumping it is a human act with no prompt.** Dependabot follows
        action SHAs, and after SMA-458 there is no third-party action here for it to follow at all. It
        sits alongside the repo''s other hand-bumped pins: `TEMPORAL_CLI_VERSION`/`TEMPORAL_CLI_SHA256`
        in `integration.yml` and `NIGHTLY_TOOLCHAIN` in `ci.yml`. **Bump runbook:** edit `PROTOC_VERSION`
        and all three digests in `.github/actions/setup-protoc/install.sh` and `EXPECTED_VERSION` in `verify.sh`,
        then run `bash .github/actions/setup-protoc/selftest.sh` — it re-downloads every published asset
        and fails if any pinned digest disagrees, and also exercises the tampered-digest and unsupported-platform
        paths. `actionlint` lints `.github/workflows/*.yml` and **not** `action.yml`, so `shellcheck`
        on the three scripts is the only lint coverage the install logic has. **A checksum mismatch is
        not a signal to update the digest** — the causes are, in order, a truncated download, an upstream
        re-tag, and tampering; verify upstream independently first. The accepted cost of pinning is that
        it does not self-heal: if protobuf removes or replaces the v35.1 assets, every required job and
        `release-plz` go red until someone bumps the pin.


