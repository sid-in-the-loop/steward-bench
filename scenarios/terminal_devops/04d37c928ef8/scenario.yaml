    arguments:
      file_path: /Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-458-protoc-pin/.github/actions/setup-protoc/selftest.sh
      content: "#!/usr/bin/env bash\n# Local self-test for the setup-protoc composite action.\n#\n# NOT\
        \ run by CI — in CI the action itself is the test. This exists so the install\n# logic can be\
        \ exercised, and a version bump re-verified, without pushing a\n# commit. Run it after changing\
        \ PROTOC_VERSION or any digest.\n#\n#   bash .github/actions/setup-protoc/selftest.sh\n#\n# Requires\
        \ network access. The Windows branch of install.sh cannot be exercised\n# here (it needs cygpath\
        \ and 7z) — CI's `test (windows-latest, stable)` is the\n# only thing covering it, and that job\
        \ is NOT a required context, so confirm it\n# by hand before merging.\nset -uo pipefail\n\nhere=\"\
        $(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nfailures=0\npass() { printf '  ok    %s\\\
        n' \"$1\"; }\nfail() { printf '  FAIL  %s\\n' \"$1\"; failures=$((failures + 1)); }\n\nsha256_of()\
        \ {\n  if command -v sha256sum > /dev/null 2>&1; then\n    sha256sum \"$1\" | awk '{print $1}'\n\
        \  else\n    shasum -a 256 \"$1\" | awk '{print $1}'\n  fi\n}\n\ncase \"$(uname -s)-$(uname -m)\"\
        \ in\n  Darwin-arm64) native_os=macOS; native_arch=ARM64 ;;\n  Linux-x86_64) native_os=Linux;\
        \ native_arch=X64   ;;\n  *) echo \"selftest: no native mapping for $(uname -s)-$(uname -m)\"\
        ; exit 1 ;;\nesac\n\nversion=\"$(awk -F'\"' '/^PROTOC_VERSION=/ {print $2}' \"${here}/install.sh\"\
        )\"\necho \"selftest: install.sh pins protoc ${version}\"\n\n# --- 1. every pinned digest still\
        \ matches the published asset ----------------\necho \"1. pinned digests match published assets\"\
        \nwhile read -r var asset; do\n  expected=\"$(awk -F'\"' -v pat=\"^${var}=\" '$0 ~ pat {print\
        \ $2}' \"${here}/install.sh\")\"\n  tmp=\"$(mktemp -d)\"\n  url=\"https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-${asset}.zip\"\
        \n  if curl -sSfL --retry 3 -o \"${tmp}/a.zip\" \"${url}\"; then\n    actual=\"$(sha256_of \"\
        ${tmp}/a.zip\")\"\n    if [ \"${actual}\" = \"${expected}\" ]; then\n      pass \"${asset}\"\n\
        \    else\n      fail \"${asset}: pinned ${expected}, published ${actual}\"\n    fi\n  else\n\
        \    fail \"${asset}: download failed (${url})\"\n  fi\n  rm -rf \"${tmp}\"\ndone <<'ASSETS'\n\
        SHA256_LINUX_X64 linux-x86_64\nSHA256_MACOS_ARM64 osx-aarch_64\nSHA256_WINDOWS_X64 win64\nASSETS\n\
        \n# --- 2. native install, then the real verify.sh must pass --------------------\necho \"2. native\
        \ install + verify (${native_os}-${native_arch})\"\nt2=\"$(mktemp -d)\"\nif env RUNNER_OS=\"${native_os}\"\
        \ RUNNER_ARCH=\"${native_arch}\" RUNNER_TEMP=\"${t2}\" \\\n       GITHUB_PATH=\"${t2}/gh_path\"\
        \ GITHUB_ENV=\"${t2}/gh_env\" \\\n       bash \"${here}/install.sh\" > \"${t2}/install.log\" 2>&1;\
        \ then\n  pass \"install.sh exited 0\"\nelse\n  fail \"install.sh failed\"; sed 's/^/      /'\
        \ \"${t2}/install.log\"\nfi\n\n# Reproduce what the runner does between steps: GITHUB_ENV lines\
        \ become the next\n# step's environment, GITHUB_PATH lines are prepended to PATH.\nif [ -s \"\
        ${t2}/gh_env\" ] && [ -s \"${t2}/gh_path\" ]; then\n  set -a; . \"${t2}/gh_env\"; set +a\n  PATH=\"\
        $(head -n 1 \"${t2}/gh_path\"):${PATH}\"; export PATH\n  if env RUNNER_OS=\"${native_os}\" bash\
        \ \"${here}/verify.sh\" > \"${t2}/verify.log\" 2>&1; then\n    pass \"verify.sh exited 0\"\n \
        \ else\n    fail \"verify.sh failed\"; sed 's/^/      /' \"${t2}/verify.log\"\n  fi\nelse\n  fail\
        \ \"install.sh exported nothing to GITHUB_ENV/GITHUB_PATH\"\nfi\n\n# --- 3. cross-platform install\
        \ lays down bin/ + include/ ---------------------\n# Exercises a non-native digest and extraction\
        \ path. The binary is not executed.\nif [ \"${native_os}\" != \"Linux\" ]; then\n  echo \"3. cross-platform\
        \ install (Linux-X64)\"\n  t3=\"$(mktemp -d)\"\n  if env RUNNER_OS=Linux RUNNER_ARCH=X64 RUNNER_TEMP=\"\
        ${t3}\" \\\n         GITHUB_PATH=\"${t3}/gh_path\" GITHUB_ENV=\"${t3}/gh_env\" \\\n         bash\
        \ \"${here}/install.sh\" > \"${t3}/install.log\" 2>&1; then\n    pass \"install.sh exited 0\"\n\
        \  else\n    fail \"install.sh failed\"; sed 's/^/      /' \"${t3}/install.log\"\n  fi\n  [ -f\
        \ \"${t3}/protoc-${version}/bin/protoc\" ] \\\n    && pass \"bin/protoc present\" || fail \"bin/protoc\
        \ missing\"\n  [ -f \"${t3}/protoc-${version}/include/google/protobuf/timestamp.proto\" ] \\\n\
        \    && pass \"include tree present\" || fail \"include tree missing\"\n  [ -x \"${t3}/protoc-${version}/bin/protoc\"\
        \ ] \\\n    && pass \"executable bit set\" || fail \"executable bit not set\"\nelse\n  echo \"\
        3. cross-platform install — skipped (native host is already Linux-X64)\"\nfi\n\n# --- 4. a bad\
        \ digest must fail closed ---------------------------------------\n# Asserts the security property,\
        \ not just the exit code: on a mismatch nothing\n# is exported AND nothing is extracted. That\
        \ is what proves the\n# verify-before-extract ordering actually holds.\necho \"4. tampered digest\
        \ fails closed\"\nt4=\"$(mktemp -d)\"\nzeros=\"$(printf '%064d' 0)\"\nsed -E \"s/\\\"[0-9a-f]{64}\\\
        \"/\\\"${zeros}\\\"/\" \"${here}/install.sh\" > \"${t4}/tampered.sh\"\nenv RUNNER_OS=\"${native_os}\"\
        \ RUNNER_ARCH=\"${native_arch}\" RUNNER_TEMP=\"${t4}\" \\\n    GITHUB_PATH=\"${t4}/gh_path\" GITHUB_ENV=\"\
        ${t4}/gh_env\" \\\n    bash \"${t4}/tampered.sh\" > \"${t4}/out.log\" 2>&1\nrc=$?\n[ \"${rc}\"\
        \ -ne 0 ] && pass \"exited non-zero (${rc})\" || fail \"exited 0 on a bad digest\"\ngrep -q \"\
        checksum mismatch\" \"${t4}/out.log\" \\\n  && pass \"reported a checksum mismatch\" || fail \"\
        no checksum-mismatch error\"\n[ ! -s \"${t4}/gh_env\" ] \\\n  && pass \"exported nothing to GITHUB_ENV\"\
        \ || fail \"exported to GITHUB_ENV despite mismatch\"\n[ ! -s \"${t4}/gh_path\" ] \\\n  && pass\
        \ \"exported nothing to GITHUB_PATH\" || fail \"exported to GITHUB_PATH despite mismatch\"\n[\
        \ ! -e \"${t4}/protoc-${version}/bin\" ] \\\n  && pass \"extracted nothing\" || fail \"an unverified\
        \ archive was extracted\"\n\n# --- 5. an unsupported platform fails loudly --------------------------------\n\
        echo \"5. unsupported platform fails loudly\"\nt5=\"$(mktemp -d)\"\nenv RUNNER_OS=Plan9 RUNNER_ARCH=X64\
        \ RUNNER_TEMP=\"${t5}\" \\\n    GITHUB_PATH=\"${t5}/gh_path\" GITHUB_ENV=\"${t5}/gh_env\" \\\n\
        \    bash \"${here}/install.sh\" > \"${t5}/out.log\" 2>&1\nrc=$?\n[ \"${rc}\" -ne 0 ] && pass\
        \ \"exited non-zero (${rc})\" || fail \"exited 0 on an unknown platform\"\ngrep -q \"install.sh\"\
        \ \"${t5}/out.log\" \\\n  && pass \"error names the file to edit\" || fail \"error does not say\
        \ where to add support\"\n\necho\nif [ \"${failures}\" -eq 0 ]; then\n  echo \"selftest: PASS\"\
        \nelse\n  echo \"selftest: FAIL (${failures})\"\n  exit 1\nfi\n"
  - tool: Bash
    arguments:
      command: bash .github/actions/setup-protoc/selftest.sh 2>&1 | tail -30; echo "EXIT=${PIPESTATUS[0]}"
      description: Run selftest before implementation to confirm it fails
      timeout: 300000
  - tool: Bash
    arguments:
      command: bash .github/actions/setup-protoc/selftest.sh
      description: Run selftest before implementation to confirm it fails
      timeout: 300000
  - tool: Write
    arguments:
      file_path: /Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-458-protoc-pin/.github/actions/setup-protoc/install.sh
      content: "#!/usr/bin/env bash\n# Install a pinned, checksum-verified protoc and expose it to later\
        \ steps.\n#\n# Runner contract — all read from the environment, all fakeable locally, which\n\
        # is how selftest.sh exercises this file:\n#   RUNNER_OS, RUNNER_ARCH  select the release asset\n\
        #   RUNNER_TEMP             scratch space for the download\n#   GITHUB_PATH             file;\
        \ each line appended is prepended to PATH\n#   GITHUB_ENV              file; each KEY=VALUE appended\
        \ is exported\n#\n# Order is load-bearing: download -> verify -> extract -> export. An unverified\n\
        # archive must never reach an executable location.\nset -euo pipefail\n\nPROTOC_VERSION=\"35.1\"\
        \n\n# Hand-bumped; nothing tracks these automatically. Dependabot follows action\n# SHAs, and\
        \ after SMA-458 there is no third-party action here for it to follow.\n# Derived 2026-08-13 with\
        \ `shasum -a 256` from:\n#   https://github.com/protocolbuffers/protobuf/releases/tag/v35.1\n\
        # Bump runbook: CLAUDE.md, \"protoc pin\". Re-verify with selftest.sh.\nSHA256_LINUX_X64=\"6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7\"\
        \nSHA256_MACOS_ARM64=\"193289af0470c6a1aada357d4fba0bbf8d78bfaac8b5e42ca30af2ef75583de2\"\nSHA256_WINDOWS_X64=\"\
        5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082\"\n\ncase \"${RUNNER_OS}-${RUNNER_ARCH}\"\
        \ in\n  Linux-X64)   asset=\"linux-x86_64\"; expected=\"${SHA256_LINUX_X64}\";   exe=\"protoc\"\
        \     ;;\n  macOS-ARM64) asset=\"osx-aarch_64\"; expected=\"${SHA256_MACOS_ARM64}\"; exe=\"protoc\"\
        \     ;;\n  Windows-X64) asset=\"win64\";        expected=\"${SHA256_WINDOWS_X64}\"; exe=\"protoc.exe\"\
        \ ;;\n  *)\n    echo \"::error::setup-protoc has no asset for ${RUNNER_OS}-${RUNNER_ARCH}. Add\
        \ the asset name and its SHA-256 to .github/actions/setup-protoc/install.sh.\"\n    exit 1\n \
        \   ;;\nesac\n\n# RUNNER_TEMP is a Win32 path on Windows runners; bash needs the POSIX form.\n\
        if [ \"${RUNNER_OS}\" = \"Windows\" ]; then\n  temp=\"$(cygpath -u \"${RUNNER_TEMP}\")\"\nelse\n\
        \  temp=\"${RUNNER_TEMP}\"\nfi\n\nroot=\"${temp}/protoc-${PROTOC_VERSION}\"\narchive=\"${temp}/protoc-${PROTOC_VERSION}-${asset}.zip\"\
        \nrm -rf \"${root}\"\nmkdir -p \"${root}\"\n\n# The tag carries a leading v (v35.1); the filename\
        \ does not (protoc-35.1-...).\n# Mixing them 404s.\nurl=\"https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip\"\
        \n\necho \"setup-protoc: asset    ${asset}\"\necho \"setup-protoc: url      ${url}\"\n\n# Retries\
        \ are not decoration: this runs in 11 job executions per PR, nine of\n# them behind required contexts,\
        \ plus the crates.io publish path.\ncurl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \\\
        \n     --connect-timeout 15 --max-time 300 \\\n     -o \"${archive}\" \"${url}\"\n\n# macOS has\
        \ no sha256sum; Linux runners and Git Bash do. Both accept the same\n# \"DIGEST  PATH\" output\
        \ format.\nif command -v sha256sum > /dev/null 2>&1; then\n  actual=\"$(sha256sum \"${archive}\"\
        \ | awk '{print $1}')\"\nelse\n  actual=\"$(shasum -a 256 \"${archive}\" | awk '{print $1}')\"\
        \nfi\n\necho \"setup-protoc: expected ${expected}\"\necho \"setup-protoc: actual   ${actual}\"\
        \n\nif [ \"${actual}\" != \"${expected}\" ]; then\n  echo \"::error::protoc checksum mismatch\
        \ for ${asset}. Likely causes, in order: (1) truncated or corrupted download; (2) the upstream\
        \ release was re-tagged or its asset replaced; (3) tampering. DO NOT update the digest in install.sh\
        \ without independently verifying the upstream release.\"\n  exit 1\nfi\n\n# unzip preserves the\
        \ archive's Unix mode. Expand-Archive and python zipfile do\n# not, and the resulting non-executable\
        \ protoc fails with \"Permission denied\"\n# deep inside a cargo build script, far from here.\
        \ 7z ships on the Windows\n# runner image; unzip is not guaranteed in Git Bash.\nif [ \"${RUNNER_OS}\"\
        \ = \"Windows\" ]; then\n  7z x -y -o\"${root}\" \"${archive}\" > /dev/null\nelse\n  unzip -q\
        \ \"${archive}\" -d \"${root}\"\n  chmod +x \"${root}/bin/${exe}\"\nfi\n\nbin_dir=\"${root}/bin\"\
        \nprotoc_bin=\"${bin_dir}/${exe}\"\ninclude_dir=\"${root}/include\"\n\n# GITHUB_PATH and GITHUB_ENV\
        \ are consumed by the runner, not by bash. On Windows\n# a POSIX /d/a/... entry is a dead PATH\
        \ entry to CreateProcess when cargo spawns\n# protoc: it looks correct from inside bash and fails\
        \ everywhere else.\nif [ \"${RUNNER_OS}\" = \"Windows\" ]; then\n  bin_dir=\"$(cygpath -w \"${bin_dir}\"\
        )\"\n  protoc_bin=\"$(cygpath -w \"${protoc_bin}\")\"\n  include_dir=\"$(cygpath -w \"${include_dir}\"\
        )\"\nfi\n\necho \"${bin_dir}\" >> \"${GITHUB_PATH}\"\n\n# prost-build resolves PROTOC from the\
        \ environment before falling back to a PATH\n# lookup, so exporting it makes this install authoritative\
        \ regardless of PATH\n# ordering. PROTOC_INCLUDE carries the well-known types (google/protobuf/*.proto)\n\
        # that protoc would otherwise resolve relative to its own binary.\n{\n  echo \"PROTOC=${protoc_bin}\"\
        \n  echo \"PROTOC_INCLUDE=${include_dir}\"\n} >> \"${GITHUB_ENV}\"\n\necho \"setup-protoc: installed\
        \ ${protoc_bin}\"\n"
  - tool: Write
    arguments:
      file_path: /Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-458-protoc-pin/.github/actions/setup-protoc/verify.sh
      content: "#!/usr/bin/env bash\n# Assert that the protoc later steps will actually use is the pinned\
        \ one.\n#\n# This MUST run as its own composite step. GITHUB_PATH and GITHUB_ENV writes do\n#\
        \ not affect the step that makes them, only later steps — so an assertion living\n# inside install.sh\
        \ would validate a local `export PATH=`, not the mechanism\n# cargo sees, and would be structurally\
        \ blind to the propagation failure it\n# exists to catch.\nset -euo pipefail\n\nEXPECTED_VERSION=\"\
        libprotoc 35.1\"\n\nif [ -z \"${PROTOC:-}\" ]; then\n  echo \"::error::PROTOC is unset — install.sh\
        \ did not export it, or GITHUB_ENV did not propagate.\"\n  exit 1\nfi\n\n# PROTOC is a Win32 path\
        \ on Windows; bash needs the POSIX form to exec it.\nif [ \"${RUNNER_OS:-}\" = \"Windows\" ];\
        \ then\n  protoc_bin=\"$(cygpath -u \"${PROTOC}\")\"\n  include_dir=\"$(cygpath -u \"${PROTOC_INCLUDE}\"\
        )\"\nelse\n  protoc_bin=\"${PROTOC}\"\n  include_dir=\"${PROTOC_INCLUDE}\"\nfi\n\n# Windows protoc\
        \ emits a trailing CR; a bare compare fails on a CORRECT install.\nexported_version=\"$(\"${protoc_bin}\"\
        \ --version | tr -d '\\r')\"\nresolved=\"$(command -v protoc || true)\"\n\necho \"setup-protoc:\
        \ PROTOC   ${PROTOC}\"\necho \"setup-protoc: resolved ${resolved}\"\necho \"setup-protoc: version\
        \  ${exported_version}\"\n\n# 1. The compiler prost-build will actually use is the pinned one.\n\
        if [ \"${exported_version}\" != \"${EXPECTED_VERSION}\" ]; then\n  echo \"::error::PROTOC reports\
        \ '${exported_version}', expected '${EXPECTED_VERSION}'.\"\n  exit 1\nfi\n\n# 2. The PATH fallback\
        \ resolves, and resolves to the same version. A version\n#    check alone would pass if some other\
        \ 35.1 protoc were first on PATH, so\n#    the resolved location is logged for exactly that case.\n\
        if [ -z \"${resolved}\" ]; then\n  echo \"::error::protoc is not on PATH — GITHUB_PATH did not\
        \ propagate.\"\n  exit 1\nfi\n\npath_version=\"$(protoc --version | tr -d '\\r')\"\nif [ \"${path_version}\"\
        \ != \"${EXPECTED_VERSION}\" ]; then\n  echo \"::error::PATH resolves protoc to '${path_version}'\
        \ at ${resolved}, expected '${EXPECTED_VERSION}'.\"\n  exit 1\nfi\n\n# 3. The well-known types\
        \ survived extraction. Without this sibling tree every\n#    google/protobuf/*.proto import fails\
        \ — which is every temporal proto.\nif [ ! -f \"${include_dir}/google/protobuf/timestamp.proto\"\
        \ ]; then\n  echo \"::error::well-known types missing at ${include_dir}/google/protobuf/ — extraction\
        \ dropped the include tree.\"\n  exit 1\nfi\n\necho \"setup-protoc: ok\"\n"
  - tool: Write
    arguments:
      file_path: /Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-458-protoc-pin/.github/actions/setup-protoc/action.yml
      content: "name: \"Setup protoc\"\ndescription: >-\n  Install a pinned, checksum-verified protoc\
        \ and expose it to later steps via\n  PROTOC, PROTOC_INCLUDE and PATH. Replaces arduino/setup-protoc\
        \ (SMA-458).\n\nruns:\n  using: composite\n  steps:\n    # Composite actions have NO default shell:\
        \ `shell:` is mandatory on every\n    # run step or the runner rejects the action outright.\n\
        \    - name: Download and verify protoc\n      shell: bash\n      run: bash \"${GITHUB_ACTION_PATH}/install.sh\"\
        \n\n    # Deliberately a separate step — see the header comment in verify.sh.\n    - name: Assert\
        \ the pinned protoc is in effect\n      shell: bash\n      run: bash \"${GITHUB_ACTION_PATH}/verify.sh\"\
        \n"
  - tool: Bash
