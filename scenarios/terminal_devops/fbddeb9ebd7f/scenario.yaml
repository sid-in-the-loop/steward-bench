        ci: derive SemVer version bumps automatically from PR title


        Version bumps were half-manual: release-cut.yml auto-cut the tag when an

        untagged version landed on main, but the tier (major/minor/patch), the

        pyproject edit, and the uv.lock regen were left to whoever drove the session

