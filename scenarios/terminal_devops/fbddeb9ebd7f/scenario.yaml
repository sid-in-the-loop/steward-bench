    arguments:
      questions:
      - question: The bump-commit push needs a non-default token or CI won't re-run on it. Which will
          you provision?
        header: Push token
        multiSelect: false
        options:
        - label: Fine-grained PAT (Recommended)
          description: 'You create a fine-grained PAT scoped to this repo (Contents: write, Pull requests:
            write), store it as a repo secret (e.g. BUMP_TOKEN). Simplest for a solo repo. I''ll wire
            the workflow to use it.'
        - label: GitHub App token
          description: Create/install a GitHub App, mint a token per-run via actions/create-github-app-token.
