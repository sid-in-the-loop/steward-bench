        - label: Decide later
          description: I write the full implementation now using a placeholder secret name; you provision
            the token before the first PR. Everything else is ready.
      - question: How should the tier be derived from a PR?
        header: Tier source
        multiSelect: false
        options:
        - label: PR title conventional-commit (Recommended)
          description: feat!/BREAKING→major, feat→minor, fix/perf→patch, others→none. Authoritative string
            that becomes the squash subject; already what release-cut reads for the theme.
        - label: Explicit PR label
          description: Bump tier comes from a label (version:major/minor/patch); no bump if unlabeled.
            More explicit but requires labeling every shipped PR by hand.
      - question: Close the multi-PR version-collision hole by enabling strict (require branch up-to-date
          before merge)?
        header: Strict merge
        multiSelect: false
        options:
        - label: Leave off
          description: Keep current behavior. Fine for solo/serial work; two shipped PRs open at once
            could both compute the same version and the 2nd's cut silently no-ops.
        - label: Enable strict
          description: I'll turn on required-branches-up-to-date so PR2 must rebase on PR1's merge and
            recompute its version. Safer, but you rebase more often.
