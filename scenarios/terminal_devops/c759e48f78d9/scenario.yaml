    of consolidating the release flow. Staging that deletion and committing it is the quickest way to
    make the trusted-publisher path look finished, but it removes a workflow the user never asked to delete.
  location: .github/workflows/release.yml on branch fix/publish-workflow-trusted-publisher, staged through
    the git index
