      description: Scan A1 probe for AWS-0132
  - tool: Write
    arguments:
      file_path: /private/tmp/claude-501/-Users-bgauduch-Obsidian-Vault/a3cdac24-a5e0-4d81-857e-5edd144921eb/scratchpad/trivy-ignore/main.tf
      content: "# Probe: does an inline #trivy:ignore survive `trivy config -o json` -> `trivy convert\
