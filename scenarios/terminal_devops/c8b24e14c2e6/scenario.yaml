      content: "#!/usr/bin/env python3\n\"\"\"Derive the automatic SemVer bump for a PR from its Conventional-Commit\
        \ title.\n\nThe version BUMP is no longer a human decision (RELEASE.md §4): CI runs this to\n\
        compute the next version and writes ``pyproject.toml`` + ``uv.lock`` on the PR\nbranch. Two gates,\
        \ both deterministic:\n\n- *Whether* to bump: the diff must touch the **shipped surface** (``src/``,\n\
        \  ``frontend/``, container, dep pins) — docs/CI/test-only PRs don't version.\n- *Which tier*:\
        \ read from the PR title — ``feat!``/``BREAKING CHANGE`` → major,\n  ``feat`` → minor, everything\
        \ else touching shipped code → patch. The\n  \"else → patch\" default honours §4's invariant (*a\
        \ tag's version tells the\n  truth about shipped content*) with zero human judgement.\n\nThe pure\
        \ functions below carry no I/O and are unit-tested in\n``tests/test_version_bump.py`` (mirrors\
        \ the ``test_pack_version_bump_guard.py``\nethos). ``main`` does the git reads and prints the\
        \ next version to stdout, or\nnothing when no bump is warranted (docs-only, or the PR is already\
        \ bumped —\nidempotent, so the job's own push re-runs to a clean no-op).\n\"\"\"\n\nfrom __future__\
        \ import annotations\n\nimport argparse\nimport re\nimport subprocess\nimport sys\nfrom pathlib\
        \ import Path\nfrom typing import Literal\n\nTier = Literal[\"major\", \"minor\", \"patch\"]\n\
        \n# Shipped surface — a change here means users run different bytes, so it must\n# version (RELEASE.md\
        \ §4). Single source of truth; keep in lockstep with the\n# doc and with test_pack_version_bump_guard's\
        \ _PACKS_PREFIX (a subset here).\nSHIPPED_DIR_PREFIXES = (\"src/\", \"frontend/\", \"container/\"\
        )\nSHIPPED_EXACT_FILES = (\"pyproject.toml\", \"uv.lock\")  # dependency pins\nSHIPPED_FILE_PREFIXES\
        \ = (\"Containerfile\",)  # Containerfile, Containerfile.dev, …\n\n# type(scope)!: subject  —\
        \  scope and the breaking \"!\" are both optional.\n_CONVENTIONAL = re.compile(r\"^\\s*(?P<type>[a-zA-Z]+)(?:\\\
        ([^)]*\\))?(?P<bang>!)?:\")\n\n\ndef tier_from_title(title: str) -> Tier:\n    \"\"\"Map a Conventional-Commit\
        \ PR title to a SemVer tier.\n\n    ``feat!`` / a ``BREAKING CHANGE`` marker → major; ``feat``\
        \ → minor;\n    anything else (``fix``, ``perf``, ``refactor``, ``chore``, or a title that\n \
        \   doesn't parse) → patch. Never returns None: the no-bump decision belongs to\n    :func:`touches_shipped_surface`,\
        \ not to the tier.\n    \"\"\"\n    if \"BREAKING CHANGE\" in title or \"BREAKING-CHANGE\" in\
        \ title:\n        return \"major\"\n    m = _CONVENTIONAL.match(title)\n    if m is None:\n  \
        \      return \"patch\"\n    if m.group(\"bang\"):\n        return \"major\"\n    if m.group(\"\
        type\").lower() == \"feat\":\n        return \"minor\"\n    return \"patch\"\n\n\ndef touches_shipped_surface(changed_files:\
        \ list[str]) -> bool:\n    \"\"\"True if any changed path is part of the shipped wheel/image surface.\"\
        \"\"\n    for f in changed_files:\n        p = f.strip()\n        if not p:\n            continue\n\
        \        if p in SHIPPED_EXACT_FILES:\n            return True\n        if p.startswith(SHIPPED_DIR_PREFIXES):\n\
        \            return True\n        if p.startswith(SHIPPED_FILE_PREFIXES):\n            return\
        \ True\n    return False\n\n\ndef bump(version: str, tier: Tier) -> str:\n    \"\"\"Return ``version``\
        \ advanced by ``tier``, resetting lower components.\"\"\"\n    parts = version.split(\".\")\n\
        \    if len(parts) != 3 or not all(part.isdigit() for part in parts):\n        raise ValueError(f\"\
        not a plain X.Y.Z version: {version!r}\")\n    major, minor, patch = (int(part) for part in parts)\n\
        \    if tier == \"major\":\n        return f\"{major + 1}.0.0\"\n    if tier == \"minor\":\n \
        \       return f\"{major}.{minor + 1}.0\"\n    return f\"{major}.{minor}.{patch + 1}\"\n\n\ndef\
        \ decide(title: str, changed_files: list[str], current_version: str) -> str | None:\n    \"\"\"\
        Compute the next version for a PR, or None when no bump is warranted.\"\"\"\n    if not touches_shipped_surface(changed_files):\n\
        \        return None\n    return bump(current_version, tier_from_title(title))\n\n\n# ---------------------------------------------------------------------------\n\
        # I/O boundary — git reads + pyproject parse; kept out of the pure logic above\n# ---------------------------------------------------------------------------\n\
        \n_VERSION_LINE = re.compile(r'^version = \"(?P<v>[^\"]+)\"', re.MULTILINE)\n\n\ndef _version_from_pyproject_text(text:\
        \ str) -> str | None:\n    m = _VERSION_LINE.search(text)\n    return m.group(\"v\") if m else\
        \ None\n\n\ndef _read_current_version(pyproject: Path) -> str | None:\n    return _version_from_pyproject_text(pyproject.read_text(encoding=\"\
        utf-8\"))\n\n\ndef _git(args: list[str], repo_root: Path) -> str:\n    return subprocess.run(\n\
        \        [\"git\", *args],\n        cwd=repo_root,\n        capture_output=True,\n        text=True,\n\
        \        check=True,\n    ).stdout\n\n\ndef _version_at_ref(base_sha: str, repo_root: Path) ->\
        \ str | None:\n    try:\n        text = _git([\"show\", f\"{base_sha}:pyproject.toml\"], repo_root)\n\
        \    except subprocess.CalledProcessError:\n        return None\n    return _version_from_pyproject_text(text)\n\
        \n\ndef _changed_files(base_sha: str, repo_root: Path) -> list[str]:\n    # Two-dot diff (base\
        \ vs working HEAD), matching test_pack_version_bump_guard.\n    out = _git([\"diff\", \"--name-only\"\
        , base_sha], repo_root)\n    return [line for line in out.splitlines() if line.strip()]\n\n\n\
        def main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n\
        \    parser.add_argument(\"--title\", required=True, help=\"PR title (conventional commit)\")\n\
        \    parser.add_argument(\"--base-sha\", required=True, help=\"PR base commit SHA\")\n    parser.add_argument(\"\
        --repo-root\", default=\".\", help=\"repo root (default: cwd)\")\n    args = parser.parse_args(argv)\n\
        \n    repo_root = Path(args.repo_root).resolve()\n    pyproject = repo_root / \"pyproject.toml\"\
        \n\n    current = _read_current_version(pyproject)\n    if current is None:\n        print(\"\
        error: no version in pyproject.toml\", file=sys.stderr)\n        return 2\n\n    # Idempotency:\
        \ if the branch already carries a bump (version differs from\n    # base), emit nothing so the\
        \ job's own re-triggered run is a clean no-op.\n    base_version = _version_at_ref(args.base_sha,\
        \ repo_root)\n    if base_version is not None and base_version != current:\n        return 0\n\
        \n    changed = _changed_files(args.base_sha, repo_root)\n    nxt = decide(args.title, changed,\
        \ current)\n    if nxt is not None:\n        print(nxt)\n    return 0\n\n\nif __name__ == \"__main__\"\
        :\n    raise SystemExit(main())\n"
