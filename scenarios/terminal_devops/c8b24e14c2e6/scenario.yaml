        \ version.** If you edited any `src/agentalloy/_packs/<pack>/`\n  content, still bump that pack's\
        \ own `version` — pack propagation is\n  version-gated by design (SkillVersion rollback chain),\
        \ and the `quality` job's\n  pack guard fails the PR on a content edit without it. This is separate\
        \ from the\n  project version and is **not** automated."
