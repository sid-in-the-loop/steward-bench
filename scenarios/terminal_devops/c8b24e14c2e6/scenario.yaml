        ],\n            [],\n            [\"\"],\n        ],\n    )\n    def test_not_shipped(self, changed:\
        \ list[str]) -> None:\n        assert vb.touches_shipped_surface(changed) is False\n\n\nclass\
        \ TestBump:\n    @pytest.mark.parametrize(\n        (\"version\", \"tier\", \"expected\"),\n \
        \       [\n            (\"7.0.7\", \"patch\", \"7.0.8\"),\n            (\"7.0.7\", \"minor\",\
