        sys.path.insert(0, str(Path(__file__).resolve().parent.parent / \"scripts\"))\n\nimport version_bump\
        \ as vb  # noqa: E402\n\n\nclass TestTierFromTitle:\n    @pytest.mark.parametrize(\n        (\"\
        title\", \"expected\"),\n        [\n            (\"feat: add responses surface\", \"minor\"),\n\
        \            (\"feat(code): index worktrees\", \"minor\"),\n            (\"feat!: drop the hook\
