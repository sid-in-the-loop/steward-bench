        \ version: str, tier: str, expected: str) -> None:\n        assert vb.bump(version, tier) == expected\
        \  # type: ignore[arg-type]\n\n    @pytest.mark.parametrize(\"bad\", [\"7.0\", \"7.0.0.1\", \"\
