      content: "name: Version Bump\n\n# Derives the SemVer bump automatically from the PR's Conventional-Commit\
        \ title\n# and writes pyproject.toml + uv.lock onto the PR branch, so the version bump is\n# no\
        \ longer a per-session human/LLM decision (RELEASE.md §4). Tier: feat! /\n# BREAKING CHANGE →\
