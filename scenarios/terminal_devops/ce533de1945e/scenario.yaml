    arguments:
      task_id: '13266'
      description: '**Goal:** Run a local embedding model that the Go API can call to generate vectors
        from wiki text. **Prod-only — skip on staging/UAT.**


        **Production server specs (verified):**

        - 8-core AMD EPYC 9354P, 31GB RAM (22GB free), 240GB disk free

        - No GPU — CPU-only, which is fine for embedding models

        - Currently running ~60 containers using ~4.5GB RAM


        **What to do:**

        1. Add Ollama service to `docker-compose.prod.yml` (or conditional in main compose)

        2. Pre-pull `all-minilm:l6-v2` model (384 dims, ~80MB, fast on CPU)

        3. Add Go client in `api/internal/embeddings/` to call Ollama''s `/api/embed` endpoint

        4. Add config env vars: `OLLAMA_URL`, `EMBEDDING_MODEL` (default: all-minilm)

        5. Add health check for Ollama service

        6. Handle graceful degradation — if Ollama is unavailable (staging/UAT), indexing works but skips
        embedding

        7. **Do NOT add Ollama to staging/UAT compose files** — those are ARM64 smaller boxes


        **Key files:**

        - `docker-compose.yml` — add ollama service (prod-only via profile or separate override)

        - `api/internal/embeddings/client.go` — new package

        - `api/internal/config/config.go` — new env vars'
  - tool: Write
    arguments:
      file_path: /Users/anshumanbiswas/.claude/plans/staged-soaring-quilt.md
      content: "# Wiki Vector Search — Implementation Plan\n\n## Context\nTaskAI wiki search currently\
        \ uses ILIKE substring matching — no ranking, no semantic understanding. PostgreSQL has tsvector+GIN\
        \ indexes built but unused. Goal: add local vector embeddings so LLMs via MCP can find the most\
        \ relevant wiki content fast. Everything local, single hardware (prod: 8-core EPYC, 31GB RAM,\
        \ no GPU). Skip Ollama on staging/UAT (ARM64, smaller).\n\n## Execution Order\n\n### Step 1: pgvector\
        \ + schema migration (Task #37)\n- Create migration: `CREATE EXTENSION IF NOT EXISTS vector`\n\
        - Add to `wiki_blocks`: `embedding vector(384)`, `embedding_model VARCHAR`, `embedded_at TIMESTAMPTZ`\n\
        - HNSW index on embedding column\n- Update Ent schema if needed (or raw SQL for vector ops)\n\
        - Files: `api/internal/db/migrations/`, `docker-compose.yml` (postgres image may need pgvector)\n\
        \n### Step 2: Ollama sidecar + Go embedding client (Task #38)\n- Add `ollama/ollama` service to\
        \ docker-compose (prod-only via env/profile)\n- Pull `all-minilm:l6-v2` on container start\n-\
        \ New package `api/internal/embeddings/` with `Client` struct\n  - `Embed(ctx, text) ([]float32,\
        \ error)`\n  - `EmbedBatch(ctx, texts) ([][]float32, error)`\n- Config: `OLLAMA_URL` env var,\
        \ graceful nil-client when not configured\n- Files: `docker-compose.yml`, `api/internal/embeddings/client.go`,\
        \ `api/internal/config/config.go`\n\n### Step 3: Wire indexing pipeline (Task #39)\n- Modify `wiki_indexing.go`\
        \ `indexPage()`: after block extraction, call embeddings client\n- Batch embed all blocks: `input\
        \ = headings_path + \"\\n\" + plain_text`\n- Raw SQL to store vectors (Ent doesn't support pgvector\
        \ natively)\n- Skip embedding if client is nil (staging/UAT graceful degradation)\n- Files: `api/internal/api/wiki_indexing.go`\n\
        \n### Step 4: Activate FTS in search handler (Task #40)\n- Replace ILIKE with `ts_rank() + @@`\
        \ using `plainto_tsquery()`\n- Return rank score in response\n- Fallback to ILIKE if FTS returns\
        \ 0 results\n- Files: `api/internal/api/wiki_search_handlers.go`\n\n### Step 5: Semantic search\
        \ endpoint + MCP tool (Task #41)\n- New handler `POST /api/wiki/semantic-search`\n- Embed query\
        \ via Ollama → `ORDER BY embedding <=> query_vector`\n- New MCP tool `semantic_search_wiki` in\
        \ `mcp/src/index.ts`\n- Files: `api/internal/api/wiki_search_handlers.go`, `api/internal/api/routes.go`,\
        \ `mcp/src/index.ts`\n\n### Step 6: Hybrid search (Task #42)\n- Add `mode` param to existing search:\
        \ `keyword`, `semantic`, `hybrid`\n- Hybrid: run FTS + vector in parallel, normalize scores, combine\
        \ with tunable alpha\n- Update `search_wiki` MCP tool with mode param\n- Files: `api/internal/api/wiki_search_handlers.go`,\
        \ `mcp/src/index.ts`\n\n### Step 7: Feedback/improvement mechanism (Task #43)\n- Search feedback\
        \ API (record clicks/usage)\n- Block annotations (search_keywords, search_summary)\n- Bulk re-embed\
        \ endpoint + MCP tool\n- Files: new migration, handlers, MCP tools\n\n## Verification\n1. Deploy\
        \ to prod with Ollama sidecar\n2. Wait for indexing cycle (2 min) to embed all wiki blocks\n3.\
        \ Use `semantic_search_wiki` MCP tool from this conversation to test queries\n4. Compare results:\
        \ ILIKE vs FTS vs semantic vs hybrid\n5. Verify staging/UAT still work without Ollama (graceful\
        \ degradation)\n"
