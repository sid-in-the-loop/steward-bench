      content: "-- Enable pgvector extension for vector similarity search\nCREATE EXTENSION IF NOT EXISTS\
        \ vector;\n\n-- Add embedding columns to wiki_blocks\nALTER TABLE wiki_blocks ADD COLUMN IF NOT\
        \ EXISTS embedding vector(384);\nALTER TABLE wiki_blocks ADD COLUMN IF NOT EXISTS embedding_model\
        \ VARCHAR(100);\nALTER TABLE wiki_blocks ADD COLUMN IF NOT EXISTS embedded_at TIMESTAMPTZ;\n\n\
        -- HNSW index for fast approximate nearest neighbor search (cosine distance)\nCREATE INDEX IF\
        \ NOT EXISTS wiki_blocks_embedding_hnsw\n    ON wiki_blocks USING hnsw (embedding vector_cosine_ops)\n\
        \    WITH (m = 16, ef_construction = 64);\n"
  - tool: Write
    arguments:
      file_path: /Users/anshumanbiswas/play/taskai/api/internal/embeddings/client.go
      content: "package embeddings\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t\"encoding/json\"\n\t\"\
        fmt\"\n\t\"io\"\n\t\"net/http\"\n\t\"time\"\n\n\t\"go.uber.org/zap\"\n)\n\n// Client calls an\
        \ Ollama-compatible embedding API.\n// A nil *Client is safe to use — all methods return nil embeddings.\n\
        type Client struct {\n\tbaseURL    string\n\tmodel      string\n\thttpClient *http.Client\n\t\
        logger     *zap.Logger\n}\n\n// NewClient creates a new embedding client. Returns nil if baseURL\
        \ is empty\n// (graceful degradation for environments without Ollama).\nfunc NewClient(baseURL,\
        \ model string, logger *zap.Logger) *Client {\n\tif baseURL == \"\" {\n\t\tlogger.Info(\"Embeddings\
        \ disabled (OLLAMA_URL not set)\")\n\t\treturn nil\n\t}\n\tif model == \"\" {\n\t\tmodel = \"\
        all-minilm:l6-v2\"\n\t}\n\treturn &Client{\n\t\tbaseURL: baseURL,\n\t\tmodel:   model,\n\t\thttpClient:\
        \ &http.Client{\n\t\t\tTimeout: 30 * time.Second,\n\t\t},\n\t\tlogger: logger,\n\t}\n}\n\n// Model\
        \ returns the model name used for embeddings.\nfunc (c *Client) Model() string {\n\tif c == nil\
        \ {\n\t\treturn \"\"\n\t}\n\treturn c.model\n}\n\n// embedRequest is the Ollama /api/embed request\
        \ body.\ntype embedRequest struct {\n\tModel string   `json:\"model\"`\n\tInput []string `json:\"\
        input\"`\n}\n\n// embedResponse is the Ollama /api/embed response body.\ntype embedResponse struct\
        \ {\n\tEmbeddings [][]float32 `json:\"embeddings\"`\n}\n\n// Embed generates an embedding for\
        \ a single text.\n// Returns nil if the client is nil (embeddings disabled).\nfunc (c *Client)\
        \ Embed(ctx context.Context, text string) ([]float32, error) {\n\tif c == nil {\n\t\treturn nil,\
        \ nil\n\t}\n\tvectors, err := c.EmbedBatch(ctx, []string{text})\n\tif err != nil {\n\t\treturn\
        \ nil, err\n\t}\n\tif len(vectors) == 0 {\n\t\treturn nil, fmt.Errorf(\"empty embedding response\"\
        )\n\t}\n\treturn vectors[0], nil\n}\n\n// EmbedBatch generates embeddings for multiple texts in\
        \ a single call.\n// Returns nil if the client is nil (embeddings disabled).\nfunc (c *Client)\
        \ EmbedBatch(ctx context.Context, texts []string) ([][]float32, error) {\n\tif c == nil {\n\t\t\
        return nil, nil\n\t}\n\tif len(texts) == 0 {\n\t\treturn nil, nil\n\t}\n\n\treqBody := embedRequest{\n\
        \t\tModel: c.model,\n\t\tInput: texts,\n\t}\n\tbody, err := json.Marshal(reqBody)\n\tif err !=\
        \ nil {\n\t\treturn nil, fmt.Errorf(\"marshal embed request: %w\", err)\n\t}\n\n\treq, err :=\
        \ http.NewRequestWithContext(ctx, http.MethodPost, c.baseURL+\"/api/embed\", bytes.NewReader(body))\n\
        \tif err != nil {\n\t\treturn nil, fmt.Errorf(\"create embed request: %w\", err)\n\t}\n\treq.Header.Set(\"\
        Content-Type\", \"application/json\")\n\n\tresp, err := c.httpClient.Do(req)\n\tif err != nil\
        \ {\n\t\treturn nil, fmt.Errorf(\"embed request failed: %w\", err)\n\t}\n\tdefer resp.Body.Close()\n\
        \n\tif resp.StatusCode != http.StatusOK {\n\t\trespBody, _ := io.ReadAll(resp.Body)\n\t\treturn\
        \ nil, fmt.Errorf(\"embed request returned %d: %s\", resp.StatusCode, string(respBody))\n\t}\n\
        \n\tvar result embedResponse\n\tif err := json.NewDecoder(resp.Body).Decode(&result); err != nil\
        \ {\n\t\treturn nil, fmt.Errorf(\"decode embed response: %w\", err)\n\t}\n\n\tif len(result.Embeddings)\
        \ != len(texts) {\n\t\treturn nil, fmt.Errorf(\"expected %d embeddings, got %d\", len(texts),\
        \ len(result.Embeddings))\n\t}\n\n\treturn result.Embeddings, nil\n}\n\n// Healthy checks if Ollama\
        \ is reachable. Returns false if client is nil.\nfunc (c *Client) Healthy(ctx context.Context)\
        \ bool {\n\tif c == nil {\n\t\treturn false\n\t}\n\treq, err := http.NewRequestWithContext(ctx,\
        \ http.MethodGet, c.baseURL+\"/api/tags\", nil)\n\tif err != nil {\n\t\treturn false\n\t}\n\t\
        resp, err := c.httpClient.Do(req)\n\tif err != nil {\n\t\treturn false\n\t}\n\tresp.Body.Close()\n\
        \treturn resp.StatusCode == http.StatusOK\n}\n"
