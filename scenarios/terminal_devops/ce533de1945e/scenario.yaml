      old_string: // AutocompletePageRequest represents a page autocomplete request
      new_string: "// searchWikiFTS uses PostgreSQL tsvector full-text search with ranking.\nfunc (s *Server)\
        \ searchWikiFTS(ctx context.Context, userID int64, req SearchWikiRequest) ([]SearchResultBlock,\
        \ error) {\n\taccessibleProjects, err := s.getUserAccessibleProjects(ctx, userID)\n\tif err !=\
        \ nil {\n\t\treturn nil, err\n\t}\n\tif len(accessibleProjects) == 0 {\n\t\treturn []SearchResultBlock{},\
        \ nil\n\t}\n\n\t// Build project filter\n\tprojectFilter, args := buildProjectFilter(req.ProjectID,\
        \ accessibleProjects)\n\n\t// plainto_tsquery handles user input safely (no special syntax needed)\n\
        \tnextArg := len(args) + 1\n\tquery := fmt.Sprintf(`\n\t\tSELECT wb.id, wb.page_id, wb.block_type,\
        \ wb.headings_path, wb.plain_text,\n\t\t       wp.title AS page_title, wp.slug AS page_slug,\n\
        \t\t       ts_rank(wb.search_vector, plainto_tsquery('english', $%d)) AS rank\n\t\tFROM wiki_blocks\
        \ wb\n\t\tJOIN wiki_pages wp ON wb.page_id = wp.id\n\t\tWHERE wb.search_vector @@ plainto_tsquery('english',\
        \ $%d)\n\t\t  AND %s\n\t`, nextArg, nextArg, projectFilter)\n\targs = append(args, req.Query)\n\
        \tnextArg++\n\n\tif req.RecencyDays != nil && *req.RecencyDays > 0 {\n\t\tquery += fmt.Sprintf(`\
        \ AND wp.updated_at >= $%d`, nextArg)\n\t\targs = append(args, time.Now().AddDate(0, 0, -*req.RecencyDays))\n\
        \t}\n\n\tquery += ` ORDER BY rank DESC LIMIT ` + strconv.Itoa(req.Limit)\n\n\trows, err := s.db.QueryContext(ctx,\
        \ query, args...)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer rows.Close()\n\n\treturn\
        \ scanSearchResults(rows)\n}\n\n// searchWikiSemantic uses pgvector cosine similarity search.\n\
        func (s *Server) searchWikiSemantic(ctx context.Context, userID int64, req SearchWikiRequest)\
        \ ([]SearchResultBlock, error) {\n\tif s.embeddingClient == nil {\n\t\t// Fall back to FTS if\
        \ embeddings are not available\n\t\treturn s.searchWikiFTS(ctx, userID, req)\n\t}\n\n\taccessibleProjects,\
        \ err := s.getUserAccessibleProjects(ctx, userID)\n\tif err != nil {\n\t\treturn nil, err\n\t\
        }\n\tif len(accessibleProjects) == 0 {\n\t\treturn []SearchResultBlock{}, nil\n\t}\n\n\t// Embed\
        \ the query\n\tqueryVector, err := s.embeddingClient.Embed(ctx, req.Query)\n\tif err != nil {\n\
        \t\ts.logger.Warn(\"Embedding query failed, falling back to FTS\",\n\t\t\tzap.Error(err),\n\t\t\
        )\n\t\treturn s.searchWikiFTS(ctx, userID, req)\n\t}\n\n\tvectorStr := float32SliceToVectorString(queryVector)\n\
        \n\t// Build project filter\n\tprojectFilter, args := buildProjectFilter(req.ProjectID, accessibleProjects)\n\
        \tnextArg := len(args) + 1\n\n\tquery := fmt.Sprintf(`\n\t\tSELECT wb.id, wb.page_id, wb.block_type,\
        \ wb.headings_path, wb.plain_text,\n\t\t       wp.title AS page_title, wp.slug AS page_slug,\n\
        \t\t       1 - (wb.embedding <=> $%d::vector) AS rank\n\t\tFROM wiki_blocks wb\n\t\tJOIN wiki_pages\
        \ wp ON wb.page_id = wp.id\n\t\tWHERE wb.embedding IS NOT NULL\n\t\t  AND %s\n\t`, nextArg, projectFilter)\n\
        \targs = append(args, vectorStr)\n\tnextArg++\n\n\tif req.RecencyDays != nil && *req.RecencyDays\
        \ > 0 {\n\t\tquery += fmt.Sprintf(` AND wp.updated_at >= $%d`, nextArg)\n\t\targs = append(args,\
        \ time.Now().AddDate(0, 0, -*req.RecencyDays))\n\t}\n\n\tquery += ` ORDER BY rank DESC LIMIT `\
        \ + strconv.Itoa(req.Limit)\n\n\trows, err := s.db.QueryContext(ctx, query, args...)\n\tif err\
        \ != nil {\n\t\treturn nil, err\n\t}\n\tdefer rows.Close()\n\n\treturn scanSearchResults(rows)\n\
        }\n\n// searchWikiHybrid combines FTS and vector search with score fusion.\nfunc (s *Server) searchWikiHybrid(ctx\
        \ context.Context, userID int64, req SearchWikiRequest) ([]SearchResultBlock, error) {\n\tif s.embeddingClient\
        \ == nil {\n\t\treturn s.searchWikiFTS(ctx, userID, req)\n\t}\n\n\taccessibleProjects, err :=\
        \ s.getUserAccessibleProjects(ctx, userID)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif\
        \ len(accessibleProjects) == 0 {\n\t\treturn []SearchResultBlock{}, nil\n\t}\n\n\t// Embed the\
        \ query\n\tqueryVector, err := s.embeddingClient.Embed(ctx, req.Query)\n\tif err != nil {\n\t\t\
        s.logger.Warn(\"Embedding query failed, falling back to FTS\",\n\t\t\tzap.Error(err),\n\t\t)\n\
        \t\treturn s.searchWikiFTS(ctx, userID, req)\n\t}\n\n\tvectorStr := float32SliceToVectorString(queryVector)\n\
        \n\t// Build project filter\n\tprojectFilter, args := buildProjectFilter(req.ProjectID, accessibleProjects)\n\
        \tnextArg := len(args) + 1\n\n\t// Reciprocal Rank Fusion (RRF): merges FTS and vector rankings\
        \ without needing score normalization.\n\t// rrf_score = 1/(k+fts_rank) + 1/(k+vector_rank), k=60\
        \ is standard.\n\tquery := fmt.Sprintf(`\n\t\tWITH fts AS (\n\t\t\tSELECT wb.id, ROW_NUMBER()\
        \ OVER (ORDER BY ts_rank(wb.search_vector, plainto_tsquery('english', $%d)) DESC) AS rn\n\t\t\t\
        FROM wiki_blocks wb\n\t\t\tJOIN wiki_pages wp ON wb.page_id = wp.id\n\t\t\tWHERE wb.search_vector\
        \ @@ plainto_tsquery('english', $%d)\n\t\t\t  AND %s\n\t\t`, nextArg, nextArg, projectFilter)\n\
        \targs = append(args, req.Query)\n\tnextArg++\n\n\tif req.RecencyDays != nil && *req.RecencyDays\
        \ > 0 {\n\t\tquery += fmt.Sprintf(` AND wp.updated_at >= $%d`, nextArg)\n\t\targs = append(args,\
        \ time.Now().AddDate(0, 0, -*req.RecencyDays))\n\t\tnextArg++\n\t}\n\n\tquery += fmt.Sprintf(`\n\
        \t\t\tLIMIT %d\n\t\t),\n\t\tvec AS (\n\t\t\tSELECT wb.id, ROW_NUMBER() OVER (ORDER BY wb.embedding\
        \ <=> $%d::vector) AS rn\n\t\t\tFROM wiki_blocks wb\n\t\t\tJOIN wiki_pages wp ON wb.page_id =\
        \ wp.id\n\t\t\tWHERE wb.embedding IS NOT NULL\n\t\t\t  AND %s\n\t`, req.Limit*2, nextArg, projectFilter)\n\
        \targs = append(args, vectorStr)\n\tnextArg++\n\n\tif req.RecencyDays != nil && *req.RecencyDays\
        \ > 0 {\n\t\tquery += fmt.Sprintf(` AND wp.updated_at >= $%d`, nextArg)\n\t\targs = append(args,\
        \ time.Now().AddDate(0, 0, -*req.RecencyDays))\n\t}\n\n\tquery += fmt.Sprintf(`\n\t\t\tLIMIT %d\n\
        \t\t),\n\t\tcombined AS (\n\t\t\tSELECT COALESCE(fts.id, vec.id) AS id,\n\t\t\t       COALESCE(1.0/(60+fts.rn),\
        \ 0) + COALESCE(1.0/(60+vec.rn), 0) AS rrf_score\n\t\t\tFROM fts\n\t\t\tFULL OUTER JOIN vec ON\
        \ fts.id = vec.id\n\t\t)\n\t\tSELECT wb.id, wb.page_id, wb.block_type, wb.headings_path, wb.plain_text,\n\
        \t\t       wp.title AS page_title, wp.slug AS page_slug,\n\t\t       c.rrf_score AS rank\n\t\t\
        FROM combined c\n\t\tJOIN wiki_blocks wb ON wb.id = c.id\n\t\tJOIN wiki_pages wp ON wb.page_id\
        \ = wp.id\n\t\tORDER BY c.rrf_score DESC\n\t\tLIMIT %d\n\t`, req.Limit*2, req.Limit)\n\n\trows,\
        \ err := s.db.QueryContext(ctx, query, args...)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\
        \tdefer rows.Close()\n\n\treturn scanSearchResults(rows)\n}\n\n// buildProjectFilter returns a\
        \ SQL WHERE clause and args for project filtering.\nfunc buildProjectFilter(projectID *int64,\
        \ accessibleProjects []int64) (string, []interface{}) {\n\tif projectID != nil {\n\t\treturn \"\
        wp.project_id = $1\", []interface{}{*projectID}\n\t}\n\t// Build IN clause: wp.project_id IN ($1,\
