      content: "# Probe A1: does trivy AWS-0132 pass when the CMK is a RESOURCE REFERENCE\n# (root-created\
        \ key) feeding a CONDITIONAL-count SSE config (module as-is)?\n\nvariable \"enable_encryption\"\
