      summary: 'Assigning Task #4: Integrate into StatusBar'
      content: "Final task! Task #4: Integrate CommandAutocomplete into StatusBar.\n\nEdit `ui/src/components/StatusBar.tsx`:\n\
        \n1. Import CommandAutocomplete from './CommandAutocomplete'\n2. Replace the command input section\
        \ (lines 99-125 — the div with flex:1 containing the `forge>` span and the `<input>`) with:\n\
        \   - Keep the outer div (flex:1, maxWidth 500px, margin auto)\n   - Keep the `forge>` span prefix\n\
        \   - Replace the `<input>` with `<CommandAutocomplete onCommand={onCommand} />`\n3. Remove the\
        \ now-unused state: `commandInput`, `setCommandInput`, `inputRef`, and the `handleKeyDown` function\
        \ — all of that is now handled inside CommandAutocomplete\n4. Keep all other StatusBar code unchanged\
        \ (stats, view toggle, uptime, WS indicator)\n\nAfter editing, verify the component renders correctly\
        \ by checking the types compile. The StatusBar should look identical but now have autocomplete\
        \ behavior.\n\nMark Task #4 as completed when done."
