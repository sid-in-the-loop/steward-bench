  - tool: Agent
    arguments:
      name: backend-dev
      description: Implement /api/cli-help endpoint
      team_name: cli-autocomplete
      prompt: "You are a Rust backend developer on the cli-autocomplete team. Your task is Task #1: Add\
        \ GET /api/cli-help backend endpoint.\n\n## What to do\n\nEdit `src/factory/api.rs` to add a new\
        \ `GET /api/cli-help` endpoint. Here's exactly what's needed:\n\n1. **Add a handler function**\
        \ `cli_help_handler` that:\n   - Runs `forge --help` using the `FORGE_CMD` env var (default to\
        \ \"forge\" if not set)\n   - Parses the stdout to extract:\n     - **Commands**: Each line under\
        \ \"Commands:\" section, extracting name and description\n     - **Options**: Each line under\
        \ \"Options:\" section, extracting flag and description\n   - Returns JSON: `{ \"commands\": [{\"\
        name\": \"init\", \"description\": \"Initialize a new forge project\"}, ...], \"options\": [{\"\
        flag\": \"--verbose\", \"description\": \"\"}, ...] }`\n   \n2. **Cache the result**: Use `std::sync::OnceLock`\
        \ or similar to compute once and return cached thereafter.\n\n3. **Register the route**: Add `get(\"\
        /api/cli-help\", cli_help_handler)` to the router in the `build_router` function.\n\n## Reference\n\
        \nLook at existing endpoint patterns in `src/factory/api.rs` for the handler signature style (they\
        \ use `State(state): State&lt;SharedState&gt;` etc).\n\nThe forge --help output format is:\n```\n\
        Commands:\n  init       Initialize a new forge project\n  interview  Conduct an interactive interview...\n\
        \  ...\n\nOptions:\n  -v, --verbose\n      --yes\n  ...\n```\n\n## Important\n- Use `tokio::process::Command`\
        \ for async execution\n- Add proper serde Serialize derives for the response types\n- Don't modify\
        \ any existing endpoints\n- After making changes, run `cargo check` to verify compilation\n- Mark\
        \ Task #1 as completed when done\n"
      mode: bypassPermissions
      run_in_background: true
  - tool: Agent
    arguments:
      name: frontend-api-dev
      description: Add cliHelp API client method
      team_name: cli-autocomplete
      prompt: "You are a frontend developer on the cli-autocomplete team. Your task is Task #2: Add cliHelp()\
        \ method to the frontend API client.\n\n## What to do\n\nEdit `ui/src/api/client.ts` to add a\
        \ `cliHelp()` method to the `api` object.\n\nThe method should:\n1. Call `GET /api/cli-help`\n\
        2. Return the typed response\n\nAdd this to the api object (follow the existing patterns in the\
        \ file):\n\n```typescript\ncliHelp: () => request<{ commands: { name: string; description: string\
        \ }[], options: { flag: string; description: string }[] }>('/cli-help'),\n```\n\nAlso add the\
        \ corresponding TypeScript types to `ui/src/types/index.ts` (or wherever types are defined):\n\
        \n```typescript\nexport interface CliHelpCommand {\n  name: string;\n  description: string;\n\
        }\n\nexport interface CliHelpOption {\n  flag: string;\n  description: string;\n}\n\nexport interface\
        \ CliHelpResponse {\n  commands: CliHelpCommand[];\n  options: CliHelpOption[];\n}\n```\n\nThen\
        \ update the cliHelp method to use: `request&lt;CliHelpResponse&gt;('/cli-help')`\n\n## Important\n\
        - Read the existing files first before editing\n- Follow the existing code style exactly\n- Mark\
        \ Task #2 as completed when done\n"
      mode: bypassPermissions
      run_in_background: true
  - tool: TaskUpdate
    arguments:
      taskId: '2'
      status: completed
  - tool: TaskUpdate
    arguments:
      taskId: '1'
      status: completed
  - tool: TaskUpdate
    arguments:
