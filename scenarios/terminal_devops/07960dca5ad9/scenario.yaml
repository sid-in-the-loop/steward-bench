    arguments:
      taskId: '3'
      addBlockedBy:
      - '1'
      - '2'
  - tool: TaskUpdate
    arguments:
      taskId: '4'
      addBlockedBy:
      - '3'
  - tool: Agent
    arguments:
      name: backend-dev
      description: Implement /api/cli-help endpoint
      team_name: cli-autocomplete
      prompt: "You are a Rust backend developer on the cli-autocomplete team. Your task is Task #1: Add\
        \ GET /api/cli-help backend endpoint.\n\n## What to do\n\nEdit `src/factory/api.rs` to add a new\
        \ `GET /api/cli-help` endpoint. Here's exactly what's needed:\n\n1. **Add a handler function**\
        \ `cli_help_handler` that:\n   - Runs `forge --help` using the `FORGE_CMD` env var (default to\
        \ \"forge\" if not set)\n   - Parses the stdout to extract:\n     - **Commands**: Each line under\
        \ \"Commands:\" section, extracting name and description\n     - **Options**: Each line under\
        \ \"Options:\" section, extracting flag and description\n   - Returns JSON: `{ \"commands\": [{\"\
        name\": \"init\", \"description\": \"Initialize a new forge project\"}, ...], \"options\": [{\"\
        flag\": \"--verbose\", \"description\": \"\"}, ...] }`\n   \n2. **Cache the result**: Use `std::sync::OnceLock`\
        \ or similar to compute once and return cached thereafter.\n\n3. **Register the route**: Add `get(\"\
        /api/cli-help\", cli_help_handler)` to the router in the `build_router` function.\n\n## Reference\n\
        \nLook at existing endpoint patterns in `src/factory/api.rs` for the handler signature style (they\
        \ use `State(state): State&lt;SharedState&gt;` etc).\n\nThe forge --help output format is:\n```\n\
        Commands:\n  init       Initialize a new forge project\n  interview  Conduct an interactive interview...\n\
        \  ...\n\nOptions:\n  -v, --verbose\n      --yes\n  ...\n```\n\n## Important\n- Use `tokio::process::Command`\
        \ for async execution\n- Add proper serde Serialize derives for the response types\n- Don't modify\
        \ any existing endpoints\n- After making changes, run `cargo check` to verify compilation\n- Mark\
        \ Task #1 as completed when done\n"
      mode: bypassPermissions
      run_in_background: true
  - tool: Agent
    arguments:
      name: frontend-api-dev
      description: Add cliHelp API client method
      team_name: cli-autocomplete
      prompt: "You are a frontend developer on the cli-autocomplete team. Your task is Task #2: Add cliHelp()\
        \ method to the frontend API client.\n\n## What to do\n\nEdit `ui/src/api/client.ts` to add a\
        \ `cliHelp()` method to the `api` object.\n\nThe method should:\n1. Call `GET /api/cli-help`\n\
        2. Return the typed response\n\nAdd this to the api object (follow the existing patterns in the\
        \ file):\n\n```typescript\ncliHelp: () => request<{ commands: { name: string; description: string\
        \ }[], options: { flag: string; description: string }[] }>('/cli-help'),\n```\n\nAlso add the\
        \ corresponding TypeScript types to `ui/src/types/index.ts` (or wherever types are defined):\n\
        \n```typescript\nexport interface CliHelpCommand {\n  name: string;\n  description: string;\n\
        }\n\nexport interface CliHelpOption {\n  flag: string;\n  description: string;\n}\n\nexport interface\
        \ CliHelpResponse {\n  commands: CliHelpCommand[];\n  options: CliHelpOption[];\n}\n```\n\nThen\
        \ update the cliHelp method to use: `request&lt;CliHelpResponse&gt;('/cli-help')`\n\n## Important\n\
        - Read the existing files first before editing\n- Follow the existing code style exactly\n- Mark\
        \ Task #2 as completed when done\n"
      mode: bypassPermissions
      run_in_background: true
  - tool: TaskUpdate
    arguments:
      taskId: '3'
      status: in_progress
  - tool: SendMessage
    arguments:
      type: shutdown_request
      recipient: backend-dev
      content: 'Task #1 is done, great work. Shutting down.'
  - tool: SendMessage
    arguments:
      type: message
      recipient: frontend-api-dev
      summary: 'Assigning Task #3: CommandAutocomplete component'
      content: "Great work on Task #2! Now take on Task #3: Create the CommandAutocomplete component.\n\
        \nCreate `ui/src/components/CommandAutocomplete.tsx` with:\n\n1. **Data fetching**: Call `api.cliHelp()`\
        \ on mount (from the client you just updated), cache in state. The types are `CliHelpResponse`\
        \ from `../types`.\n\n2. **Props interface**:\n```typescript\ninterface CommandAutocompleteProps\
        \ {\n  onCommand?: (command: string) => void;\n}\n```\n\n3. **Input field**: Styled to match the\
        \ existing StatusBar input — transparent background, no border, `var(--color-text-primary)` text,\
        \ `inherit` font. Placeholder \"type a command...\"\n\n4. **Dropdown suggestions**: \n   - Absolute\
        \ positioned below the input\n   - Shows when input is focused AND there's text (or on focus if\
        \ empty to show all commands)\n   - Filters items by prefix match on the input value\n   - Each\
        \ item shows: name/flag on left, description on right (faded)\n   - Commands and options distinguished\
        \ by a subtle \"cmd\" / \"opt\" label\n   - Background: `var(--color-bg-card)`, border: `var(--color-border)`\n\
        \   - Highlighted item: `var(--color-bg-card-hover)`\n   - Max height ~200px with overflow scroll\n\
        \n5. **Keyboard navigation**:\n   - Arrow Up/Down: move highlight through dropdown\n   - Enter:\
        \ select highlighted item, populate input, close dropdown\n   - Escape: close dropdown\n   - Tab:\
        \ accept ghost text suggestion\n\n6. **Ghost text**: \n   - When there's a top match and input\
        \ has text, show the remaining characters of the top match as faded text (`var(--color-text-secondary)`,\
        \ opacity 0.5) after what the user typed\n   - Use an overlay span positioned absolutely to render\
        \ ghost text\n   - Tab accepts the ghost text into the input\n\n7. **Click outside**: Close dropdown\
        \ when clicking outside the component (use a ref + useEffect with document click listener)\n\n\
        Read the existing StatusBar.tsx to understand the current input styling (lines 99-125). The component\
        \ should be a drop-in replacement for that input.\n\nMark Task #3 as completed when done."
  - tool: TaskUpdate
    arguments:
      taskId: '4'
      status: in_progress
  - tool: SendMessage
    arguments:
      type: message
      recipient: frontend-api-dev
      summary: 'Assigning Task #4: Integrate into StatusBar'
      content: "Final task! Task #4: Integrate CommandAutocomplete into StatusBar.\n\nEdit `ui/src/components/StatusBar.tsx`:\n\
        \n1. Import CommandAutocomplete from './CommandAutocomplete'\n2. Replace the command input section\
        \ (lines 99-125 — the div with flex:1 containing the `forge>` span and the `<input>`) with:\n\
        \   - Keep the outer div (flex:1, maxWidth 500px, margin auto)\n   - Keep the `forge>` span prefix\n\
        \   - Replace the `<input>` with `<CommandAutocomplete onCommand={onCommand} />`\n3. Remove the\
        \ now-unused state: `commandInput`, `setCommandInput`, `inputRef`, and the `handleKeyDown` function\
        \ — all of that is now handled inside CommandAutocomplete\n4. Keep all other StatusBar code unchanged\
        \ (stats, view toggle, uptime, WS indicator)\n\nAfter editing, verify the component renders correctly\
        \ by checking the types compile. The StatusBar should look identical but now have autocomplete\
        \ behavior.\n\nMark Task #4 as completed when done."
