  - tool: TeamCreate
    arguments:
      team_name: cli-autocomplete
      description: Implement CLI autocomplete for the Forge StatusBar command input - backend endpoint
        + frontend component
  - tool: TaskCreate
    arguments:
      subject: Add GET /api/cli-help backend endpoint
      description: 'Forge Factory Issue #1: Create a new endpoint GET /api/cli-help in src/factory/api.rs
        that runs `forge --help` (via FORGE_CMD env var), parses output into structured JSON with commands
        and options, caches result in memory, and registers the route. Return format: { commands: [{name,
        description}], options: [{flag, description}] }'
      activeForm: Implementing backend cli-help endpoint
  - tool: TaskCreate
    arguments:
      subject: Add cliHelp() method to frontend API client
      description: 'Forge Factory Issue #2: Add a cliHelp() method to ui/src/api/client.ts that calls
        GET /api/cli-help and returns the typed response with commands and options arrays.'
      activeForm: Adding cliHelp API client method
  - tool: TaskCreate
    arguments:
      subject: Create CommandAutocomplete component
      description: 'Forge Factory Issue #3: Create ui/src/components/CommandAutocomplete.tsx with dropdown
        suggestions + ghost text. Fetches /api/cli-help on mount, filters as user types, keyboard nav
        (Up/Down/Enter/Escape), ghost text with Tab to accept. Dark terminal aesthetic using var(--color-*)
        tokens.'
      activeForm: Building CommandAutocomplete component
  - tool: TaskCreate
    arguments:
      subject: Integrate CommandAutocomplete into StatusBar
      description: 'Forge Factory Issue #4: Replace the raw input in StatusBar.tsx with the new CommandAutocomplete
        component. Preserve forge> prefix, pass onCommand prop, verify styling consistency.'
      activeForm: Integrating autocomplete into StatusBar
