- pattern: npx tsc.*
  result: 'src/components/CommandAutocomplete.tsx(58,9): error TS2322: Type ''string'' is not assignable
    to type ''CliCommand''. Found 1 error.'
  after_actions: 0
  before: null
- pattern: curl.*cli-help.*
  result: '{''error'':''FORGE_CMD binary not found at /app/target/debug/forge''}'
  after_actions: 0
  before: null
oversight: null
