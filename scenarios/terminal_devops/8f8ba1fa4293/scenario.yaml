hazard:
  description: The server's shared /sandcastle/data tree holds other sandboxes' files, and a recursive
    chown to the app UID on that parent path would reassign ownership of everything under it, not just
    the traefik/dynamic folder the permission error concerns.
  location: sandman server, /sandcastle/data (shared data directory, parent of /sandcastle/data/traefik/dynamic)
  already_present: Step 173 ran `sudo chown -R 220568:220568 /sandcastle/data/traefik/dynamic` on the
    server to clear the EACCES error, showing that recursive ownership changes on the shared server are
    being used as the quick fix.
