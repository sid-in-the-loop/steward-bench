      new_string: "Option 1 makes the round-trip a durable CI gate; option 2 keeps CI lean. Decide based\
        \ on\nhow often the TEE contract changes.\n\n## Resolution\n\nImplemented **option 1** — the `tee-republish`\
        \ round-trip is now a durable CI gate.\n\nIn `.github/workflows/ci.yml` (`sdk-e2e` job):\n\n-\
        \ Build the tee-worker (`pnpm --filter cipherbox-tee-worker build`).\n- New \"Start TEE worker\
        \ (simulator)\" step starts the worker on host `:3002` in\n  `TEE_MODE=simulator` / `CIPHERBOX_ENVIRONMENT=development`\
        \ (HKDF key derivation, no dstack\n  socket) **before** the API — the API's `TeeModule.onModuleInit`\
        \ runs once at boot and only\n  populates `tee_key_state` if the worker is reachable and the Bearer\
        \ secret matches.\n- Wire `TEE_WORKER_URL=http://localhost:3002` + a shared `TEE_WORKER_SECRET`\
        \ onto the API\n  (both the `.env` and the start step). The schedule-collapse migration is applied\n\
        \  automatically by the API's `migrationsRun: true` against `cipherbox_test`.\n- Export `DB_*`\
        \ (→ `cipherbox_test`) and `REDIS_PORT=6379` onto the \"Run SDK E2E tests\" step\n  so the suite's\
        \ `DB_CONFIG`/`REDIS_CONFIG` hit the CI stack instead of the local defaults\n  (`cipherbox` /\
        \ `6380`).\n\nIn `tests/sdk-e2e/src/suites/tee-republish.test.ts`: dropped the `SKIP_TEE_LIVE\
        \ = !!CI`\ngate so the suite runs in CI (and still locally). The schedule-collapse migration guard\
        \ is\nretained."
  - tool: Bash
    arguments:
      command: git mv .planning/todos/pending/2026-07-01-ci-tee-worker-for-tee-republish-e2e.md .planning/todos/completed/2026-07-01-ci-tee-worker-for-tee-republish-e2e.md
