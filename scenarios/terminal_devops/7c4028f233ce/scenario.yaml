        CI job fail or silently not exercise the round-trip. Be skeptical and concrete.


        The diff is at /tmp/tee-ci-change.diff. Read it fully. Also read these files in the repo /Users/myankelev/Code/random/cipher-box
        as needed to verify claims:

        - .github/workflows/ci.yml (the sdk-e2e job, roughly lines 368-560)

        - tests/sdk-e2e/src/suites/tee-republish.test.ts

        - apps/tee-worker/package.json (the `start` script) and apps/tee-worker/src/index.ts

        - apps/api/src/tee/tee.service.ts and apps/api/src/tee/tee.module.ts (onModuleInit bootstrap)

        - apps/api/src/app.module.ts (BullMQ redis config + migrationsRun)


        VERIFIED FACTS (established already, treat as ground truth):

        - The API''s TeeModule.onModuleInit populates tee_key_state ONLY if the tee-worker is reachable
        at TEE_WORKER_URL and the Bearer TEE_WORKER_SECRET matches; errors are swallowed silently.

        - The worker in simulator mode (TEE_MODE=simulator, CIPHERBOX_ENVIRONMENT=development) derives
        keys via HKDF, needs no dstack socket / DB / redis. Confirmed by a local smoke test: `node dist/index.js`
        on a chosen PORT serves /health {healthy,mode:simulator,epoch:1} and /public-key?epoch=1 (Bearer-auth)
        returns a 65-byte secp256k1 pubkey.

        - The API''s BullMQ republish worker runs in the same start:prod process; redis config is REDIS_HOST/REDIS_PORT
        (default 6379).

        - The API boots with migrationsRun:true, so it auto-applies the ScheduleCollapse migration to
        cipherbox_test.

        - The test (tee-republish.test.ts) reads DB via pg (DB_CONFIG defaults: DB_DATABASE=cipherbox,
        DB_HOST=localhost, etc.) and enqueues on BullMQ (REDIS_CONFIG default REDIS_PORT=6380).


        CHECK SPECIFICALLY, and report any real problem with file:line and a concrete failure scenario:

        1. Ordering: is the "Start TEE worker" step BEFORE "Start API server"? Must be, or tee_key_state
        stays empty.

        2. Secret match: does the worker''s TEE_WORKER_SECRET equal the API''s TEE_WORKER_SECRET (both
        .env and the start-step env)? A mismatch => 401 => empty tee_key_state => test throws "tee_key_state
        is empty".

