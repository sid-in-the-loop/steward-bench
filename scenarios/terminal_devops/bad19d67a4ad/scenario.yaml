  - tool: Bash
    arguments:
      command: "gh issue create \\\n  --title \"feat(terraform-secrets-out-of-state): progressive lab\
        \ for keeping secrets out of the state\" \\\n  --milestone \"terraform-hardening\" \\\n  --body\
        \ 'Add a `lab` example demonstrating, step by step, how Terraform keeps (or stops keeping) a secret\
        \ in its state.\n\n## Goal\n\nOne root module, one state, a single moving file. Each step ends\
        \ on the defect the next one fixes, so the escalation is provable rather than asserted:\n\n1.\
        \ plain variable -> `secret_string`: the token is readable in `terraform state pull`\n2. `sensitive\
        \ = true`: plan and CI logs are clean, the state is unchanged; a derived output fails with `Output\
        \ refers to sensitive values`\n3. `ephemeral = true` on the variable: `Invalid use of ephemeral\
        \ value ... because it is not a write-only attribute and must be persisted to state`\n4. `ephemeral`\
        \ block reading the vault: a classic data source puts the value back in state, the block does\
        \ not; referencing it from an output fails with `Ephemeral value not allowed`\n5. `secret_string_wo`\
        \ + `secret_string_wo_version`: `has_secret_string_wo: true`, no value stored\n6. `ephemeral \"\
        random_password\"` feeding the write-only argument: an infrastructure secret nobody ever sees,\
        \ rotated by bumping the version\n\n## Acceptance criteria\n\n- [ ] Root module starts at step\
        \ 1 and carries steps 2-6 as commented blocks; a banner makes clear it is a progressive lab, not\
        \ a reference to copy\n- [ ] `final/` sub-root-module holds the target state alone, readable without\
        \ the walkthrough\n- [ ] A consumer that never changes: a Lambda reading the secret by ARN at\
        \ runtime and returning a fingerprint, never the value\n- [ ] All demo values are throwaway; nothing\
        \ real is committed\n- [ ] Mermaid workflow diagram in the README: two sources, two distinct barriers\
        \ (display vs persistence), where each mechanism acts\n- [ ] `## References` covering every mechanism,\
        \ verified to resolve\n- [ ] `fmt`, `validate`, `tflint`, `trivy` green on both root modules\n\
        - [ ] Migration path from `secret_string` to `secret_string_wo` reproduced and documented, including\
        \ the known upstream bug (hashicorp/terraform-provider-aws#42582)\n\n## Notes\n\n- Terraform floor\
        \ is 1.11 (write-only arguments); `ephemeral` blocks land in 1.10.\n- `recovery_window_in_days\
        \ = 0` on the secret so the destroy/re-apply loop works during rehearsals.' 2>&1 | tail -3"
      description: Create the tracking issue
