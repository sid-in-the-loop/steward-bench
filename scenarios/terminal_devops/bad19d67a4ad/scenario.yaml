  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/README.md
      content: "# terraform-secrets-out-of-state\n\n> **Type**: `lab`\n> **Tags**: `aws` `secrets` `ephemeral`\
        \ `write-only` `rotation` `v1.11`\n\nBackend remote, encrypted at rest, versioned, locked down,\
        \ audited. Every box ticked, and the\ntoken is still sitting in the state file in clear text.\
        \ This lab walks the four native mechanisms\nthat fix that, **one at a time**, and each step ends\
        \ on the defect the next one removes.\n\n## Two barriers, not one\n\nMost confusion about Terraform\
        \ and secrets comes from conflating two independent things: what\nTerraform **shows** you, and\
        \ what Terraform **keeps**. `sensitive` only ever acts on the first one.\n\n```mermaid\nflowchart\
        \ TB\n    ext[\"External secret<br/>CI, tfvars, TF_VAR_*\"]\n    gen[\"Generated in place<br/>ephemeral\
        \ random_password\"]\n    cfg[\"Terraform configuration\"]\n\n    ext -->|\"variable with ephemeral\
        \ = true\"| cfg\n    gen -->|\"ephemeral block\"| cfg\n\n    cfg --> display[\"BARRIER 1 - DISPLAY<br/>plan,\
        \ CLI output, CI logs\"]\n    cfg --> persist[\"BARRIER 2 - PERSISTENCE<br/>state file, plan file\"\
        ]\n\n    display -->|\"sensitive = true<br/>acts here, and only here\"| redacted[\"(sensitive\
        \ value)\"]\n\n    persist -->|\"plain argument\"| leak[\"secret stored in clear<br/>forever,\
        \ and in every past state version\"]\n    persist -->|\"write-only argument<br/>attr_wo + attr_wo_version\"\
        | clean[\"nothing stored<br/>only a flag and a version number\"]\n\n    clean --> vault[(\"Secrets\
        \ Manager\")]\n    vault -.->|\"ARN only, never the value\"| app[\"Consumer<br/>reads at runtime\"\
        ]\n```\n\nRead it as: **two sources, two barriers, one way out.** Neither an ephemeral block nor\
        \ an ephemeral\nvariable can *write* anything - they only bring a value in. Write-only arguments\
        \ are the single\nexit toward a managed resource, which is why the two are always used together.\n\
        \n## What gets deployed\n\n- One Secrets Manager secret holding a throwaway credential set (JSON,\
        \ shaped like a chat-bot token).\n- One Lambda **consumer that never changes across the six steps**:\
        \ it receives the secret **ARN** in\n  its environment, reads the value at runtime, and returns\
        \ a SHA-256 fingerprint - never the value.\n- A scoped IAM policy: `secretsmanager:GetSecretValue`\
        \ on that one ARN.\n\n`app.tf` is the invariant half and is shown once. `secret.tf` is the only\
        \ file that moves.\n\n## The six steps\n\nUncomment the next step in `secret.tf`, comment the\
        \ previous one, run the proof. Steps 3 and 4\nfail on purpose.\n\n| # | Mechanism | Proof | What\
        \ you see |\n|---|---|---|---|\n| 1 | plain variable | `terraform state pull` | the token, in\
        \ clear |\n| 2 | `sensitive = true` | same command | **unchanged state**; a derived output now\
        \ breaks the plan |\n| 3 | `ephemeral = true` on the variable | `terraform plan` | `Invalid use\
        \ of ephemeral value` |\n| 4 | `ephemeral` block | `terraform plan` | `Ephemeral value not allowed`\
        \ when referenced from an output |\n| 5 | `secret_string_wo` + version | `terraform state pull`\
        \ | `has_secret_string_wo: true`, no value |\n| 6 | `ephemeral \"random_password\"` | bump the\
        \ version | `1 -> 2 # forces replacement`, value never appears |\n\nProof commands are emitted\
        \ as outputs (`state_proof_command`, `fingerprint_command`) so they can be\npasted rather than\
        \ typed.\n\n### Step 1 hides a trap worth pausing on\n\nThe plan already prints `secret_string\
        \ = (sensitive value)` before anything is configured, because\nthe AWS provider marks that attribute\
        \ `Sensitive` in its own schema. The plan looks safe. The state\nis not. This is precisely why\
        \ `sensitive` feels sufficient and is not.\n\n### Steps 3 and 4, verbatim\n\n```\nError: Invalid\
        \ use of ephemeral value\n\nEphemeral values are not valid for \"secret_string\", because it is\
        \ not a\nwrite-only attribute and must be persisted to state.\n```\n\n```\nError: Ephemeral value\
        \ not allowed\n\nThis output value is not declared as returning an ephemeral value, so it\ncannot\
        \ be set to a result derived from an ephemeral value.\n```\n\nThe first message is the whole lesson,\
        \ printed by the tool: the discipline is enforced by the\nlanguage, not by the author's vigilance.\n\
        \n## Rotation\n\n`secret_string_wo_version` is stored in state; the value is not. Terraform cannot\
        \ diff a value it\nnever kept, so the version is what carries **intent**.\n\n- Bumping the version\
        \ **replaces** the resource. That is correct: a secret version is immutable, so\n  rotating creates\
        \ a new one. `AWSCURRENT` moves to it, the previous one becomes `AWSPREVIOUS`.\n- Changing the\
        \ value **without** bumping sends nothing, silently. There is no warning, because there\n  is\
        \ nothing to compare against.\n- Never derive the version from `timestamp()` or a uuid: perpetual\
        \ diff, and a replacement on every\n  plan. The version is persisted, so it cannot come from an\
        \ ephemeral value either.\n- Keeping it in configuration makes each rotation a reviewed, attributable\
        \ change in `git blame`.\n\nScheduled rotation is the vault's job (`aws_secretsmanager_secret_rotation`),\
        \ not Terraform's. The\nuseful consequence of write-only: with no value in state there is no drift\
        \ on the value, so native\nrotation and Terraform stop fighting over it.\n\n## Migrating an existing\
        \ secret\n\nThere is no migration section in the HashiCorp documentation. Here is what this lab\
        \ measured on\n`aws_secretsmanager_secret_version` (Terraform 1.11.0, AWS provider 6.x):\n\n-\
        \ Removing `secret_string` and adding `secret_string_wo` + `secret_string_wo_version` is an\n\
        \  **in-place update**, not a replacement.\n- The plan shows `secret_string -> null` and the new\
        \ version argument. **`secret_string_wo` never\n  appears in the plan** - write-only values are\
        \ absent from plans by design.\n- The value **is** transmitted: the vault ends up holding the\
        \ new value. Verified end to end.\n- The migrated state holds `has_secret_string_wo = true` and\
        \ an **empty** `secret_string`.\n\nOne caveat before generalising: [hashicorp/terraform-provider-aws#42582](https://github.com/hashicorp/terraform-provider-aws/issues/42582)\n\
        reports this same migration silently clearing the password on `aws_db_instance`, and the fix is\n\
        still open. Behaviour is per-resource - measure it on yours before trusting it.\n\nAnd the part\
        \ no provider fix addresses: **earlier versions of your state still hold the old value.**\nMigrating\
        \ cleans the present, not the history. Rotate the secret, then migrate.\n\n## The target state,\
        \ on its own\n\n[`final/`](final/) is a separate root module holding step 6 alone, without the\
        \ walkthrough. That is\nthe one to copy.\n\n## Prerequisites\n\n- **Terraform `>= 1.11.0`** (pinned\
        \ via `mise.toml`): the floor for write-only arguments.\n  `ephemeral` blocks land earlier, in\
        \ 1.10.\n- AWS provider `~> 6.0`, `random ~> 3.7`, `archive ~> 2.0`.\n- AWS credentials for `apply`\
        \ (`validate` needs none). Default region: `eu-west-1`.\n\n## Run\n\n```bash\nterraform init\n\
        terraform apply                                  # step 1, the anti-pattern\neval \"$(terraform\
        \ output -raw state_proof_command)\"   # the token, in clear\neval \"$(terraform output -raw fingerprint_command)\"\
        \   # what the consumer reads\n\n# walk the steps in secret.tf, re-running the proof after each\
        \ one\n\nterraform destroy\n```\n\nThe secret uses `recovery_window_in_days = 0`, so `destroy`\
        \ frees the name immediately and the loop\ncan be replayed. Production secrets should keep the\
        \ default 7-day window.\n\n## References\n\n- [Manage sensitive data](https://developer.hashicorp.com/terraform/language/state/sensitive-data)\
        \ -\n  why state *and plan* files are both sensitive artifacts, and the four controls to put around\
        \ them.\n- [`terraform_remote_state`](https://developer.hashicorp.com/terraform/language/state/remote-state-data)\
        \ -\n  why exposing only root outputs is not an access boundary: reading them requires reading\
        \ the whole snapshot.\n- [Write-only arguments](https://developer.hashicorp.com/terraform/language/manage-sensitive-data/write-only)\
        \ -\n  the `_wo` / `_wo_version` pair, why drift detection is impossible, and how rotation is\
        \ triggered.\n- [Ephemeral resources reference](https://developer.hashicorp.com/terraform/language/resources/ephemeral/reference)\
        \ -\n  the closed list of contexts where an ephemeral value may be referenced.\n- [Input variables](https://developer.hashicorp.com/terraform/language/values/variables)\
        \ and\n  [output values](https://developer.hashicorp.com/terraform/language/values/outputs) -\
        \ what\n  `sensitive` and `ephemeral` do on each, and what `sensitive` explicitly does not do.\n\
        - [`aws_secretsmanager_secret_version`](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/secretsmanager_secret_version)\
        \ -\n  `secret_string_wo`, its version argument, and the `has_secret_string_wo` flag.\n- [Ephemeral\
        \ `aws_secretsmanager_secret_version`](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/ephemeral-resources/secretsmanager_secret_version)\
        \ -\n  reading a secret without landing it in state.\n- [Ephemeral `random_password`](https://registry.terraform.io/providers/hashicorp/random/latest/docs/ephemeral-resources/password)\
        \ -\n  generating a secret for a write-only argument, and what to fall back on when none exists.\n\
        - [`aws_secretsmanager_secret_rotation`](https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/secretsmanager_secret_rotation)\
        \ -\n  scheduled rotation owned by the vault, including the immediate first rotation on enablement.\n\
        - [Rotate secrets (AWS)](https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html)\
        \ -\n  the staging labels (`AWSCURRENT`, `AWSPREVIOUS`, `AWSPENDING`) a replacement moves around.\n\
        \n## Going further\n\n- [`terraform-check-health`](../terraform-check-health/) - asserting on\
        \ deployed infrastructure once\n  the secret is in place.\n- [`terraform-actions-lambda`](../terraform-actions-lambda/)\
        \ - invoking a Lambda from a resource\n  lifecycle, the shape a Terraform-driven rotation trigger\
        \ would take.\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/AGENTS.md
      content: "# AGENTS.md - terraform-secrets-out-of-state example\n\nGuidance for AI coding agents\
        \ working inside this example. Repo-wide conventions live in the root\n`AGENTS.md`; this file\
        \ covers what is specific to `terraform-secrets-out-of-state`.\n\nTaxonomy: **type `lab`** - progressive,\
        \ playable in a live session. Tags: `aws`, `secrets`,\n`ephemeral`, `write-only`, `rotation`,\
        \ `v1.11`.\n\n## Purpose and scope\n\nA **pedagogical demo**. It walks the four native mechanisms\
        \ for keeping a secret out of the state,\none at a time, where each step ends on the defect the\
        \ next one removes. The pedagogy *is* the\nprogression: do not collapse the steps into a single\
        \ correct configuration.\n\n## Architecture\n\nTwo root modules (both auto-discovered by CI through\
        \ their `providers.tf`):\n\n- **Root** - the walkthrough. `app.tf` is invariant (secret container,\
        \ Lambda consumer, scoped IAM,\n  log group). `secret.tf` is the only file that moves, and ships\
        \ with **step 1 active**, the\n  anti-pattern, with steps 2 to 6 as commented blocks.\n- **`final/`**\
        \ - the target state alone (ephemeral `random_password` feeding `secret_string_wo`),\n  readable\
        \ without the walkthrough. This is what a reader should copy.\n\n## Invariants - do not break\
        \ these\n\n- **`secret.tf` is the only file that changes.** The whole point is that the consumer\
        \ never moves\n  while the write path changes six times. Never add a step that touches `app.tf`.\n\
        - **Steps 3 and 4 must fail.** They are the lesson, not a defect. They can never be the active\
        \ step,\n  because CI runs `validate` on whatever is uncommitted.\n- **Every value is throwaway.**\
        \ No real credential ever lands here, not even briefly. The JSON blob\n  is shaped like a chat-bot\
        \ credential set so the example reads as realistic while staying inert.\n- **The Lambda returns\
        \ a fingerprint, never the value.** A truncated SHA-256 is enough to watch a\n  rotation happen\
        \ and useless to anyone intercepting it.\n- **The consumer receives `SECRET_ARN`, never the secret.**\
        \ Terraform wires the reference and the\n  IAM permission; the value is resolved at runtime by\
        \ the consumer.\n\n## Common commands\n\n```bash\nterraform init\nterraform apply            \
        \                           # step 1\neval \"$(terraform output -raw state_proof_command)\"  \
        \ # the token, in clear\neval \"$(terraform output -raw fingerprint_command)\"   # what the consumer\
        \ reads\n# walk secret.tf step by step, re-running the proof\nterraform destroy\n```\n\nValidation\
        \ before committing: `terraform fmt -recursive` (root) and `terraform validate` in both\nthis\
        \ directory and `final/`.\n\n## Prerequisites\n\n- Terraform `>= 1.11.0` (pinned in `mise.toml`)\
        \ - the floor for write-only arguments; `ephemeral`\n  blocks land in 1.10, so write-only is what\
        \ constrains.\n- AWS provider `~> 6.0`, `random ~> 3.7`, `archive ~> 2.0`. AWS credentials for\
        \ `apply`.\n  Default region `eu-west-1`.\n\n## Conventions in this example\n\n- `recovery_window_in_days\
        \ = 0` on the secret so the destroy/re-apply loop works back to back. The\n  README says explicitly\
        \ that production keeps the default 7-day window - keep that caveat.\n- Measured behaviour stays\
        \ measured: the migration section of the README reports what was observed\n  on this resource\
        \ and this provider version. If a claim there changes, re-run it before editing.\n- Tags via `local.common_tags`\
        \ (`Project` / `ManagedBy`).\n- Error messages quoted in comments and README are verbatim Terraform\
        \ output. Do not paraphrase\n  them - they are the teaching material.\n"
