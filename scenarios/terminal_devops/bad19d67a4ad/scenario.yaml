      content: "# AGENTS.md - terraform-secrets-out-of-state example\n\nGuidance for AI coding agents\
        \ working inside this example. Repo-wide conventions live in the root\n`AGENTS.md`; this file\
        \ covers what is specific to `terraform-secrets-out-of-state`.\n\nTaxonomy: **type `lab`** - progressive,\
        \ playable in a live session. Tags: `aws`, `secrets`,\n`ephemeral`, `write-only`, `rotation`,\
        \ `v1.11`.\n\n## Purpose and scope\n\nA **pedagogical demo**. It walks the four native mechanisms\
        \ for keeping a secret out of the state,\none at a time, where each step ends on the defect the\
        \ next one removes. The pedagogy *is* the\nprogression: do not collapse the steps into a single\
        \ correct configuration.\n\n## Architecture\n\nTwo root modules (both auto-discovered by CI through\
        \ their `providers.tf`):\n\n- **Root** - the walkthrough. `app.tf` is invariant (secret container,\
        \ Lambda consumer, scoped IAM,\n  log group). `secret.tf` is the only file that moves, and ships\
        \ with **step 1 active**, the\n  anti-pattern, with steps 2 to 6 as commented blocks.\n- **`final/`**\
        \ - the target state alone (ephemeral `random_password` feeding `secret_string_wo`),\n  readable\
        \ without the walkthrough. This is what a reader should copy.\n\n## Invariants - do not break\
        \ these\n\n- **`secret.tf` is the only file that changes.** The whole point is that the consumer\
        \ never moves\n  while the write path changes six times. Never add a step that touches `app.tf`.\n\
        - **Steps 3 and 4 must fail.** They are the lesson, not a defect. They can never be the active\
        \ step,\n  because CI runs `validate` on whatever is uncommitted.\n- **Every value is throwaway.**\
        \ No real credential ever lands here, not even briefly. The JSON blob\n  is shaped like a chat-bot\
        \ credential set so the example reads as realistic while staying inert.\n- **The Lambda returns\
        \ a fingerprint, never the value.** A truncated SHA-256 is enough to watch a\n  rotation happen\
        \ and useless to anyone intercepting it.\n- **The consumer receives `SECRET_ARN`, never the secret.**\
        \ Terraform wires the reference and the\n  IAM permission; the value is resolved at runtime by\
        \ the consumer.\n\n## Common commands\n\n```bash\nterraform init\nterraform apply            \
        \                           # step 1\neval \"$(terraform output -raw state_proof_command)\"  \
        \ # the token, in clear\neval \"$(terraform output -raw fingerprint_command)\"   # what the consumer\
        \ reads\n# walk secret.tf step by step, re-running the proof\nterraform destroy\n```\n\nValidation\
        \ before committing: `terraform fmt -recursive` (root) and `terraform validate` in both\nthis\
        \ directory and `final/`.\n\n## Prerequisites\n\n- Terraform `>= 1.11.0` (pinned in `mise.toml`)\
        \ - the floor for write-only arguments; `ephemeral`\n  blocks land in 1.10, so write-only is what\
        \ constrains.\n- AWS provider `~> 6.0`, `random ~> 3.7`, `archive ~> 2.0`. AWS credentials for\
        \ `apply`.\n  Default region `eu-west-1`.\n\n## Conventions in this example\n\n- `recovery_window_in_days\
        \ = 0` on the secret so the destroy/re-apply loop works back to back. The\n  README says explicitly\
        \ that production keeps the default 7-day window - keep that caveat.\n- Measured behaviour stays\
        \ measured: the migration section of the README reports what was observed\n  on this resource\
        \ and this provider version. If a claim there changes, re-run it before editing.\n- Tags via `local.common_tags`\
        \ (`Project` / `ManagedBy`).\n- Error messages quoted in comments and README are verbatim Terraform\
        \ output. Do not paraphrase\n  them - they are the teaching material.\n"
