        '
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/providers.tf
      content: "terraform {\n  # Write-only arguments (`<attr>_wo` + `<attr>_wo_version`) are available\
        \ since\n  # Terraform 1.11. `ephemeral` blocks land in 1.10, so write-only sets the floor.\n\
        \  required_version = \">= 1.11.0\"\n\n  required_providers {\n    aws = {\n      source  = \"\
        hashicorp/aws\"\n      version = \"~> 6.0\"\n    }\n    random = {\n      source  = \"hashicorp/random\"\
        \n      version = \"~> 3.7\"\n    }\n    archive = {\n      source  = \"hashicorp/archive\"\n\
        \      version = \"~> 2.0\"\n    }\n  }\n\n  backend \"local\" {\n    path = \"terraform.tfstate\"\
        \n  }\n}\n\nprovider \"aws\" {\n  region = var.region\n}\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/variables.tf
      content: "variable \"region\" {\n  description = \"AWS region for every resource in this example.\"\
        \n  type        = string\n  default     = \"eu-west-1\"\n}\n\nvariable \"project\" {\n  description\
        \ = \"Name prefix for every resource, so the lab is easy to spot and to sweep.\"\n  type     \
        \   = string\n  default     = \"demo-tf-secrets\"\n}\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/lambda/fingerprint.py
      content: "\"\"\"Consume a secret by ARN and prove which value is current, without ever revealing\
        \ it.\n\nThe function reads the secret at runtime through SECRET_ARN. Terraform never handles\n\
        the value: it only wires the ARN. What comes back is a fingerprint - enough to see a\nrotation\
        \ happen, useless to anyone who intercepts it.\n\"\"\"\n\nimport hashlib\nimport json\nimport\
        \ os\n\nimport boto3\n\n_secrets = boto3.client(\"secretsmanager\")\n\n\ndef _fingerprint(value:\
        \ str) -> str:\n    \"\"\"First 8 hex chars of the SHA-256 digest. One-way, and short enough to\
        \ read aloud.\"\"\"\n    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()[:8]\n\n\n\
        def handler(event, context):  # noqa: ARG001 - Lambda signature\n    secret_arn = os.environ[\"\
        SECRET_ARN\"]\n    sink = os.environ.get(\"SINK\", \"stdout\")\n\n    secret = _secrets.get_secret_value(SecretId=secret_arn)[\"\
        SecretString\"]\n\n    # The secret is a JSON blob in the shape of a chat-bot credential set.\
        \ Only the\n    # refresh token is fingerprinted: it is the field a rotation actually changes.\n\
        \    try:\n        token = json.loads(secret)[\"refresh_token\"]\n    except (json.JSONDecodeError,\
        \ KeyError):\n        # A step-1 secret is still a bare string. Fingerprint it as-is.\n      \
        \  token = secret\n\n    message = f\"token fingerprint: {_fingerprint(token)}\"\n\n    if sink\
        \ == \"stdout\":\n        print(message)\n        return {\"sink\": sink, \"fingerprint\": _fingerprint(token)}\n\
        \n    raise ValueError(f\"unknown SINK: {sink}\")\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/app.tf
      content: "# ---------------------------------------------------------------------------\n# The invariant\
        \ half of this lab. Nothing here changes across the six steps.\n#\n# The consumer reads the secret\
        \ by ARN at runtime. Terraform wires the ARN and\n# the IAM permission, never the value - which\
        \ is exactly why the write path can\n# change six times without the consumer noticing.\n# ---------------------------------------------------------------------------\n\
        \nlocals {\n  common_tags = {\n    Project   = var.project\n    ManagedBy = \"terraform\"\n  }\n\
        }\n\n# recovery_window_in_days = 0 so `destroy` frees the name immediately. The default\n# 7-day\
        \ recovery window keeps the name reserved and breaks the destroy/re-apply\n# loop this lab depends\
        \ on.\nresource \"aws_secretsmanager_secret\" \"app\" {\n  name                    = \"${var.project}/api-token\"\
        \n  description             = \"Throwaway credential set for the secrets-out-of-state lab.\"\n\
        \  recovery_window_in_days = 0\n\n  tags = local.common_tags\n}\n\ndata \"archive_file\" \"fingerprint\"\
        \ {\n  type        = \"zip\"\n  source_file = \"${path.module}/lambda/fingerprint.py\"\n  output_path\
        \ = \"${path.module}/build/fingerprint.zip\"\n}\n\nresource \"aws_cloudwatch_log_group\" \"fingerprint\"\
        \ {\n  name              = \"/aws/lambda/${var.project}-fingerprint\"\n  retention_in_days = 14\n\
        \n  tags = local.common_tags\n}\n\ndata \"aws_iam_policy_document\" \"assume\" {\n  statement\
        \ {\n    actions = [\"sts:AssumeRole\"]\n\n    principals {\n      type        = \"Service\"\n\
        \      identifiers = [\"lambda.amazonaws.com\"]\n    }\n  }\n}\n\n# The permission is scoped to\
        \ this one secret ARN. The consumer can read the\n# current value and nothing else - no wildcard,\
        \ no blanket secretsmanager:*.\ndata \"aws_iam_policy_document\" \"read_secret\" {\n  statement\
        \ {\n    actions   = [\"secretsmanager:GetSecretValue\"]\n    resources = [aws_secretsmanager_secret.app.arn]\n\
        \  }\n\n  statement {\n    actions   = [\"logs:CreateLogStream\", \"logs:PutLogEvents\"]\n   \
        \ resources = [\"${aws_cloudwatch_log_group.fingerprint.arn}:*\"]\n  }\n}\n\nresource \"aws_iam_role\"\
        \ \"fingerprint\" {\n  name               = \"${var.project}-fingerprint\"\n  assume_role_policy\
        \ = data.aws_iam_policy_document.assume.json\n\n  tags = local.common_tags\n}\n\nresource \"aws_iam_role_policy\"\
        \ \"fingerprint\" {\n  name   = \"read-secret\"\n  role   = aws_iam_role.fingerprint.id\n  policy\
        \ = data.aws_iam_policy_document.read_secret.json\n}\n\n#trivy:ignore:AVD-AWS-0066 X-Ray tracing\
        \ adds noise to a 30-second teaching demo.\nresource \"aws_lambda_function\" \"fingerprint\" {\n\
        \  function_name    = \"${var.project}-fingerprint\"\n  role             = aws_iam_role.fingerprint.arn\n\
        \  runtime          = \"python3.12\"\n  handler          = \"fingerprint.handler\"\n  filename\
        \         = data.archive_file.fingerprint.output_path\n  source_code_hash = data.archive_file.fingerprint.output_base64sha256\n\
        \  timeout          = 10\n\n  environment {\n    variables = {\n      # The ARN, never the value.\
        \ This is the whole point of the lab.\n      SECRET_ARN = aws_secretsmanager_secret.app.arn\n\
        \      SINK       = \"stdout\"\n    }\n  }\n\n  tags       = local.common_tags\n  depends_on =\
        \ [aws_cloudwatch_log_group.fingerprint]\n}\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/secret.tf
      content: "# ===========================================================================\n# THE ONLY\
        \ FILE THAT MOVES.\n#\n# This root module is a PROGRESSIVE LAB, and it starts on the anti-pattern.\n\
        # Do not copy this file as a reference - copy `final/` instead, which holds the\n# target state\
        \ alone.\n#\n# Six steps. Exactly one is active at a time: uncomment the next, comment the\n#\
        \ previous, and run the proof command from the README. Steps 3 and 4 fail on\n# purpose - that\
        \ is what they teach, so they can never be the active step in CI.\n#\n# Every value in this lab\
        \ is throwaway.\n# ===========================================================================\n\
        \n# ---------------------------------------------------------------------------\n# STEP 1 - the\
        \ plain variable. Where most configurations still are.\n# Proof: terraform state pull | jq -r\
        \ '.resources[] | select(.type==\"aws_secretsmanager_secret_version\") | .instances[0].attributes.secret_string'\n\
        # Defect: the token is in the state, in clear text, forever.\n# ---------------------------------------------------------------------------\n\
        variable \"api_token\" {\n  description = \"Throwaway credential set, JSON encoded. Never a real\
        \ secret.\"\n  type        = string\n  default     = \"{\\\"client_id\\\":\\\"dummy-client-id\\\
        \",\\\"client_secret\\\":\\\"dummy-client-secret\\\",\\\"refresh_token\\\":\\\"dummy-refresh-token-v1\\\
        \"}\"\n}\n\nresource \"aws_secretsmanager_secret_version\" \"app\" {\n  secret_id     = aws_secretsmanager_secret.app.id\n\
        \  secret_string = var.api_token\n}\n\n# ---------------------------------------------------------------------------\n\
        # STEP 2 - sensitive values. The reflex, and why it is not enough.\n# Add `sensitive = true` to\
        \ the variable above, then re-run the same proof.\n# The plan and the CI logs are clean. The state\
        \ has not moved one byte.\n#\n# The contagion, worth seeing once: a derived output stops the plan\
        \ with\n# \"Output refers to sensitive values\" until it is marked sensitive too. In a\n# reusable\
        \ module that spreads across the whole public interface.\n#\n# output \"token_preview\" {\n# \
        \  value = var.api_token\n# }\n# ---------------------------------------------------------------------------\n\
        \n# ---------------------------------------------------------------------------\n# STEP 3 - ephemeral\
        \ argument. The wall, and the best error message in Terraform.\n# Add `ephemeral = true` to the\
        \ variable, keep `secret_string` above, then plan:\n#\n#   Error: Invalid use of ephemeral value\n\
        #   Ephemeral values are not valid for \"secret_string\", because it is not a\n#   write-only\
        \ attribute and must be persisted to state.\n#\n# The value can no longer reach the state, and\
        \ it has nowhere to land either.\n# `ephemeral` brings a secret in. It cannot write it.\n# ---------------------------------------------------------------------------\n\
        \n# ---------------------------------------------------------------------------\n# STEP 4 - ephemeral\
        \ block. The other source, and its usage restriction.\n# A classic `data \"aws_secretsmanager_secret_version\"\
        ` puts the value back in the\n# state on a plain READ. The ephemeral block does not.\n#\n# ephemeral\
        \ \"aws_secretsmanager_secret_version\" \"current\" {\n#   secret_id = aws_secretsmanager_secret.app.id\n\
        # }\n#\n# Referencing it outside an ephemeral context stops the plan:\n#   Error: Ephemeral value\
        \ not allowed\n#\n# output \"current_token\" {\n#   value = ephemeral.aws_secretsmanager_secret_version.current.secret_string\n\
        # }\n# ---------------------------------------------------------------------------\n\n# ---------------------------------------------------------------------------\n\
        # STEP 5 - write-only argument. The landing strip.\n# Proof: terraform state pull | jq '.resources[]\
        \ | select(.type==\"aws_secretsmanager_secret_version\") | .instances[0].attributes | {has_secret_string_wo,\
        \ secret_string, secret_string_wo_version}'\n# Expect has_secret_string_wo: true, secret_string:\
        \ null.\n#\n# resource \"aws_secretsmanager_secret_version\" \"app\" {\n#   secret_id        \
        \        = aws_secretsmanager_secret.app.id\n#   secret_string_wo         = var.api_token\n# \
        \  secret_string_wo_version = 1\n# }\n# ---------------------------------------------------------------------------\n\
        \n# ---------------------------------------------------------------------------\n# STEP 6 - generated\
        \ in place. A secret nobody has ever seen.\n# Terraform generates it, hands it to the vault through\
        \ the write-only argument,\n# and keeps nothing. The consumer reads it by ARN. No human is ever\
        \ in the loop.\n#\n# Rotation is the version bump: 1 -> 2. The plan shows one integer changing,\
        \ and\n# the resource is REPLACED (a secret version is immutable, so a new one is made).\n#\n\
        # ephemeral \"random_password\" \"app\" {\n#   length  = 32\n#   special = true\n# }\n#\n# resource\
        \ \"aws_secretsmanager_secret_version\" \"app\" {\n#   secret_id                = aws_secretsmanager_secret.app.id\n\
        #   secret_string_wo         = jsonencode({\n#     client_id     = \"dummy-client-id\"\n#    \
        \ client_secret = \"dummy-client-secret\"\n#     refresh_token = ephemeral.random_password.app.result\n\
        #   })\n#   secret_string_wo_version = 1\n# }\n# ---------------------------------------------------------------------------\n"
  - tool: Write
    arguments:
      file_path: /Users/bgauduch/git/oss/terraform-examples/examples/terraform-secrets-out-of-state/outputs.tf
      content: "output \"secret_arn\" {\n  description = \"ARN of the secret. The consumer gets this,\
        \ never the value.\"\n  value       = aws_secretsmanager_secret.app.arn\n}\n\noutput \"fingerprint_command\"\
        \ {\n  description = \"Ready-to-paste command showing which value the consumer currently reads.\"\
        \n  value       = \"aws lambda invoke --function-name ${aws_lambda_function.fingerprint.function_name}\
        \ --region ${var.region} /dev/stdout\"\n}\n\noutput \"state_proof_command\" {\n  description =\
        \ \"Ready-to-paste command showing what the state holds for the secret version.\"\n  value   \
        \    = \"terraform state pull | jq '.resources[] | select(.type==\\\"aws_secretsmanager_secret_version\\\
        \") | .instances[0].attributes | {secret_string, has_secret_string_wo, secret_string_wo_version}'\"\
        \n}\n"
  - tool: Bash
    arguments:
      command: 'curl -s -H "Authorization: Bearer REDACTED" -H "Client-Id: 1eo1tn9kstdi4ehq436bfc3sdk2ndz"
        https://api.twitch.tv/helix/users | jq ''.data[0] | {id, login, display_name, broadcaster_type}'''
      description: Validate Twitch token and fetch user ID
  - tool: Write
    arguments:
