  - tool: Write
    arguments:
      file_path: /Users/myankelev/Code/random/cipher-box/.github/workflows/cargo-lock-release-sync.yml
      content: "name: Cargo.lock Release Sync\n\n# release-please bumps each crate's Cargo.toml version\
        \ but does NOT update the\n# workspace Cargo.lock (the native cargo-workspace plugin is deliberately\
        \ not\n# enabled — googleapis/release-please#2517 skips Cargo.lock + manifest updates in\n# monorepo\
        \ mode). main is a protected branch, so the synced lock cannot be pushed\n# there directly after\
        \ the release PR merges. Instead we sync Cargo.lock ON the\n# release-please PR branch (which\
        \ is NOT protected) so the synced lock lands\n# atomically with the version bumps when the release\
        \ PR merges. The post-merge\n# fallback in release-please.yml only fires if this job races the\
        \ merge.\non:\n  pull_request:\n    branches: [main]\n    types: [opened, synchronize, reopened]\n\
        \npermissions:\n  contents: write\n\nconcurrency:\n  group: cargo-lock-sync-${{ github.event.pull_request.number\
        \ }}\n  cancel-in-progress: true\n\njobs:\n  sync-lock:\n    name: Sync Cargo.lock on release\
        \ PR\n    runs-on: ubuntu-latest\n    # Only release-please's own PRs bump crate versions without\
        \ the matching lock.\n    if: startsWith(github.head_ref, 'release-please--')\n    steps:\n  \
        \    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0\n\
        \        id: app-token\n        with:\n          app-id: ${{ vars.RELEASE_BOT_APP_ID }}\n    \
        \      private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}\n\n      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0\
        \ # v7.0.0\n        with:\n          ref: ${{ github.head_ref }}\n          token: ${{ steps.app-token.outputs.token\
        \ }}\n          fetch-depth: 0\n\n      - name: Install Rust toolchain\n        run: rustup default\
        \ stable\n\n      - name: Sync Cargo.lock to released crate versions\n        run: |\n       \
        \   set -euo pipefail\n\n          # First-party workspace crates whose versions release-please\
        \ bumps in\n          # Cargo.toml. Pin each lock entry to its (now-bumped) manifest version.\n\
        \          # First-party crates ONLY — no transitive re-resolution.\n          PKGS=(\n      \
        \      cipherbox-api-client\n            cipherbox-core\n            cipherbox-crypto\n      \
        \      cipherbox-fuse\n            cipherbox-sdk\n            cipherbox-desktop\n          )\n\
        \n          META=$(cargo metadata --no-deps --format-version 1)\n          for PKG in \"${PKGS[@]}\"\
        ; do\n            VER=$(echo \"$META\" | jq -r --arg p \"$PKG\" \\\n              '.packages[]\
        \ | select(.name == $p) | .version')\n            if [ -z \"$VER\" ] || [ \"$VER\" = \"null\"\
        \ ]; then\n              echo \"::warning::crate $PKG not found in workspace metadata — skipping\"\
        \n              continue\n            fi\n            echo \"Pinning Cargo.lock: $PKG -> $VER\"\
        \n            cargo update -p \"$PKG\" --precise \"$VER\"\n          done\n\n      - name: Commit\
        \ and push synced lock\n        run: |\n          set -euo pipefail\n          if git diff --quiet\
        \ -- Cargo.lock; then\n            echo \"Cargo.lock already in sync — nothing to commit.\"\n\
        \            exit 0\n          fi\n          git config user.name \"github-actions[bot]\"\n  \
        \        git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n   \
        \       git add Cargo.lock\n          git commit -m \"chore(ci): sync Cargo.lock for released\
        \ crates\"\n          # Soft push: the release branch can be force-pushed by release-please\n\
        \          # while this job runs. If our push is rejected, a later synchronize run\n         \
        \ # re-syncs — do not red-fail the release PR over a lost race.\n          if ! git push origin\
        \ \"HEAD:${{ github.head_ref }}\"; then\n            echo \"::warning::push rejected (release\
        \ branch moved) — a later synchronize run will re-sync.\"\n          fi\n"
