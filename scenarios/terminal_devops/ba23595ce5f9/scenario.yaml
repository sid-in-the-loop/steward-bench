        \ versions. The release PR merged before the pre-merge \\`cargo-lock-release-sync\\` job pushed\
        \ the synced lock, so main's committed Cargo.lock is briefly out of sync with the bumped Cargo.toml\
        \ versions. Merging this restores lock/manifest parity.\"\n          # Best-effort auto-merge;\
        \ harmless (|| true) if auto-merge is disabled.\n          gh pr merge \"$SYNC_BRANCH\" --repo\
        \ \"${{ github.repository }}\" --squash --auto || true"
