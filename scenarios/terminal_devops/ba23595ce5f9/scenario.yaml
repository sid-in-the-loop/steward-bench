        \n          SYNC_BRANCH=\"chore/cargo-lock-sync-${GITHUB_SHA:0:7}\"\n          git switch -c \"\
        $SYNC_BRANCH\"\n          git add Cargo.lock\n          git commit -m \"chore(ci): sync Cargo.lock\
        \ for released crates\"\n          git push origin \"HEAD:${SYNC_BRANCH}\"\n          gh pr create\
