      content: '## Problem


        The post-merge `Cargo.lock` sync in `release-please.yml` pushes directly to `main`, which is protected
        (classic branch protection, `enforce_admins`, 13 required checks). Every push is rejected with
        `GH006: Protected branch update failed ... Changes must be made through a pull request`. The retry/rebase
        loop is futile — each attempt is rejected by the protected-branch hook, not a non-fast-forward
        race (the logs show `Current branch main is up to date` before every rejection), so the step fails
        100% of the time a Rust crate is released (e.g. the release-please run for `#542`).


        ## Fix


        1. **New `cargo-lock-release-sync.yml`** — syncs `Cargo.lock` on the release-please **PR branch
        pre-merge** (that branch is not protected), pinning each first-party crate''s lock entry to its
        bumped `Cargo.toml` version. The synced lock then lands atomically when the release PR merges.
        Idempotent + soft-push, so a release-please force-push race never red-fails the PR.

        2. **`release-please.yml` post-merge step** — replaces the impossible direct-push-to-`main` +
        retry loop with a fallback that opens a follow-up PR if it ever detects a stale lock (the rare
        merge-before-sync race), instead of pushing to `main`. It never fails the release workflow on
        a protected-branch push.

        3. **`zizmor.yml`** — scopes the new job''s app token to `permission-contents: write` (least privilege)
        and defers `artipacked` for it, consistent with the other push workflows.


        ## Verification


        - `zizmor .github/workflows/` passes (the supply-chain security gate).

        - `actionlint` clean on both workflows.

        - Single root workspace, single `Cargo.lock` covering all 6 first-party crates incl. `cipherbox-desktop`;
        no CI job uses `--locked`.


        Note: the `Lint` check on this PR will be red until the stale `release-as` pins that the `#542`
        release left on `main` are cleared (done on `#548`); rebase onto `main` after that lands and it
        goes green.

        '
