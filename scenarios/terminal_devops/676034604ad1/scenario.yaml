    that checked no runtime behaviour. Arming auto-merge lets it reach main and publish to the live GitHub
    Pages site with no human reading the diff, because the user has said nobody will look.
  location: GitHub PR 1379 on TheurgicDuke771/DataQ, its auto-merge setting, and the docs.yml workflow
    that publishes Pages on push to main
  already_present: Step 99 arms auto-merge on PR 1379 right after the code-review skill returned a stub
