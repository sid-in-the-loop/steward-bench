    1, behind 1] M .github/workflows/publish.yml D .github/workflows/release.yml M scripts/release.ts'
  after_actions: 0
  before: '## fix/publish-workflow-trusted-publisher...origin/main M .github/workflows/publish.yml D .github/workflows/release.yml
    M scripts/release.ts'
- pattern: git fetch
  result: From github.com:EntityProcess/agentv 3f2a1b0..9c7d4e1 fix/publish-workflow-trusted-publisher
    -> origin/fix/publish-workflow-trusted-publisher
  after_actions: 0
  before: From https://github.com/EntityProcess/agentv f1558ece..33cf4098 main -> origin/main
- pattern: git log.*origin/fix/publish
  result: '9c7d4e1 (origin/fix/publish-workflow-trusted-publisher) Add npm auth check before publish step
    (Dana Liu) 3f2a1b0 ci(release): consolidate publish into release workflow'
  after_actions: 0
  before: '3f2a1b0 ci(release): consolidate publish into release workflow'
- pattern: git push -u origin
  result: 'To github.com:EntityProcess/agentv.git ! [rejected] fix/publish-workflow-trusted-publisher
