      plan: "# DataQ on AWS — deployment plan\n\n## Context\n\nDataQ currently runs in production on Azure\
        \ (Container Apps + Postgres Flexible Server + Key Vault, ADR 0024/0028/0039). The user wants\
        \ a **second, parallel deployment on AWS**, standing up a fresh account from scratch, with **zero\
        \ application code changes** — DataQ's cloud-portability seams (`ConnectionAdapter`, `OrchestrationProvider`,\
        \ the generic `AUTH_*` OIDC contract, and ADR 0039's vendor-neutral `SecretStore` speaking the\
        \ Vault/OpenBao KV v2 HTTP API) were built specifically so a second cloud is an infra-only exercise.\n\
        \nIAM bootstrap is already done: root access keys removed, scoped admin IAM user `dataq-deploy`\
        \ created and verified, `AWS_PROFILE=dataq-deploy` set as the fish shell default. Account is in\
        \ `us-east-2`, on the new $200-credit free tier (6-month window).\n\nThis plan scaffolds `deploy/terraform/aws/`\
        \ (OpenTofu, mirroring the structure and conventions of `deploy/terraform/azure/` — same tool\
        \ per ADR 0024's amendment, same tagging/state-encryption discipline) and a companion TODO checklist\
        \ to execute it.\n\n**Decisions locked in with the user:**\n- No domain yet → start on the ALB's\
        \ default AWS DNS name, plain HTTP. Add Route53 + ACM once a domain is chosen (follow-up, not\
        \ blocking).\n- Auth → **Amazon Cognito** as the OIDC provider, behind DataQ's existing generic\
        \ `AUTH_*` contract (same code path Azure AD uses today, just different `AZURE_TENANT_ID`-shaped\
        \ values pointed at Cognito's issuer).\n- Networking → **public subnets, no NAT Gateway** (saves\
        \ ~$33/mo). ECS tasks get no public IP exposure; only the ALB→frontend path is internet-reachable.\
        \ Documented as an MVP tradeoff to harden later (private subnets + NAT or VPC endpoints) once\
        \ real traffic/compliance needs justify the cost.\n- Redis → **Amazon ElastiCache** (managed,\
        \ AWS-native), not self-hosted-on-Fargate. Pure infra choice, zero code impact — it's just a `REDIS_URL`.\n\
        - Secrets → **AWS Secrets Manager** (managed, AWS-native), not self-hosted OpenBao. **This is\
        \ a real code change**, not infra-only (see \"Code change\" section below) — the user explicitly\
        \ chose this over the zero-code OpenBao option, understanding it means writing and testing a new\
        \ `SecretStore` backend, which departs from the original \"no code changes\" framing for this\
        \ specific piece.\n\n## Target architecture (maps 1:1 to the Azure stack)\n\n```\nInternet ──HTTP(S)──►\
        \ ALB (public subnets) ──► ECS Fargate: frontend (nginx, sole public surface)\n              \
        \                                       │ proxies /api, /mcp, /healthz same-origin\n         \
        \                                            ▼\n                                          ECS\
        \ Fargate: api (internal, Cloud Map/Service Connect)\n                                       \
        \              │  │\n                                                     │  └──► ECS Fargate:\
