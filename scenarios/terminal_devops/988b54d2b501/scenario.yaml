        \ tokens, same AUTH_* contract as Azure AD today)\nGitHub Actions ──OIDC (token.actions.githubusercontent.com)──►\
        \ IAM role (per-resource scoped) ──► ecs:UpdateService / RunTask\n```\n\nKey parity decisions\
        \ carried over from Azure (see rationale already captured from the Azure stack):\n- Frontend is\
        \ the only internet-facing thing; api/worker have no public ingress.\n- Worker cannot scale to\
        \ zero (embedded celery-beat) → ECS desired-count fixed at 1, not autoscaled to 0.\n- Migrate\
        \ is a discrete one-shot ECS `RunTask`, gated before rollout, polled to terminal state by CI —\
