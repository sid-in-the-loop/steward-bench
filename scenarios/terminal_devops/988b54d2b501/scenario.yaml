        header: Domain/TLS
        options:
        - label: No domain yet — start HTTP-only (Recommended)
          description: Use the ALB's default AWS DNS name for now (plain HTTP). Add a real domain + ACM
            TLS cert as a follow-up once you decide on one — this keeps the first deployment simple and
            free of DNS registration.
        - label: I have a domain to use
          description: You'll tell me the domain/registrar and we route Route53 + an ACM cert into the
            plan from the start, so the first deploy is already HTTPS with a real hostname.
      - question: How should sign-in work on the AWS deployment?
        header: Auth mode
        options:
        - label: Email OTP (Recommended)
          description: Reuses DataQ's existing IdP-less email-OTP auth (ADR 0032) — no new AWS identity
            service needed, just SMTP creds. Zero new code, fastest to stand up.
        - label: OIDC via Amazon Cognito
          description: Stands up a Cognito user pool as the OIDC provider behind the existing generic
            AUTH_* contract — more 'enterprise' but is extra AWS setup + Cognito has its own free-tier/cost
            curve to account for.
      - question: 'Networking: skip the NAT Gateway (~$33/mo) by running Fargate tasks in public subnets
          with locked-down security groups, or use the more textbook private-subnet + NAT setup?'
        header: Network design
        options:
        - label: Public subnets, no NAT (Recommended)
          description: ECS tasks (api/worker/redis/openbao/RDS) sit in public subnets but have no public
            IP/inbound access — only the ALB→frontend path is internet-reachable. Saves ~$33/mo, matches
            the cost-consciousness from our earlier free-tier discussion. Can harden to private subnets
            + NAT/VPC endpoints later.
        - label: Private subnets + NAT Gateway
          description: More conventional AWS security posture (compute never in a subnet with an IGW route)
            but costs ~$33/mo extra for the NAT Gateway alone, on top of everything else.
