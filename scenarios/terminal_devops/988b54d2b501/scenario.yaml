        \ file-for-file where the concept transfers):\n\n| File | Purpose |\n|---|---|\n| `versions.tf`\
        \ / `providers.tf` | OpenTofu + `hashicorp/aws ~>5.0` provider, `us-east-2`, local state with\
        \ the same `encryption {}` passphrase-based block used on Azure |\n| `main.tf` | VPC (2 public\
        \ subnets across 2 AZs, IGW, route table — no NAT), common tags (`project=dataq`, `purpose=dataq-app-aws`)\
        \ |\n| `variables.tf` / `terraform.tfvars.example` | Mirrors Azure's variable shape: `app_db_password`,\
        \ `state_encryption_passphrase` (sensitive, no default), image tags, `github_repo`, `github_environment`,\
        \ Cognito callback URLs, email/SMTP vars |\n| `ecs.tf` | ECS cluster + task definitions + services:\
        \ `frontend` (public via ALB target group), `api` (internal, Service Connect), `worker` (internal,\
        \ min=max=1, celery -B command) |\n| `migrate.tf` | One-off `aws_ecs_task_definition` for the\
        \ migrate job (alembic upgrade head), no service — invoked via `RunTask` from CI |\n| `alb.tf`\
        \ | Internet-facing ALB, listener on :80 (HTTP-only for now), target group → frontend service\
        \ only |\n| `postgres.tf` | `aws_db_instance` (`db.t4g.micro`, single-AZ, `publicly_accessible=false`,\
        \ in the public subnets per the network decision above), DB subnet group |\n| `redis.tf` | Self-hosted\
        \ Redis as its own ECS Fargate service (`redis:7-alpine`, pinned — same CVE rationale as Azure),\
        \ `--requirepass` via a generated secret, Service Connect internal DNS |\n| `openbao.tf` | Self-hosted\
        \ OpenBao as its own ECS Fargate service, `SECRET_STORE=openbao` wiring, KV v2 mount init |\n\
        | `cognito.tf` | User pool + app client (SPA + API resource server), mirrors the Azure AD app-registration\
        \ shape (`AZURE_*`-equivalent env vars point at Cognito's issuer/client id) |\n| `iam.tf` | ECS\
        \ task execution role, per-service task roles (least-priv: CloudWatch Logs write, nothing else\
        \ needed since secrets go through OpenBao not IAM-native Secrets Manager) |\n| `github_oidc.tf`\
        \ | `aws_iam_openid_connect_provider` for `token.actions.githubusercontent.com` + IAM role with\
        \ a trust-policy condition on `sub`, resource-scoped deploy policy |\n| `logs.tf` | CloudWatch\
        \ Log Groups per service, retention matching Azure's `log_retention_days` |\n| `outputs.tf` |\
        \ ALB DNS name, RDS endpoint, Cognito pool/client IDs — feeds the same \"wire into GitHub repo\
        \ secrets/vars\" convention as the Azure README |\n| `README.md` | Runbook mirroring `deploy/terraform/azure/README.md`:\
        \ prerequisites, manual RDS role/DB bootstrap SQL, `tofu init/plan/apply`, post-apply `gh secret\
        \ set`/`gh variable set` commands, verify section |\n\nAlso:\n- `.github/workflows/deploy-aws.yml`\
        \ — new, manual `workflow_dispatch` initially, mirrors `deploy.yml`'s build→push (GHCR)→migrate(RunTask,\
        \ poll-to-terminal)→`ecs update-service` (api, then worker, then frontend) pattern, OIDC login\
        \ via `aws-actions/configure-aws-credentials`.\n- One `deploy/README.md` update: fill in the AWS\
        \ section (already stubbed) with the concrete resource list once built, add the AWS pre-deploy/post-deploy\
        \ checklist entries alongside the existing Azure ones.\n\nNo backend/frontend application code\
        \ changes.\n\n## TODO checklist (execution order)\n\n1. [ ] Scaffold `deploy/terraform/aws/` —\
