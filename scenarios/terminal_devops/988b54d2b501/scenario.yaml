        \  ├──► ElastiCache Redis (cache.t4g.micro, managed)\n                                       \
        \              ├──► AWS Secrets Manager (IAM task-role auth, no self-hosted component)\n     \
        \                                                ├──► RDS PostgreSQL (db.t4g.micro, public subnet,\
        \ not publicly accessible)\n                                                     └──► CloudWatch\
        \ Logs\nECS one-off task: migrate (alembic upgrade head, run before every deploy, polled to terminal\
        \ state)\nCognito User Pool ──OIDC──► frontend + api (validates tokens, same AUTH_* contract as\
        \ Azure AD today)\nGitHub Actions ──OIDC (token.actions.githubusercontent.com)──► IAM role (per-resource\
        \ scoped) ──► ecs:UpdateService / RunTask\n```\n\nKey parity decisions carried over from Azure\
        \ (see rationale already captured from the Azure stack):\n- Frontend is the only internet-facing\
        \ thing; api/worker have no public ingress.\n- Worker cannot scale to zero (embedded celery-beat)\
        \ → ECS desired-count fixed at 1, not autoscaled to 0.\n- Migrate is a discrete one-shot ECS `RunTask`,\
        \ gated before rollout, polled to terminal state by CI — not an init container.\n- Image rollout\
        \ stays out-of-band from Terraform (`ignore_changes` equivalent + CI does `aws ecs update-service\
