  - tool: AskUserQuestion
    arguments:
      questions:
      - question: 'Redis: use AWS ElastiCache (managed) or self-hosted Redis on Fargate?'
        header: Redis choice
        options:
        - label: ElastiCache (AWS-native)
          description: Managed AWS service, no patching/maintenance, but extra ~$12-15/mo minimum for
            the smallest node (cache.t4g.micro) and no free-tier coverage. Zero code impact either way
            — it's just a REDIS_URL.
        - label: Self-hosted on Fargate (matches what Azure does)
          description: Same approach Azure already uses in prod — redis:7-alpine pinned (CVE-avoidance),
            run as its own ECS task. Cheaper, but you own patching/restarts. This is not a workaround,
            it's literally the existing Azure architecture.
      - question: 'Secrets: use AWS Secrets Manager (native) or self-hosted OpenBao on Fargate?'
        header: Secrets choice
        options:
        - label: Self-hosted OpenBao (Recommended, zero new code)
          description: DataQ's SecretStore already speaks OpenBao's KV v2 HTTP API today (ADR 0039) —
            pointing SECRET_STORE=openbao at a self-hosted instance on AWS needs zero backend code changes.
            AWS-native, but not the AWS 'default' secrets service.
        - label: AWS Secrets Manager (AWS-native, needs new code)
          description: Matches how Azure uses Key Vault (a managed secrets service with IAM-based auth,
            no self-hosted component) — but there is currently no AWS Secrets Manager SecretStore implementation
            in the codebase. This means writing and testing a new backend class, which goes against 'no
            code changes' from the original ask.
  - tool: Bash
    arguments:
      command: grep -rl "class.*SecretStore" backend/app/ 2>/dev/null; echo "---"; find backend/app -iname
        "*secret*" -type f 2>/dev/null
      description: Locate existing SecretStore implementation files
  - tool: Bash
    arguments:
      command: grep -n "class \|def get\|def set\|def delete\|SECRET_STORE\|Literal\[" backend/app/core/secrets.py
        | head -60
      description: Inspect SecretStore class structure and interface
