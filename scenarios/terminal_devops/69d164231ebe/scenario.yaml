        \ next manual run\n    process.exitCode = 1;\n  }\n}\n\nmain().catch(e => {\n  console.error(`[codex-refresh]\
        \ fatal: ${e.stack || e.message}`);\n  if (String(e.message).includes(\"400\") || String(e.message).includes(\"\
        invalid_grant\")) {\n    console.error(`[codex-refresh] refresh_token rejected — re-run: codex\
        \ login --device-auth  &&  gh secret set CODEX_AUTH_JSON --repo ${REPO} < ~/.codex/auth.json`);\n\
        \  }\n  process.exit(1);\n});\n"
