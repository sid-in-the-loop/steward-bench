        \ null, 2) + \"\\n\");\n  console.log(`[codex-refresh] wrote new tokens, new refresh truncated=${after.tokens.refresh_token.slice(0,20)}...`);\n\
        \n  // push to GitHub secret via gh\n  const jsonStr = JSON.stringify(after);\n  // gh secret\
