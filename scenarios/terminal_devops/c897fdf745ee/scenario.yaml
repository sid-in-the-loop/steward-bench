        \ else 999)\n            print(f\"AWS-0132 FAIL -> line {ln} -> {names.get(ln, names[best])}\"\
        )\nprint(\"--- buckets NOT flagged by AWS-0132 = PASS ---\")\nflagged=set()\nfor res in d.get(\"\
        Results\",[]):\n    for m in res.get(\"Misconfigurations\",[]):\n        if m.get(\"ID\")==\"\
        AWS-0132\":\n            flagged.add(m.get(\"CauseMetadata\",{}).get(\"StartLine\"))\nfor k,v\
        \ in names.items():\n    print((\"FAIL \" if k in flagged else \"PASS \")+v)\n'"
      description: Extract AWS-0132 findings per variant
  - tool: Write
    arguments:
      file_path: /private/tmp/claude-501/-Users-bgauduch-Obsidian-Vault/a3cdac24-a5e0-4d81-857e-5edd144921eb/scratchpad/trivy-a1/main.tf
      content: "# Probe A1: does trivy AWS-0132 pass when the CMK is a RESOURCE REFERENCE\n# (root-created\
        \ key) feeding a CONDITIONAL-count SSE config (module as-is)?\n\nvariable \"enable_encryption\"\
        \ {\n  type    = bool\n  default = true\n}\n\nresource \"aws_kms_key\" \"ex\" {\n  description\
        \ = \"root-created CMK\"\n}\n\n# bucket A: module-as-is style -> conditional count keyed on enable_encryption\
        \ && key!=null\nlocals {\n  kms_enabled = var.enable_encryption && aws_kms_key.ex.arn != null\n\
        }\nresource \"aws_s3_bucket\" \"a_conditional\" {\n  bucket = \"probe-a-conditional\"\n}\nresource\
