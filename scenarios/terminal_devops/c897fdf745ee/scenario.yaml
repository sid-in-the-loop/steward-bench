        \ && trivy config . --severity HIGH,CRITICAL --misconfig-scanners terraform -f json 2>/dev/null\
        \ | python3 -c '\nimport json,sys\nd=json.load(sys.stdin)\nnames={4:\"v1_sse_s3(AES256)\",17:\"\
