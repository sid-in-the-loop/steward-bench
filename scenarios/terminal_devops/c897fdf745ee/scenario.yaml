      content: "# Plan - Fix CI on PR #33 - always-encrypt + documented trivy exception\n\n## Context\n\
        \nPR #33 (`bgauduch/terraform-examples`, branch `feat/terraform-module-testing`) adds the live's\n\
        `terraform test` example. Two of three red checks already fixed + pushed (commit `b384bf0`):\n\
        commitlint (body reflow), fmt, deferred-actions/02 (transient 503), and the example's tflint\n\
        findings (`tests/setup` version constraints -> root-style `~>`; `enable_encryption` now used).\n\
        \n**Remaining red check:** `validate + lint + scan (terraform-module-testing)` fails at **trivy**:\n\
        single finding **AWS-0132 (HIGH)** - the example bucket isn't encrypted with a customer-managed\
        \ key\n(the module makes SSE-KMS conditional; with default vars there's no encryption at all).\n\
        \n## Empirical validation (trivy 0.71.2, probed locally)\n- A managed key does NOT satisfy AWS-0132:\
        \ `AES256` (SSE-S3) FAILS, `aws:kms` with no key id\n  (aws/s3 managed key) FAILS; only `aws:kms`\
        \ + a real CMK ARN PASSES.\n- An inline `#trivy:ignore:AWS-0132` on the `aws_s3_bucket_server_side_encryption_configuration`\n\
        \  resource **survives the CI 2-step** (`trivy config -o json` then `trivy convert --exit-code\
        \ 1`):\n  A/B proven - without it gate exit=1, with it the finding is dropped from the JSON and\
        \ gate exit=0.\n\n## Decision (per user)\nPragmatic for the example - don't over-engineer:\n1.\
        \ **Always encrypt the bucket.** With a CMK (when `enable_encryption` + `kms_key_arn`) -> SSE-KMS\n\
        \   with that key; otherwise fall back to the **AWS-managed key for S3** (`kms_master_key_id =\
        \ null`).\n   This is strictly better than today (today: no encryption when no key).\n2. **Add\
        \ a documented trivy exception** (`#trivy:ignore:AWS-0132`) - the fallback path uses a\n   managed\
        \ key, not a CMK, which AWS-0132 flags.\n3. **Leave a `TODO(security)` comment** to harden later\
        \ (require/provision a CMK, e.g. the\n   \"root provisions a CMK\" pattern - kept as a future\
        \ improvement, not done now).\n4. **Break nothing else** - verify all examples + the demo are\
        \ unaffected.\n\n## Changes (minimal)\n\n### `examples/terraform-module-testing/modules/s3-bucket/main.tf`\n\
        Make the SSE config always-on + add the exception. `local.kms_enabled` is kept (drives the CMK\n\
        choice + the `encryption_enabled` output); `enable_encryption`, its cross-variable validation,\
        \ and\nall other resources stay as-is.\n```hcl\n# The bucket is always encrypted. With a CMK (enable_encryption\
        \ + kms_key_arn) it uses\n# SSE-KMS with that key; otherwise it falls back to the AWS-managed\
        \ key for S3\n# (kms_master_key_id = null). trivy AWS-0132 wants a customer-managed key, which\
        \ the\n# fallback path doesn't use, so it is ignored here.\n# TODO(security): require a CMK to\
        \ satisfy AWS-0132 for real - e.g. provision one in the\n# root and inject it (like the deferred-actions\
        \ example). Deferred hardening.\n#trivy:ignore:AWS-0132\nresource \"aws_s3_bucket_server_side_encryption_configuration\"\
        \ \"this\" {\n  bucket = aws_s3_bucket.this.id\n  rule {\n    apply_server_side_encryption_by_default\
        \ {\n      sse_algorithm     = \"aws:kms\"\n      kms_master_key_id = local.kms_enabled ? var.kms_key_arn\
        \ : null\n    }\n    bucket_key_enabled = true\n  }\n}\n```\n(was `count = local.kms_enabled ?\
        \ 1 : 0` + `kms_master_key_id = var.kms_key_arn`)\n\n### `examples/terraform-module-testing/tests/plan.tftest.hcl`\n\
        The SSE resource is no longer count-indexed, so the two encryption runs change from\npresence/absence\
        \ to key-id value (exact `rule` indexing verified by running the test):\n- `no_encryption_block_without_key`\
        \ -> `falls_back_to_managed_key_without_cmk`\n  (`enable_encryption=false`): assert\n  `one(aws_s3_bucket_server_side_encryption_configuration.this.rule).apply_server_side_encryption_by_default[0].kms_master_key_id\
        \ == null`.\n- `encryption_block_present_with_key` -> `uses_provided_cmk` (`enable_encryption=true`,\n\
        \  `kms_key_arn=\"arn:...demo-key\"`): assert the same path `== \"arn:...demo-key\"` (drop the\n\
        \  `length(...) == 1` assertion).\n\n### `examples/terraform-module-testing/tests/deploy.tftest.hcl`\n\
        `output.encryption_enabled == false` still holds (no CMK in use by default). Only update the\n\
        `error_message` wording to \"CMK encryption must be off (managed-key fallback) ...\" for accuracy.\n\
        \n### `examples/terraform-module-testing/modules/s3-bucket/outputs.tf`\nClarify the `encryption_enabled`\
        \ description (\"true when a customer-managed key is in use\").\n\n### Untouched\nModule `variables.tf`\
        \ (incl. the `enable_encryption` cross-var validation),\n`tests/validations.tftest.hcl`, `tests/parallel.tftest.hcl`,\
        \ root `main.tf`/`variables.tf`/\n`outputs.tf`, `sweep.sh` (no real CMK is created anywhere ->\
        \ no KMS leak -> sweeper stays S3-only).\nUser's pending working-tree edits (`~>` constraints,\
        \ EN comments) kept.\n\n## Verification (local)\n1. `terraform init`; `terraform fmt -recursive\
        \ -check` -> clean.\n2. `tflint --recursive --config .tflint.hcl` -> exit 0.\n3. CI 2-step: `trivy\
        \ config . -f json -o trivy.json --exit-code 0` then\n   `trivy convert --severity HIGH,CRITICAL\
        \ --exit-code 1 trivy.json` -> **exit 0** (AWS-0132 ignored,\n   no other HIGH).\n4. `terraform\
        \ test -filter=tests/validations.tftest.hcl -filter=tests/plan.tftest.hcl` -> creds-free\n   (mock_provider);\
        \ confirms the rewritten assertions hold and validations still pass.\n5. Apply tests (`deploy`,\
        \ `parallel`) need `AWS_PROFILE=sandbox` (eu-west-1); not in CI. Offer to run\n   the full suite\
        \ against the sandbox as a final check.\n\n## Land it\n- Stage changes + pending working-tree\
        \ edits; **amend** the single PR commit `b384bf0` (body still\n  accurate, lines <=100); `git\
        \ push --force-with-lease`; poll `gh pr checks` until green.\n\n## Out of scope (surfaced)\n-\
        \ Root `providers.tf` still `>=` for aws/core (best practice: `~>` for a root) - follow-up.\n\
        - The \"root provisions a CMK\" hardening (A1) - the proper AWS-0132 fix - deferred per the TODO.\n"
