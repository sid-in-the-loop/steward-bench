      content: "# Plan - Fix CI on PR #33 (terraform-module-testing) - A1 (root provides CMK)\n\n## Context\n\
        \nPR #33 (`feat/terraform-module-testing`, `bgauduch/terraform-examples`) adds the live's native\n\
        `terraform test` example. CI had 3 red checks; two are **already fixed and pushed** (commit\n\
        `b384bf0`):\n- **Conventional commits**: 120-char body line reflowed to <=100. GREEN.\n- **fmt\
        \ / deferred-actions/02-after**: the latter was a transient 503 on trivy attestation; the\n  re-push\
        \ re-ran it. GREEN. tflint findings in the example (missing `required_version`/provider\n  version\
        \ in `tests/setup/main.tf`; `enable_encryption` unused) also fixed; version constraints\n  set\
        \ to root-style `~>` per HashiCorp best practice. User translated touched-file comments FR->EN.\n\
        \n**Remaining red check:** `validate + lint + scan (terraform-module-testing)` now fails at the\n\
        **trivy** step (it previously died earlier at tflint, so trivy never ran). Single finding:\n**AWS-0132\
        \ (HIGH)** - the example bucket isn't encrypted with a customer-managed key (CMK).\n\n## Empirical\
        \ findings (probed locally, trivy 0.71.2)\n\nSettles the design. AWS-0132 verdict per encryption\
        \ style:\n\n| Encryption style | sse_algorithm | kms_master_key_id | AWS-0132 |\n|---|---|---|---|\n\
        | SSE-S3 | `AES256` | (S3-managed) | **FAIL** |\n| KMS managed | `aws:kms` | null (`aws/s3` key)\
        \ | **FAIL** |\n| **CMK** | `aws:kms` | real key ARN | **PASS** |\n| none | - | - | FAIL |\n\n\
        => A managed key does NOT satisfy the gate. A real CMK does. `deferred-actions/02-after` passes\n\
        **only because its root creates `aws_kms_key.root` and injects it** - the module does not self-create.\n\
        \nSecond probe: with a **root-provided CMK reference**, BOTH a conditional-`count` SSE config\n\
        (module as-is) AND an always-on SSE config PASS AWS-0132. So we do NOT need to touch the module\n\
        or rewrite tests - we only need the **root** to provision and pass a CMK.\n\n## Decision (supersedes\
        \ the earlier \"module creates its own CMK\" idea)\n\n**A1 - the root provisions a CMK and passes\
        \ it to the module** (mirrors `deferred-actions`, gives\nlive-series continuity). The module's\
        \ conditional SSE-KMS, the cross-variable validations, and the\nplan/validation tests stay **unchanged**.\
        \ Minimal blast radius.\n\n## Changes\n\n### `examples/terraform-module-testing/main.tf` (root)\n\
        Add a KMS key and wire it into the module call (replacing the var-driven encryption inputs):\n\
        ```hcl\n# The example bucket is encrypted with a customer-managed key by default. The root\n#\
        \ provisions the CMK and passes it down (same pattern as the deferred-actions live).\nresource\
        \ \"aws_kms_key\" \"example\" {\n  description             = \"CMK for the terraform-module-testing\
        \ example bucket\"\n  enable_key_rotation     = true\n  deletion_window_in_days = 7\n}\n\nmodule\
        \ \"bucket\" {\n  source             = \"./modules/s3-bucket\"\n  bucket_name        = var.bucket_name\n\
        \  environment        = var.environment\n  enable_encryption  = true\n  kms_key_arn        = aws_kms_key.example.arn\n\
        \  force_destroy      = var.force_destroy\n  versioning_enabled = var.versioning_enabled\n  tags\
        \               = { example = \"terraform-module-testing\" }\n}\n```\n\n### `examples/terraform-module-testing/variables.tf`\
        \ (root)\n`enable_encryption` and `kms_key_arn` are no longer referenced at the root (hardcoded\
        \ above) ->\n**remove both** to avoid tflint `terraform_unused_declarations`. No test sets them\
        \ at root level\n(deploy/parallel only set bucket_name/environment/force_destroy/versioning_enabled),\
        \ so this is safe.\n(`run_id`, `region`, `bucket_name`, `environment`, `force_destroy`, `versioning_enabled`\
        \ stay.)\n\n### `examples/terraform-module-testing/outputs.tf` (root)\nUnchanged - `encryption_enabled`\
        \ / `kms_key_arn` outputs map to the module outputs (not the removed\nroot vars).\n\n### `examples/terraform-module-testing/tests/deploy.tftest.hcl`\n\
        The default is now CMK-on, so flip the one encryption assertion in `deploy_and_assert`:\n```hcl\n\
        assert {\n  condition     = output.encryption_enabled == true\n  error_message = \"the example\
        \ bucket must be encrypted with a CMK by default\"\n}\nassert {\n  condition     = output.kms_key_arn\
        \ != null\n  error_message = \"a CMK ARN must be exposed for the deployed bucket\"\n}\n```\n\n\
        ### `examples/terraform-module-testing/sweep.sh`\nThe root now creates a KMS key on every real\
        \ apply (`deploy`, `parallel`), which can leak if a test\nis interrupted before auto-destroy.\
        \ Extend the sweeper (today S3-only):\n- Broaden the tag query: `--resource-type-filters \"s3\"\
        \ \"kms\"`.\n- In the delete loop, branch on ARN: bucket -> empty + `delete-bucket` (existing);\
        \ KMS ->\n  `aws kms schedule-key-deletion --key-id <id> --pending-window-in-days 7` (keys can't\
        \ be hard-deleted).\n- Update header comment + dry-run listing. (No version header - this repo\
        \ doesn't use the vault's\n  script-versioning convention.)\n\n### Untouched (key point)\n`modules/s3-bucket/**`\
        \ (conditional `count = kms_enabled ? 1 : 0` kept), `tests/plan.tftest.hcl`,\n`tests/validations.tftest.hcl`,\
        \ `tests/parallel.tftest.hcl`. The user's pending working-tree edits\n(`~>` version constraints,\
        \ EN comments) are kept.\n\n## Verification (local, no AWS creds needed for CI-green)\n1. `terraform\
        \ init`\n2. `terraform fmt -recursive -check` -> clean\n3. `tflint --recursive --config .tflint.hcl`\
        \ -> exit 0 (confirms no unused-var after removing root vars)\n4. `trivy config . --severity HIGH,CRITICAL\
        \ --exit-code 1` -> **passes** (no AWS-0132)\n5. `terraform test -filter=tests/validations.tftest.hcl\
        \ -filter=tests/plan.tftest.hcl` -> creds-free\n   (mock_provider); confirms module + those tests\
        \ still green\n6. Apply tests (`deploy`, `parallel`) need `AWS_PROFILE=sandbox` (eu-west-1). Not\
        \ run in CI. Offer to\n   run the full suite against the sandbox as a final confidence check.\n\
        \n## Land it\n- Stage the changed files + pending working-tree edits.\n- **Amend** the single\
        \ PR commit `b384bf0` (feature PR = one clean commit). Body stays accurate\n  (\"conditional SSE-KMS\"\
        \ still true) - no body change. Lines already <=100.\n- `git push --force-with-lease`; poll `gh\
        \ pr checks` until `terraform-module-testing` is green.\n\n## Out of scope (surfaced, not done)\n\
        - Root `providers.tf` still uses `>=` for aws/core; per the same best practice a root should use\
        \ `~>`.\n  Left untouched (demoed centerpiece, outside \"fix what you added\"); flag as a follow-up.\n"
