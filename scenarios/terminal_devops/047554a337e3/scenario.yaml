        \ all\ndepend on whoever drives that session. PRs #432/#433 folded the bump into the\nfix PR (good)\
        \ but still leaned on the human/LLM to pick the tier and keep the\nlock synced. Result: inconsistency\
        \ across sessions/LLMs and the recurring\n`uv.lock` drift.\n\n**Goal:** derive the bump tier automatically\
        \ from the PR's Conventional-Commit\ntype and apply the `pyproject`+`uv.lock` edit in CI, so it\
        \ happens identically\nregardless of session or LLM. No standalone `chore(release)` commits.\n\
        `release-cut.yml` stays untouched.\n\n## Design decisions (confirmed with user)\n\n- **Push token:**\
        \ fine-grained PAT in repo secret `BUMP_TOKEN` (Contents: write,\n  Pull requests: write). Required\
        \ because `GITHUB_TOKEN`-pushed commits do **not**\n  trigger workflows (same anti-recursion rule\
        \ `release-cut.yml:12` documents for\n  tags) — the bumped SHA would get no check runs and every\
        \ PR would deadlock.\n  **User must create this before the first PR merges.**\n- **Tier source:**\
        \ PR **title** (authoritative conventional-commit string; already\n  what `release-cut` reads\
        \ for the theme, and what the squash subject becomes).\n- **Strict merge:** enable required-branches-up-to-date\
        \ on `main` to close the\n  two-PRs-in-flight version-collision hole.\n\n## Tier logic (fully\
        \ deterministic — zero human judgment)\n\nWhether-to-bump keeps the RELEASE.md §4 **shipped-surface\
        \ path gate**; only the\ntier is derived from type:\n\n1. Diff touches **no** shipped surface\
        \ (`src/`, `src/agentalloy/_packs/`,\n   `frontend/`, `Containerfile*`/`container/`, dep pins\
