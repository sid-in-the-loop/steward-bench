        \ `feat!`/`BREAKING CHANGE` → major, `feat` → minor, everything else touching shipped code → patch.\n\
        \nPure, unit-tested logic in `scripts/version_bump.py`; the workflow is the I/O + push shell.\
        \ Idempotent no-op once bumped. `release-cut.yml` is untouched.\n\n## Required infra (post-merge,\
