        \ (anti-recursion), which would deadlock auto-merge on the bumped SHA.\n3. *Then* enable `strict`\
        \ + add `version-bump` to required contexts.\n\nDoing (3) before (2) deadlocks the first shipped\
        \ PR.\n\n## Tests\n\n- `tests/test_version_bump.py`: 43 tests — tier mapping (incl. `feat!`/`BREAKING`),\
