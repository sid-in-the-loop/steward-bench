      planFilePath: /home/nmeyers/.claude/plans/distributed-chasing-gizmo.md
  - tool: TaskCreate
    arguments:
      subject: scripts/version_bump.py — pure tier/SemVer logic + CLI
      description: 'Pure functions: tier_from_title, touches_shipped_surface, bump, decide + __main__
        CLI. Mirror pack-guard ethos.'
  - tool: TaskCreate
    arguments:
      subject: tests/test_version_bump.py — unit tests
      description: Test tier mapping (feat!/BREAKING/else→patch/no-shipped→none), SemVer resets, idempotency.
