      content: "# Plan: Fully automatic SemVer bumps from PR type\n\n## Context\n\nVersion bumps were\
        \ never truly automatic. `release-cut.yml` auto-cuts the tag +\nrelease when an **untagged** version\
        \ lands on `main`, but RELEASE.md §4/§5\ndeliberately keep *\"the version BUMP a human decision\
