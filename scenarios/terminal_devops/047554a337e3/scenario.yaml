        \ I/O + push shell.\n#\n# TWO INVARIANTS this workflow depends on:\n# - The bump commit MUST be\
        \ pushed with a NON-default token (secret BUMP_TOKEN,\n#   a fine-grained PAT with contents+PR\
        \ write). GITHUB_TOKEN-pushed commits do\n#   NOT trigger workflows (GitHub anti-recursion — the\
        \ same rule release-cut.yml\n#   documents for tags). A GITHUB_TOKEN push would leave the bumped\
        \ SHA with no\n#   check runs and deadlock auto-merge on the required checks.\n# - This job (`version-bump`)\
        \ is a REQUIRED status check. Because it only goes\n#   green on the fully-bumped SHA (idempotent\
        \ no-op once bumped), auto-merge can\n#   never fire on the un-bumped commit.\n#\n# Idempotent:\
        \ if the branch already carries a bump (a human/LLM did it, or this\n# job's own push re-triggered\
        \ the run), the script emits nothing and the job is\n# a clean green no-op. release-cut.yml is\
        \ untouched — it still cuts the tag when\n# the untagged version lands on main and CI is green.\n\
        \non:\n  pull_request:\n    types: [opened, synchronize, reopened, edited]\n\nconcurrency:\n \
        \ group: version-bump-${{ github.event.pull_request.number }}\n  cancel-in-progress: true\n\n\
        permissions:\n  contents: read # the bump commit is pushed with BUMP_TOKEN, not GITHUB_TOKEN\n\
        \njobs:\n  version-bump:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out PR head\
        \ branch\n        uses: actions/checkout@v4\n        with:\n          # head_ref = the PR's source\
        \ branch (not the detached merge ref), so\n          # we can commit + push back to it. fetch-depth\
        \ 0: the script reads the\n          # base commit's pyproject and the base..HEAD diff.\n    \
        \      ref: ${{ github.head_ref }}\n          fetch-depth: 0\n          token: ${{ secrets.BUMP_TOKEN\
        \ }}\n\n      - name: Install uv\n        uses: astral-sh/setup-uv@v3\n        with:\n       \
        \   enable-cache: true\n\n      - name: Compute and apply version bump\n        env:\n       \
        \   PR_TITLE: ${{ github.event.pull_request.title }}\n          BASE_SHA: ${{ github.event.pull_request.base.sha\
        \ }}\n        run: |\n          set -euo pipefail\n          next=$(uv run python scripts/version_bump.py\
        \ \\\n            --title \"$PR_TITLE\" --base-sha \"$BASE_SHA\")\n\n          if [ -z \"$next\"\
        \ ]; then\n            echo \"No version bump warranted (no shipped-surface change, or already\
        \ bumped).\"\n            exit 0\n          fi\n\n          echo \"Deriving bump → v$next\"\n\
        \          # Exactly one top-level `version = \"...\"` line in pyproject.toml.\n          sed\
        \ -i -E \"s/^version = \\\"[^\\\"]+\\\"/version = \\\"$next\\\"/\" pyproject.toml\n          uv\
        \ lock\n\n          git config user.name \"agentalloy-release-bot\"\n          git config user.email\
        \ \"release-bot@users.noreply.github.com\"\n          git add pyproject.toml uv.lock\n       \
        \   git commit -m \"chore: bump version to $next\" \\\n            -m \"Automated bump derived\
        \ from the PR title's Conventional-Commit type.\" \\\n            -m \"Co-Authored-By: agentalloy-release-bot\
        \ <release-bot@users.noreply.github.com>\"\n          git push origin \"HEAD:${{ github.head_ref\
        \ }}\"\n"
