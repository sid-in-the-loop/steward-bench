        \ + green.\n\n## Verification\n1. **Unit:** `uv run pytest tests/test_version_bump.py -q` — tier/SemVer/idempotency.\n\
        2. **Full gate:** `uv run ruff check . && uv run ruff format --check . && uv run\n   pyright &&\
        \ uv run pytest -m \"not integration and not container\"`.\n3. **Live end-to-end (after `BUMP_TOKEN`\
        \ exists):** open a throwaway `fix:` PR\n   touching a `src/` file → confirm the bump job commits\
        \ `pyproject`+`uv.lock`\n   to the branch, CI re-runs green on the bumped SHA, and on merge `release-cut`\n\
        \   tags the derived version. Then a `docs:`-only PR → confirm **no** bump.\n4. Confirm `gh api\
        \ repos/nrmeyers/agentalloy/branches/main/protection` shows\n   `version-bump` in contexts and\
        \ `strict: true`.\n\n## Blocker to surface at handoff\nUser must create the fine-grained PAT and\
