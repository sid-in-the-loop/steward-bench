      new_string: "## 4. Versioning (SemVer)\n\nVersion lives in `pyproject.toml` (`[project] version`).\
        \ Every tier refers to\n**shipped code only**: **patch** = bug fix to shipped behavior, **minor**\
        \ =\nbackward-compatible feature, **major** = breaking change. Changes outside the\nshipped surface\
        \ (CI, docs, tests, tooling) have no SemVer tier — they don't\nversion at all.\n\n### The bump\
        \ is automatic — you do not choose the tier or edit `pyproject`\n\n`Version Bump` (`.github/workflows/version-bump.yml`)\
        \ derives and applies the\nbump on every PR. You never open a `chore(release)` PR and never hand-edit\
        \ the\nversion. Two deterministic gates (`scripts/version_bump.py`, unit-tested in\n`tests/test_version_bump.py`):\n\
        \n- **Whether to bump — shipped-surface path gate.** A bump happens only when the\n  PR's diff\
        \ touches the **shipped surface**: `src/` (incl. `src/agentalloy/_packs/`),\n  `frontend/`, `Containerfile*`\
        \ / `container/`, or dependency pins in\n  `pyproject.toml` / `uv.lock`. PRs touching only CI,\
        \ docs, tests, or tooling do\n  **not** bump — main being ahead of the last tag by that class\
        \ of change is not\n  drift, it's the definition.\n- **Which tier — from the PR title's Conventional-Commit\
        \ type.** `feat!` or a\n  `BREAKING CHANGE` marker → **major**; `feat` → **minor**; **everything\
        \ else**\n  touching shipped code (`fix`, `perf`, `refactor`, `chore`, …) → **patch**. So\n  the\
        \ only lever you touch is the PR title — get the type right and the version\n  follows.\n\nWhen\
        \ it fires, the workflow rewrites `pyproject.toml`, regenerates `uv.lock`,\nand commits both to\
