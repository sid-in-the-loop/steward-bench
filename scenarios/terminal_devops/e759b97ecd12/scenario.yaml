        \ gate (`release-gate.yml`) has sophisticated E2E verification logic (polling, desktop change\
        \ detection, `run_executed_tests` check). Meanwhile, `tag-staging.yml` has a simpler, weaker version\
        \ of the same check (lines 34-66) that doesn't verify desktop E2E jobs actually executed. We need\
        \ to:\n\n1. Unify the verification logic so both workflows use the same checks\n2. Make the release\
        \ gate a required status check on the release-please PR\n\n## Approach: Reusable Workflow\n\n\
        Extract the E2E verification into a reusable workflow (`verify-e2e.yml`) called by both `release-gate.yml`\
        \ and `tag-staging.yml`.\n\n## Files to modify\n\n- **Create:** `.github/workflows/verify-e2e.yml`\
        \ — reusable workflow with the full verification logic\n- **Modify:** `.github/workflows/release-gate.yml`\
        \ — slim down to call verify-e2e.yml\n- **Modify:** `.github/workflows/tag-staging.yml` — replace\
        \ simple E2E check with call to verify-e2e.yml\n\n## Step 1: Create `verify-e2e.yml` (reusable\
        \ workflow)\n\n```yaml\nname: Verify E2E\non:\n  workflow_call:\n    inputs:\n      commit_sha:\n\
        \        description: 'Commit SHA to verify E2E tests for'\n        required: true\n        type:\
        \ string\n```\n\n**Jobs:**\n1. `detect-changes` — takes `commit_sha`, diffs from latest release\
        \ tag to that commit, outputs `desktop` and `prev_tag`\n2. `verify-e2e` — full Web E2E + Desktop\
        \ E2E verification (polling, `run_executed_tests`, fallback range search)\n\nThe logic is lifted\
        \ directly from the current `release-gate.yml` with one change: instead of `gh api repos/.../git/ref/heads/main`\
        \ to get the SHA, it uses `inputs.commit_sha`.\n\n## Step 2: Slim down `release-gate.yml`\n\n\
        ```yaml\nname: Release Gate\non:\n  pull_request:\n    branches: [main]\n    types: [opened, synchronize,\
        \ reopened]\n\njobs:\n  get-main-sha:\n    name: Get Main SHA\n    if: startsWith(github.head_ref,\
        \ 'release-please--')\n    runs-on: ubuntu-latest\n    outputs:\n      sha: ${{ steps.sha.outputs.sha\
        \ }}\n    steps:\n      - name: Get latest main commit\n        id: sha\n        env:\n      \
        \    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          SHA=$(gh api repos/${{ github.repository\
        \ }}/git/ref/heads/main --jq '.object.sha')\n          echo \"sha=${SHA}\" >> \"$GITHUB_OUTPUT\"\
        \n\n  verify:\n    name: Verify E2E Passed\n    needs: get-main-sha\n    if: startsWith(github.head_ref,\
        \ 'release-please--')\n    uses: ./.github/workflows/verify-e2e.yml\n    with:\n      commit_sha:\
        \ ${{ needs.get-main-sha.outputs.sha }}\n```\n\nThe `if: startsWith(...)` ensures non-release-please\
        \ PRs skip the check (GitHub treats skipped required checks as satisfied).\n\n## Step 3: Update\
        \ `tag-staging.yml`\n\nReplace the \"Verify E2E tests passed\" step (lines 34-66) with a call\
        \ to the reusable workflow:\n\n```yaml\njobs:\n  verify-e2e:\n    name: Verify E2E\n    uses:\
        \ ./.github/workflows/verify-e2e.yml\n    with:\n      commit_sha: <resolved from release tag>\n\
        \n  tag-staging:\n    name: Create Staging Tag\n    needs: verify-e2e\n    ...\n```\n\nNeed to\
        \ resolve the tag to a commit SHA first. Options:\n- Add a small `resolve-tag` job that does `git\
        \ rev-parse` and outputs the SHA\n- Or pass the tag to verify-e2e.yml and let it resolve internally\n\
        \nI'll add a `resolve-tag` job since verify-e2e.yml should work with commit SHAs generically.\n\
        \n## Step 4: Add branch protection (manual / gh API)\n\nAfter merging, use `gh api` to add the\
        \ release gate check as required:\n- Check name will be \"Verify E2E Passed / Verify E2E\" (caller\
        \ job name / called workflow job name)\n- Actually need to verify the exact check name after first\
        \ run\n\nNote: This step should be done manually after the workflow changes are merged and the\
        \ check names are confirmed.\n\n## Verification\n\n1. Create PR, verify release-gate.yml calls\
