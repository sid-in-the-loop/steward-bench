        fails → use the **IdToken** (carries `aud` + `email` directly). Also `--output text` prints the
        literal `None` for a missing field — `Bearer None` reads as a mysterious 401.

        - 2026-08-30T21:54Z onward: three **DataQ PATs minted** via `POST /api/v1/me/api-keys` on the
        AWS deployment — `qa-admin` (`dq_live_ybpE…`), `qa-member` (`dq_live_YLlj…`), `qa-viewer` (`dq_live_UyG4…`),
        all `expires_in_days=90` → **expire 2026-11-28**. Held by the maintainer for QA; revoke via Profile
        → API keys when done.

        - ~2026-08-30T22:05Z: the PATs closed the standing "no AWS authenticated probe" gap — per-role
        `/me` resolution correct, admin `/admin/llm` 200 vs member 403, viewer suite-create 403 (`workspace_role_required`),
        **audited write** `PATCH /me` 200 + read-back (the #1621 class does not reproduce), `/mcp/` 401→200
        with PAT. One defect found and filed: #1736 (401 message hardcodes "Azure AD token" on a Cognito
        deployment).

        - Expected state after: no compute changes anywhere (probes only); AWS admin display_name now
        "QA Admin"; three live QA PATs outstanding until revoked or 2026-11-28.

