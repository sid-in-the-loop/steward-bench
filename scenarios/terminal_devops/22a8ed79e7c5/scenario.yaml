        curl -s -H "Authorization: Bearer $A" "$API/api/v1/me" | python3 -c "import json,sys; print(json.load(sys.stdin).get(\"display_name\"))"'''
      description: Authenticated audited write probe on AWS
  - tool: Bash
    arguments:
      command: 'bash -c ''API=https://d29cc3r7frs6eb.cloudfront.net

        A=$(sed -n 3p /Users/arijit/Downloads/temp.txt)

        echo -n "no auth:   "; curl -s -o /dev/null -w "%{http_code}\n" "$API/mcp/"

