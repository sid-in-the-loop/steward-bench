        \       # HELIKON_REQUIRE_TEMPORAL=1 is inherited from job env; TEMPORAL_TEST_SERVER\n       \
        \ # is scoped to the suite step above, so it is absent here — exactly the\n        # condition\
        \ the guard exists to catch. The suite MUST fail. If someone\n        # deletes those five lines,\
        \ this step is what notices; without it the job\n        # would quietly return to passing while\
        \ asserting nothing. The test binary\n        # is already compiled, so this costs seconds.\n\
        \        run: |\n          if cargo test -p paigasus-helikon-runtime-temporal --test temporal_live\
        \ -- --test-threads=1; then\n            echo \"::error::HELIKON_REQUIRE_TEMPORAL=1 with no TEMPORAL_TEST_SERVER\
        \ must FAIL, but the suite passed — the never-green-by-skip guard in gate() is gone.\"\n     \
        \       exit 1\n          fi\n          echo \"guard OK: the suite fails when TEMPORAL_TEST_SERVER\
        \ is absent\"\n      - if: always() && steps.suite.outcome != 'skipped'\n        name: Record\
