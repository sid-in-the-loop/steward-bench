        **Return to me (short — the detail goes in the report file):**

        1. Status: DONE / DONE_WITH_CONCERNS / BLOCKED / NEEDS_CONTEXT

        2. The commit SHA (short)

        3. One line of test evidence: the Step 4, Step 5, and Step 7 `test result:` lines

