        689e9dd ee16924
      description: Generate Task 1 review package
  - tool: Agent
    arguments:
      subagent_type: general-purpose
      model: sonnet
      run_in_background: false
      description: Review Task 1
      prompt: 'You are reviewing Task 1 of SMA-457 in the Paigasus Helikon Rust SDK.


        **Repo (read-only for you):** `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457`

        This is a git worktree shared with other sessions. **Do not run any git command that moves HEAD
        or branches** (no checkout/switch/reset/rebase/stash/branch). Read-only git (`show`, `diff`, `log`)
        is fine. Do not modify any file.


        **Three inputs — read all three:**

        1. Requirements (the brief): `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457/.superpowers/sdd/2026-08-07-sma-457-ci-integration-jobs/task-1-brief.md`

        2. Implementer''s report: `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457/.superpowers/sdd/2026-08-07-sma-457-ci-integration-jobs/task-1-report.md`

        3. The diff: `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457/.superpowers/sdd/2026-08-07-sma-457-ci-integration-jobs/review-689e9dd..ee16924.diff`


        **Context — what this change is for.** The suite in `temporal_live.rs` is env-gated: without `TEMPORAL_TEST_SERVER`
        its tests print `SKIPPED:` and **return**, which means they *pass*. `cargo test` captures a passing
        test''s output, so the `SKIPPED:` text is never printed. A CI job running this suite would therefore
        be green whether or not it ever reached a Temporal server. This task adds a `HELIKON_REQUIRE_TEMPORAL=1`
        guard that turns that silent skip into a panic. A later task''s CI workflow sets that variable.


        **Global constraints binding this task (verify each against the diff):**

        - Commit format `<type>(<scope>): SMA-457 <lowercase message>`; scope must be in `.versionrc`''s
        allowlist.

        - Exactly ONE file may change: `crates/paigasus-helikon-runtime-temporal/tests/temporal_live.rs`.
        Any other file in the diff is a defect.

        - The env var must be spelled exactly `HELIKON_REQUIRE_TEMPORAL` and compared to exactly `"1"`
        — a later task hardcodes both.

        - The existing loud-skip behaviour (message text and `None` return) must be preserved unchanged
        when the variable is absent.

        - The repo has an existing precedent for this idiom at `crates/paigasus-helikon-tools/tests/os_sandbox.rs:21`
        and `os_sandbox_seatbelt.rs:19` (`HELIKON_REQUIRE_SANDBOX`). Read those and judge whether this
        change is consistent with them.


        **Deliberate design decision, stated so you can assess it rather than rediscover it:** the brief
        specifies NO new `#[test]` for the guard, on the grounds that such a test would mutate global
        process env and be racy under parallel test threads; verification is instead the behavioural before/after
        commands in the brief''s steps. You may still judge whether that reasoning holds and whether the
        behavioural verification the implementer actually ran is sufficient evidence — say so either way.


        **Your job — produce BOTH verdicts. A report missing either is incomplete:**


        **A. Spec compliance (✅ / ❌).** Walk each of the brief''s 8 steps. Was it done? Does the code
        match the brief''s Step 3 text? Is anything in the diff that the brief did NOT ask for (scope
        creep)? Is anything the brief asked for missing?


        **B. Task quality (Approved / Not approved)**, with findings labelled **Critical**, **Important**,
        or **Minor**. Consider in particular:

        - Does the guard actually close the hole? Reason about the control flow yourself: what happens
        when the var is set to `"1"` vs `"0"` vs `"true"` vs unset, and when `TEMPORAL_TEST_SERVER` is
        set-but-empty vs set-but-unreachable.

        - Is the panic message actionable — does it tell a CI reader what went wrong and what to do?

        - Is the doc comment accurate about *why* the guard exists?

        - Any Rust correctness issue, clippy concern, or deviation from the surrounding file''s style.


        Do NOT re-run the test suite — the implementer''s report carries the test evidence, and a full
