  - tool: AskUserQuestion
    arguments:
      questions:
      - question: Task 1's `HELIKON_REQUIRE_TEMPORAL` guard is the plan's most important change, but the
          plan deliberately adds no automated test for it (a `#[test]` would mutate global process env
          and be racy). So if someone later deletes those 5 lines, nothing catches it — CI silently returns
          to passing green-by-skip, the exact bug this ticket exists to fix. How should that be handled?
        header: Guard regression
        multiSelect: false
        options:
        - label: Add a guard self-test step to the CI job (Recommended)
          description: 'Amend Task 4: after the suite passes, run it once more with TEMPORAL_TEST_SERVER
            unset and HELIKON_REQUIRE_TEMPORAL=1, asserting it FAILS. The test binary is already compiled,
            so this costs ~5 seconds. It makes the guard regression-proof at exactly the layer that matters
            — CI — without a racy env-mutating unit test.'
        - label: Accept as-is, no regression test
          description: The guard is five lines in a file any reviewer touching the suite will read, and
            CLAUDE.md documents why it exists. Cheapest, and the plan already justifies it — but relies
            entirely on reviewer vigilance for the one mechanism that keeps the job honest.
        - label: Subprocess integration test in the crate
          description: A `#[test]` that spawns the test binary as a child process with the env set and
            asserts a non-zero exit. Genuinely automated and runs on every `cargo test`, but needs the
            harness binary path at runtime, adds real complexity, and duplicates what the CI step does
            in one line.
  - tool: Edit
    arguments:
      replace_all: false
