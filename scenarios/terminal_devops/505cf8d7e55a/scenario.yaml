  - tool: Agent
    arguments:
      subagent_type: general-purpose
      model: sonnet
      run_in_background: false
      description: 'Task 1: temporal guard'
      prompt: 'You are implementing Task 1 of a CI ticket (SMA-457) in the Paigasus Helikon Rust SDK.


        **Where this fits:** SMA-332 shipped a live Temporal integration suite that CI never executes.
        We are about to wire it into a CI job. Your task adds the one thing that makes that job meaningful
        — a guard so the suite cannot report success when it never reached a server.


        **Working directory (all paths absolute, work ONLY here):**

        `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457`


        This is a git worktree shared with other sessions. **Never run any git command that moves HEAD
        or switches/creates/deletes branches** (no `checkout`, `switch`, `reset`, `rebase`, `stash`, `branch`).
        You may run `git add <explicit paths>`, `git commit`, `git show`, `git diff`, `git status`, `git
        log`.


        **READ THIS FIRST — it is your requirements, with the exact values to use verbatim:**

        `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457/.superpowers/sdd/2026-08-07-sma-457-ci-integration-jobs/task-1-brief.md`


        Follow its 8 steps in order. The Rust code to write is given in full in Step 3 — use it verbatim,
        do not paraphrase or "improve" it.


        **Interfaces you produce for later tasks:** the env var name `HELIKON_REQUIRE_TEMPORAL` with value
        `"1"`. A later task''s CI workflow sets exactly that. Do not rename it.


        **Ambiguity resolved for you, do not revisit:**

        - The brief explains why there is no new `#[test]` for this guard (a unit test would mutate global
        process env and be racy under parallel test threads). That reasoning is settled and approved.
        Do NOT add an env-mutating `#[test]`. The verification is the behavioural before/after commands
        in the brief''s steps.

        - A separate CI-level self-test for this guard is already planned in a later task. It is not your
        job.

        - Step 7 needs a local Temporal dev server. The `temporal` CLI IS installed on this machine (`/opt/homebrew/bin/temporal`),
        as is `protoc`. Run it.


        **Global constraints that bind this task:**

        - Commit message format: `<type>(<scope>): SMA-457 <lowercase message>`. Use exactly the message
        given in the brief''s Step 8. A local `commit-msg` hook runs `convco check` and will reject anything
        else.

        - Run `cargo fmt --all` before committing (the pre-commit hook is a deliberate no-op).

        - **Never `git add -A` or `git add .`** — `.env` and `.claude` are untracked but NOT gitignored,
        so a broad add stages secrets. Stage the explicit file path only, then verify with `git show --stat
        HEAD`.

        - Commits are signed via a 1Password SSH key. If a commit fails with "failed to fill whole buffer"
        the vault is locked — STOP and report that; do not bypass signing.


        **CRITICAL — work synchronously:** Several commands here take minutes (the first `cargo test`
        compiles temporalio-sdk-core, the heaviest dependency tree in the workspace; allow 10+ minutes).
        Run every command in the FOREGROUND and wait for it to finish. Do NOT background long commands,
        do NOT hand them to a monitor, and do NOT end your turn while any verification is incomplete.
        Your turn ends only when the task reaches a terminal state (DONE / BLOCKED / NEEDS_CONTEXT).


        **Report file — write your full report here:**

        `/Users/smaschek/dev/paigasus/paigasus-helikon/.claude/worktrees/sma-457/.superpowers/sdd/2026-08-07-sma-457-ci-integration-jobs/task-1-report.md`


