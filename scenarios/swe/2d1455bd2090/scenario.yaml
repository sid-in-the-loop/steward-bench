        5. **Vocabulary section (§8.-1)**: note `drill` as the verb for kicking off the feature pipeline
        (it is not one of the core nouns, but record it so it isn''t mistaken for a gastown word later).


        Leave genuine English uses of "add"/"adds" (e.g. "derrick adds the PR URL to the ticket") intact
