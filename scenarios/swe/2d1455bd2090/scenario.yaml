        - `derrick add "<prompt>"` → `derrick drill "<prompt>"`

        - `derrick run add-feature` → `derrick run drill`

        - `/add-feature` (slash command + skill) → `/drill`

        - persisted `pipeline_id` string `"add-feature"` → `"drill"`, BUT the runner will still accept
        `"add-feature"` as a deprecated alias so existing run manifests stay resumable.

        - `add` stays as a hidden, deprecated CLI alias on `drill`.


        ## Tasks

        1. **Record a new decision** in DESIGN.md §12 (next free D-number, e.g. D58) capturing: the rename
        `add`→`drill`, the consistent application across CLI/run-subcommand/slash-command/pipeline_id,
        and the dual backward-compat aliases (runner accepts legacy `"add-feature"` pipeline_id; hidden
        `add` CLI alias). Reference the affected sections. This decision SUPERSEDES the command naming
        in D46 and D50 — note that explicitly rather than contradicting them.

        2. **Update D46 and D50 wording** so they read `derrick drill` instead of `derrick add` (the behaviours
        they describe — prompt_key auto-resume, init initial commit for worktrees — are unchanged), with
        a pointer to the new decision.

        3. **Update §5.3** — the section heading (`### 5.3 \`derrick add\` — the feature pipeline`) and
        body, including the `derrick add "..."` examples, the `/add-feature ...` example, and the "resolves
        to `derrick run add-feature --prompt`" / `--resume-from` lines.

        4. **Update the overview/intro one-liners** in §1/§2 and any pipeline diagram/labels that say
