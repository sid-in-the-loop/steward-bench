        ## Rationale (use this in the decision entry)

        `derrick add` drives the entire dark-factory pipeline (spec → clarify → assay → plan → tasks →
        batch → foreman dispatch → implementation). `add` is the verb of passive list-appending (git add,
        npm add) — it framed derrick as a backlog/queue tool rather than the build/execution engine it
        is. `drill` is the verb the oil-derrick metaphor implies (a derrick drills the well) and fits
        the existing vocabulary (site/foreman/hand/dispatch). Applied consistently: `derrick drill "<prompt>"`,
        `derrick run drill`, `/drill`.


