        \ Client.Timeout would cancel that read.\n//\n// SECURITY: every client this returns refuses a\
        \ cross-host redirect\n// (see RejectCrossHostRedirect). This is the one construction point\n\
        // for all four OAuth flows in this library — sts, refresh, authcode,\n// deviceflow — and each\
        \ of them puts a credential in a POST form\n// body, so the policy belongs here rather than at\
        \ each caller.\nfunc HTTPClient(transport http.RoundTripper) *http.Client {\n\tif transport ==\
        \ nil {\n\t\ttransport = http.DefaultTransport\n\t}\n\treturn &http.Client{\n\t\tTransport:  \
        \   transport,\n\t\tCheckRedirect: RejectCrossHostRedirect,\n\t}\n}\n\n// RejectCrossHostRedirect\
        \ is the CheckRedirect policy for every OAuth\n// request this library makes. It stops a redirect\
        \ chain from leaving\n// the host the request was originally sent to.\n//\n// SECURITY: net/http\
        \ strips sensitive *headers* when a redirect\n// crosses to a different host (shouldCopyHeaderOnRedirect),\
        \ but it\n// replays the request *body* unconditionally on 307/308 — and the\n// body is where\
        \ every OAuth credential lives: sts's subject_token\n// (the user's login JWT), refresh's refresh_token,\
        \ authcode's\n// authorization code and PKCE verifier, deviceflow's device_code. A\n// POST body\
        \ therefore gets none of the protection a bearer header\n// gets, so without this policy an open\
        \ redirect or a misconfigured\n// proxy in front of a legitimate token endpoint is enough to hand\n\
        // those credentials to a third host. The response is trusted too: a\n// redirect target that\
        \ answers with its own access_token would have\n// it returned to the caller as if the real authorization\
        \ server had\n// issued it.\n//\n// Comparison is against via[0], the host the caller chose, not\
        \ the\n// previous hop — otherwise a chain could walk away one host at a\n// time. Only the host\
        \ is compared, so a same-host http→https upgrade\n// still follows (by then the body has already\
        \ gone out in clear, and\n// refusing would not put it back); a change of port is treated as a\n\
        // different endpoint and refused.\n//\n// Deliberately not configurable. An option to permit\
        \ cross-host\n// redirects here would be set by exactly the party that benefits from\n// it, and\
        \ no authorization server needs one: RFC 8693 and RFC 6749\n// token endpoints answer at the URL\
        \ the client was configured with.\nfunc RejectCrossHostRedirect(req *http.Request, via []*http.Request)\
        \ error {\n\tif len(via) >= maxOAuthRedirects {\n\t\treturn fmt.Errorf(\"stopped after %d redirects\"\
        , maxOAuthRedirects)\n\t}\n\tif len(via) > 0 && !strings.EqualFold(req.URL.Host, via[0].URL.Host)\
        \ {\n\t\treturn fmt.Errorf(\"refusing redirect to a different host (%s -> %s): an OAuth request\
        \ body carries credentials and must not leave its origin\",\n\t\t\tvia[0].URL.Host, req.URL.Host)\n\
        \t}\n\treturn nil\n}\nEOF\ncd \"$A\" && gofmt -l internal/oauthhttp/ && go build ./... && echo\
        \ BUILD_OK"
