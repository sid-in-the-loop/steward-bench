        ## Summary\n\nAdds the two `faucet-conformance` behavioral checks deliberately deferred from #465\
        \ — `assert_discover_roundtrips` and `assert_cancellation_flushes` — as **integration-level**\
        \ checks. As #471 notes, neither can be made meaningful against the crate's synthetic in-memory\
        \ doubles (a double has no backing catalog to re-read from; timing-sensitive mid-run cancellation\
        \ is flaky in a unit test), so both drive a live backend / the real pipeline where they belong.\n\
        \n## What's added\n\n**Check 12 — `assert_discover_roundtrips`** (discoverable sources)\nFor each\
        \ `DatasetDescriptor` a source's `discover()` reports, deep-merge its `config_patch` onto the\
        \ base config, rebuild the source, and assert the dataset is genuinely readable end-to-end (not\
        \ just a name in a list). A new pure `merge_config_patch(base, patch)` helper (recursive object\
        \ merge, scalar/array replace — mirroring the CLI's deep-merge) writes the `rebuild` closure in\
        \ one line.\n\nAdopted in **all 11 catalog-backed sources**: postgres, mysql, mssql, sqlite, mongodb,\
        \ elasticsearch, bigquery, snowflake, spanner, s3, gcs — reusing each existing seeded backend\
        \ (testcontainers / MinIO / emulator / tempfile / wiremock). GCS is `#[ignore]`d for the same\
        \ reason its bounded-memory check is (the read path needs gRPC; `fake-gcs-server` is REST-only).\n\
        \n**Check 13 — `assert_cancellation_flushes`**\nDrives the **real** `faucet_core::run_stream`\
        \ with a deterministic self-cancelling source (no timers, no flakiness): one page, then the source\
        \ fires the token and blocks. Asserts `run_stream` returns `Ok` with the partial result **and**\
        \ the buffered sink's `flush()` ran (records are durable) — the #146 H16 / [ADR 0011](https://github.com/faucet-hq/faucet-stream/blob/main/docs/adr/0011-cooperative-cancellation.md)\
        \ flush-completing cancellation contract.\n\n## Non-vacuous by construction\n\nPer the crate's\
        \ discipline (a check that cannot fail is worthless), each new check ships with a passing **and**\
        \ a `#[should_panic]` failing self-test, backed by two new doubles:\n- `DiscoverableSource` (+\
        \ `empty()`) — drives the pass path and the empty-catalog / non-discoverable / unreadable-rebuild\
        \ failure paths.\n- `BufferedSink` (+ `broken()`) — models a sink that only commits on `flush`;\
        \ the broken variant (flush drops the buffer) drives the failure path.\n\nNew lib code is at **100%\
        \ patch coverage** (measured via `cargo llvm-cov`; every line of `merge_config_patch` / `assert_discover_roundtrips`\
        \ / `assert_cancellation_flushes` is exercised).\n\n## Verification\n\n- `cargo test -p faucet-conformance`\
        \ — 52 unit tests + 2 doctests green.\n- Ran the round-trip live against real backends locally:\
        \ **sqlite, postgres, mysql, mongodb, s3 (MinIO), spanner (emulator)**, plus the wiremock trio\
        \ **elasticsearch, bigquery, snowflake** — all pass. mssql compiles (SQL Server is CI-only on\
        \ arm64); gcs compiles (`#[ignore]`d, gRPC backend).\n- `cargo clippy --tests -D warnings` clean\
        \ on the conformance crate and all 11 adopted source crates; `cargo fmt`; rustdoc `-D warnings`\
        \ clean.\n\n## Docs\n\n- `crates/conformance/README.md` — the checks table now lists all 13 (7–11\
        \ were already shipped but undocumented) plus an integration-level section.\n- `docs/book/src/extending/authoring-connectors.md`\
        \ — how to wire the two integration checks into a new connector.\n- `docs/book/src/reference/conformance.md`\
        \ — a \"behavioral conformance battery\" section distinguishing the runtime battery from the static\
        \ score.\n\nCloses #471.\n\nRelated: #465 (deferred these two), #470 (adopted checks 1–11), #211\
        \ (dataset discovery), #146 H16 (flush-completing cancellation). Roadmap epic #38.\nEOF\n)\" 2>&1\
