        \nMermaid's `flowchart.useMaxWidth: true` (in `mermaid-init.js`) combined with `.content .mermaid\
        \ svg { max-width: 100% }` (in `custom.css`) forced **every** diagram's SVG to shrink to the column\
        \ width. A long horizontal chain then scaled down proportionally to a ~30px-tall strip, and because\
        \ the SVG was capped at 100% it never overflowed — so the `.mermaid` box's existing `overflow-x:\
        \ auto` never engaged.\n\n## Fix\n\n- `mermaid-init.js`: `useMaxWidth: false` → mermaid emits\
        \ a natural-width SVG.\n- `custom.css`: `.content .mermaid svg { max-width: none }` → the SVG\
        \ keeps its intrinsic width and the enclosing box scrolls horizontally.\n\nLong pipelines now\
        \ render at full, legible size and scroll within their box; short diagrams are unchanged (they\
        \ already fit and stay centered). Purely a docs-site asset change — no Markdown edited, so GitHub's\
        \ native mermaid rendering is unaffected.\n\n## Verification\n\nRebuilt the book (`mdbook build\
        \ docs/book`) and screenshotted the page headless before/after — the 8-node streaming diagram\
        \ now shows full-size `page 1 → write → page 2 → …` instead of an empty strip.\n\nRoadmap epic\
        \ #38.\nEOF\n)\" 2>&1 | tail -2"
