      content: "# @pantoken/i18n\n\nLocale bundles and localization helpers for [`@pantoken/web-components`](https://www.npmjs.com/package/@pantoken/web-components).\n\
        It includes the 44 supported locale bundles, locale direction metadata, and browser-safe MessageFormat\
        \ 2 and `Intl` helpers.\n\n## Install\n\n```sh\nnpm i @pantoken/i18n @pantoken/web-components\
        \ @pantoken/css\n```\n\n## Register A Locale\n\nUse a built-in bundle when you want the translated\
        \ web-component strings for that locale:\n\n```ts\nimport { hu, registerLocalized } from \"@pantoken/i18n\"\
        ;\nimport \"@pantoken/css\";\n\nregisterLocalized(hu);\n```\n\nYou can also register a locale\
        \ tag directly. This derives weekday names and direction from the locale, while other strings\
        \ use the English defaults:\n\n```ts\nimport { registerLocalized } from \"@pantoken/i18n\";\n\n\
        registerLocalized(\"ar\"); // direction is inferred as rtl\n```\n\nPass a custom element registry\
        \ or registration options when needed:\n\n```ts\nregisterLocalized(\"x-custom\", customElements,\
        \ {\n  prefix: \"x\",\n  only: [\"button\", \"icon\"],\n});\n```\n\n## Selective Imports\n\nEach\
        \ locale bundle is exported individually, so import only the locales your application supports:\n\
        \n```ts\nimport { createLocaleSet, de, en, hu } from \"@pantoken/i18n\";\n\nconst locales = createLocaleSet({\
        \ en, de, hu });\n\nlocales.register(\"hu\");\nlocales.has(\"de\");\nlocales.get(\"en\");\n```\n\
        \n`createLocaleSet` narrows locale keys to the bundles passed to it. `LOCALES` provides metadata\
        \ for every supported locale, including `dir` and the display label.\n\n## Formatting Helpers\n\
        \nThe package also exports browser-safe helpers for MessageFormat 2 and the standard `Intl` formatters:\n\
        \n```ts\nimport {\n  formatDate,\n  formatList,\n  formatMessage,\n  formatNumber,\n  formatRelativeTime,\n\
        \  isolate,\n} from \"@pantoken/i18n\";\n\nformatMessage(\"en\", \"Welcome, {$name}!\", { name:\
        \ \"Ada\" });\nformatNumber(\"de\", 1234567.89);\nformatDate(\"hu\", new Date());\nformatList(\"\
        en\", [\"CSS\", \"Swift\", \"Kotlin\"]);\nformatRelativeTime(\"en\", -3, \"day\");\nisolate(\"\
        filename.txt\"); // for interpolation outside MF2\n```\n\nUse `formatMessage` with valid MessageFormat\
        \ 2 syntax. Validate messages during a build with `validateMf2` from `@pantoken/i18n-engine`;\
        \ formatting intentionally throws for invalid message syntax.\n\n## API\n\n- **`registerLocalized(bundleOrLocale)`**\
        \ — register web components with a locale bundle or raw BCP 47 tag.\n- **`createLocaleSet(bundles)`**\
        \ — define a typed subset of locale bundles.\n- **`defineBundle(config)`** — create a custom `LocaleBundle`\
        \ for a locale not included here.\n- **`LOCALES`** — locale metadata registry.\n- **`LocaleBundle`**,\
        \ **`LocaleInfo`**, **`WebComponentStrings`** — public type contracts.\n- **`ENGLISH_STRINGS`**,\
        \ **`makeStrings`** — English defaults and locale-aware string construction.\n- **`getDir(localeOrBundle)`**\
        \ — resolve `ltr` or `rtl` direction.\n- **`formatMessage`**, **`formatNumber`**, **`formatDate`**,\
        \ **`formatList`**, **`formatRelativeTime`**, **`isolate`** — runtime localization helpers.\n\
        - **`ar`**, **`de`**, **`en`**, **`fr`**, **`hu`**, and the other locale exports — pre-built `LocaleBundle`\
        \ values.\n\n## Related\n\n- [`@pantoken/web-components`](https://www.npmjs.com/package/@pantoken/web-components)\
        \ provides the custom elements and their string contract.\n- [`@pantoken/css`](https://www.npmjs.com/package/@pantoken/css)\
        \ provides the token styles used by the components.\n\n## License\n\nMIT\n"
