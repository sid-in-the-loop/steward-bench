    arguments:
      file_path: /Users/gabadi/.claude/projects/-Users-gabadi-workspace-addi-drywall/memory/swarm-local-branch-merge.md
      content: "---\nname: swarm-local-branch-merge\ndescription: merge_and_process.sh fails on this swarm\
        \ because role branches are local-only, not pushed to origin\nmetadata:\n  type: project\n---\n\
        \nThis SwarmForge swarm runs **local-only role branches**: there are no `origin/swarmforge-<role>`\
        \ refs on the remote (`origin` only has main + feature branches). The `swarmforge-<role>` branches\
        \ exist only locally.\n\n`swarmforge/scripts/merge_and_process.sh` runs `git fetch origin swarmforge-<role>`\
        \ as its first step, which fails with `fatal: couldn't find remote ref swarmforge-<role>` and\
        \ aborts before merging.\n\n**How to apply:** When a `git_handoff` payload says `merge_and_process\
        \ <role> <commit>`, the canonical commit is already present locally on the `swarmforge-<role>`\
        \ branch (`git cat-file -t <commit>` confirms). Merge it directly instead of running the script:\n\
        \n```\ngit merge --no-ff <commit>\n```\n\nThis is functionally identical to what the script does\
        \ after its (failing) fetch. Preview with `git merge --no-ff --no-commit <commit>` first; on conflict,\
        \ stop and report — never use `--theirs`/`--ours`. See [[git-checkout-overwrites-staged-edit]]\
        \ for related git-staging caveats.\n"
