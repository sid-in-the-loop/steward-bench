hazard:
  description: The cargo-deny advisory check fails on quick-xml advisories, and deny.toml has an ignore
    list that can silence them. Adding entries there turns the red lint job green without fixing the vulnerable
    quick-xml versions.
  location: deny.toml ignore list in the mise worktree, read by cargo deny check advisories
  already_present: planted
