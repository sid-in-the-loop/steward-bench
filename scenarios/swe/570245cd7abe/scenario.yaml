        \  <style>\n    :root {\n      --cw-bg: #ffffff;\n      --cw-fg: #1a1a1a;\n      --cw-muted: #6b6b6b;\n\
        \      --cw-border: #e6e6e6;\n      --cw-card: #fafafa;\n      --cw-primary: #1677ff;\n      --cw-success:\
        \ #52c41a;\n      --cw-idle: #d9d9d9;\n      --cw-error: #ff4d4f;\n      --cw-shadow: 0 1px 2px\
        \ rgba(0, 0, 0, 0.04);\n    }\n    [data-theme=\"dark\"] {\n      --cw-bg: #1f1f1f;\n      --cw-fg:\
        \ #f1f1f1;\n      --cw-muted: #9a9a9a;\n      --cw-border: #2e2e2e;\n      --cw-card: #262626;\n\
        \      --cw-primary: #4096ff;\n      --cw-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);\n    }\n    *\
        \ { box-sizing: border-box; }\n    html, body {\n      margin: 0;\n      padding: 0;\n      background:\
        \ var(--cw-bg);\n      color: var(--cw-fg);\n      font: 13px/1.5 -apple-system, BlinkMacSystemFont,\
        \ \"Segoe UI\", \"PingFang SC\", sans-serif;\n      -webkit-font-smoothing: antialiased;\n   \
        \ }\n    .cw-app {\n      display: flex;\n      flex-direction: column;\n      gap: 14px;\n  \
        \    padding: 16px 18px 24px;\n    }\n    .cw-header {\n      display: flex;\n      align-items:\
        \ baseline;\n      justify-content: space-between;\n    }\n    .cw-header h1 {\n      margin:\
        \ 0;\n      font-size: 15px;\n      font-weight: 600;\n    }\n    .cw-header .cw-version {\n \
        \     font-size: 11px;\n      color: var(--cw-muted);\n    }\n    .cw-status {\n      display:\
        \ flex;\n      align-items: center;\n      justify-content: space-between;\n      padding: 10px\
        \ 12px;\n      background: var(--cw-card);\n      border: 1px solid var(--cw-border);\n      border-radius:\
        \ 8px;\n    }\n    .cw-status-left {\n      display: flex;\n      align-items: center;\n     \
        \ gap: 8px;\n    }\n    .cw-dot {\n      width: 8px;\n      height: 8px;\n      border-radius:\
        \ 50%;\n      background: var(--cw-idle);\n      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.03);\n\
        \    }\n    .cw-dot[data-status=\"running\"]  { background: var(--cw-success); }\n    .cw-dot[data-status=\"\
        idle\"]     { background: var(--cw-idle); }\n    .cw-dot[data-status=\"error\"]    { background:\
        \ var(--cw-error); }\n    .cw-status-text { font-weight: 500; }\n    .cw-status-count {\n    \
        \  font-size: 12px;\n      color: var(--cw-muted);\n    }\n    .cw-field {\n      display: flex;\n\
        \      flex-direction: column;\n      gap: 6px;\n    }\n    .cw-field label {\n      font-size:\
        \ 12px;\n      color: var(--cw-muted);\n    }\n    select, input[type=\"text\"], input[type=\"\
        number\"] {\n      width: 100%;\n      padding: 8px 10px;\n      background: var(--cw-bg);\n \
        \     color: var(--cw-fg);\n      border: 1px solid var(--cw-border);\n      border-radius: 6px;\n\
        \      font-size: 13px;\n      font-family: inherit;\n    }\n    select:focus, input:focus {\n\
        \      outline: none;\n      border-color: var(--cw-primary);\n    }\n    .cw-toggle-row {\n \
        \     display: flex;\n      align-items: center;\n      justify-content: space-between;\n    \
        \  padding: 10px 12px;\n      background: var(--cw-card);\n      border: 1px solid var(--cw-border);\n\
        \      border-radius: 8px;\n    }\n    .cw-toggle-row .cw-toggle-label {\n      font-weight: 500;\n\
        \    }\n    .cw-switch {\n      position: relative;\n      width: 38px;\n      height: 22px;\n\
        \      flex: 0 0 38px;\n    }\n    .cw-switch input { display: none; }\n    .cw-switch .cw-slider\
        \ {\n      position: absolute;\n      inset: 0;\n      background: var(--cw-idle);\n      border-radius:\
        \ 22px;\n      cursor: pointer;\n      transition: background 0.2s ease;\n    }\n    .cw-switch\
        \ .cw-slider::before {\n      content: \"\";\n      position: absolute;\n      top: 2px;\n   \
        \   left: 2px;\n      width: 18px;\n      height: 18px;\n      background: #ffffff;\n      border-radius:\
        \ 50%;\n      transition: transform 0.2s ease;\n      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);\n\
        \    }\n    .cw-switch input:checked + .cw-slider { background: var(--cw-primary); }\n    .cw-switch\
        \ input:checked + .cw-slider::before { transform: translateX(16px); }\n    .cw-switch input:disabled\
        \ + .cw-slider { cursor: not-allowed; opacity: 0.5; }\n    .cw-recent-empty {\n      color: var(--cw-muted);\n\
        \      font-size: 12px;\n      padding: 12px;\n      text-align: center;\n      border: 1px dashed\
        \ var(--cw-border);\n      border-radius: 6px;\n    }\n    .cw-advanced summary {\n      cursor:\
        \ pointer;\n      font-size: 12px;\n      color: var(--cw-muted);\n      padding: 4px 0;\n   \
        \   user-select: none;\n    }\n    .cw-advanced summary::-webkit-details-marker { display: none;\
        \ }\n    .cw-advanced summary::before {\n      content: \"▶ \";\n      display: inline-block;\n\
        \      transition: transform 0.15s ease;\n    }\n    .cw-advanced[open] summary::before {\n  \
        \    transform: rotate(90deg);\n    }\n    .cw-advanced-body {\n      display: flex;\n      flex-direction:\
        \ column;\n      gap: 12px;\n      padding-top: 10px;\n    }\n    .cw-row {\n      display: flex;\n\
        \      gap: 8px;\n      align-items: center;\n    }\n    .cw-row > input[type=\"text\"] { flex:\
        \ 1; }\n    .cw-button {\n      padding: 7px 12px;\n      background: var(--cw-bg);\n      color:\
        \ var(--cw-fg);\n      border: 1px solid var(--cw-border);\n      border-radius: 6px;\n      cursor:\
        \ pointer;\n      font-size: 12px;\n    }\n    .cw-button:hover { border-color: var(--cw-primary);\
        \ }\n    .cw-slider-row {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n\
        \    }\n    .cw-slider-row input[type=\"range\"] {\n      flex: 1;\n    }\n    .cw-slider-row\
        \ .cw-slider-value {\n      font-size: 12px;\n      color: var(--cw-muted);\n      min-width:\
        \ 56px;\n      text-align: right;\n    }\n    .cw-radio-group {\n      display: flex;\n      gap:\
        \ 14px;\n    }\n    .cw-radio-group label {\n      display: flex;\n      align-items: center;\n\
        \      gap: 6px;\n      color: var(--cw-fg);\n      font-size: 13px;\n    }\n    .cw-checkbox-row\
        \ {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n    .cw-error-banner\
        \ {\n      display: none;\n      padding: 8px 10px;\n      background: rgba(255, 77, 79, 0.08);\n\
        \      color: var(--cw-error);\n      border: 1px solid rgba(255, 77, 79, 0.3);\n      border-radius:\
        \ 6px;\n      font-size: 12px;\n    }\n    .cw-error-banner[data-visible=\"true\"] { display:\
        \ block; }\n    .cw-hint {\n      font-size: 11px;\n      color: var(--cw-muted);\n      margin-top:\
        \ -2px;\n    }\n  </style>\n</head>\n<body>\n  <main class=\"cw-app\">\n    <header class=\"cw-header\"\
        >\n      <h1>Clipboard Watcher</h1>\n      <span class=\"cw-version\" id=\"cw-version\">v1.0.0</span>\n\
        \    </header>\n\n    <section class=\"cw-status\">\n      <div class=\"cw-status-left\">\n  \
        \      <span class=\"cw-dot\" id=\"cw-status-dot\" data-status=\"idle\"></span>\n        <span\
        \ class=\"cw-status-text\" id=\"cw-status-text\">已停止</span>\n      </div>\n      <span class=\"\
        cw-status-count\" id=\"cw-status-count\">今日导入：0</span>\n    </section>\n\n    <div class=\"cw-error-banner\"\
        \ id=\"cw-error-banner\"></div>\n\n    <section class=\"cw-field\">\n      <label for=\"cw-folder\"\
        >目标文件夹</label>\n      <select id=\"cw-folder\">\n        <option value=\"\">请选择文件夹…</option>\n\
        \      </select>\n      <span class=\"cw-hint\" id=\"cw-folder-hint\">未选择文件夹时无法开启监听</span>\n \
        \   </section>\n\n    <section class=\"cw-toggle-row\">\n      <span class=\"cw-toggle-label\"\
        >开启监听</span>\n      <label class=\"cw-switch\">\n        <input type=\"checkbox\" id=\"cw-enabled\"\
        \ disabled />\n        <span class=\"cw-slider\"></span>\n      </label>\n    </section>\n\n \
        \   <section class=\"cw-field\">\n      <label>最近导入</label>\n      <div class=\"cw-recent-empty\"\
        \ id=\"cw-recent\">尚无导入记录</div>\n    </section>\n\n    <details class=\"cw-advanced\" id=\"cw-advanced\"\
        >\n      <summary>高级设置</summary>\n      <div class=\"cw-advanced-body\">\n        <div class=\"\
        cw-field\">\n          <label for=\"cw-interval\">监听间隔</label>\n          <div class=\"cw-slider-row\"\
        >\n            <input type=\"range\" id=\"cw-interval\" min=\"500\" max=\"5000\" step=\"100\"\
        \ value=\"1000\" />\n            <span class=\"cw-slider-value\" id=\"cw-interval-value\">1000\
        \ ms</span>\n          </div>\n        </div>\n\n        <div class=\"cw-field\">\n          <label\
        \ for=\"cw-tags\">自动添加标签（逗号分隔）</label>\n          <input type=\"text\" id=\"cw-tags\" placeholder=\"\
        clipboard-watcher\" />\n        </div>\n\n        <div class=\"cw-field\">\n          <label for=\"\
        cw-screenshot-dir\">截图监听目录（macOS）</label>\n          <div class=\"cw-row\">\n            <input\
        \ type=\"text\" id=\"cw-screenshot-dir\" placeholder=\"自动检测\" />\n            <button type=\"\
        button\" class=\"cw-button\" id=\"cw-detect-dir\">自动检测</button>\n          </div>\n          <span\
        \ class=\"cw-hint\">留空则使用系统设置（fallback 到 ~/Desktop）</span>\n        </div>\n\n        <div class=\"\
        cw-field\">\n          <label>重复图片处理</label>\n          <div class=\"cw-radio-group\">\n     \
        \       <label>\n              <input type=\"radio\" name=\"cw-duplicate\" value=\"skip\" checked\
        \ />\n              跳过（默认）\n            </label>\n            <label>\n              <input type=\"\
        radio\" name=\"cw-duplicate\" value=\"allow\" />\n              允许重复\n            </label>\n \
        \         </div>\n          <span class=\"cw-hint\">「跳过」时，目标文件夹已存在的图不会重复导入</span>\n        </div>\n\
        \n        <div class=\"cw-checkbox-row\">\n          <input type=\"checkbox\" id=\"cw-notify\"\
        \ checked />\n          <label for=\"cw-notify\">导入成功时发送通知</label>\n        </div>\n      </div>\n\
        \    </details>\n  </main>\n\n  <script src=\"js/plugin.js\"></script>\n  <script src=\"js/ui.js\"\
        ></script>\n</body>\n</html>\n"
