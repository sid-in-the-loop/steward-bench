      content: "/*\n * Clipboard Watcher — plugin.js\n *\n * M2 范围：配置 schema + eagle.extraData 读写 + 文件夹拉取\
        \ + 生命周期钩子\n * M3 起追加：剪贴板轮询、hash 去重、addFromPath 导入\n * M4 起追加：截图目录监听\n */\n\nconst os = require('os')\n\
        const path = require('path')\nconst { execSync } = require('child_process')\n\nconst CONFIG_KEY\
        \ = 'clipboardWatcher'\nconst CONFIG_VERSION = 1\n\nconst DEFAULT_CONFIG = Object.freeze({\n \
        \ version: CONFIG_VERSION,\n  enabled: false,\n  folderId: null,\n  intervalMs: 1000,\n  tags:\
        \ 'clipboard-watcher',\n  screenshotDir: '',\n  notifyOnImport: true,\n  duplicateStrategy: 'skip',\n\
        })\n\nconst ALLOWED_DUPLICATE_STRATEGIES = ['skip', 'allow']\n\nfunction cloneDefaults() {\n \
        \ return JSON.parse(JSON.stringify(DEFAULT_CONFIG))\n}\n\nfunction normalizeConfig(raw) {\n  const\
        \ merged = Object.assign(cloneDefaults(), raw && typeof raw === 'object' ? raw : {})\n  merged.version\
        \ = CONFIG_VERSION\n  if (typeof merged.enabled !== 'boolean') merged.enabled = false\n  if (typeof\
        \ merged.folderId !== 'string' || !merged.folderId) merged.folderId = null\n  const interval =\
        \ Number(merged.intervalMs)\n  merged.intervalMs = Number.isFinite(interval) ? Math.min(5000,\
        \ Math.max(500, interval)) : 1000\n  if (typeof merged.tags !== 'string') merged.tags = DEFAULT_CONFIG.tags\n\
        \  if (typeof merged.screenshotDir !== 'string') merged.screenshotDir = ''\n  if (typeof merged.notifyOnImport\
        \ !== 'boolean') merged.notifyOnImport = true\n  if (!ALLOWED_DUPLICATE_STRATEGIES.includes(merged.duplicateStrategy))\
        \ {\n    merged.duplicateStrategy = 'skip'\n  }\n  return merged\n}\n\nfunction parseTags(input)\
        \ {\n  if (typeof input !== 'string') return []\n  return input\n    .split(',')\n    .map((t)\
        \ => t.trim())\n    .filter(Boolean)\n}\n\nfunction detectScreenshotDir() {\n  if (os.platform()\
        \ !== 'darwin') return null\n  try {\n    const out = execSync('defaults read com.apple.screencapture\
        \ location 2>/dev/null')\n      .toString()\n      .trim()\n    if (out) return out\n  } catch\
        \ {\n    // fall through to default\n  }\n  return path.join(os.homedir(), 'Desktop')\n}\n\nconst\
        \ state = {\n  config: cloneDefaults(),\n  folders: [],\n  folderIndex: new Map(),\n  todayCount:\
        \ 0,\n  todayDate: null,\n  lastImport: null,\n  lastError: null,\n  runtimeStatus: 'idle', //\
        \ 'idle' | 'running' | 'error'\n}\n\nfunction rolloverTodayIfNeeded() {\n  const today = new Date().toISOString().slice(0,\
        \ 10)\n  if (state.todayDate !== today) {\n    state.todayDate = today\n    state.todayCount =\
        \ 0\n  }\n}\n\nasync function loadConfig() {\n  try {\n    const raw = await eagle.extraData.get(CONFIG_KEY)\n\
        \    state.config = normalizeConfig(raw)\n  } catch (err) {\n    eagle.log.warn(`[clipboard-watcher]\
        \ load config failed: ${err && err.message ? err.message : err}`)\n    state.config = cloneDefaults()\n\
        \    state.lastError = 'CONFIG_LOAD_FAILED'\n  }\n  return state.config\n}\n\nasync function saveConfig(patch)\
        \ {\n  state.config = normalizeConfig(Object.assign({}, state.config, patch))\n  try {\n    await\
        \ eagle.extraData.set(CONFIG_KEY, state.config)\n  } catch (err) {\n    eagle.log.error(`[clipboard-watcher]\
        \ save config failed: ${err && err.message ? err.message : err}`)\n    state.lastError = 'CONFIG_SAVE_FAILED'\n\
        \    throw err\n  }\n  return state.config\n}\n\nfunction flattenFolders(folders, parentPath =\
        \ '') {\n  const list = []\n  if (!Array.isArray(folders)) return list\n  for (const f of folders)\
        \ {\n    if (!f || typeof f.id !== 'string') continue\n    const label = parentPath ? `${parentPath}\
        \ / ${f.name}` : f.name\n    list.push({ id: f.id, label })\n    if (Array.isArray(f.children)\
        \ && f.children.length) {\n      list.push(...flattenFolders(f.children, label))\n    }\n  }\n\
        \  return list\n}\n\nasync function refreshFolders() {\n  try {\n    const raw = await eagle.folder.getAll()\n\
        \    state.folders = flattenFolders(raw)\n    state.folderIndex = new Map(state.folders.map((f)\
        \ => [f.id, f.label]))\n  } catch (err) {\n    eagle.log.error(`[clipboard-watcher] refreshFolders\
        \ failed: ${err && err.message ? err.message : err}`)\n    state.folders = []\n    state.folderIndex\
        \ = new Map()\n    state.lastError = 'FOLDER_FETCH_FAILED'\n  }\n  return state.folders\n}\n\n\
        function setRuntimeStatus(status, errorCode = null) {\n  state.runtimeStatus = status\n  if (status\
        \ === 'error') {\n    state.lastError = errorCode || state.lastError || 'UNKNOWN'\n  } else if\
        \ (status === 'running') {\n    state.lastError = null\n  }\n}\n\nasync function enableWatcher()\
        \ {\n  // M3 实装监听；M2 仅做状态切换\n  if (!state.config.folderId) {\n    state.lastError = 'NO_FOLDER_SELECTED'\n\
        \    setRuntimeStatus('error', state.lastError)\n    return false\n  }\n  await saveConfig({ enabled:\
        \ true })\n  setRuntimeStatus('running')\n  eagle.log.info('[clipboard-watcher] enabled (M2 skeleton\
        \ — actual polling lands in M3)')\n  return true\n}\n\nasync function disableWatcher() {\n  await\
        \ saveConfig({ enabled: false })\n  setRuntimeStatus('idle')\n  eagle.log.info('[clipboard-watcher]\
        \ disabled')\n}\n\nasync function selectFolder(folderId) {\n  await saveConfig({ folderId: folderId\
        \ || null })\n  if (!folderId && state.config.enabled) {\n    await disableWatcher()\n  }\n}\n\
        \nfunction getSnapshot() {\n  rolloverTodayIfNeeded()\n  return {\n    config: state.config,\n\
        \    folders: state.folders,\n    folderLabel: state.config.folderId ? state.folderIndex.get(state.config.folderId)\
        \ || null : null,\n    todayCount: state.todayCount,\n    lastImport: state.lastImport,\n    lastError:\
        \ state.lastError,\n    runtimeStatus: state.runtimeStatus,\n    detectedScreenshotDir: detectScreenshotDir(),\n\
        \    defaults: cloneDefaults(),\n  }\n}\n\nwindow.ClipboardWatcher = {\n  CONFIG_KEY,\n  DEFAULT_CONFIG,\n\
        \  ALLOWED_DUPLICATE_STRATEGIES,\n  state,\n  loadConfig,\n  saveConfig,\n  refreshFolders,\n\
        \  flattenFolders,\n  detectScreenshotDir,\n  parseTags,\n  enableWatcher,\n  disableWatcher,\n\
        \  selectFolder,\n  setRuntimeStatus,\n  getSnapshot,\n}\n\neagle.onPluginCreate(async () => {\n\
        \  eagle.log.info('[clipboard-watcher] onPluginCreate')\n  rolloverTodayIfNeeded()\n  await loadConfig()\n\
        \  await refreshFolders()\n\n  if (state.config.enabled && state.config.folderId) {\n    // M2：仅恢复\
        \ UI 状态；M3 才真正启动轮询\n    setRuntimeStatus('running')\n  } else if (state.config.enabled && !state.config.folderId)\
        \ {\n    // 配置异常：曾经 enabled 但 folder 丢失\n    state.config.enabled = false\n    setRuntimeStatus('idle')\n\
        \  } else {\n    setRuntimeStatus('idle')\n  }\n\n  if (window.ClipboardWatcherUI && typeof window.ClipboardWatcherUI.render\
        \ === 'function') {\n    window.ClipboardWatcherUI.render()\n  }\n})\n\neagle.onPluginShow(async\
        \ () => {\n  eagle.log.info('[clipboard-watcher] onPluginShow')\n  rolloverTodayIfNeeded()\n \
        \ await refreshFolders()\n  if (window.ClipboardWatcherUI && typeof window.ClipboardWatcherUI.render\
        \ === 'function') {\n    window.ClipboardWatcherUI.render()\n  }\n})\n"
