      new_string: "#### F4：去重机制（v1.1 修订）\n\n**核心原则**：同一张图片在目标文件夹内不出现两次。\n\n##### F4.1 hash 方法\n- 对图片 PNG\
        \ Buffer 取 `Buffer.byteLength` + 前 256 字节拼接做 hash（轻量，无需引入 crypto 库）\n\n##### F4.2 检测范围\n- 维度：**目标\
        \ folderId 维度**（更换文件夹则各自独立判定）\n- 来源：\n  - **进程内 hash 集合**：插件运行期间已成功导入过的所有 hash\n  - **启动期回填**：插件启动\
        \ / 切换文件夹时，调用 `eagle.item.get({ folders: [folderId] })` 拉取该文件夹现有 item，按 item 实际文件路径逐个计算 hash 回填进集合\n\
        - 进程内 hash 集合不持久化（重启时由回填重建，避免 `eagle.extraData` 10KB 上限）\n\n##### F4.3 重复处理策略（用户可选）\n\nUI 控件：高级设置区下拉\
        \ / Radio，字段名 `duplicateStrategy`，可选：\n\n| 值 | 行为 | 备注 |\n|---|---|---|\n| `skip`（**默认**） | 检测到重复直接跳过，不写\
        \ tmp、不调 `addFromPath`、不计数、不通知 | 符合用户\"在这个文件夹就不要重复\"的预期 |\n| `allow` | 允许重复，仍然导入 | 用户明确想保留多份的场景\
        \ |\n\n剪贴板路径：在写 tmp 之前先判 hash → skip 时整段流程短路。\n截图路径：在调 `addFromPath` 之前判 hash → skip 时不导入但保留源文件（不动用户的截图原文件）。\n\
        \n##### F4.4 跨 Session 噪音抑制（保留）\n- `skip` 策略下不再需要 30 秒滑动窗口（hash 集合已覆盖）\n- `allow` 策略下保留 **30 秒滑动窗口**避免剪贴板被反复读取触发洪水（防抖\
