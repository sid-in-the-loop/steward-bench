  - tool: Edit
    arguments:
      replace_all: false
      file_path: /Users/lc4t/Documents/git/copy2eagle/docs/decisions.md
      old_string: '## ADR-007：包管理用 npm，与 Eagle 官方推荐一致'
      new_string: "## ADR-009：去重以\"目标文件夹内不重复\"为默认语义\n\n- **Date**：2026-05-30\n- **Context**：用户明确希望同一张图片不在目标文件夹里出现两次；旧的\
        \ PRD F4 仅做了 30 秒滑动窗口，无法防止跨 Session / 长时间间隔后的重复导入。\n- **Decision**：\n  - 去重维度：**目标 folderId 维度**，进程内\
        \ `Map<folderId, Set<hash>>`\n  - 启动期 / 切换文件夹时通过 `eagle.item.get({ folders: [folderId] })` 回填现有内容\n\
        \  - 暴露 `duplicateStrategy` 给用户：\n    - `skip`（默认）：检测到重复直接短路，不导入\n    - `allow`：允许重复入库，并启用 30\
        \ 秒滑动窗口作为剪贴板防抖\n  - hash 仍用 ADR-002 的轻量算法\n- **Consequences**：\n  - 默认行为最贴近用户预期（\"在这个文件夹就不要重复\"\
        ）\n  - 重启后需重新回填一次（item 数大时显示 UI 索引状态），未来若性能成问题再持久化（不存 `extraData`，改用 plugin 用户态目录）\n  - 不识别视觉相似（裁剪/缩放后视为不同图），是\
        \ MVP 显式取舍\n- **被否决方案**：\n  - **持久化 hash 到 `eagle.extraData`**：10KB 容量上限太小（~250 hash），且配置文件应\"\
        小且语义化\"，不适合塞数据\n  - **强制全局去重（跨文件夹）**：用户可能就是想把同图存到不同分类下，不该剥夺这个能力\n  - **只在剪贴板路径去重**：截图路径同样会重复（例如同一张文档反复截图），覆盖不全\n\
        - **Why**：把\"重复\"语义和文件夹绑定，与 Eagle 自身的组织模型一致；用户用一个开关控制\"是否允许重复\"，心智成本最低。\n\n---\n\n## ADR-007：包管理用\
        \ npm，与 Eagle 官方推荐一致"
