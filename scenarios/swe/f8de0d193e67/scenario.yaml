          \ literally. */\nconst escapeRegExp = (value: string): string => value.replace(/[.*+?^${}()|[\\\
          ]\\\\]/g, \"\\\\$&\");\n\n/** Build the match pattern for a glossary term, based on how it's\
          \ shaped in generated markdown. */\nconst patternFor = (kind: GlossaryKind, term: string): RegExp\
          \ => {\n  const escaped = escapeRegExp(term);\n  switch (kind) {\n    case \"heading\":\n  \
          \    return new RegExp(`^(#{1,6} )${escaped}$`, \"gm\");\n    case \"line\":\n      return new\
          \ RegExp(`^${escaped}$`, \"g\");\n    case \"badge\":\n      return new RegExp(`(pantoken-doc-tag\"\
          >)${escaped}(<)`, \"g\");\n    default:\n      return new RegExp(`\\\\b${escaped}\\\\b`, \"\
          g\");\n  }\n};\n\n/** Build the replacement string for a translated term, preserving any capture\
          \ groups `patternFor` used. */\nconst replacementFor = (kind: GlossaryKind, translated: string):\
          \ string => {\n  switch (kind) {\n    case \"heading\":\n      return `$1${translated}`;\n \
          \   case \"badge\":\n      return `$1${translated}$2`;\n    default:\n      return translated;\n\
          \  }\n};\n\n/**\n * Deterministic adapter: substitutes known structural terms only (headings,\
          \ badges, table labels),\n * looked up from the `<locale>.glossary.json` translation-memory\
          \ cache (see `glossary.ts` for the term\n * list and `translate-glossary.ts` for how the cache\
          \ is filled). It can't translate prose, so\n * `translatesProse` is `false`. Safe to run in\
          \ CI — it never spawns an adapter or hits the network.\n */\nexport class GlossaryTranslationAdapter\
          \ implements TranslationAdapter {\n  readonly name = \"glossary\";\n  // Deterministic term\
          \ substitution only — it cannot translate prose, so the memory must never cache\n  // its output\
          \ under a prose key.\n  readonly translatesProse = false;\n  private readonly replacements:\
          \ Array<[RegExp, string]>;\n\n  constructor(locale = \"hu\") {\n    const memory = TranslationMemory.load(locale,\
          \ \"glossary\");\n    // Untranslated terms are skipped (identity passthrough) rather than matched\
          \ against an empty\n    // string, so an in-progress locale still renders every OTHER already-translated\
          \ term correctly.\n    this.replacements = GLOSSARY_TERMS.flatMap(({ kind, term }) => {\n  \
          \    const translated = memory.get(\"text\", term);\n      return translated === undefined ?\
          \ [] : [[patternFor(kind, term), replacementFor(kind, translated)] as const];\n    });\n  }"
