        \    const type = cm[3];\n    const body = cm[4];\n    let text = '';\n    if (type === 's') {\n\
        \      const idx = +(/<v>([^<]*)<\\/v>/.exec(body)?.[1] ?? -1);\n      text = '[s' + idx + ']'\
