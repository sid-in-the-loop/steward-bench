        ([^\"]+)\"\\/>/g;\nconst merges = [];\nlet mm;\nwhile ((mm = mergeRe.exec(sheet))) merges.push(mm[1]);\n\
        if (merges.length) console.log('MERGES:', merges.join(', '));\n"
