        \ m;\n  while ((m = re.exec(xml))) {\n    const inner = m[1];\n    const tre = /<t[^>]*>([^<]*)<\\\
        /t>/g;\n    let txt = '';\n    let tm;\n    while ((tm = tre.exec(inner))) txt += tm[1];\n   \
        \ ss.push(txt);\n  }\n}\n\nconst sheet = fs.readFileSync(`${root}/xl/worksheets/sheet${sheetN}.xml`,\
        \ 'utf8');\nconst rowRe = /<row r=\"(\\d+)\"[^>]*>([\\s\\S]*?)<\\/row>/g;\nlet m;\nwhile ((m =\
        \ rowRe.exec(sheet))) {\n  const r = m[1];\n  const inner = m[2];\n  const cellRe = /<c r=\"([A-Z]+\\\
        d+)\"(?: s=\"(\\d+)\")?(?: t=\"([^\"]*)\")?>([\\s\\S]*?)<\\/c>/g;\n  const cells = [];\n  let\
