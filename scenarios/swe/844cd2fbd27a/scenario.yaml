        \ N+4   \"↓\"                                 (style 25, no border)\n//   row N+5   next node\
        \ ...\n//\n// Node convention (each PROCESS_FLOW item is a single string):\n//   · Plain text\
        \                → bordered box (style 21)\n//   · Prefix '?' → decision       → yellow box (style\
        \ 20), '?' stripped, '◇ ' added\n//   · Prefix '!' → terminal/exit  → bordered box, '■ ' added\
        \ (END / RETURN /\n//                                   LEAVE LIST-PROCESSING markers)\n//\n//\
        \ Decision branches that need a separate side-arm row are described inside\n// the decision string\
        \ itself with \" → \" (e.g. \"? gt_result IS INITIAL → MESSAGE + LEAVE\")\n// — the renderer keeps\
        \ everything on one row so the chart stays compact in\n// a 3-column grid. For programs that need\
        \ true two-branch fan-out, drivers\n// can render the branch as the next node prefixed with \"\
        └─ \" or similar.\n// =============================================================\nfunction\
        \ appendProcessFlow(payload, items, opts = {}) {\n  if (!Array.isArray(items) || items.length\
        \ === 0) return payload;\n  const { cells, merges, rowHeights, cols } = payload;\n  const heading\
        \ = opts.heading || 'Process Flow Chart';\n  const colSpan = Math.max(1, Math.min(3, cols.length\
        \ || 3));\n  const lastCol = colLetter(colSpan - 1);\n\n  // Find next free row by scanning current\
        \ cells.\n  let maxRow = 0;\n  for (const ref of Object.keys(cells)) {\n    const m = /^([A-Z]+)(\\\
        d+)$/.exec(ref);\n    if (m) maxRow = Math.max(maxRow, +m[2]);\n  }\n\n  let r = maxRow + 2; //\
        \ 1 blank spacer row between table and heading\n\n  // Heading row — style 17 (grey + bold + all\
        \ borders).\n  cells[R(r - 1, 0)] = { v: heading, s: 17 };\n  for (let c = 1; c < colSpan; c++)\
        \ cells[R(r - 1, c)] = { s: 17 };\n  if (colSpan > 1) merges.push(`A${r}:${lastCol}${r}`);\n \
        \ rowHeights[r] = 22;\n  r++;\n\n  items.forEach((raw, idx) => {\n    const txt = String(raw ??\
        \ '');\n    const isDecision = /^\\?\\s*/.test(txt);\n    const isTerminal = /^!\\s*/.test(txt);\n\
        \    const label = isDecision ? `◇ ${txt.replace(/^\\?\\s*/, '')}`\n                : isTerminal\
        \ ? `■ ${txt.replace(/^!\\s*/, '')}`\n                : txt;\n    const style = isDecision ? 20\
        \ : 21;\n\n    cells[R(r - 1, 0)] = { v: label, s: style };\n    for (let c = 1; c < colSpan;\
        \ c++) cells[R(r - 1, c)] = { s: style };\n    if (colSpan > 1) merges.push(`A${r}:${lastCol}${r}`);\n\
        \    rowHeights[r] = 24;\n    r++;\n\n    if (idx < items.length - 1) {\n      // Centered \"\
        ↓\" arrow row, no border / no fill — visually links boxes.\n      cells[R(r - 1, 0)] = { v: '↓',\
        \ s: 25 };\n      for (let c = 1; c < colSpan; c++) cells[R(r - 1, c)] = { s: 25 };\n      if\
        \ (colSpan > 1) merges.push(`A${r}:${lastCol}${r}`);\n      rowHeights[r] = 16;\n      r++;\n\
        \    }\n  });\n\n  return payload;\n}\n\n// =============================================================\n\
