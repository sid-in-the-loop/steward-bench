        }\n\nconst sheet = fs.readFileSync(`${root}/xl/worksheets/sheet${sheetN}.xml`, 'utf8');\n\n//\
        \ Column widths\nconst colsBlock = /<cols>([\\s\\S]*?)<\\/cols>/.exec(sheet)?.[1] || '';\nconst\
        \ cols = [];\nconst colRe = /<col\\s+([^/]+)\\/>/g;\nlet cm;\nwhile ((cm = colRe.exec(colsBlock)))\
        \ {\n  const a = cm[1];\n  cols.push({\n    min: /min=\"(\\d+)\"/.exec(a)?.[1],\n    max: /max=\"\
