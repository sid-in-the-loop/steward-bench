      content: "import fs from 'node:fs';\n\nconst root = process.argv[2];\nconst xml = fs.readFileSync(`${root}/xl/styles.xml`,\
        \ 'utf8');\n\nfunction parseList(tag) {\n  const re = new RegExp(`<${tag}[^>]*>([\\\\s\\\\S]*?)<\\\
        \\/${tag}>`);\n  const m = re.exec(xml);\n  if (!m) return [];\n  return m[1];\n}\n\nfunction\
        \ pickAll(text, tag) {\n  const out = [];\n  const re = new RegExp(`<${tag}(?:\\\\s[^>]*)?(?:/>|>([\\\
        \\s\\\\S]*?)<\\\\/${tag}>)`, 'g');\n  let m;\n  while ((m = re.exec(text))) out.push({ outer:\
        \ m[0], inner: m[1] || '' });\n  return out;\n}\n\n// Fonts\nconst fontsBlock = parseList('fonts');\n\
        const fonts = pickAll(fontsBlock, 'font').map((f, i) => {\n  const sz = /<sz val=\"([^\"]+)\"\
        /.exec(f.inner)?.[1];\n  const name = /<name val=\"([^\"]+)\"/.exec(f.inner)?.[1];\n  const color\
        \ = /<color rgb=\"([^\"]+)\"/.exec(f.inner)?.[1];\n  const bold = /<b\\s*\\/?>/.test(f.inner)\
        \ ? 'B' : '';\n  const italic = /<i\\s*\\/?>/.test(f.inner) ? 'I' : '';\n  return { i, sz, name,\
        \ color, attr: bold + italic };\n});\n\n// Fills\nconst fillsBlock = parseList('fills');\nconst\
        \ fills = pickAll(fillsBlock, 'fill').map((f, i) => {\n  const pf = /<patternFill[^>]*patternType=\"\
        ([^\"]+)\"/.exec(f.inner)?.[1] || 'none';\n  const fg = /<fgColor rgb=\"([^\"]+)\"/.exec(f.inner)?.[1]\
        \ || '';\n  const bg = /<bgColor rgb=\"([^\"]+)\"/.exec(f.inner)?.[1] || '';\n  return { i, pf,\
        \ fg, bg };\n});\n\n// Borders\nconst bordersBlock = parseList('borders');\nconst borders = pickAll(bordersBlock,\
        \ 'border').map((f, i) => {\n  function side(name) {\n    const m = new RegExp(`<${name}([^/>]*)(?:/>|>)`).exec(f.inner);\n\
        \    if (!m) return '-';\n    const style = /style=\"([^\"]+)\"/.exec(m[1])?.[1] || '?';\n   \
        \ return style === 'thin' ? 'T' : style[0]?.toUpperCase() || '?';\n  }\n  return { i, l: side('left'),\
        \ r: side('right'), t: side('top'), b: side('bottom') };\n});\n\n// CellXfs\nconst xfsBlock =\
        \ parseList('cellXfs');\nconst xfs = pickAll(xfsBlock, 'xf').map((f, i) => {\n  const inner =\
        \ f.outer;\n  const fontId = /fontId=\"(\\d+)\"/.exec(inner)?.[1] ?? '?';\n  const fillId = /fillId=\"\
        (\\d+)\"/.exec(inner)?.[1] ?? '?';\n  const borderId = /borderId=\"(\\d+)\"/.exec(inner)?.[1]\
        \ ?? '?';\n  const numFmtId = /numFmtId=\"(\\d+)\"/.exec(inner)?.[1] ?? '?';\n  const align =\
        \ /<alignment([^/>]*)/.exec(f.inner || inner)?.[1] || '';\n  const h = /horizontal=\"([^\"]+)\"\
        /.exec(align)?.[1] || '';\n  const v = /vertical=\"([^\"]+)\"/.exec(align)?.[1] || '';\n  const\
        \ wrap = /wrapText=\"1\"/.test(align) ? 'W' : '';\n  return { i, font: fontId, fill: fillId, border:\
        \ borderId, numFmt: numFmtId, h, v, wrap };\n});\n\nconsole.log('=== FONTS ===');\nfonts.forEach(f\
        \ => console.log(`${f.i}: ${f.attr || '-'} sz=${f.sz} clr=${f.color || '-'} name=${f.name || '-'}`));\n\
        console.log('\\n=== FILLS ===');\nfills.forEach(f => console.log(`${f.i}: pf=${f.pf} fg=${f.fg\
        \ || '-'} bg=${f.bg || '-'}`));\nconsole.log('\\n=== BORDERS ===');\nborders.forEach(b => console.log(`${b.i}:\
        \ L${b.l} R${b.r} T${b.t} B${b.b}`));\nconsole.log('\\n=== CELLXFS (style index → font/fill/border/numFmt/align)\
        \ ===');\nxfs.forEach(x => console.log(`${x.i}: f${x.font} fill${x.fill} bd${x.border} nf${x.numFmt}\
        \ ${x.h}|${x.v}${x.wrap ? '|W' : ''}`));\n"
