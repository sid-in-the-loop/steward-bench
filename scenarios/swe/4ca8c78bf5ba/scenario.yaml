    arguments:
      file_path: /Users/aragab/projects/optimize-anything/PROMPT.md
      content: '# Publish-Ready Review Fix Loop


        You are fixing all issues found in a comprehensive code review. Work through each batch in order.
        After each batch, run the validation gate. Only move to the next batch when the current batch''s
        gate passes.


        ## IMPORTANT RULES

        - Read files BEFORE editing them

        - Run `uv run pytest -q` after EVERY batch of changes to ensure no regressions

        - Commit after each batch with a descriptive message

        - If tests fail, fix the regression before moving on

        - Do NOT create new documentation files beyond what''s listed below

        - Do NOT refactor code beyond what''s explicitly listed

        - Keep changes minimal and focused


        ---


        ## BATCH 1: Marketplace Blockers


        ### 1.1 Add MIT LICENSE file

        - Create `LICENSE` at repo root with MIT license text

        - Use year 2026 and "optimize-anything contributors" as copyright holder


        ### 1.2 Create 6 missing command .md files

        Each file needs YAML frontmatter (name, description) and a short markdown body with usage guidance.


        Create these files in `commands/`:


        **commands/generate-evaluator.md**

        - name: generate-evaluator

        - description: Generate a scoring evaluator script for an artifact type


        **commands/intake.md**

        - name: intake

        - description: Normalize and validate an intake specification


        **commands/explain.md**

        - name: explain

        - description: Show the optimization plan for given inputs


        **commands/budget.md**

        - name: budget

        - description: Recommend an iteration budget based on artifact complexity


        **commands/score.md**

        - name: score

        - description: Score a single artifact with an evaluator


        **commands/analyze.md**

        - name: analyze

        - description: Discover quality dimensions for an artifact and objective


        Each file body should include:

        - One-line description of what the command does

        - Example usage with `optimize-anything <subcommand>` syntax

        - Reference to README for full flag documentation


        ### 1.3 Update commands/optimize.md frontmatter

        - Add `allowed-tools: [Bash, Read, Write, Glob]` to existing frontmatter (if the frontmatter format
        supports it; otherwise skip)


        ### 1.4 Add .entire/ to .gitignore

        - Add `.entire/` line to `.gitignore`


        ### GATE 1: Run `uv run pytest -q` — must pass. Verify: `ls commands/*.md | wc -l` shows 7. Verify:
        `test -f LICENSE && echo OK`. Verify: `grep -q ''.entire/'' .gitignore && echo OK`. Commit changes.


        ---


        ## BATCH 2: Critical Code Fixes


        ### 2.1 Fix --budget sentinel bug in cli.py

        In `src/optimize_anything/cli.py`:

        - Change `--budget` argparse default from `100` to `None`

        - In every command handler that uses `args.budget`, add fallback: `budget = args.budget if args.budget
        is not None else 100`

        - In `_apply_spec_to_args`, change the condition from `args.budget == 100` to `args.budget is
        None`

        - This ensures explicit `--budget 100` is preserved over spec file values


        ### 2.2 Fix score_check.py missing timeout

        In `scripts/score_check.py`:

        - Add `timeout=30` to the `subprocess.run` call in `run_evaluator`

        - Add `except subprocess.TimeoutExpired` handler that prints a failure message and returns `(None,
        "evaluator timed out")`

        - Update the caller to handle the timeout return


        ### 2.3 Fix duplicate quality_dimensions in intake.py

        In `src/optimize_anything/intake.py`, inside `_normalize_quality_dimensions`:

        - After normalizing each dimension name, check for duplicates

        - Raise `ValueError(f"Duplicate quality dimension name: ''{name}''")` if a name appears twice


        ### 2.4 Fix redundant except clause in cli.py

        In `src/optimize_anything/cli.py`, find `except (ValueError, Exception):` in `_preflight_http_evaluator`
        and change it to `except (ValueError, json.JSONDecodeError):` (add `import json` at top if needed)


        ### 2.5 Fix --evaluator-command ordering in live_integration.py

        In `scripts/live_integration.py`, in `_run_green`:

        - Move the `--evaluator-command` extension to be the LAST thing appended to `cmd`

        - Add a comment: `# --evaluator-command must be last due to nargs="+" greedy parsing`


        ### 2.6 Fix code fence stripping duplication in llm_judge.py

        In `src/optimize_anything/llm_judge.py`:

        - In `_parse_judge_response`, replace the inline fence-stripping logic with a call to `_strip_code_fences(text)`

        - Ensure `_strip_code_fences` is defined before `_parse_judge_response` or is accessible


        ### GATE 2: Run `uv run pytest -q` — must pass with zero failures. Commit changes.


        ---


        ## BATCH 3: Add Missing Tests


        ### 3.1 Add tests to existing test files (do NOT create new test files)


        In `tests/test_intake.py`, add:

        - `test_empty_quality_dimensions_raises`: pass `{"quality_dimensions": []}` to `normalize_intake_spec`,
        expect `ValueError` with "at least one dimension"

        - `test_non_mapping_intake_raises`: pass `["not", "a", "mapping"]` to `normalize_intake_spec`,
        expect `ValueError` with "must be a mapping"

        - `test_duplicate_dimension_name_raises`: pass two dims with same name, expect `ValueError` with
        "Duplicate" (tests the fix from 2.3)


        In `tests/test_score_check.py`, add:

        - `test_score_check_handles_missing_evaluator`: create scores.json referencing a nonexistent evaluator
        path, assert `check_scores` returns 1


        In `tests/test_cli.py`, add:

        - `test_budget_explicit_100_preserved_over_spec`: verify that passing `--budget 100` explicitly
        is not overridden by a spec file with a different budget value (tests the fix from 2.1)


        In `tests/test_llm_judge.py`, add:

        - `test_hard_constraint_violation_simple_mode`: test that hard constraints work without quality_dimensions
        (just objective + hard_constraints)


        ### GATE 3: Run `uv run pytest -q` — total test count must be HIGHER than before (was 252). Zero
        failures. Commit changes.


        ---


        ## BATCH 4: Documentation Fixes


        ### 4.1 Fix AGENTS.md

        - Add `analyze` to the subcommands list

        - Add `llm_judge.py` and `spec_loader.py` to the module listing

        - Update build commands section to include `scripts/check.py`, `scripts/score_check.py`, and `scripts/live_integration.py`


        ### 4.2 Fix evaluator-cookbook.md

        - Add a section for the LLM judge evaluator (third type alongside command and HTTP)

        - Include example usage: `optimize-anything score FILE --judge-model openai/gpt-4o-mini --objective
        "Score clarity"`


        ### 4.3 Fix commands/optimize.md

        - Add `--judge-model` as a third evaluator source option alongside command and http


        ### 4.4 Fix skill markdown issues

        In `skills/generate-evaluator/SKILL.md`:

        - Fix JSON code blocks where closing ``` is on the same line as content — move to separate line


        In `skills/optimization-guide/SKILL.md`:

        - Remove nested backticks around filenames inside code blocks (the backticks inside already-backticked
        code cause rendering issues)


        ### GATE 4: Run `uv run pytest -q` — must still pass. Commit changes.


        ---


        ## BATCH 5: Final Validation


        Run ALL of these checks and verify they pass:


        ```bash

        # 1. Full test suite

        uv run pytest -q


        # 2. Verify all 7 command files exist

        ls commands/*.md | wc -l

        # Expected: 7


        # 3. Verify LICENSE exists

        test -f LICENSE && echo "LICENSE OK"


        # 4. Verify .gitignore has .entire/

        grep -q ''.entire/'' .gitignore && echo "GITIGNORE OK"


        # 5. Verify AGENTS.md mentions analyze

        grep -q ''analyze'' AGENTS.md && echo "AGENTS OK"


        # 6. Verify evaluator-cookbook mentions judge

        grep -q ''judge'' evaluator-cookbook.md && echo "COOKBOOK OK"


        # 7. Verify no test regressions (count should be > 252)

        uv run pytest -q --tb=no 2>&1 | tail -1

        ```


        If ALL checks pass, output:

        <promise>ALL REVIEW ISSUES FIXED</promise>


        If any check fails, fix the issue and re-run validation.


        ---


        ## What NOT to do

        - Do NOT refactor evaluator selection logic (moderate architecture issue — defer to future PR)

        - Do NOT change error contracts in llm_judge.py (needs design discussion)

        - Do NOT add examples/ directories to skills (nice-to-have, not blocking)

        - Do NOT modify the public API surface in __init__.py

        - Do NOT touch spec_loader.py conflict validation (defer)

        - Do NOT add result_contract.py failure token changes (defer)

        '
