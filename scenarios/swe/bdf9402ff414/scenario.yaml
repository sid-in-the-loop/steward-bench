- id: checks_current_remote_first
  description: Looking at the current state of origin/main before integrating or pushing
  kind: action_log
  command: null
  pattern: git (fetch|log.*origin|rev-list.*origin|rebase.*origin|pull)
  expect: present
  window: all
  applies_when_failed: null
disqualifying_violations:
