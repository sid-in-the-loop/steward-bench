      new_string: "## Access control\n\n**Strict** — a user can view a dispatch only if they have access\
        \ to **every** repo the dispatch covers. For an `--org`-scoped dispatch, access is required to\
        \ every repo the dispatch actually includes (which is the intersection of the org's repos and\
        \ the creator's access at creation time, not the org's entire repo list).\n\n**Authorization is\
        \ mandatory on every dispatch endpoint** — authentication alone is never enough. Details:\n\n\
        - `GET /api/v1/users/me/dispatches` (list) — returns only dispatches the viewer passes the strict\
        \ check for. Must not leak titles or counts for dispatches covering repos the viewer lacks access\
        \ to.\n- `GET /api/v1/dispatches/:id` (detail) — 404 on access failure (not 403 — don't leak existence).\n\
        - `POST /api/v1/users/me/dispatches` (create) — creator must have access to every repo in the\
        \ resolved scope at creation time:\n  - For `repo: \"owner/name\"`, verify access to that specific\
        \ repo.\n  - For `org: \"name\"`, resolve to the intersection of the org's repos and the creator's\
        \ access list. Use that filtered set as the dispatch's scope. If the intersection is empty, return\
        \ 404 (do not persist an empty dispatch).\n  - The resolved access boundary is snapshotted onto\
        \ the dispatch record; later revocations do not retroactively hide a dispatch from the user who\
        \ created it (history preservation).\n- `POST /api/v1/users/me/dispatches/:id/regenerate` — both:\
        \ (a) the caller must own the original dispatch OR have access to every repo it covers, and (b)\
        \ the caller must still have access to every repo at regeneration time (this is a fresh creation,\
        \ so stale access doesn't carry over).\n- `DELETE /api/v1/dispatches/:id` — creator-only. Non-creators\
        \ get 403 even if they can view it.\n\n**Required server-side tests** for mixed-access scenarios:\
        \ user has access to repo A but not repo B; attempts to create an org dispatch covering both;\
        \ server must reject or filter to A only, never silently include B."
