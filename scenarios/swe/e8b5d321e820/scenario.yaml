    arguments:
      questions:
      - question: Which fingerprint shape do you want in the plan?
        header: Fingerprint
        multiSelect: false
        options:
        - label: Hash of sorted used IDs (Recommended)
          description: Key = user + scope + sha256(sorted(used_checkpoint_ids)) + branches + generate
            + voice. Multi-repo trivially works (one flat sorted list). Perfect uniqueness.
        - label: First + last timestamps + count
          description: Your original proposal. Simpler mental model, but merged timestamps in multi-repo
            case lose resolution and interior of the set isn't reflected.
        - label: Belt-and-suspenders
          description: Hash of sorted IDs AND first/last timestamps AND count. Most robust but redundant.
