        - Hooks list: drop any `useRegenerate` style hook if present (verify during edit).\n\n### Change\
        \ 2 — Rewrite idempotency fingerprint to use source state\n\n**`2026-04-16-entire-dispatch-design.md`,\
        \ lines 400–423**\n\nReplace the request-params-only fingerprint with a source-state fingerprint.\
        \ New section text:\n\n- **Fingerprint components** (stable hash of):\n  - `user_id`\n  - `scope`\
        \ (ordered: `[repo]` OR `sorted([org/repo, …])` for org scope)\n  - `first_checkpoint_created_at`\
        \ — ISO timestamp of the earliest checkpoint that contributed a bullet (i.e., passed the fallback\
        \ chain)\n  - `last_checkpoint_created_at` — ISO timestamp of the latest contributing checkpoint\n\
        \  - `used_checkpoint_count` — number of checkpoints that produced a bullet (after the fallback\
        \ chain, not just the candidate set)\n  - `sorted(branches)` or `\"all\"`\n  - `generate` (bool)\n\
        \  - `voice` (normalized: preset name → preset name; file content → hash of content; literal →\
        \ hash of literal string)\n- **Order of operations on the server**:\n  1. Resolve access + enumerate\
        \ candidate checkpoints in the request's window (cheap — metadata only).\n  2. Batch-fetch analyses\
        \ (cheap — cached per-checkpoint).\n  3. Apply fallback chain to determine the \"used\" set and\
