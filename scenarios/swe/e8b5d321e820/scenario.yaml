      new_string: "- **Fingerprint components** (stable SHA-256 hash of):\n  - `user_id`\n  - `scope`\
        \ (ordered: `[repo]` OR `sorted([org/repo, …])` for org scope)\n  - `used_checkpoints_hash` —\
        \ SHA-256 of the lexically-sorted list of checkpoint IDs that actually contributed a bullet (i.e.,\
        \ passed the fallback chain). Multi-repo case is trivial: the list is the union of used IDs across\
        \ all covered repos, sorted lex. Single scalar in the fingerprint regardless of repo count.\n\
        \  - `sorted(branches)` or `\"all\"`\n  - `generate` (bool)\n  - `voice` (normalized: preset name\
        \ → preset name; file content → hash of content; literal → hash of literal string)\n- **Response-only\
        \ metadata** (NOT part of the fingerprint, kept for UI/debugging):\n  - `first_checkpoint_created_at`\
        \ and `last_checkpoint_created_at` — human-readable window boundaries shown in the UI and in CLI\
        \ text output. Derived from the used set. Useful for \"this dispatch covers Apr 9 – Apr 16\" labels.\n\
        \  - `used_checkpoint_count` — same. Redundant with `used_checkpoints_hash` for uniqueness purposes\
        \ but useful for quick at-a-glance metadata and debugging.\n- **Order of operations on the server**:\n\
        \  1. Resolve access + enumerate candidate checkpoints in the request's window (cheap — metadata\
        \ only).\n  2. Batch-fetch analyses (cheap — cached per-checkpoint).\n  3. Apply the fallback\
        \ chain to determine the \"used\" set (checkpoints that will contribute a bullet).\n  4. Compute\
        \ `used_checkpoints_hash = sha256(lex_sorted(used_ids).join(\",\"))`.\n  5. Compute fingerprint\
        \ from the components above.\n  6. If a completed dispatch exists with the same fingerprint: return\
        \ it with `deduped: true`. Skip LLM synthesis.\n  7. Otherwise: run LLM synthesis (if `generate:\
        \ true`), persist a new dispatch, return with `deduped: false`.\n- **Rationale for hashing the\
        \ used set**: any single checkpoint added, removed, or newly eligible changes the sorted ID list\
        \ → changes `used_checkpoints_hash` → changes the fingerprint → produces a fresh dispatch. A pending\
        \ checkpoint becoming complete also changes the used set (it joins the list), so the dispatch\
        \ refreshes automatically. Multi-repo is handled naturally because we hash one flat sorted list,\
        \ not a per-repo structure. Solves Codex's stale-cache concern without a regenerate endpoint.\n\
        - **Dry-run requests** (`dry_run: true`) skip steps 6–7 and are never persisted.\n- **Client retry\
        \ semantics**: unchanged — CLI can safely retry 5xx, because same inputs + same source state =\
        \ same fingerprint = same record returned.\n- **Response shape**: `idempotency_key_hash` and `deduped`\
        \ fields stay (useful for clients). `used_checkpoints_hash` is also echoed in the response so\
        \ clients can verify/debug. `first_checkpoint_created_at`, `last_checkpoint_created_at`, `used_checkpoint_count`\
        \ remain as response metadata (not in the key). Remove `unpushed_count` from the `warnings` object\
        \ (see Change 3)."
