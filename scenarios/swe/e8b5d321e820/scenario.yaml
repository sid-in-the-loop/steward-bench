        \ JSON/response shape updates, test list updates. |\n| `specs/2026-04-16-entire-dispatch-web-ui-design.md`\
        \ | Web UI spec. Regenerate endpoint row, regenerate button, `RegenerateButton.tsx` component,\
        \ sidebar Actions list, tests, open questions. |\n\nNo code files are touched — this round is\
