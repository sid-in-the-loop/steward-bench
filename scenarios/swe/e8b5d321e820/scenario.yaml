        \ even after checkpoint state changes, so retries return stale results and force users into the\
        \ `regenerate` special case.\n3. **Unpushed detection unreliable** — `git rev-list entire/checkpoints/v1\
        \ ^origin/entire/checkpoints/v1` depends on stale remote-tracking refs and hardcodes `origin`,\
        \ so it re-introduces the same 404/unpushed ambiguity it was meant to resolve.\n\nThe user's response\
        \ to all three is to simplify rather than fortify:\n\n1. **Remove `regenerate` entirely.** With\
        \ a better fingerprint (see #2), re-submitting the same inputs to `POST /dispatches` naturally\
        \ returns the same dispatch when source state is unchanged and produces a fresh one when it isn't.\
        \ Regenerate becomes redundant and its auth hole disappears with it.\n2. **Rebuild the fingerprint\
        \ on actual source state** — use the real first and last checkpoint timestamps (of the checkpoints\
        \ that actually contributed bullets) plus the count of used checkpoints. Same set + same inputs\
        \ → dedupe; any checkpoint added/removed/newly-complete → new fingerprint → new dispatch.\n3.\
        \ **Drop unpushed detection from v1.** No local-git heuristics. The server's batch-analysis status\
        \ model already distinguishes `complete`/`pending`/`generating`/`failed`/`not_visible`/`unknown`,\
        \ and \"unknown\" just falls through the local fallback chain without trying to diagnose why.\
