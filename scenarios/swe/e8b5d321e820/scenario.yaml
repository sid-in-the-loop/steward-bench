        \ endpoints to build, no auth hole, retries correctly reflect current state, and no brittle git-ref\
        \ inference.\n\n## Files to modify\n\n| Path | Kind of change |\n|---|---|\n| `specs/2026-04-16-entire-dispatch-design.md`\
