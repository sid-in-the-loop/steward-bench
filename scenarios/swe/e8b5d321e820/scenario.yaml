      content: "# Spec simplification — responding to follow-up adversarial review\n\n## Context\n\nThe\
        \ follow-up Codex adversarial review on the `entire dispatch` specs raised three issues:\n\n1.\
        \ **Regenerate auth hole** — any viewer with access to every repo can regenerate someone else's\
        \ dispatch, potentially replaying private voice content.\n2. **Idempotency cache-staleness** —\
