        the server''s response references) to detect unpushed checkpoints.


        If the count is > 0 and format is `text` or `markdown`, a single-line nudge is appended. In `--format
        json`, the count is surfaced as a `warnings.unpushed_count` field instead.'
      new_string: '### Unpushed-checkpoint detection


        **Purely local signal — no API needed.** Before any batch fetch, enumerate the set of checkpoint-commits
        that exist on the local `entire/checkpoints/v1` branch but are missing from the remote tracking
        branch:


        ```

        git rev-list entire/checkpoints/v1 ^origin/entire/checkpoints/v1

        ```


        Each returned commit carries a checkpoint ID in its trailer (see CLAUDE.md). That''s the unpushed
        set — deterministically known from git refs, not inferred from API responses. Both modes use the
        same local method:


        - **Local mode**: after computing the unpushed set, the CLI can optionally skip the batch analysis
        fetch for those IDs (they''ll return `unknown` anyway) or include them and expect `unknown`.

        - **Server mode**: the server only sees pushed checkpoints. The CLI enumerates local checkpoints
        in the window and intersects with the unpushed set; the delta is what should have been on the
        server but wasn''t reported — that''s the unpushed nudge.


        **Edge case: no remote tracking branch.** If `origin/entire/checkpoints/v1` doesn''t exist (user
        has never pushed the checkpoint branch), all local checkpoints in the window are "unpushed." The
        nudge wording changes to: `"⚠ you haven''t pushed your checkpoint branch — run \`git push origin
        entire/checkpoints/v1\` to enable richer analysis."`


        **Distinctions surfaced to the user** (each counted and labelled separately — not conflated):


        | Classification | Source | User-visible label |

        |---|---|---|

        | `unpushed` | local git refs | "N checkpoints not pushed — run `git push …`" |

        | `access_denied` | API status `not_visible` | "N checkpoints you no longer have access to" |

        | `pipeline_pending` | API status `pending`/`generating` | "N checkpoints still being analyzed"
        |

        | `pipeline_failed` | API status `failed` | "N checkpoints failed analysis" |

        | `uncategorized` | all fallback steps exhausted | "N uncategorized checkpoints skipped" |


        In `--format text`/`markdown`, these are grouped into one warnings block at the bottom. In `--format
        json`, they live under `warnings.{unpushed_count, access_denied_count, pending_count, failed_count,
        uncategorized_count}`.'
