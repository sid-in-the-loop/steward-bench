      old_string: "### Server-side prerequisites\n\n- `POST /api/v1/users/me/checkpoints/analyses/batch`\
        \ — **exists** (see analysis-endpoints PR). Used in `--local` mode.\n- `POST /api/v1/users/me/dispatches`\
        \ — **new, required for default mode**. Takes scope params + generate/voice, returns the structured\
        \ dispatch payload + `web_url`. Persists result so entire.io web can render.\n- `GET /api/v1/orgs/:org/checkpoints?since=…&cursor=…`\
        \ — **new, required for `--org --local`** only. Server-mode `--org` uses internal enumeration,\
        \ so this endpoint isn't blocking for the default path.\n\nRough response shape for the new dispatches\
        \ endpoint:\n\n```json\n{\n  \"id\": \"dsp_01H…\",\n  \"web_url\": \"https://entire.io/dispatch/dsp_01H…\"\
        ,\n  \"window\": {\"since\": \"…\", \"until\": \"…\"},\n  \"repos\": [ /* same shape as --format\
        \ json output below */ ],\n  \"totals\": { \"checkpoints\": 13, \"branches\": 4, \"files_touched\"\
        : 23 },\n  \"warnings\": { \"unpushed_count\": 2, \"pending_count\": 0, \"uncategorized_count\"\
        : 0 },\n  \"generated_text\": \"…\"  /* only when `generate: true` in request; null otherwise\
        \ */\n}\n```"
      new_string: "### Server-side prerequisites\n\n- `POST /api/v1/users/me/checkpoints/analyses/batch`\
        \ — **exists** (see analysis-endpoints PR). Used in `--local` mode. **Authorization required**:\
        \ server MUST enforce per-checkpoint access (each ID's repo must be visible to the caller). IDs\
        \ the caller cannot see return status `not_visible`, not `unknown`, so the CLI can distinguish\
        \ access-denied from truly-unknown.\n- `POST /api/v1/users/me/dispatches` — **new, required for\
        \ default mode**. Takes scope params + generate/voice, returns the structured dispatch payload\
        \ + `web_url`. Persists result so entire.io web can render. See authorization and idempotency\
        \ sections below.\n- `GET /api/v1/orgs/:org/checkpoints?since=…&cursor=…` — **new, required for\
        \ `--org --local`** only. Server-mode `--org` uses internal enumeration, so this endpoint isn't\
        \ blocking for the default path. **Authorization required**: response filters to repos the caller\
        \ has access to within the requested org; mixed-access orgs return only the visible subset (and\
        \ never leak repo names/IDs outside that subset).\n\n#### Authorization contract (required for\
        \ all new endpoints)\n\n**All dispatch-related endpoints MUST enforce per-repo authorization before\
        \ any work or persistence.** Authentication (a valid login token) is necessary but not sufficient.\n\
        \nSpecifically:\n\n- `POST /api/v1/users/me/dispatches` — when the body names `repo`, the caller\
        \ must have access to that repo; reject with 403 if not. When the body names `org`, resolve to\
        \ the set of repos in that org the caller has access to (intersection with org membership) — if\
        \ empty, return 404 rather than a zero-result dispatch (don't persist empty dispatches).\n- `GET\
        \ /api/v1/dispatches/:id` — caller must have access to **every** repo the dispatch covers (strict\
        \ mode, matches the web UI spec). On failure, return 404 (don't leak existence).\n- `GET /api/v1/orgs/:org/checkpoints`\
        \ — filter results to repos the caller has access to in that org. If the caller has zero access\
        \ in that org, 404.\n- Batch analyses — per-ID access check; inaccessible IDs return `not_visible`,\
        \ not the content.\n\nAccess snapshots at creation time are recorded on the dispatch record so\
        \ later revocations don't retroactively hide a dispatch from the user who created it (history\
        \ preservation — see web UI spec).\n\n#### Idempotency\n\n**`POST /api/v1/users/me/dispatches`\
        \ MUST be idempotent** on a deterministic key derived from the request inputs. Rationale: any\
        \ retry (CLI retry on 5xx, user re-running the same command, accidental double-submit from the\
        \ web UI) would otherwise pollute the feed with duplicate dispatches.\n\n**Idempotency key** =\
        \ stable hash (e.g., SHA-256) of:\n\n```\nuser_id\n+ scope (ordered: [repo] OR sorted([org/repo,\
        \ …]) for org scope)\n+ since (ISO, truncated to minute)\n+ until (ISO, truncated to minute)\n\
        + sorted(branches) (or \"all\")\n+ generate (bool)\n+ voice (normalized: preset name → preset\
        \ name; file content → hash of content; literal → hash of literal string)\n```\n\nServer behavior:\n\
        \n- Compute the key on request receipt.\n- If an existing dispatch with the same key exists and\
        \ is `status: complete` or `status: generating`, return that dispatch's id/web_url — do not create\
        \ a duplicate.\n- `regenerate` (`POST /api/v1/users/me/dispatches/:id/regenerate`) explicitly\
        \ bypasses dedupe — it's the documented escape hatch for \"I want a new run of the same scope.\"\
        \n- Dry-run requests (`dry_run: true`) are never persisted and never dedupe-checked.\n\n**Client-side\
        \ retry semantics**: CLI can safely retry 5xx without worrying about duplicates, because the server\
        \ keys on content not request id. No client-provided `Idempotency-Key` header required, but the\
        \ server MAY accept one if supplied to cover cases where scope inputs are identical but the user\
        \ really wants a separate record.\n\n**Deletion / cleanup** — users can delete their own dispatches\
        \ via `DELETE /api/v1/dispatches/:id` (creator only; also enforces access). Deletion is hard-delete\
        \ in v1; soft-delete + restore deferred. This prevents feed pollution if duplicates slip through\
        \ somehow, and gives users agency over their history.\n\n#### Response shape for `POST /dispatches`\n\
        \n```json\n{\n  \"id\": \"dsp_01H…\",\n  \"idempotency_key_hash\": \"sha256:…\",   /* echoed so\
        \ callers can verify */\n  \"deduped\": false,                      /* true if server returned\
        \ existing record without creating a new one */\n  \"web_url\": \"https://entire.io/dispatch/dsp_01H…\"\
        ,\n  \"window\": {\"since\": \"…\", \"until\": \"…\"},\n  \"repos\": [ /* same shape as --format\
        \ json output below */ ],\n  \"totals\": { \"checkpoints\": 13, \"branches\": 4, \"files_touched\"\
        : 23 },\n  \"warnings\": {\n    \"unpushed_count\": 2,\n    \"access_denied_count\": 0,\n    \"\
        pending_count\": 0,\n    \"failed_count\": 0,\n    \"uncategorized_count\": 0\n  },\n  \"generated_text\"\
        : \"…\"  /* only when `generate: true` in request; null otherwise */\n}\n```"
