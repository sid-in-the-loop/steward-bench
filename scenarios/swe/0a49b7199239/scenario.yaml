  - tool: Bash
    arguments:
      command: "python3 - <<'PY'\np = \"cmd/entire/cli/hooks_git_cmd.go\"\ns = open(p).read()\n\nstart\
        \ = s.index(\"// initHookLogging initializes logging for hooks and stamps it with the most\")\n\
        end = s.index(\"func newHooksGitCmd() *cobra.Command {\")\nnew = '''// withHookSession adds the\
        \ hook-only logging context the root entry point\n// cannot supply, and configures redaction for\
        \ the checkpoint writes that follow.\n// Returns the context to pass down (cmd.SetContext) so\
        \ hook handlers inherit it.\n//\n// The root PersistentPreRunE already opened the log sink and\
        \ put the logger in\n// the context, and closes it again in its PersistentPostRun (main.go closes\
        \ once\n// more for the error path cobra skips post-runs on). So there is nothing here to\n//\
        \ initialize or to clean up — only the session, which root would have to scan\n// session state\
        \ on every command to know.\n//\n// The gate is load-bearing on the agent-hook path, not merely\
        \ defensive: the\n// git-hook tree checks it before calling, but newAgentHooksCmd does not, so\
        \ this\n// is the only thing standing between a never-enabled repo and having its session\n//\
        \ state scanned and its redactors loaded.\nfunc withHookSession(ctx context.Context) context.Context\
        \ {\n\tif !settings.IsSetUpAndEnabled(ctx) {\n\t\treturn ctx\n\t}\n\n\tctx = logging.WithSessionID(ctx,\
        \ strategy.FindMostRecentSession(ctx))\n\n\t// Configure redaction once at startup: PII (opt-in),\
        \ inline custom_redactions,\n\t// and rule packs discovered under .entire/redactors/. No-op if\
        \ nothing is\n\t// configured. Hooks are the checkpoint-writing path, so this cannot be left\n\
        \t// to the root prerun: without it only always-on secret scanning would run.\n\t// Receives the\
        \ logger-carrying ctx so redaction diagnostics and the load-time\n\t// summary route into .entire/logs/.\n\
        \tstrategy.EnsureRedactionConfigured(ctx)\n\n\treturn ctx\n}\n\n'''\ns = s[:start] + new + s[end:]\n\
        \n# git tree prerun + drop PersistentPostRunE\nold = '''\t\t\tlogCtx, cleanup := initHookLogging(ctx)\n\
        \t\t\tcmd.SetContext(logCtx)\n\t\t\thookLogCleanup = cleanup\n\t\t\treturn nil\n\t\t},\n\t\tPersistentPostRunE:\
        \ func(_ *cobra.Command, _ []string) error {\n\t\t\tif hookLogCleanup != nil {\n\t\t\t\thookLogCleanup()\n\
        \t\t\t}\n\t\t\treturn nil\n\t\t},\n\t}'''\nnew = '''\t\t\tcmd.SetContext(withHookSession(ctx))\n\
        \t\t\treturn nil\n\t\t},\n\t}'''\nassert old in s\ns = s.replace(old, new)\nopen(p, \"w\").write(s)\n\
        PY\ngrep -n \"hookLogCleanup\" cmd/entire/cli/hooks_git_cmd.go; gofmt -l cmd/entire/cli/hooks_git_cmd.go;\
        \ echo ok"
      description: Replace initHookLogging in hooks_git_cmd.go
  - tool: Bash
