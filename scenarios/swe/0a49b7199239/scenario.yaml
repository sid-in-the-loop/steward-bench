        , err)\n\t}\n\tif !strings.Contains(string(content), `\"session_id\":\"`+sessionID+`\"`) {\n\t\
        \tt.Errorf(\"log line missing session_id=%s: %s\", sessionID, content)\n\t}\n}\n\n// TestWithHookSession_GateSkipsRepo\
        \ covers the gate that newAgentHooksCmd relies\n// on entirely: a repo Entire never set up, and\
        \ one where it is disabled, must\n// come back with the context untouched — nothing scanned, no\
        \ redactors loaded.\nfunc TestWithHookSession_GateSkipsRepo(t *testing.T) {\n\ttests := []struct\
        \ {\n\t\tname     string\n\t\tsettings string\n\t}{\n\t\t{\"never set up\", \"\"},\n\t\t{\"set\
        \ up but disabled\", `{\"enabled\":false,\"strategy\":\"manual-commit\"}`},\n\t}\n\n\tfor _, tt\
        \ := range tests {\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\ttmpDir := t.TempDir()\n\t\t\
        \tt.Chdir(tmpDir)\n\t\t\ttestutil.InitRepo(t, tmpDir)\n\n\t\t\tif tt.settings != \"\" {\n\t\t\t\
