        ## `session_id` becomes a context value (9b0fc4d97)


        Follow-up on this branch: `session_id` is now handled exactly like `component` and `agent`, and
        the `currentSessionID` package global is gone.


        The global meant a process had exactly one session at a time, and "overriding" it meant overwriting
        it for every other caller. As a plain context value, a derived context shadows the session for
        its own scope only — which is the behaviour the old design couldn''t express. `WithSessionID`
        drops its `error` return and the mutex with it, becoming a two-line decorator matching its siblings.


        ### The duplicate-key hazard this had to solve


        There are **123** hand-written `slog.String("session_id", …)` attrs across `cmd/` and `internal/`.
        slog does not dedupe attrs, so once the context carries a session, any of those running under
        a session-scoped context would emit the key twice:


        ```json

        {"level":"WARN","msg":"…","session_id":"first","session_id":"second"}

        ```


        So `log()` now drops its own session attr when the call site already supplied one. The check handles
        both slog calling conventions (`slog.Attr` values and loose key/value pairs) and correctly ignores
        a `"session_id"` appearing in a *value* position. Table-driven test covers all three shapes; a
        second test pins the scope-shadowing that motivated the change.


        Those 123 attrs are deliberately **not** deleted here — each needs checking that the in-scope
        ctx is the session-scoped one, and getting it wrong silently mis-attributes a line.


        ### Validation deliberately not carried over


        `validation.ValidateSessionID` is gone from this path. Logging builds no paths from the session
        ID — it''s an slog attribute — so the traversal guard belongs where the ID is resolved from the
        filesystem, not at this call site. (`ValidateSessionID` remains in use at ~38 other sites.)


        Related gap found but **not** fixed here, since it wants a proper audit of `state.SessionID` consumers
        first: `session.StateStore.Load` validates the filename-derived ID but returns `state.SessionID`
        straight from `json.Unmarshal`, never reconciled with the filename and never re-validated, so
        `FindMostRecentSession` can return an arbitrary string.


        ### redact keeps its session stamp


        `redact` holds an injected `*slog.Logger` and calls it without a context (10 `logger.Warn` sites
        plus one `WarnContext`, which doesn''t help — the JSONHandler doesn''t read ctx). Those are the
        customer-facing redaction diagnostics this branch exists to route into `.entire/logs/`, and they''d
        lose `session_id` under a pure context value. `logging.SessionLoggerFromContext(ctx)`, wired into
        `strategy.EnsureRedactionConfigured`, stamps it for them.


        It stamps the **session only**, not every ctx attr. `redact` tags its own lines `component=redaction`,
        so re-adding `component` from the context would recreate the exact duplicate-key defect described
        above. No current caller of `EnsureRedactionConfigured` sets a component, so it wouldn''t fire
        today — but it would be a silent landmine for whoever adds a `WithComponent` upstream. Full decoration
        belongs with the follow-up that also deletes redact''s `componentAttr`.


        ### Net effect of losing process-wide stamping


        Exactly **9** sites log through a context that cannot descend from a stamped one (`logging.X(context.Background(),
        …)`): `recap/render_static.go` ×3, `explain.go` ×2, `copilotcli/transcript.go`, `codex/reviewer.go`,
        `opencode/opencode.go`, `review/tui_sink.go`. Eight are `Debug`, one is `Warn`, and every one
        names its own subsystem in the message — none does session-scoped work.


        Against that: in `explain` and `recap` the global could tag lines with the **wrong** session,
        since both routinely operate on a checkpoint from a session other than the ambient one. Trading
        a session tag on 9 diagnostic lines for the removal of a global that could assert a false session.


        ### Verification


        - `gofmt` clean; golangci-lint 2.11.3 clean (0 issues)

        - `mise run test:ci:core` — `-race` over every package, exit 0

        - `go test -tags integration ./cmd/entire/cli/integration_test/` — exit 0

