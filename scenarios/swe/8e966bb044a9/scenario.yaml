  - tool: Bash
    arguments:
      command: "cd /home/janfr/dev/pc-switcher\ngh issue create \\\n  --title \"Release tooling: honor\
        \ lightweight tags so standard \\`gh release create\\` produces the correct version\" \\\n  --label\
        \ \"type:task\" --label \"comp:dx\" \\\n  --body \"$(cat <<'EOF'\n## Problem\n\nInstalling pc-switcher\
        \ from a release tag only produces the correct version when the tag is **annotated**. A plain\
        \ `gh release create <tag>` creates a **lightweight** tag, which `uv-dynamic-versioning` (dunamai,\
        \ via `git describe`) ignores — it falls back to the nearest *annotated* tag and yields a wrong,\
        \ dev-suffixed version.\n\nThis makes the \"obvious\" standard release path (`gh release create`)\
        \ silently produce broken installs, and it matters for `install_on_target` (source and target\
        \ must resolve to the same version).\n\n## Evidence\n\nThrough the real `uv pip install git+…@<tag>`\
        \ path (fresh cache):\n\n- Annotated tag `v0.1.0-alpha.12` → `0.1.0-alpha.12` ✓\n- Lightweight\
        \ tag at commit X (with an annotated tag also present) → resolves to the *annotated* tag's version,\
        \ ignoring the lightweight one ✗\n- Branch ref `01-folder-sync` → `0.1.0-alpha.12+post.31.dev.0.<sha>`\
        \ (dev version)\n\nAll existing releases (`v0.1.0-alpha.6`..`v0.1.0-alpha.12`) are annotated tags.\n\
        \n## Current workaround\n\nCreate an **annotated** tag via the git data API (git tag push is blocked\
        \ by a tag-creation-restriction ruleset; `gh release create` makes lightweight tags), then create\
        \ the release with `--verify-tag`:\n\n```bash\nTAG_OBJ=$(gh api repos/<owner>/<repo>/git/tags\
        \ -f tag=<vX> -f message=\"<vX>\" -f object=<sha> -f type=commit --jq '.sha')\ngh api repos/<owner>/<repo>/git/refs\
        \ -f ref=refs/tags/<vX> -f sha=\"$TAG_OBJ\"\ngh release create <vX> --prerelease --verify-tag\
        \ ...\n```\n\n## Proposed fix\n\nMake the standard flow robust to lightweight tags, one of:\n\n\
        1. Configure `uv-dynamic-versioning`/dunamai to describe using **all** tags (honor lightweight\
        \ tags), so `gh release create` \"just works\"; **or**\n2. Provide a documented/automated release\
        \ command (script or `make release`) that always creates an **annotated** tag via the git data\
        \ API and the GitHub release together.\n\n## Related gotchas found\n\n- **Immutable releases**\
        \ are enabled: deleting a release with `--cleanup-tag` **burns the tag name** (cannot be recreated).\
        \ Do not delete/recreate release tags.\n- `uv`'s git cache can mask a newly created tag on a machine\
        \ that already cached the underlying commit (fresh machines are unaffected).\nEOF\n)\" 2>&1"
      description: Create honor-annotated-tags GitHub issue
  - tool: Write
    arguments:
      file_path: /home/janfr/.claude/projects/-home-janfr-dev-pc-switcher/memory/pcswitcher-release-annotated-tags.md
      content: "---\nname: pcswitcher-release-annotated-tags\ndescription: Cutting a pc-switcher release\
        \ requires an ANNOTATED tag via the git data API — lightweight tags produce wrong versions\nmetadata:\n\
        \  type: project\n---\n\nReleasing pc-switcher (for install / install-on-target to resolve the\
        \ correct version) requires an **annotated** git tag. `uv-dynamic-versioning` (dunamai via `git\
        \ describe`) **ignores lightweight tags** and falls back to the nearest annotated tag, yielding\
        \ a wrong dev-suffixed version (e.g. `0.1.0-alpha.12+post.31.dev.0.<sha>`).\n\n**Why:** the repo\
        \ has constraints that make the obvious paths fail:\n- Plain `gh release create <tag>` creates\
        \ a **lightweight** tag → wrong version.\n- Direct `git push` of a tag is **blocked by a tag-creation\
        \ ruleset** (\"creations being restricted\").\n- **Immutable releases** are on: deleting a release\
        \ with `--cleanup-tag` **burns the tag name** (cannot be reused — must bump to the next version).\n\
        \n**How to apply:** create the annotated tag via the GitHub git data API, then the release:\n\
        ```bash\nTAG_OBJ=$(gh api repos/flaksit/pc-switcher/git/tags -f tag=vX -f message=\"vX\" -f object=<sha>\
        \ -f type=commit --jq '.sha')\ngh api repos/flaksit/pc-switcher/git/refs -f ref=refs/tags/vX -f\
        \ sha=\"$TAG_OBJ\"\ngh release create vX --prerelease --verify-tag --title \"vX\" --notes \"...\"\
        \n```\nThen verify with a FRESH uv cache (`UV_CACHE_DIR=<tmp> uv pip install \"git+…@vX\"`), because\
        \ uv's git cache can mask a new tag on a machine that already cached the underlying commit (fresh/reset\
        \ machines are unaffected). Improvement tracked in issue #161 (make standard `gh release create`\
        \ work). Claude cuts the releases in this repo, not the user. Related: [[uat-give-instructions-not-execute]]."
