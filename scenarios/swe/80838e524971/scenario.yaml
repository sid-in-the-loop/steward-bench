        show_setup_menu() {\n  local options=\"  Audio\\n  Wifi\\n\U000F00AF  Bluetooth\\n\U000F140B \
        \ Power Profile\\n  System Sleep\\n\U000F02A2  Dotfiles\\n  Defaults\\n\U000F0C54  DNS\\n  Security\\\
