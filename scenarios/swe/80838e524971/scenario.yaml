        \ ;;\n  *Defaults*) show_setup_default_menu ;;\n  *DNS*) present_terminal omarchy-setup-dns ;;\n\
        \  *Security*) show_setup_security_menu ;;\n  *Config*) show_setup_config_menu ;;\n  *) show_main_menu\
        \ ;;\n  esac\n}"
