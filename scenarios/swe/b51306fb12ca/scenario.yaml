      file_path: /Users/shunkakinoki/dotfiles/scripts/sync-codex-security.sh
      content: "#!/usr/bin/env bash\n# sync-codex-security.sh — Sync deny patterns from Claude settings.json\n\
        # into the Codex security hook's hardcoded deny_patterns array.\nset -euo pipefail\n\nROOT=\"\
        $(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\nCLAUDE_SETTINGS=\"$ROOT/config/claude/settings.json\"\
        \nCODEX_SECURITY=\"$ROOT/config/codex/hooks/security.sh\"\n\n[[ -f $CLAUDE_SETTINGS ]] || {\n\
        \  echo \"ERROR: config/claude/settings.json not found\" >&2\n  exit 1\n}\n\n[[ -f $CODEX_SECURITY\
        \ ]] || {\n  echo \"ERROR: config/codex/hooks/security.sh not found\" >&2\n  exit 1\n}\n\n# Extract\
        \ Bash deny patterns and strip the Bash(...:*) wrapper\npatterns=$(jq -r '.permissions.deny[]'\
        \ \"$CLAUDE_SETTINGS\" \\\n  | grep '^Bash(' \\\n  | sed -E 's/^Bash\\((.+):\\*\\)$/\\1/' \\\n\
        \  | sort)\n\n# Build the new array block\nnew_block=\"deny_patterns=(\"\nwhile IFS= read -r pat;\
        \ do\n  new_block+=$'\\n'\"  \\\"$pat\\\"\"\ndone <<<\"$patterns\"\nnew_block+=$'\\n'\")\"\n\n\
        # Replace the existing deny_patterns block in-place\n# Match from 'deny_patterns=(' to the closing\
        \ ')'\ntmpfile=$(mktemp)\nawk -v new=\"$new_block\" '\n  /^deny_patterns=\\(/ { in_block=1; print\
        \ new; next }\n  in_block && /^\\)/ { in_block=0; next }\n  in_block { next }\n  { print }\n'\
        \ \"$CODEX_SECURITY\" >\"$tmpfile\"\n\nmv \"$tmpfile\" \"$CODEX_SECURITY\"\nchmod +x \"$CODEX_SECURITY\"\
        \n"
