        \ ]] || {\n  echo \"ERROR: config/codex/hooks/security.sh not found\" >&2\n  exit 1\n}\n\n# Extract\
        \ Bash deny patterns and strip the Bash(...:*) wrapper\npatterns=$(jq -r '.permissions.deny[]'\
        \ \"$CLAUDE_SETTINGS\" \\\n  | grep '^Bash(' \\\n  | sed -E 's/^Bash\\((.+):\\*\\)$/\\1/' \\\n\
