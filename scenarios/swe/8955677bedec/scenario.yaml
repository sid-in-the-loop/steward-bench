        requirements say" is one reading of the code that survived a refutation pass — treat it as a strong
        lead, not as proven; verify it yourself before you act on it, and say so in your report if it
        is wrong.


        1. **A14, A15 — apt offers to remove software it does not own.** `AptProbe.capture_source_items`
        drops packages whose installed version comes from no configured repository; `query_target_items`
        applies no equivalent filter, so a hand-`.deb` package diffs as a removal. `PKG-FR-DEB-OWNERSHIP`
        says `apt_sync` produces no item for such software in any configuration, whichever machine holds
        it. The fix is the same filter on the target side, which costs one batched `apt-cache policy`
        over Nomad''s manual set. Check whether the run already issues such a call for another purpose
        before adding one, and keep it to one call per machine (row A18 and A10 pin that economy for the
        source; hold the target to the same rule and add a row for it if none exists).


        2. **A62, A63 — a vendor build against a distribution build is never reported.** `origins.is_origin_mismatch`
        returns true only when both machines have a non-empty vendor origin set, so `gh` from `cli.github.com`
        against `gh` from the Ubuntu archive — the worked example in the user requirements — produces
        no item at all when the versions match. `PKG-FR-DISTRO-ORIGIN` makes the distribution ONE origin
        per machine, not no origin. Fix the comparison so a vendor-versus-distribution split is an origin
        divergence, while a mirror difference (A23/A61) still is not, and `PKG-FR-APT-ORIGIN-DIFF`''s
        precedence over a version difference still holds.


