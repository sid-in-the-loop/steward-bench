        # Your work: three rulings the user has made on open questions


        They sit in the "Questions the requirements do not settle" section of the coverage doc, each with
        an `A:` line holding the ruling. Implement each, then remove the settled question from that section.


        ## 1. Question "G79 — a registry on Nomad that cannot be parsed" (~line 1870)


        Ruling, verbatim: "G64 invented something that is not in the requirements: G64 adds ''or corrupt''
        and ''corrupt one warns''. Not good. **Corrupt file should abort the entire sync**, so the user
        can fix it and start a new sync. Update G64, G79. Update the gap listed below for G79."


        So: a snippet-registry file that cannot be parsed is not data and is not silence — it ends the
        run. An absent or empty file still reads as "no snippets" (that half of G64 is right). Change
        `SnippetRegistry.load` (in `src/pcswitcher/jobs/packages/state.py`) so a corrupt file aborts the
        run rather than degrading to an empty mapping with a warning, on whichever machine holds it. Use
        the abort mechanism the declined registry-overwrite already uses (see rows G73/G74 and `ManualInstallsSyncJob`)
        so the run ends rather than the job failing, and make the message name the file and say what the
        user must do. Check `PKG-FR-READ-FAILS-JOB` and `PKG-FR-REGISTRY-CONSENT` and add the obligation
        to whichever article should carry it — the criteria currently say nothing about an unparsable
        registry, so this needs an article edit, not just a row edit.

        Then update rows G64, G79 and G80 (Atlas''s own registry corrupt at transfer time — under this
        ruling it aborts too, so its current "approving sends the corrupt file" expectation is wrong),
        their tests, and the G79/G80 entries in the gaps register.


        ## 2. Question "J — a plan of nothing but report-only findings" (~line 1872)


        Ruling: modify `PKG-FR-NO-TERMINAL`:

        - "MUST treat every reviewable item as declined for this run" — "declined" is not vocabulary this
        project uses; the decision is **skip once**. Reword.

        - "reviewable item" and "non-empty review" must mean **an item where the user needs to make a
        decision**, not merely an item presented to the user. So a headless run whose review holds nothing
        but report-only findings has nothing to decide: that job reports success, not skipped.

        - The user does not understand what the trailing clause "it still transfers no registry" is doing
        in the article. It is there because a no-terminal run must send nothing even when its review was
        empty and the job succeeded (rows G82, J46). Keep that obligation but state it so a reader can
        see why it is there, or move it to the article that should own it.


        Implement the reworded article: change the code so a non-empty review consisting only of report-only
        findings no longer skips the job, and update the affected rows in J.4 (~line 1462) and anywhere
        else the "non-empty review ⇒ skipped" reading is asserted (J39, J47, `PKG-FR-OUTCOME-SKIPPED`''s
        reference to it, and the `docs/system` and `docs/jobs` prose). Add rows at the end of section
        J for any branch the amended article newly distinguishes, with tests.


        ## 3. Question "K23 — folder_sync''s exclusions depend on which package jobs are enabled" (~line
        1877)


        Ruling: `PKG-FR-JOB-INDEPENDENCE` binds package sync jobs only — the user has already narrowed
        the article''s wording in the working tree. The requirements never said `folder_sync`''s behaviour
        may not depend on a package job''s switch, so there is no conformance defect here.


        Resolve row K23 (~line 1674): it is currently marked `‼`. Restate it as what the amended article
        demands, mark it covered by the tests that already assert the gating (`unit/jobs/test_folder_sync:TestPackageJobExcludeFiltersGating::*`
        — make sure those tests name K23 in their docstring), and remove the question entry. Do NOT touch
        rows K81 and K82: they are separate defects against `PKG-FR-SNAP-DATA-BOUNDARY` that another agent
        is fixing.

        The user''s ruling also says "the code doesn''t [make folder_sync depend on package jobs either].
        See `_decision_file_exclude_filters()`." That function is unconditional, but `_package_job_exclude_filters`
        IS gated on the sibling job''s switch. Check both and say plainly in your report what the code
        actually does — do not write a row that claims the gating does not exist if it does.


        # Report back (terse)


        Files changed, row ids touched, article text you changed, the five verification results, and anything
        you could not settle.'
