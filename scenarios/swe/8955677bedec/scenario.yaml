        # Your work: the B41 ruling


        The coverage doc''s "Questions the requirements do not settle" section holds question **B41**
        — a hold added and its package removed in the same run, where the two approved answers contradict
        each other. The user has ruled:


        > Packages and blocks are presented together: the block is mentioned in the same question as the
        software it applies to, and the decision on the software is applied to the block as well.


        Scope, which the user has confirmed:

        1. **Only where both are items.** A block rides its software''s question only where that software
        is itself an item in the same run (an install, a removal, or a change). A block whose software
        produces no item in this run — the common case, a package both machines already have — stays its
        own item, decided on its own, exactly as today.

        2. **All three block kinds**, not just apt: an apt hold, a snap refresh hold and a flatpak mask
        alike. `PKG-FR-BLOCKS-REPLICATE` is the article that generalises this, with `PKG-FR-APT-HOLD-ITEM`,
        `PKG-FR-SNAP-HOLD` and `PKG-FR-FLATPAK-MASK` as the per-manager ones.


        ## What to do


        - Amend `PKG-FR-BLOCKS-REPLICATE`, `PKG-FR-APT-HOLD-ITEM`, `PKG-FR-SNAP-HOLD` and `PKG-FR-FLATPAK-MASK`
        so the exception is explicit and its boundary is unambiguous: the block is a separately decided
        item **except** where the software it applies to is itself an item this run, in which case the
        two are presented in one question and the software''s decision governs both. Give the amendment
        a *Why* line. Mirror the change in the user requirements'' apt/snap/flatpak narrative sections.

