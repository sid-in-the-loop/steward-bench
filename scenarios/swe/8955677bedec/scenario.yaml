        Rules you must not break:

        - A row states what an ARTICLE demands. Never derive a row from a test or from the code. A test
        is one implementation of a row; it may bundle rows and set up any way it likes.

        - Scenario ids are stable — tests cite them. NEVER renumber. Add new ids at the end of a section.
        Deleting a row that a ruling makes meaningless is allowed (delete its test too); leaving a hole
        in the numbering is fine.

        - Atlas is source, Nomad is target in sections A–K.

        - Update every affected doc, not just the matrix: user requirements, conformance criteria, `docs/system/package-sync.md`,
        `docs/jobs/package-sync.md`, and any ADR whose decision changes.

        - Executor writes require `mutates=` (see CLAUDE.md).

        - Verify with all five: `uv run pytest -q`, `uv run ruff format .`, `uv run ruff check .`, `uv
        run basedpyright`, `uv run codespell`. All must pass before you report.

        - Do NOT `git commit` and do NOT `git add`. Leave your work in the tree.

        - Other agents are editing the same two markdown files in OTHER sections concurrently. If an Edit
        fails because the file changed on disk, re-read and retry. Touch only what your brief names.


        # Your work: three rulings the user has made on open questions


        These are in the "Questions the requirements do not settle" section of the coverage doc, each
        with an `A:` line holding the user''s ruling. Implement the rulings: code, tests, articles and
        rows, and remove the question entry from that section once it is settled.


        ## 1. Question "E — whether a warning satisfies ''a run MUST name''" (coverage doc ~line 1864)


        Ruling: **Sideloaded snaps do not need to be searched/found nor named.** Update the user requirements
        doc, the conformance criteria, the code and any other doc.


        So: `PKG-FR-SNAP-SIDELOAD` keeps "ignored on both machines: never installed, never removed, never
        offered as an item, never the subject of a hold item" and LOSES the obligation to name what it
        found. The detection that withholds a sideloaded name from both manifests must stay (that is what
        keeps them out of every item); what goes is the warning/finding and any obligation to report it.
        Update: the article, the user-requirements "Sideloaded snaps" section (~line 231), `docs/system/package-sync.md`
        (~line 84), `docs/jobs/package-sync.md` (~line 262), `src/pcswitcher/jobs/snap_sync.py`, the E.6
        section intro and rows E38–E49 in the matrix, and the E41/E49 entries in the "Gaps — what to test
        next" register. Rows and tests that exist only to assert the warning (E41, E48, and the naming
        half of E38/E39/E46/E49) go away with it; rows asserting "no item, no command" stay and must keep
        their tests passing.


        ## 2. Question "F118 — the filter article''s unscoped clause" (~line 1866)


        Ruling: make `PKG-FR-FLATPAK-FILTER` more precise — "a remote the source does not restrict MUST
        NOT stay restricted on the target" applies **only to remotes needed by approved applications (or
        their dependencies)**.


        Rewrite that clause in the article. Then row F118 (matrix ~line 995, currently `‼`) states the
        narrow rule the code already implements: a remote both machines have that no approved application
        needs this run keeps whatever filter Nomad had. Write the unit test that proves it, cite it, and
        drop the `‼`. Also update the F118 entry in the gaps register and check row F117 and F103 still
        read correctly against the amended article.


        ## 3. Question "F121 — a third-scope application and the remote count" (~line 1868)


        Ruling: each flatpak installation (system-wide, or a given user''s per-user installation) keeps
        its own independent set of remotes, so a third-scope application can only ever name a third-scope
        remote — one the run never reads and never touches. The problem does not exist.


        Verify that claim against flatpak''s actual model before you write it down (per-installation `repo/config`;
        `flatpak remotes --user` / `--system` list only that installation''s remotes) and say in your
        report what you checked. Then resolve row F121 (~line 1003, currently `—`): restate its Expected
        as what the article demands given per-installation remotes, and either cite a test that proves
        the parser can never see a third-scope remote (F120 already asserts only the user and system installations
        are read — a new test may be redundant; if the row holds only by reading F119/F120 together, mark
        it `P` and add its id to `COMPOSITIONS` in the ratchet test with the composition stated in its
        Test column) — and update the F121 gap-register entry.


        # Report back (terse)


        Files changed, row ids touched, what you deleted and why, the five verification results, and anything
        you could not settle.'
