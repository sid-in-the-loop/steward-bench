        Two complementary guards:


        1. **Primary, portable guard** — `rejectOptionLike` refuses any SSH host, username, or port that
        begins with `-`. Such a value is never legitimate, and this matches git''s own CVE fix.

        2. **Defense in depth** — insert `--` before the destination so ssh stops parsing options at it
        even if a value somehow slips through. (Verified the local OpenSSH accepts `--`; it is universally
        supported.)


        The remote command path is unaffected — it is shell-quoted and passed as a single argument *after*
        the destination, so it cannot inject local ssh options.


        ## Tests


        - `TestSSHInvocationArgsRejectsOptionLikeDestination` — option-like host and username are rejected.

        - `TestSSHInvocationArgsTerminatesOptionsBeforeDestination` — `--` sits immediately before the
        destination.

        - Both ssh test shims (unit + syncer integration) were updated to consume the new `--`, so existing
        invocation assertions are unchanged. Full `go test ./...` passes.


        🤖 Generated with [Claude Code](https://claude.com/claude-code)

        EOF

        )" 2>&1 | tail -2'
