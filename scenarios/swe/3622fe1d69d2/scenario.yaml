      activeForm: Updating plugin/doc layer
  - tool: TaskCreate
    arguments:
      subject: 'Verify: Codex review + cargo build/test + rename sweep'
      description: Run cargo build + targeted tests, drill --help / add alias check, legacy-manifest resume
        regression, rg sweep for stray references, and a Codex review pass on the Rust diff.
      activeForm: Verifying the rename
  - tool: TaskUpdate
    arguments:
      taskId: '1'
      status: in_progress
      owner: design-keeper
  - tool: TaskUpdate
    arguments:
      taskId: '2'
      status: in_progress
      owner: flow-engineer
  - tool: Agent
    arguments:
      description: Record decision + update DESIGN.md
      subagent_type: design-keeper
      prompt: 'We are renaming derrick''s feature-pipeline command from `add` / `add-feature` / `/add-feature`
        to **`drill`**, consistently across the whole surface. The user approved this. Your job is the
        DESIGN.md layer only (the Rust code and plugin/doc files are handled by others — do NOT touch
        them).


        ## Rationale (use this in the decision entry)

        `derrick add` drives the entire dark-factory pipeline (spec → clarify → assay → plan → tasks →
        batch → foreman dispatch → implementation). `add` is the verb of passive list-appending (git add,
        npm add) — it framed derrick as a backlog/queue tool rather than the build/execution engine it
        is. `drill` is the verb the oil-derrick metaphor implies (a derrick drills the well) and fits
        the existing vocabulary (site/foreman/hand/dispatch). Applied consistently: `derrick drill "<prompt>"`,
        `derrick run drill`, `/drill`.


        ## Naming map

        - `derrick add "<prompt>"` → `derrick drill "<prompt>"`

        - `derrick run add-feature` → `derrick run drill`

        - `/add-feature` (slash command + skill) → `/drill`

        - persisted `pipeline_id` string `"add-feature"` → `"drill"`, BUT the runner will still accept
        `"add-feature"` as a deprecated alias so existing run manifests stay resumable.

        - `add` stays as a hidden, deprecated CLI alias on `drill`.


        ## Tasks

        1. **Record a new decision** in DESIGN.md §12 (next free D-number, e.g. D58) capturing: the rename
        `add`→`drill`, the consistent application across CLI/run-subcommand/slash-command/pipeline_id,
        and the dual backward-compat aliases (runner accepts legacy `"add-feature"` pipeline_id; hidden
        `add` CLI alias). Reference the affected sections. This decision SUPERSEDES the command naming
        in D46 and D50 — note that explicitly rather than contradicting them.

        2. **Update D46 and D50 wording** so they read `derrick drill` instead of `derrick add` (the behaviours
        they describe — prompt_key auto-resume, init initial commit for worktrees — are unchanged), with
        a pointer to the new decision.

        3. **Update §5.3** — the section heading (`### 5.3 \`derrick add\` — the feature pipeline`) and
        body, including the `derrick add "..."` examples, the `/add-feature ...` example, and the "resolves
        to `derrick run add-feature --prompt`" / `--resume-from` lines.

        4. **Update the overview/intro one-liners** in §1/§2 and any pipeline diagram/labels that say
        `/add-feature` or `derrick add` (around lines 8, 30, 56, 85, 90, 137, 217, 309, 428, 446–452,
        681, 742, 865–874, 1069, 1078, 1201, 1266, 1801, 1885–1897, 1914, 1935, 1960).

        5. **Vocabulary section (§8.-1)**: note `drill` as the verb for kicking off the feature pipeline
        (it is not one of the core nouns, but record it so it isn''t mistaken for a gastown word later).


        Leave genuine English uses of "add"/"adds" (e.g. "derrick adds the PR URL to the ticket") intact
        — only rename the command references. Keep the `add-feature` string where it documents the *legacy/deprecated*
        alias (call it out as deprecated).


        Report exactly which D-number you assigned and a summary of the sections you changed.'
  - tool: Agent
    arguments:
      description: Rename add→drill across Rust crates
      subagent_type: flow-engineer
      prompt: 'Implement a consistent rename of derrick''s feature-pipeline command from `add` / `add-feature`
        to **`drill`** across the Rust workspace. The user approved this plan. Scope is the Rust code
        + its tests + the adopt template strings ONLY. Do NOT edit DESIGN.md, README.md, AGENTS.md, .claude/
        files, marketplace.json, or templates/.vscode/ — those are handled separately.


        This is a cross-crate change touching public command surface and a serialized identifier — keep
        the trait/enum shapes clean and consult the rust-architect mindset for the enum consolidation.
        Use `tracing` (no println) per house rules; tests use real SQLite/tempfile, not mocks.


        ## Naming map

        - Top-level CLI: `Command::Add(AddArgs)` → `Command::Drill(DrillArgs)`; module `crates/derrick-cli/src/commands/add.rs`
        → rename to `drill.rs`; dispatcher arm in `crates/derrick-cli/src/lib.rs`.

        - Run subcommand: `RunCommand::AddFeature(AddFeatureArgs)` → `RunCommand::Drill(DrillArgs)`. Consolidate
        so the shorthand and run-subcommand share one `DrillArgs` struct if that''s how it''s currently
        shaped (today `AddArgs` converts into `AddFeatureArgs`) — keep the conversion working, just renamed.
        CLI invocation becomes `derrick run drill`.

        - Help/about/doc strings: `derrick add` → `derrick drill`, `run add-feature` → `run drill`, `/add-feature`
        → `/drill`.

        - `crates/derrick-cli/src/commands/run.rs`: `run_pipeline("add-feature")` / `run_pipeline_as_restart("add-feature",
        ...)` → `"drill"`; error message "derrick run add-feature requires tools.substrate.backend: native"
        → "derrick run drill requires ...".

        - `crates/derrick-cli/src/commands/init.rs`: wizard prompt/help/error strings referencing `derrick
        add` (~lines 339, 912, 918, 927, 951, 979, 981, 996, 998) → `derrick drill`.

        - `crates/derrick-flow/src/runner.rs`: `const ADD_FEATURE_PIPELINE: &str = "add-feature"` → introduce
        `const DRILL_PIPELINE: &str = "drill"` and a `const LEGACY_DRILL_PIPELINE: &str = "add-feature"`.
        The pipeline matcher must accept BOTH (drill OR legacy add-feature) so existing `.derrick/runs/*/manifest.json`
        with `pipeline_id:"add-feature"` still resume. New runs must persist `pipeline_id:"drill"`. Comment
        the legacy arm `// deprecated alias: pre-rename manifests`.

        - `crates/derrick-flow/src/manifest.rs`, `progress.rs`, `lib.rs`: rename test helpers (`add_feature_pipeline`,
        `add_feature_pipeline_with_dispatch`, `add_feature_pipeline_bridge_only`, the `ADD_FEATURE_PIPELINE`
        test const) to `drill_*` / `DRILL_PIPELINE`, and the manifest doc comment ("so `derrick add` can
        auto-resume" → drill). Update the ~20 call sites.

        - `crates/derrick-adopt/src/lib.rs`: `COMMAND_NAMES` entry `"add-feature.md"` → `"drill.md"`;
        template generator: the `/add-feature` command body → `# /drill\n\nRun \`derrick run drill --prompt
        "$ARGUMENTS"\`.\n`; the derrick-resume template body → `derrick run drill --resume-from`. Update
        path-assertion tests (lines ~1969, 2124) to expect `drill.md`.

        - `crates/derrick-config/src/lib.rs` (~1032) and `crates/derrick-assay/src/types.rs` (~92): doc
        comments `/add-feature` → `/drill`.


        ## Backward-compat REQUIREMENTS

        1. **Hidden deprecated CLI alias:** `drill` must still be invocable as `add`. Use clap `#[command(alias
        = "add")]` (a hidden alias — NOT `visible_alias`, so `--help` shows only `drill`). When invoked
        via the `add` alias, print a one-line deprecation note to stderr via `tracing`/eprintln-equivalent
        used elsewhere in the CLI (match how the CLI emits user-facing notes — check existing patterns;
        do not introduce raw println in non-CLI crates, but the CLI bin may use its established UI/eprintln
        path). Detecting alias use: check `std::env::args` for the `add` token, or use clap''s matched-subcommand
        name if available.

        2. **Runner dual-accept** of pipeline_id as described above.


        ## Tests

        - Rename affected test fns: `run_add_feature_smoke_writes_real_artifacts` → `run_drill_smoke_writes_real_artifacts`
        (and update its arg array `["run","add-feature",...]` → `["run","drill",...]`) in `crates/derrick-cli/tests/cli.rs`;
        `add_feature_happy_path_writes_all_artifacts` → `drill_happy_path_writes_all_artifacts`; `missing_prompt_for_add_feature_errors`
        → `missing_prompt_for_drill_errors`; `add_args_*` → `drill_args_*` in the renamed drill.rs.

        - **Add a regression test** (in derrick-flow) that builds/loads a run manifest with `pipeline_id:
        "add-feature"` and asserts the runner still resolves and resumes it (legacy alias). And assert
        a fresh run writes `pipeline_id: "drill"`.


        ## Done criteria

        - `cargo build` and `cargo test -p derrick-cli -p derrick-flow -p derrick-adopt` pass.

        - `cargo run -- drill --help` works; `cargo run -- add --help` resolves via the hidden alias.

        - `rg -n "add-feature|Command::Add|AddArgs|AddFeature|ADD_FEATURE" crates/` returns only the intentional
        legacy-alias sites (runner legacy const + the hidden `add` clap alias + the regression test).


        Report the files you changed, how you implemented the hidden alias + deprecation note, and the
        cargo test result. Do NOT git commit.'
