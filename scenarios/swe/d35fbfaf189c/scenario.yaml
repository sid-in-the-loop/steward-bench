    arguments:
      description: Sandcastle controller/view code audit
      subagent_type: Explore
      prompt: "Do a code-review pass on the Sandcastle Rails app at /persisted/Projects/Sandcastle. I'm\
        \ running a full audit looking for bugs — only flag REAL bugs, not style nits. Do NOT edit code;\
        \ just report. Report concisely with file:line references, one bullet per issue.\n\nFocus areas:\n\
        \n1. **app/controllers/** — look for:\n   - Missing `require_admin!` / `require_authentication`\
        \ on protected actions\n   - `params[...]` use where strong params expected\n   - ActiveRecord::RecordNotFound\
        \ / ServiceName::Error not rescued\n   - Redirects that leak authorization (e.g. `Sandbox.find(params[:id])`\
        \ returning another user's record without scoping to current_user)\n   - Controllers referencing\
        \ nonexistent partials or routes\n   - `format.turbo_stream` branches that reference templates\
        \ that don't exist\n\n2. **app/views/** — look for:\n   - `dom_id(sandbox)` vs custom ids like\
        \ `-archived` / `-card` mismatches against Turbo Stream targets in broadcasts (already found one\
        \ such bug in Sandbox#broadcast_replace_to_dashboard which is now fixed — find any SIMILAR issues\
        \ in other models/broadcasts)\n   - Links to routes that no longer exist (check against config/routes.rb)\n\
        \   - ERB that accesses methods the model doesn't have (e.g. sandbox.some_attr where the column\
        \ was renamed)\n\n3. **app/models/** — look for:\n   - after_commit broadcasts with stale dom_ids\
        \ (see above)\n   - `finish_job` / `fail_job` not being called on all code paths in jobs\n\n4.\
        \ **app/jobs/** — look for:\n   - Exceptions not caught leaving sandbox in job_in_progress? state\
        \ forever\n   - Jobs that don't call `sandbox.finish_job` on early return\n\n5. **app/services/**\
        \ — look for:\n   - `SandboxManager`, `TerminalManager`, `TailscaleManager`, `SystemStatus`, `BtrfsHelper`,\
        \ `NetworkManager`: any places where Docker/system errors aren't wrapped in `Error` subclass.\n\
        \   - Command-injection risks (string interpolation into shell commands).\n\nRules: Only report\
        \ things that look like **genuine bugs** — missing auth, broken routes, missing methods, stale\
        \ dom_ids, stuck job state, etc. Do not report style preferences, testing coverage, or \"could\
        \ be refactored\". Don't invent issues.\n\nFormat: one section per focus area, each issue one\
        \ bullet with `path/to/file.rb:N — short description`. Target total response under 600 words."
