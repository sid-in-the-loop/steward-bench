        \   broadcast_remove_to([ user, \"dashboard\" ], target: dom_id(self))\n  rescue => e\n    Rails.logger.warn(\"\
        Sandbox#broadcast_remove: #{e.message}\")\n  end"
      new_string: "  def broadcast_replace_to_dashboard\n    # If sandbox is destroyed or archived, remove\
        \ it from whichever list it\n    # was in. The active partial uses dom_id \"sandbox_N\"; the archived\n\
        \    # partial uses \"sandbox_N-archived\". We don't know which one the row\n    # was rendered\
        \ as, so we target both — missing targets are no-ops.\n    if status.in?(%w[destroyed archived])\n\
        \      broadcast_remove_to([ user, \"dashboard\" ], target: dom_id(self))\n      broadcast_remove_to([\
        \ user, \"dashboard\" ], target: \"#{dom_id(self)}-archived\")\n    else\n      broadcast_replace_to(\n\
