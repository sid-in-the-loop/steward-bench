        \ sandbox: self },\n        target: dom_id(self)\n      )\n    end\n  rescue => e\n    Rails.logger.warn(\"\
        Sandbox#broadcast_replace: #{e.message}\")\n  end\n\n  def broadcast_remove_from_dashboard\n \
        \   broadcast_remove_to([ user, \"dashboard\" ], target: dom_id(self))\n    broadcast_remove_to([\
        \ user, \"dashboard\" ], target: \"#{dom_id(self)}-archived\")\n  rescue => e\n    Rails.logger.warn(\"\
        Sandbox#broadcast_remove: #{e.message}\")\n  end"
