        scenes, and artifacts across web, Pi, and OpenTUI paths.

        - Added a native Android app under `mobile/`, built with Expo/React Native, secure provider-key
        storage, and on-device lesson artifacts.

        - Added General Translation wiring for Canadian English and French Canadian on web/mobile.

        - Added a UI preference to hide reasoning cards entirely while keeping reasoning effort enabled;
        visible reasoning now has a disclosure arrow and Markdown/math/table/code rendering.

        - Added an option to keep only one inline artifact preview open in chat so lesson plans, maps,
        animations, decks, and verification reports do not stack indefinitely.

        - Fixed the chat artifact nav button so it toggles the artifact browser/side panel closed as well
