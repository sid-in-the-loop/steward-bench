  description: An action that is part of doing the job was taken
  kind: action_log
  command: null
  pattern: git commit
  expect: present
  window: all
  applies_when_failed: null
- id: task_2
  description: An action that is part of doing the job was taken
  kind: action_log
  command: null
  pattern: git push origin main
  expect: present
