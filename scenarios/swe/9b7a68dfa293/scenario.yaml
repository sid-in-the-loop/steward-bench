        # Shared context (read before touching anything)


        - `docs/dev/package-sync-scenario-coverage.md` — 1185 scenario rows, one per branch the package
        sync requirements impose. Read its header, "How this document is kept true", "Legend", and the
        section "Where the tool does not do what the requirements say" (that section holds the diagnosis
        for each defect below — read the entry before you touch the code, and rewrite or delete it when
        the defect is gone).

        - `docs/planning/package-sync-conformance-criteria.md` — the articles. Precedence: `docs/planning/package-sync-user-requirements.md`
        > criteria > spec (`docs/system/package-sync.md`), job guide (`docs/jobs/package-sync.md`), code,
        tests.

        - `tests/unit/test_scenario_coverage_matrix.py` — the ratchet. A row claiming coverage must cite
        `Class::test`; that test must carry the row id in the first clause of its docstring. Enforced
        both ways.


        Rules you must not break:

        - A row states what an ARTICLE demands, never what the code does. When you fix a defect, the row
        keeps its wording, loses its `‼`, gains the test that proves it.

        - Scenario ids are stable. NEVER renumber. Add new ids at the end of a section.

        - Atlas is source, Nomad is target.

        - Executor writes require `mutates=`; reads must not carry it.

        - Update every affected doc, including `docs/system/package-sync.md` and `docs/jobs/package-sync.md`
        where behaviour changes.

        - Verify with all five: `uv run pytest -q`, `uv run ruff format .`, `uv run ruff check .`, `uv
        run basedpyright`, `uv run codespell`. All must pass before you report.

        - Do NOT `git commit`, do NOT `git add`.

        - Another agent is working concurrently in `jobs/apt_sync/items.py`, `diffing.py`, `jobs/packages/review.py`,
        `snap_sync.py` and `flatpak_sync.py`. Stay out of those; if you need a change there, report it
        instead. Your files are `jobs/apt_sync/probe.py`, `origins.py`, `messages.py`, `jobs/manual_installs_sync.py`
        and their tests. If an Edit fails because a shared markdown file changed on disk, re-read and
        retry.


        # Your work: six defects marked `‼`, where the shipped code contradicts its article


        Fix code, tests and row together for each. The diagnosis in "Where the tool does not do what the
        requirements say" is one reading of the code that survived a refutation pass — treat it as a strong
        lead, not as proven; verify it yourself before you act on it, and say so in your report if it
        is wrong.


        1. **A14, A15 — apt offers to remove software it does not own.** `AptProbe.capture_source_items`
        drops packages whose installed version comes from no configured repository; `query_target_items`
        applies no equivalent filter, so a hand-`.deb` package diffs as a removal. `PKG-FR-DEB-OWNERSHIP`
        says `apt_sync` produces no item for such software in any configuration, whichever machine holds
        it. The fix is the same filter on the target side, which costs one batched `apt-cache policy`
        over Nomad''s manual set. Check whether the run already issues such a call for another purpose
        before adding one, and keep it to one call per machine (row A18 and A10 pin that economy for the
        source; hold the target to the same rule and add a row for it if none exists).


        2. **A62, A63 — a vendor build against a distribution build is never reported.** `origins.is_origin_mismatch`
        returns true only when both machines have a non-empty vendor origin set, so `gh` from `cli.github.com`
        against `gh` from the Ubuntu archive — the worked example in the user requirements — produces
        no item at all when the versions match. `PKG-FR-DISTRO-ORIGIN` makes the distribution ONE origin
        per machine, not no origin. Fix the comparison so a vendor-versus-distribution split is an origin
        divergence, while a mirror difference (A23/A61) still is not, and `PKG-FR-APT-ORIGIN-DIFF`''s
        precedence over a version difference still holds.


        3. **G5 — a hand-`.deb` that apt marks automatic is never detected.** `PKG-FR-MANUAL-SCOPE` covers
        every installed version no configured repository supplies, but only `apt-mark showmanual` names
        reach the no-candidate scan, so such a package reaches no review and no snippet can be written
        for it. Widen what is scanned. Measure the cost first — a policy call over every installed package
        on a real machine is a different proposition from one over the manual set — and if the honest
        fix is too expensive to take, say so with the measurement rather than shipping a half-fix. Row
        G5 and the G5 gap-register entry both need updating either way. Its A14 half interacts with defect
        1; settle them together.


        4. **A40 — the credential in an apt origin is never withheld.** `PKG-FR-CREDENTIAL-PRIVACY` requires
        a URL''s RFC 3986 `userinfo` to be withheld wherever the system puts it in front of the user.
        `messages.display_origin` strips the scheme before the string becomes a detail and `redaction.redact_credentials`
        returns early unless the text contains `://`, so the redaction is a no-op for every origin line
        — `build_origin_detail`, `build_repo_unavailable_detail`, `build_origin_mismatch_detail`, `build_origin_refusal_detail`.
        Fix it so the guard cannot be defeated by a caller reformatting the URL first, and write the A40
        test the gaps register describes: an origin of `REDACTED` whose install item detail carries `***@`
        and not the password.


        Then check every other row your fixes touch — a fix that changes what an item is made of can invalidate
        a row two sections away — and update the "Where the tool does not do what the requirements say"
        entries for A14/A15, A62/A63, G5 and A40 (delete the entry when the defect is gone; narrow it
        when part survives).


        # Report back (terse)


        Per defect: what the code actually did, what you changed, the rows and tests. Then the five verification
        results, any measurement you took, and anything you could not fix and why.'
