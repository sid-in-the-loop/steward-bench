      content: '## What


        Bumps the transitive dependency `event-listener` from `5.4.1` to `5.4.2` in `Cargo.lock`. Lockfile-only
        — no manifest or source changes.


        ## Why


        The PR-time `audit` job (`cargo audit --deny warnings`) currently fails on **every** open pull
        request:


        ```

        error: 1 denied warning found!

        Crate:    event-listener

        Version:  5.4.1

        Warning:  unsound

        Title:    `event-listener` allows `!Send` tags to cross thread boundaries via `StackSlot`

        ID:       RUSTSEC-2026-0221

        ```


        `main` carries the same finding — its `Cargo.lock` pins `event-listener 5.4.1`, and `cargo audit
        --deny warnings` reproduces the failure on a clean checkout of `61c8f5c`.


        The daily `scheduled-audit` job stayed green throughout because the two jobs use different tools
        with different severity semantics (an intentional split, per `CLAUDE.md`):


        | Job | Tool | Behaviour on an `unsound` advisory |

        |---|---|---|

        | `audit` (PR / push) | `cargo audit --deny warnings` | **fails the run** |

        | `scheduled-audit` (daily) | `rustsec/audit-check@v2` | files an issue, **exits 0** |


        So the finding surfaced only as auto-filed issue #161 (2026-08-01) while the daily gate kept reporting
        success.


        ## The fix


        `event-listener 5.4.2` is the patched release — the advisory declares `patched = [">= 5.4.2"]`.
        It reaches the graph transitively via `sqlx-core 0.9.0` and `async-lock 3.4.2` / `redis 1.4.1`,
        so no manifest pin is involved. The bump also drops `concurrent-queue`, which 5.4.2 no longer
        needs.


        Verified locally: `cargo audit --deny warnings` exits 0 after the bump.


        ## Impact


        Unblocks the `audit` gate on the open Dependabot PRs (#158, #162, #163, #165) and on any future
        PR.


        Closes #161


        🤖 Generated with [Claude Code](https://claude.com/claude-code)

        '
