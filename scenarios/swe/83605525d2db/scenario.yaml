        the argv it invoked into the message verbatim, and a Git pathname may hold any byte except NUL
        and ''/''. An ESC (0x1b) or a C1 CSI (U+009B) reaching the terminal is obeyed rather than displayed
        (escape sequence injection, CWE-150), and an LF forges an extra line of tool output (log injection,
        CWE-117). This left cmd/entire-graph/main.go as the only unguarded error sink after PR #96 routed
        every other renderer through termsafe.


        Solution: Escape by value at the sink with termsafe.Line(err.Error()). By value rather than by
        wrapping os.Stderr, for two independent reasons: stderr also carries the index progress bar''s
        real cursor control (internal/cli/progressbar.go writes "\r...\033[K"), which a writer wrap could
        not tell apart from an injected sequence; and termsafe.Writer keeps LF as layout, which is precisely
        the byte a one-line error report must not let a repository forge. Only Line (escapeLayout) closes
        CWE-117 here. The change mirrors the by-value escaping already applied in internal/cli/root.go
        (diffProgressLine). For errors with no control bytes termsafe.Line returns the input unchanged,
        so ordinary output is byte-identical (verified by md5 against a build of main); exit codes are
        unchanged.


        Accepted trade-off: Line escapes LF and TAB, so a legitimately multi-line Git diagnostic would
        print on one line with its breaks shown as \x0a. No such diagnostic is reachable through this
        sink today — every revision resolves through `git rev-parse --verify --end-of-options`, whose
        failures are one terse line — but Git''s stderr is folded in verbatim, so a multi-line one is
        a Git version away. Documented in main.go.


