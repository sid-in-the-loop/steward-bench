        \ as control sequences\") routed every\nhuman-readable renderer through `internal/termsafe`. It\
        \ left one sink un-escaped: the error that\nends a failed run.\n\n`cmd/entire-graph/main.go`:\n\
        \n```go\nif err := cli.Execute(version, os.Args[1:]); err != nil {\n    fmt.Fprintln(os.Stderr,\
        \ err)   // raw\n    os.Exit(1)\n}\n```\n\nError text is not tool-authored. `gitutil`'s `run`\
        \ (`internal/gitutil/git.go`) folds **both** git's\nown stderr **and** the argv it invoked into\
        \ the message verbatim:\n\n```go\nreturn \"\", fmt.Errorf(\"%s %s: %s\", name, strings.Join(args,\
        \ \" \"), msg)\n```\n\nNeither is a byte string this tool chose, and a Git pathname may hold **any\
        \ byte but NUL and `/`**.\nSo the bytes of the one string that reaches the reader's terminal unfiltered\
        \ are decided elsewhere,\none call away from `main()`:\n\n- **ESC (0x1b)** and **C1 CSI (U+009B)**\
        \ are sequence introducers a terminal *obeys* instead of\n  displaying: recolour, reposition,\
        \ hide, overwrite (CWE-150).\n- **LF** forges an extra line of tool output, so a value can append\
        \ a line the tool never\n  reported (CWE-117).\n\n## The exploit\n\nReproduction against `main`\
        \ at `03fb795`, in any repository with two commits:\n\n```console\n$ HOSTILE=$(printf 'zzzpay\\\
        033[31mred\\302\\2330m\\nAll checks passed')\n$ entire-graph diff --repo \"$REPO\" --base HEAD~1\
        \ --head \"$HOSTILE\" 2>&1 >/dev/null | od -c\n...  z z z p a y 033 [ 3 1 m r e d 302 233 0 m\
        \  \\n  A l l   c h e c k s   p a s s e d ...\n```\n\nThe raw `033` (ESC), `302 233` (U+009B)\
        \ and `\\n` are intact on stderr: the terminal recolours, and\nthe report splits into three lines,\
        \ two of which the tool never wrote.\n\nNote the asymmetry inside that one message. It carries\
        \ the revision **twice** — once `%q`-quoted by\nthe `resolve diff head %q` wrapper (safe), and\
        \ once raw through `run`'s argv echo (unsafe). Only the\nfatal-error sink was unprotected.\n\n\
        On this branch:\n\n```console\n...  z z z p a y \\ x 1 b [ 3 1 m r e d \\ u 0 0 9 b 0 m \\ x 0\
        \ a A l l   c h e c k s ...\n```\n\n## The fix\n\nOne line in `cmd/entire-graph/main.go`, escaping\
        \ **by value**:\n\n```go\nfmt.Fprintln(os.Stderr, termsafe.Line(err.Error()))\n```\n\n**Why not\
        \ wrap the writer.** Two independent reasons, both checked against source:\n\n1. stderr also carries\
        \ the progress bar's *real* cursor control: `internal/cli/progressbar.go`\n   writes `fmt.Fprintf(b.w,\
        \ \"\\r%s\\033[K\", line)` and `fmt.Fprint(b.w, \"\\r\\033[K\")`, with\n   `internal/cli/index.go`\
        \ wiring that bar to stderr. A `termsafe.Writer` around `os.Stderr` would\n   render the progress\
        \ bar as literal escape text, because by the time bytes reach a writer it\n   cannot tell the\
        \ tool's own cursor control from an injected one.\n2. `Writer` keeps LF as layout (`keepLayout`),\
        \ which is exactly the byte a one-line error report\n   must not let a repository forge. Only\
        \ `Line` (`escapeLayout`) closes CWE-117 here.\n\nThis also closes an asymmetry inside `root.go`\
        \ itself: `diffProgressLine` already does\n`line += \" file=\" + termsafe.Line(event.Path)` with\
        \ a comment that the path \"may hold any byte but\nNUL and `/`\", while the `return err` two lines\
        \ earlier sent the same class of byte raw up to\n`main()`. `termsafe.Line` is that same by-value\
        \ treatment applied at the end of the path.\n\n## Why it cannot regress existing behaviour\n\n\
        - `termsafe.Line` returns **the input string itself** when nothing needs escaping, so every\n\
        \  control-free error is byte-identical to before — verified by md5 against a build of `main`.\
        \ Exit\n  code, stream and trailing newline are unchanged (1 on failure, 0 on success, verified).\n\
        - Only the fatal-error sink changed. stdout, the JSON/NDJSON streams (deliberately unwrapped;\n\
        \  `encoding/json` already escapes controls) and the progress bar's cursor control are untouched.\n\
        - No schema change (frozen 1.x, additive-only), no new dependency, no network, no docs affected:\n\
        \  `termsafe` is an existing internal package.\n\n**One disclosed trade-off.** `Line` escapes\
        \ LF and TAB, so a git diagnostic that is legitimately\nseveral lines would print on one line\
        \ with its breaks shown as `\\x0a`. No such diagnostic is\nreachable through this sink today —\
        \ every revision this tool resolves goes through\n`git rev-parse --verify --end-of-options`, whose\
        \ failures are one terse line — but git's stderr is\nfolded into these errors verbatim, so a multi-line\
        \ one is a git version away. The collapse is\ndeliberate and unavoidable at this sink: once a\
        \ hint's newline and an injected one are both bytes\ninside one error string, nothing here can\
        \ tell them apart. It is documented in the code.\n\n## The test\n\n`cmd/entire-graph/main_test.go`\
        \ (new). `main()` ends in `os.Exit`, so it cannot be called\nin-process; `TestMain` re-execs the\
        \ **test binary itself** as the real entry point (guarded by\n`ENTIRE_GRAPH_TEST_RUN_MAIN`). That\
        \ exercises the real `fmt.Fprintln` to the real `os.Stderr` with\nno separate build step, which\
        \ matters because the tree-sitter grammars make building this command\nexpensive.\n\n`TestFatalErrorEscapesTerminalControlBytes`\
        \ builds a two-commit repository, runs `diff` against a\nhostile `--head` revision, and asserts\
        \ the **security property** — no raw ESC, no raw U+009B in\neither spelling, and exactly one line\
        \ — after first checking the hostile bytes actually reached\nstderr, so it cannot pass vacuously.\n\
        \n**It asserts the property, not the escaped spelling**, deliberately. See the timeline below\
        \ for why\nthe original spelling assertions had to go.\n\n**Failing-first, proven** against an\
        \ unmodified `git checkout main -- cmd/entire-graph/main.go`:\n\n```\n--- FAIL: TestFatalErrorEscapesTerminalControlBytes\
        \ (0.21s)\n    main_test.go:81: raw ESC reached the terminal: \"...zzzpay<ESC>[31mred<CSI>0m<LF>All\
        \ checks passed...\"\n    main_test.go:87: raw C1 CSI (U+009B) reached the terminal: \"...\"\n\
        \    main_test.go:90: raw C1 CSI byte (0x9b) reached the terminal: \"...\"\n    main_test.go:93:\
        \ the error report spans 3 lines, so a revision forged output lines: \"...\"\nFAIL\n```\n\nAll\
        \ four assertions fail before the change and pass after it.\n\n## Timeline\n\nThis branch is append-only;\
        \ no commit has been rewritten, so every state below is still reachable.\n\n| Commit | What |\n\
        |---|---|\n| `60aa6dc` | Original fix + regression test, against base `11d001d`. |\n| `8561997`,\
        \ `e8ac679` | Author's merges of `main`. CI was green here — but against a base that was, by review\
        \ time, 163 commits stale. |\n| `52ebb7f` | Merge of `main` at `03fb795`. Clean, no conflicts.\
        \ |\n| `8315e1f` | Review fixes to the test (below). |\n\n**What review found at `e8ac679`.**\
        \ The fix was correct and the vulnerability reproduced, but the\nregression test could not pass\
        \ once merged with current `main`, and had stopped discriminating the\nfix from its absence. Two\
        \ changes landed after this branch's base:\n\n- `internal/sem/provider.go` (from `d260c8e`) now\
        \ rejects an unsafe `--repo` *before* any git\n  subprocess and formats the path with `%q`. The\
        \ test's reproduction — a nonexistent `--repo` —\n  therefore no longer reached the unescaped\
        \ sink at all.\n- Every revision now resolves through `git rev-parse --verify --end-of-options`.\n\
        \n`%q` already spells ESC and the C1 CSI the way termsafe does, but spells LF as `\\n` rather\
        \ than\n`\\x0a`, so exactly one assertion failed while the property it meant to check still held.\
        \ Reverting\n`main.go` on current `main` produced the **identical single failure** — the test\
        \ had no\ndiscriminating power left.\n\n**What `8315e1f` changes.** Repoint the test at a sink\
        \ that is still unescaped (a hostile `--head`\nrevision, reaching `run`'s verbatim argv echo),\
        \ and assert the property rather than the literal.\nThe spelling was never the right anchor: the\
        \ message carries a `%q`-quoted copy of the revision as\nwell as a raw one, so an escaped ESC\
        \ is present whether or not this sink escapes anything — and it\nis brittle against exactly the\
        \ change that should leave this test alone. Also covers a stray `0x9b`\nbyte, which the previous\
        \ `ContainsRune` check missed, and documents the `Line`-vs-`Writer` choice\nand the multi-line\
        \ trade-off in `main.go`.\n\n## Gate\n\nRun at `8315e1f`, on darwin/amd64, go1.26.5. Tree is byte-identical\
        \ to the fully verified tree\n(`5488821`).\n\n```\ngofmt -s -l .                             \
        \                (no output)\ngo vet ./...                                              exit 0\n\
        go build ./...                                            exit 0\ngo test ./cmd/entire-graph/\
        \ -count=1                      ok\ngo test ./cmd/entire-graph/ -run TestFatalError -count=20\
        \ ok   (not flaky)\ngo test ./internal/cli/ ./internal/termsafe/ -count=1     ok\ngo test -race\
        \ ./...                                       ok  (all 8 packages)\nsh scripts/entire-graph-statusline_test.sh\
        \                151 passed, 0 failed\n```\n\nNot independently validated: Windows and Linux were\
        \ not verified natively (no skips or build tags,\nso the test runs on all platforms — CI covers\
        \ this).\n\nRe-opens the gap left by #96.\n\n> **Merge-order note.** #142 rewrites this exact\
        \ statement and keeps it raw, so the two conflict\n> directly in `cmd/entire-graph/main.go`. Landing\
        \ this PR first means its test guards #142's rebase;\n> landing #142 first risks a conflict resolution\
        \ that silently drops the escaping.\n"
