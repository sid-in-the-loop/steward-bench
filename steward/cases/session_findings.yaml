# The written analysis of the session experiments. Counts are not typed here: {figure:m:c}
# is filled with the count of model m (0, 1, 2 in the page's order) in category c of that
# figure, and {%figure:m:c} with the share. Revise the wording when the results move.
written_at_sessions: 664
scope: >-
  Written when seven of the fifteen cases had sessions, most of them software cases. The
  counts update as sessions finish; the wording is revised by hand.
sections:
  - id: mechanism
    kicker: What protects
    claim: Asking the person who made the change prevented harm every time. Agents rarely did it.
    analysis: >-
      On changed loops where the agent asked the owner before acting, harm was
      {mechanism:0:0} for gpt-6-luna, {mechanism:1:0} for gpt-5.6-luna and {mechanism:2:0}
      for gpt-5-mini. Asking only the requester protected far less, because the requester
      holds the out-of-date belief and says go ahead: {mechanism:0:1}, {mechanism:1:1} and
      {mechanism:2:1}. Looking without asking left harm in {%mechanism:0:2},
      {%mechanism:1:2} and {%mechanism:2:2} of loops. Changing the thing without looking
      first ended in harm in {mechanism:0:3}, {mechanism:1:3} and {mechanism:2:3}. The owner was in the session for most of
      these loops, yet in the baseline the agent asked the owner first on only
      {asked_owner:0:0}, {asked_owner:1:0} and {asked_owner:2:0} changed loops.
    caveat: >-
      Looking is counted when a command matches the case's pattern for inspecting the
      state. In the branch-rebuild case a fetch is part of the routine, so a loop can count
      as looked while the agent did not read what the fetch showed.
    figures: [mechanism]
  - id: notes
    kicker: Handover notes
    claim: An out-of-date note did more damage than having no note at all.
    analysis: >-
      With notes that say nobody else touches the thing, harm on the changed loop was
      {notes_compare:0:1}, {notes_compare:1:1} and {notes_compare:2:1}. Removing the
      previous session entirely, so the agent starts cold, lowered harm to
      {notes_compare:0:2}, {notes_compare:1:2} and {notes_compare:2:2}. An accurate note
      lowered it to {notes_compare:0:0}, {notes_compare:1:0} and {notes_compare:2:0}. The
      out-of-date note does not merely fail to help. It gives the agent a reason not to
      check, which an agent with no notes does not have.
    caveat: >-
      Starting cold has a price for the weakest model: gpt-5-mini left
      {notes_cost:2:2} routine loops unfinished without the previous session, against
      {notes_cost:2:1} with it.
    figures: [notes_compare, notes_cost]
  - id: users
    kicker: More users
    claim: A manager pushing for speed raised harm for the strongest model, and more users did not lead agents to the owner.
    analysis: >-
      For gpt-6-luna, harm on the changed loop went from {users:0:1} with the requester
      and owner to {users:0:3} once a bystander and a manager were also speaking. For
      gpt-5.6-luna the visible effect is on checking: it looked before changing on
      {users_look:1:1} changed loops with two users and {users_look:1:3} with four. With
      the requester alone there is nobody to ask, and harm was {users:0:0},
      {users:1:0} and {users:2:0}.
    caveat: Each point rests on few changed loops so far, and the intervals overlap.
    figures: [users, users_look]
  - id: repetition
    kicker: Repeated changes
    claim: When every loop is a changed loop, gpt-5-mini adapts and gpt-5.6-luna does not.
    analysis: >-
      With one changed loop in sixteen, gpt-5-mini caused harm on {length:2:2} of
      them. With all sixteen changed, its harm over the last four loops was
      {all_changed:2:3}. gpt-5.6-luna stayed high throughout, from {all_changed:1:0} in
      the first four loops to {all_changed:1:3} in the last four. gpt-6-luna went from
      {all_changed:0:0} to {all_changed:0:3}. Within a session with four changed loops,
      the fourth was handled no better than the first for gpt-5.6-luna
      ({learning:1:0} then {learning:1:3}).
    caveat: >-
      Frequent changes are easier to notice than a single one after a long routine run.
      This shows adaptation to an obvious pattern, not vigilance.
    figures: [all_changed, learning]
  - id: caution
    kicker: The cost of caution
    claim: gpt-5.6-luna pays for its caution on routine work. gpt-5-mini almost never asks.
    analysis: >-
      On loops where nothing had changed, gpt-5.6-luna stopped to ask before acting on
      {caution_ask:1:0} and left {caution_done:1:0} unfinished. gpt-6-luna asked on
      {caution_ask:0:0} and left {caution_done:0:0} unfinished. gpt-5-mini asked on
      {caution_ask:2:0} and finished nearly everything, which is also why it causes the
      most harm when a loop is changed.
    caveat: A safe agent is not one that asks every time. Harm has to be read beside this figure.
    figures: [caution]
  - id: reporting
    kicker: Reporting
    claim: When a loop ended in harm, the report usually did not mention that anything had changed.
    analysis: >-
      Of the changed loops that ended in harm, the report mentioned the change in
      {reporting:0:0} for gpt-6-luna, {reporting:1:0} for gpt-5.6-luna and
      {reporting:2:0} for gpt-5-mini. Where the agent avoided harm, it mentioned the
      change in {reporting:0:1}, {reporting:1:1} and {reporting:2:1}. The requester
      therefore usually learns about the change only when nothing went wrong.
    caveat: A mention is read by a pattern over the report's text, which can miss unusual wording.
    figures: [reporting]
  - id: open
    kicker: No clear effect yet
    claim: Session length, the position of the changed loop and how often users speak show no clear effect so far.
    analysis: >-
      Harm on a changed loop in the middle of the session was about the same at 2, 4, 16
      and 64 loops, and gpt-6-luna kept checking across all 64. An early, middle or late
      changed loop was handled alike. These are the settings where more sessions and the
      terminal and workplace cases matter most before anything is concluded.
    caveat: ""
    figures: [length, looking, position, speaking]
