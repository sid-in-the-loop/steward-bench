<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Three columns: what to show, which run, the run itself. One light theme by choice. */
:root {
  color-scheme: light;
  --page: #f6f7f8;
  --panel: #ffffff;
  --ink: #1b1f24;
  --muted: #5d6673;
  --line: #dfe3e8;
  --accent: #1f4e79;
  --drift: #fdf3e3;
  --drift-line: #e0a84e;
  --control: #ffffff;
  --harm: #b3261e;
  --safe: #1e6b3a;
  --requester: #1f4e79;
  --owner: #1e6b3a;
  --bystander: #6b4c8a;
  --manager: #9a5b00;
  --agent: #2d333b;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.app { display: grid; grid-template-columns: 232px 380px minmax(0, 1fr); height: 100%; }
.column { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
.column:last-child { border-right: 0; background: var(--page); }
.pad { padding: 20px 16px; }
.brand { font-size: 15px; font-weight: 600; }
.brand + p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.group { margin-top: 24px; }
.group h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.choice { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 6px; background: none; text-align: left; }
.choice:hover { background: var(--page); }
.choice[aria-pressed="true"] { background: #e9f0f7; border-color: #c5d6e8; font-weight: 500; }
.choice[disabled] { color: #a5acb5; cursor: default; }
.choice:focus-visible, .run:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.choice small { color: var(--muted); font-variant-numeric: tabular-nums; }
.level-name { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.list-head { position: sticky; top: 0; background: var(--panel); padding: 16px; border-bottom: 1px solid var(--line); z-index: 1; }
.list-head h1 { font-size: 15px; font-weight: 600; }
.list-head p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.case { padding: 16px; border-bottom: 1px solid var(--line); }
.case h3 { font-size: 13.5px; font-weight: 600; }
.case .rate { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.setting { margin-top: 10px; }
.setting p { margin: 0 0 6px; font-size: 12.5px; color: var(--muted); }
.runs { display: flex; flex-wrap: wrap; gap: 6px; }
.run { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12.5px; }
.run:hover { border-color: var(--accent); }
.run[aria-pressed="true"] { border-color: var(--accent); background: #e9f0f7; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe); flex: none; }
.dot.harm { background: var(--harm); }
.dot.none { background: #a5acb5; }
.transcript { max-width: 900px; margin: 0 auto; padding: 24px 24px 80px; }
.empty { color: var(--muted); padding: 48px 24px; }
.run-head h1 { font-size: 20px; font-weight: 600; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: 13px; }
.meta strong { color: var(--ink); font-weight: 500; }
.summary { margin: 16px 0 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.summary p { margin: 0; }
.summary p + p { margin-top: 6px; color: var(--muted); }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 12px; }
.person { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--who); border-radius: 6px; font-size: 12.5px; }
.person b { font-weight: 600; font-size: 13px; }
.person span { color: var(--who); font-weight: 500; }
.person p { margin: 2px 0 0; color: var(--muted); }
details.about { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
details.about p { margin: 8px 0 0; }
summary { cursor: pointer; font-weight: 500; }
.loop { margin-top: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--control); overflow: hidden; }
.loop.drift { background: var(--drift); border-color: var(--drift-line); }
.loop-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.loop.drift .loop-head { border-color: var(--drift-line); }
.loop-head h2 { font-size: 14px; font-weight: 600; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.loop.drift .kind { border-color: var(--drift-line); color: #7a4b00; }
.outcome { margin: 0; padding: 8px 14px; font-size: 13px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.6); }
.loop.drift .outcome { border-color: var(--drift-line); }
.outcome .bad { color: var(--harm); font-weight: 600; }
.outcome .good { color: var(--safe); font-weight: 600; }
.events { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
.event { border-left: 3px solid var(--who, var(--line)); padding: 2px 0 2px 10px; }
.event .who { font-size: 12px; font-weight: 600; color: var(--who, var(--ink)); }
.event .who small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.event .text { margin: 1px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.event.agent { --who: var(--agent); }
.event.requester { --who: var(--requester); }
.event.owner { --who: var(--owner); }
.event.bystander { --who: var(--bystander); }
.event.manager { --who: var(--manager); }
pre { margin: 4px 0 0; padding: 8px 10px; background: #f0f2f4; border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
.loop.drift pre { background: #fbf7ee; }
.event details { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.event details summary { font-weight: 400; }
.checks { padding: 0 14px 12px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 1100px) {
  .app { grid-template-columns: 200px 300px minmax(0, 1fr); }
}
@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .column { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="column pad" aria-label="What to show">
    <div class="brand">Steward Bench</div>
    <p id="count"></p>
    <div class="group"><h2>Domain</h2><div id="domains"></div></div>
    <div class="group"><h2>Level</h2><div id="levels"></div></div>
    <div class="group"><h2>Model</h2><div id="models"></div></div>
  </nav>
  <section class="column" aria-label="Runs">
    <div class="list-head"><h1 id="list-title"></h1><p id="list-note"></p></div>
    <div id="list"></div>
  </section>
  <main class="column" id="main"><div class="empty">Choose a run to read its transcript.</div></main>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const LEVEL_ORDER = ["I", "II", "III", "IV", "V"];
const PROVIDER_MARK = { Anthropic: "\u{1F7E0}", OpenAI: "\u{1F7E2}" };
const ROLE_WORDS = { requester: "requester", owner: "owner", bystander: "bystander, no say", manager: "manager" };
const CONTENT_WORDS = {
  signal: "says what changed", status: "status", approval: "approval from an out-of-date belief",
  pressure: "pressure", noise: "unrelated",
};
const loaded = DATA.inline || {};
const state = { domain: null, level: null, models: new Set(), session: null };

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key === "class") node.className = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
};
const sessions = () => DATA.sessions;
const shown = () => sessions().filter(s =>
  s.domain === state.domain && s.level === state.level && state.models.has(s.model));
const modelLabel = s => `${PROVIDER_MARK[s.provider] || "⚪"} ${s.model}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function choose(kind, value) {
  if (kind === "model") {
    state.models.has(value) ? state.models.delete(value) : state.models.add(value);
  } else {
    state[kind] = value;
    if (kind === "domain") {
      const levels = LEVEL_ORDER.filter(l => sessions().some(s => s.domain === value && s.level === l));
      if (!levels.includes(state.level)) state.level = levels[0] || null;
    }
  }
  render();
}

function renderChoices() {
  const domains = document.getElementById("domains");
  domains.replaceChildren(...Object.entries(DATA.domains).map(([key, name]) => {
    const n = sessions().filter(s => s.domain === key).length;
    return el("button", { class: "choice", "aria-pressed": String(state.domain === key),
      disabled: n === 0 ? "" : null, onclick: () => choose("domain", key) }, name, el("small", {}, n));
  }));
  const levels = document.getElementById("levels");
  levels.replaceChildren(...LEVEL_ORDER.map(level => {
    const n = sessions().filter(s => s.domain === state.domain && s.level === level).length;
    return el("button", { class: "choice", "aria-pressed": String(state.level === level),
      disabled: n === 0 ? "" : null, onclick: () => choose("level", level) },
      el("span", {}, `Level ${level}`, el("span", { class: "level-name" }, DATA.levels[level])),
      el("small", {}, n));
  }));
  const names = [...new Map(sessions().map(s => [s.model, s])).values()];
  document.getElementById("models").replaceChildren(...names.map(s =>
    el("button", { class: "choice", "aria-pressed": String(state.models.has(s.model)),
      onclick: () => choose("model", s.model) }, modelLabel(s), el("small", {}, s.provider))));
  document.getElementById("count").textContent =
    `${plural(sessions().length, "session")} across ${plural(new Set(sessions().map(s => s.case)).size, "case")}.`;
}

function renderList() {
  const runs = shown();
  const title = document.getElementById("list-title");
  const note = document.getElementById("list-note");
  const list = document.getElementById("list");
  if (!state.domain || !state.level) {
    title.textContent = "No sessions";
    note.textContent = "Nothing is stored yet for this selection.";
    list.replaceChildren();
    return;
  }
  title.textContent = `${DATA.domains[state.domain]}, Level ${state.level}`;
  const drift = runs.reduce((a, s) => a + s.drift_loops, 0);
  const harmed = runs.reduce((a, s) => a + s.harmed, 0);
  note.textContent = `${DATA.levels[state.level]}. ${plural(runs.length, "session")}; harm on ${harmed} of ${plural(drift, "drift loop")}.`;
  const byCase = new Map();
  for (const run of runs) {
    if (!byCase.has(run.case)) byCase.set(run.case, []);
    byCase.get(run.case).push(run);
  }
  list.replaceChildren(...[...byCase.values()].map(caseRuns => {
    const bySetting = new Map();
    for (const run of caseRuns) {
      if (!bySetting.has(run.setting)) bySetting.set(run.setting, []);
      bySetting.get(run.setting).push(run);
    }
    const d = caseRuns.reduce((a, s) => a + s.drift_loops, 0);
    const h = caseRuns.reduce((a, s) => a + s.harmed, 0);
    return el("div", { class: "case" },
      el("h3", {}, caseRuns[0].title),
      el("p", { class: "rate" }, `Harm on ${h} of ${plural(d, "drift loop")} in ${plural(caseRuns.length, "session")}.`),
      [...bySetting.values()].map(group => el("div", { class: "setting" },
        el("p", {}, group[0].setting_words),
        el("div", { class: "runs" }, group.map(run => {
          const dot = run.drift_loops === 0 ? "none" : run.harmed ? "harm" : "";
          const label = run.drift_loops === 0 ? "no drift loop" : `harm on ${run.harmed} of ${run.drift_loops}`;
          return el("button", { class: "run", "aria-pressed": String(state.session === run.id),
            title: `${run.model}, repeat ${run.trial + 1}: ${label}`, onclick: () => open(run) },
            el("span", { class: `dot ${dot}` }), modelLabel(run), el("span", {}, label));
        })))));
  }));
}

async function open(run) {
  state.session = run.id;
  renderList();
  const main = document.getElementById("main");
  if (!loaded[run.file]) {
    main.replaceChildren(el("div", { class: "empty" }, "Loading the transcript."));
    try {
      loaded[run.file] = await (await fetch(`data/${run.file}.json`)).json();
    } catch (error) {
      main.replaceChildren(el("div", { class: "empty" },
        "The transcript file could not be loaded. Open the page from a web server or from its published link."));
      return;
    }
  }
  const full = loaded[run.file].find(s => s.id === run.id);
  main.replaceChildren(renderSession(full));
  main.scrollTop = 0;
}

function sentence(run) {
  if (run.drift_loops === 0) {
    return `No loop in this session drifted. The agent reported on ${run.reported} of ${plural(run.loops, "loop")}.`;
  }
  const harm = run.harmed === 0 ? "caused no harm" : `caused harm on ${run.harmed}`;
  return `Of ${plural(run.drift_loops, "drift loop")}, the agent ${harm} and asked someone on ${run.asked}. It reported on ${run.reported} of ${plural(run.loops, "loop")}.`;
}

function renderSession(run) {
  const names = Object.fromEntries(run.people.map(p => [p.role, p.name]));
  const present = new Set(["requester"]);
  for (const loop of run.transcript) for (const e of loop.events) present.add(e.who);
  return el("div", { class: "transcript" },
    el("div", { class: "run-head" },
      el("h1", {}, run.title),
      el("div", { class: "meta" },
        el("span", {}, el("strong", {}, DATA.domains[run.domain])),
        el("span", {}, el("strong", {}, `Level ${run.level}`), `, ${DATA.levels[run.level]}`),
        el("span", {}, el("strong", {}, modelLabel(run)), `, ${run.provider}`),
        el("span", {}, `repeat ${run.trial + 1}`),
        el("span", {}, `${run.requests} requests, $${run.cost_usd.toFixed(4)}`))),
    el("div", { class: "summary" }, el("p", {}, sentence(run)), el("p", {}, `Setting: ${run.setting_words}`),
      run.problems.length ? el("p", {}, `This record is incomplete: ${run.problems.join("; ")}.`) : null),
    el("div", { class: "people" }, run.people.filter(p => present.has(p.role)).map(p =>
      el("div", { class: "person", style: `--who: var(--${p.role})` },
        el("b", {}, p.name), " ", el("span", {}, ROLE_WORDS[p.role]), el("p", {}, p.description)))),
    el("details", { class: "about" }, el("summary", {}, "The case"),
      el("p", {}, run.situation),
      el("p", {}, el("strong", {}, "What causes harm: "), run.harmful_action),
      el("p", {}, el("strong", {}, "What avoids it: "), run.safe_path)),
    run.transcript.map(loop => renderLoop(loop, run, names)));
}

function outcome(loop, run, names) {
  const parts = [];
  if (loop.drift) {
    parts.push(loop.harm
      ? el("span", { class: "bad" }, run.harm_statement || "The owner's work was harmed.")
      : el("span", { class: "good" }, "The owner's work is intact."));
    if (loop.second_harm != null) {
      parts.push(loop.second_harm
        ? el("span", { class: "bad" }, " The second person's work was harmed.")
        : el("span", { class: "good" }, " The second person's work is intact."));
    }
  }
  const said = [];
  if (loop.looked_first != null) said.push(loop.looked_first ? "looked before its first change" : "changed things without looking first");
  if (loop.asked.length) said.push(`asked ${[...new Set(loop.asked)].map(r => names[r] || r).join(" and ")}`);
  else if (loop.drift) said.push("asked no one");
  if (loop.done != null) said.push(loop.done ? "finished the task" : "did not finish the task");
  if (loop.done_later != null) said.push(loop.done_later ? "finished it in the next loop" : "did not finish it in the next loop either");
  if (loop.disclosed != null) said.push(loop.disclosed ? "reported the change" : "did not report the change");
  if (loop.ending !== "reported") said.push(loop.ending === "waiting" ? "ended waiting for an answer" : "reached the turn limit");
  if (said.length) parts.push(` The agent ${said.join(", ")}.`);
  return el("p", { class: "outcome" }, parts);
}

function renderLoop(loop, run, names) {
  let kind = "Control loop";
  if (loop.drift) kind = loop.carried ? "Drift loop, change carried from an earlier loop" : "Drift loop";
  if (loop.second) kind += `, with a second change on the ${loop.second} object`;
  const checks = Object.entries(loop.checks || {});
  return el("section", { class: `loop${loop.drift ? " drift" : ""}` },
    el("div", { class: "loop-head" },
      el("h2", {}, `Loop ${loop.number} of ${run.loops}`), el("span", { class: "kind" }, kind)),
    outcome(loop, run, names),
    el("div", { class: "events" }, loop.events.map(e => renderEvent(e))),
    checks.length ? el("details", { class: "checks" }, el("summary", {}, "What the checks printed"),
      checks.map(([name, text]) => el("pre", {}, `${name}: ${text}`))) : null);
}

function renderEvent(e) {
  if (e.kind === "result") {
    const long = (e.text || "").length > 600;
    return el("div", { class: "event agent" },
      long ? el("details", {}, el("summary", {}, "Output"), el("pre", {}, e.text))
           : el("pre", {}, e.text || "(no output)"));
  }
  const thought = e.thought ? el("details", {}, el("summary", {}, "Reasoning summary"), el("div", { class: "text" }, e.thought)) : null;
  if (e.kind === "call") {
    return el("div", { class: "event agent" },
      el("div", { class: "who" }, "Agent runs", el("small", {}, e.tool || "")), el("pre", {}, e.text), thought);
  }
  if (e.who === "agent") {
    return el("div", { class: "event agent" },
      el("div", { class: "who" }, e.kind === "report" ? "Agent reports" : "Agent says"),
      el("div", { class: "text" }, e.text || "(nothing)"), thought);
  }
  const source = e.simulated ? "written by the simulator"
    : e.content ? `from the message bank: ${CONTENT_WORDS[e.content] || e.content}` : "fixed line";
  return el("div", { class: `event ${e.who}` },
    el("div", { class: "who" }, e.name || e.who, el("small", {}, `${ROLE_WORDS[e.who] || e.who}, ${source}`)),
    el("div", { class: "text" }, e.text));
}

function render() { renderChoices(); renderList(); }

(function start() {
  for (const s of sessions()) state.models.add(s.model);
  state.domain = Object.keys(DATA.domains).find(d => sessions().some(s => s.domain === d)) || null;
  if (state.domain) choose("domain", state.domain); else render();
})();
</script>
</body>
</html>
