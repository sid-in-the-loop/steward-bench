<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Three columns: what to show, which session, the session itself. One light theme by choice. */
:root {
  color-scheme: light;
  --page: #f4f5f7;
  --panel: #ffffff;
  --ink: #161a1f;
  --muted: #5b6470;
  --faint: #8a929d;
  --line: #dde1e6;
  --accent: #1f4e79;
  --accent-soft: #e8eff7;
  --drift: #c96a00;
  --drift-soft: #fff4e5;
  --drift-mid: #fbd9a8;
  --control: #64748b;
  --control-soft: #f1f4f8;
  --harm: #c62828;
  --harm-soft: #fdecec;
  --safe: #1b7a43;
  --safe-soft: #e8f5ed;
  --requester: #2459c7;
  --owner: #7a3fd1;
  --bystander: #0e7c93;
  --manager: #c2307a;
  --terminal: #11161d;
  --terminal-ink: #e4e9ef;
  --terminal-muted: #9aa5b1;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px 420px minmax(0, 1fr); height: 100%; }
.column { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
.column:last-child { border-right: 0; background: var(--page); }

/* Left: domains with their levels, and the models. */
.nav { padding: 18px 12px; }
.brand { font-size: 15px; font-weight: 700; padding: 0 8px; }
.group { margin-top: 22px; }
.group-head { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.chev { display: inline-block; width: 10px; transition: transform .12s; color: var(--faint); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.group-body { margin-top: 6px; }
.group-body[hidden] { display: none; }
.domain-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 8px; border-radius: 6px; text-align: left; font-weight: 500; }
.domain-row:hover { background: var(--page); }
.domain-row.current { color: var(--accent); }
.domain-row .count, .level-row .count { margin-left: auto; color: var(--faint); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.levels { margin: 2px 0 6px 16px; padding-left: 8px; border-left: 1px solid var(--line); }
.level-row { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 6px; text-align: left; }
.level-row:hover { background: var(--page); }
.level-row b { font-weight: 600; min-width: 22px; }
.level-row span.name { color: var(--muted); font-size: 12.5px; }
.level-row[aria-pressed="true"] { background: var(--accent-soft); }
.level-row[aria-pressed="true"] b, .level-row[aria-pressed="true"] span.name { color: var(--accent); }
.level-row[disabled] { opacity: .4; cursor: default; }
.chips { display: flex; flex-direction: column; gap: 6px; padding: 0 4px; }

/* A model as a chip: the provider's mark, its name and the model's. */
.model { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border: 1px solid var(--line); border-radius: 7px; background: #f8f9fb; font-size: 12.5px; white-space: nowrap; }
.model .org { color: var(--muted); }
.model .sep { color: var(--faint); }
.model .mname { font-weight: 600; }
.mark { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; flex: none; }
.mark svg { width: 13px; height: 13px; }
.mark.OpenAI { background: #ffffff; color: #000000; box-shadow: inset 0 0 0 1px #d6d9de; }
.mark.Anthropic { background: #f0eee6; color: #191919; box-shadow: inset 0 0 0 1px #e1ddd0; }
.mark.Other { background: #e9ecf0; color: var(--muted); font-size: 10px; font-weight: 700; }
button.model { width: 100%; }
button.model[aria-pressed="false"] { opacity: .45; filter: grayscale(1); }
button.model[aria-pressed="true"] { border-color: #b9c9dc; background: var(--panel); }

/* Middle: cases, their configs and sessions. */
.list-head { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 16px 18px; border-bottom: 1px solid var(--line); }
.crumbs { font-size: 12.5px; color: var(--muted); }
.list-head h1 { font-size: 16px; font-weight: 600; margin-top: 2px; }
.case { padding: 16px 18px 18px; border-bottom: 1px solid var(--line); }
.case h3 { font-size: 14px; font-weight: 600; line-height: 1.35; }
.case .id { font: 11.5px var(--mono); color: var(--faint); margin-top: 2px; }
.setting { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; }
.config > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; list-style: none; cursor: pointer; }
.config > summary::-webkit-details-marker { display: none; }
.config > summary .label { font-size: 12px; font-weight: 600; color: var(--ink); margin-right: 2px; }
.config > summary .label::before { content: "\25B8"; display: inline-block; margin-right: 5px; color: var(--faint); transition: transform .12s; }
.config[open] > summary .label::before { transform: rotate(90deg); }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--control-soft); color: #3c4652; border: 1px solid #e3e7ec; }
.tag.drift { background: var(--drift-soft); color: #8a4a00; border-color: var(--drift-mid); }
.kv { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12.5px; }
.kv th, .kv td { text-align: left; padding: 4px 8px 4px 0; border-top: 1px solid #edf0f3; vertical-align: top; }
.kv th { font-weight: 500; color: var(--muted); width: 128px; }
.kv td.mono { font: 12px var(--mono); }
.users { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12.5px; }
.users th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
.users td { padding: 5px 8px 5px 0; border-bottom: 1px solid #edf0f3; vertical-align: top; }
.who-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.runs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.run { display: inline-flex; align-items: center; gap: 7px; padding: 3px 4px 3px 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 12.5px; }
.run:hover { border-color: #9fb4cc; }
.run[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.run .mname { font-weight: 600; }
.result { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.result.harm { background: var(--harm-soft); color: var(--harm); }
.result.safe { background: var(--safe-soft); color: var(--safe); }
.result.none { background: var(--control-soft); color: var(--muted); }

/* Right: the session. */
.transcript { max-width: 940px; margin: 0 auto; padding: 24px 28px 96px; }
.empty { color: var(--muted); padding: 48px 28px; }
.session-head h1 { font-size: 21px; font-weight: 600; line-height: 1.3; margin-top: 4px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.meta .pill { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 16px; }
.stat { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.bad b { color: var(--harm); }
.stat.good b { color: var(--safe); }
.incomplete { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--harm-soft); color: var(--harm); font-size: 13px; }
.map { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 16px; }
.map .cell { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; background: #e4e8ee; color: #4b5563; }
.map .cell.drift { background: #f0a030; color: #ffffff; }
.map .cell.harm { background: var(--harm); color: #ffffff; }
.map .key { display: inline-flex; align-items: center; gap: 5px; margin-left: 12px; font-size: 12px; color: var(--muted); }
.map .key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.filter { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); font-size: 12px; }
.filter button { padding: 4px 10px; color: var(--muted); }
.filter button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.panel { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.panel > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.panel p { margin: 8px 0 0; }
.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px; margin-top: 12px; }
.person { display: flex; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.person b { font-size: 13px; font-weight: 600; }
.person .role { color: var(--who); font-weight: 600; margin-left: 6px; }
.person p { margin: 2px 0 0; color: var(--muted); }
.avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #ffffff; background: var(--who); }
.avatar.small { width: 18px; height: 18px; font-size: 8.5px; }
.requester { --who: var(--requester); }
.owner { --who: var(--owner); }
.bystander { --who: var(--bystander); }
.manager { --who: var(--manager); }

/* A loop: a coloured rail and header for its kind, the handover, then the agent's work. */
.loop { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--control); border-radius: 10px; overflow: hidden; scroll-margin-top: 16px; }
.loop.drift { border-color: var(--drift-mid); border-left-color: var(--drift); }
.loop.harmed { border-left-color: var(--harm); }
.loop-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; background: linear-gradient(90deg, var(--control-soft), #ffffff 70%); border-bottom: 1px solid var(--line); }
.loop.drift .loop-head { background: linear-gradient(90deg, #fde3bd, var(--drift-soft) 45%, #ffffff); border-bottom-color: var(--drift-mid); }
.loop-no { display: flex; align-items: baseline; gap: 5px; }
.loop-no b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.loop-no span { font-size: 12px; color: var(--muted); }
.kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; background: var(--control); color: #ffffff; }
.loop.drift .kind { background: var(--drift); }
.kind-note { font-size: 12.5px; color: #8a4a00; }
.verdicts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #fcfcfd; }
.verdict { font-size: 12px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: #3c4652; }
.verdict.good { background: var(--safe-soft); border-color: #bfe0cb; color: var(--safe); }
.verdict.bad { background: var(--harm-soft); border-color: #f2c4c4; color: var(--harm); }
.verdict.strong { font-weight: 700; }
.phase { padding: 12px 16px 14px; }
.phase + .phase { border-top: 1px dashed var(--line); }
.phase-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.flow { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.bubble { min-width: 0; flex: 1; padding: 8px 12px; border-radius: 0 10px 10px 10px; background: color-mix(in srgb, var(--who) 8%, #ffffff); border: 1px solid color-mix(in srgb, var(--who) 26%, #ffffff); }
.byline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 12px; }
.byline b { font-size: 13px; color: var(--who); }
.byline .role { color: var(--who); font-weight: 500; }
.byline .src { color: var(--faint); }
.text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.agent { --who: #3b4350; }
.msg.agent .bubble { background: #ffffff; border-color: #cfd5dc; }
.msg.agent .byline b { color: var(--ink); }
.msg.agent .mark { width: 28px; height: 28px; border-radius: 50%; }
.msg.agent .mark svg { width: 16px; height: 16px; }
.msg.exchange .bubble { border-style: dashed; border-width: 1.5px; }
.msg.report .bubble { border: 1.5px solid var(--accent); background: #f6f9fc; }
.msg.report .byline b { color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); font-style: italic; padding-left: 38px; }
.step { margin-left: 38px; border-radius: 8px; overflow: hidden; background: var(--terminal); color: var(--terminal-ink); }
.step .cmd { display: flex; gap: 8px; padding: 8px 12px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.step .cmd .prompt { color: #7ee2a8; user-select: none; }
.step .out { border-top: 1px solid #263040; }
.step .out > summary { padding: 4px 12px; font-size: 11.5px; color: var(--terminal-muted); cursor: pointer; }
.step pre { margin: 0; padding: 6px 12px 10px; font: 12px/1.45 var(--mono); color: var(--terminal-muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; }
.thought { margin-left: 38px; font-size: 12.5px; color: var(--muted); }
.thought > summary { cursor: pointer; }
.thought .text { padding: 4px 0 0 12px; border-left: 2px solid var(--line); margin-top: 4px; }
.checks { padding: 0 16px 12px; font-size: 12.5px; color: var(--muted); }
.checks pre { margin: 6px 0 0; padding: 8px 10px; background: var(--control-soft); border-radius: 6px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 1200px) { .app { grid-template-columns: 220px 340px minmax(0, 1fr); } }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .column { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="column nav" aria-label="What to show">
    <div class="brand">Steward Bench</div>
    <section class="group">
      <button class="group-head" aria-expanded="true" data-body="tree"><span class="chev">&#9656;</span>Domains and levels</button>
      <div class="group-body" id="tree"></div>
    </section>
    <section class="group">
      <button class="group-head" aria-expanded="true" data-body="models"><span class="chev">&#9656;</span>Models</button>
      <div class="group-body chips" id="models"></div>
    </section>
  </nav>
  <section class="column" aria-label="Sessions">
    <div class="list-head"><div class="crumbs" id="crumbs"></div><h1 id="list-title"></h1></div>
    <div id="list"></div>
  </section>
  <main class="column" id="main"><div class="empty">Choose a session to read its transcript.</div></main>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const LEVEL_ORDER = ["I", "II", "III", "IV", "V"];
// Provider marks from the lobe-icons set (MIT licence).
const MARKS = {
  OpenAI: '<svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M9.205 8.658v-2.26c0-.19.072-.333.238-.428l4.543-2.616c.619-.357 1.356-.523 2.117-.523 2.854 0 4.662 2.212 4.662 4.566 0 .167 0 .357-.024.547l-4.71-2.759a.797.797 0 00-.856 0l-5.97 3.473zm10.609 8.8V12.06c0-.333-.143-.57-.429-.737l-5.97-3.473 1.95-1.118a.433.433 0 01.476 0l4.543 2.617c1.309.76 2.189 2.378 2.189 3.948 0 1.808-1.07 3.473-2.76 4.163zM7.802 12.703l-1.95-1.142c-.167-.095-.239-.238-.239-.428V5.899c0-2.545 1.95-4.472 4.591-4.472 1 0 1.927.333 2.712.928L8.23 5.067c-.285.166-.428.404-.428.737v6.898zM12 15.128l-2.795-1.57v-3.33L12 8.658l2.795 1.57v3.33L12 15.128zm1.796 7.23c-1 0-1.927-.332-2.712-.927l4.686-2.712c.285-.166.428-.404.428-.737v-6.898l1.974 1.142c.167.095.238.238.238.428v5.233c0 2.545-1.974 4.472-4.614 4.472zm-5.637-5.303l-4.544-2.617c-1.308-.761-2.188-2.378-2.188-3.948A4.482 4.482 0 014.21 6.327v5.423c0 .333.143.571.428.738l5.947 3.449-1.95 1.118a.432.432 0 01-.476 0zm-.262 3.9c-2.688 0-4.662-2.021-4.662-4.519 0-.19.024-.38.047-.57l4.686 2.71c.286.167.571.167.856 0l5.97-3.448v2.26c0 .19-.07.333-.237.428l-4.543 2.616c-.619.357-1.356.523-2.117.523zm5.899 2.83a5.947 5.947 0 005.827-4.756C22.287 18.339 24 15.84 24 13.296c0-1.665-.713-3.282-1.998-4.448.119-.5.19-.999.19-1.498 0-3.401-2.759-5.947-5.946-5.947-.642 0-1.26.095-1.88.31A5.962 5.962 0 0010.205 0a5.947 5.947 0 00-5.827 4.757C1.713 5.447 0 7.945 0 10.49c0 1.666.713 3.283 1.998 4.448-.119.5-.19 1-.19 1.499 0 3.401 2.759 5.946 5.946 5.946.642 0 1.26-.095 1.88-.309a5.96 5.96 0 004.162 1.713z"/></svg>',
  Anthropic: '<svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017l-1.344 3.46H0L6.57 3.522zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z"/></svg>',
};
const ROLE_WORDS = { requester: "requester", owner: "owner", bystander: "bystander, no say", manager: "manager" };
const CONTENT_WORDS = {
  signal: "says what changed", status: "status", approval: "approval from an out-of-date belief",
  pressure: "pressure", noise: "unrelated",
  disagreement: "exchange: disagreement", hearsay: "exchange: hearsay",
  retraction: "exchange: retraction", side_talk: "exchange: side talk", pile_up: "exchange: pile-up",
  shop_talk: "exchange: shop talk",
};
const EXCHANGE_KINDS = new Set(["disagreement", "hearsay", "retraction", "side_talk", "pile_up", "shop_talk"]);
const loaded = DATA.inline || {};
const state = { domain: null, level: null, models: new Set(), session: null, open: new Set(), driftOnly: false };

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key === "class") node.className = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
};
const sessions = () => DATA.sessions;
const shown = () => sessions().filter(s =>
  s.domain === state.domain && s.level === state.level && state.models.has(s.model));
const initials = name => name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

function mark(provider) {
  const node = el("span", { class: `mark ${MARKS[provider] ? provider : "Other"}`, title: provider });
  if (MARKS[provider]) node.innerHTML = MARKS[provider];
  else node.textContent = provider.slice(0, 1);
  return node;
}

function modelChip(s, tag = "span", attrs = {}) {
  return el(tag, { class: "model", ...attrs }, mark(s.provider),
    el("span", { class: "org" }, s.provider), el("span", { class: "sep" }, "/"),
    el("span", { class: "mname" }, s.model));
}

function choose(kind, value) {
  if (kind === "model") {
    state.models.has(value) ? state.models.delete(value) : state.models.add(value);
  } else if (kind === "place") {
    [state.domain, state.level] = value;
    state.open.add(state.domain);
  }
  render();
}

function toggleDomain(domain) {
  state.open.has(domain) ? state.open.delete(domain) : state.open.add(domain);
  renderChoices();
}

function renderChoices() {
  const domains = Object.entries(DATA.domains).filter(([key]) => sessions().some(s => s.domain === key));
  document.getElementById("tree").replaceChildren(...domains.map(([key, name]) => {
    const inDomain = sessions().filter(s => s.domain === key);
    const expanded = state.open.has(key);
    const row = el("button", { class: `domain-row${state.domain === key ? " current" : ""}`,
      "aria-expanded": String(expanded), onclick: () => toggleDomain(key) },
      el("span", { class: "chev" }, "▸"), name, el("span", { class: "count" }, inDomain.length));
    const levels = expanded ? el("div", { class: "levels" }, LEVEL_ORDER.map(level => {
      const n = inDomain.filter(s => s.level === level).length;
      return el("button", { class: "level-row",
        "aria-pressed": String(state.domain === key && state.level === level),
        disabled: n === 0 ? "" : null, onclick: () => choose("place", [key, level]) },
        el("b", {}, level), el("span", { class: "name" }, DATA.levels[level]),
        el("span", { class: "count" }, n));
    })) : null;
    return el("div", {}, row, levels);
  }));
  const models = [...new Map(sessions().map(s => [s.model, s])).values()];
  document.getElementById("models").replaceChildren(...models.map(s =>
    modelChip(s, "button", { "aria-pressed": String(state.models.has(s.model)),
      title: state.models.has(s.model) ? "Hide this model" : "Show this model",
      onclick: () => choose("model", s.model) })));
}

function tags(config) {
  return config.tags.map(t => el("span", { class: `tag${/drift|second|carried|recording/.test(t) && t !== "no drift" ? " drift" : ""}` }, t));
}

function configTable(config) {
  const table = el("table", { class: "kv" }, config.rows.map(([label, value]) =>
    el("tr", {}, el("th", {}, label), el("td", { class: label === "Setting" ? "mono" : null }, value))));
  const users = el("table", { class: "users" },
    el("tr", {}, ["User", "Speaks", "Unrelated", "Stance"].map(h => el("th", {}, h))),
    config.users.map(u => el("tr", {},
      el("td", {}, el("span", { class: `who-name ${u.role}` },
        el("span", { class: "avatar small" }, initials(u.name)), u.name,
        el("span", { style: "color: var(--muted); font-weight: 400" }, ROLE_WORDS[u.role] || u.role))),
      el("td", {}, u.speaks), el("td", {}, u.unrelated || "–"), el("td", {}, u.stance || "–"))));
  return [table, users];
}

function configBox(config) {
  return el("details", { class: "config" },
    el("summary", {}, el("span", { class: "label" }, "Config"), tags(config)),
    configTable(config));
}

function result(run) {
  if (run.drift_loops === 0) return el("span", { class: "result none" }, "no drift");
  return el("span", { class: `result ${run.harmed ? "harm" : "safe"}`,
    title: `${run.harmed} of ${run.drift_loops} drift loops harmed` }, `harm ${run.harmed}/${run.drift_loops}`);
}

function renderList() {
  const runs = shown();
  const list = document.getElementById("list");
  const title = document.getElementById("list-title");
  const crumbs = document.getElementById("crumbs");
  if (!state.domain || !state.level) {
    crumbs.textContent = "";
    title.textContent = "Nothing stored for this selection";
    list.replaceChildren();
    return;
  }
  crumbs.textContent = DATA.domains[state.domain];
  title.textContent = `Level ${state.level}: ${DATA.levels[state.level]}`;
  const byCase = new Map();
  for (const run of runs) {
    if (!byCase.has(run.case)) byCase.set(run.case, []);
    byCase.get(run.case).push(run);
  }
  list.replaceChildren(...[...byCase.values()].map(caseRuns => {
    const bySetting = new Map();
    for (const run of caseRuns) {
      if (!bySetting.has(run.setting)) bySetting.set(run.setting, []);
      bySetting.get(run.setting).push(run);
    }
    return el("div", { class: "case" },
      el("h3", {}, caseRuns[0].title), el("div", { class: "id" }, caseRuns[0].case),
      [...bySetting.values()].map(group => {
        const repeats = new Set(group.map(r => r.trial)).size > 1;
        return el("div", { class: "setting" }, configBox(group[0].config),
          el("div", { class: "runs" }, group.map(run =>
            el("button", { class: "run", "aria-pressed": String(state.session === run.id),
              title: `${run.provider} / ${run.model}, repeat ${run.trial + 1}`, onclick: () => open(run) },
              mark(run.provider), el("span", { class: "mname" }, run.model),
              repeats ? el("span", { class: "tag" }, `#${run.trial + 1}`) : null, result(run)))));
      }));
  }));
}

async function open(run) {
  state.session = run.id;
  renderList();
  const main = document.getElementById("main");
  if (!loaded[run.file]) {
    main.replaceChildren(el("div", { class: "empty" }, "Loading the transcript."));
    try {
      loaded[run.file] = await (await fetch(`data/${run.file}.json`)).json();
    } catch (error) {
      main.replaceChildren(el("div", { class: "empty" },
        "The transcript file could not be loaded. Open the page from a web server or from its published link."));
      return;
    }
  }
  const full = loaded[run.file].find(s => s.id === run.id);
  main.replaceChildren(renderSession(full));
  main.scrollTop = 0;
}

function stat(value, label, tone) {
  return el("div", { class: `stat${tone ? " " + tone : ""}` }, el("b", {}, value), el("span", {}, label));
}

function renderSession(run) {
  const names = Object.fromEntries(run.people.map(p => [p.role, p.name]));
  const present = new Set(run.config.users.map(u => u.role));
  for (const loop of run.transcript) for (const e of loop.events) present.add(e.who);
  const driftLoops = run.transcript.filter(l => l.drift);
  const looked = driftLoops.filter(l => l.looked_first).length;
  const body = el("div", { id: "loops" });
  const fill = () => body.replaceChildren(...run.transcript
    .filter(loop => !state.driftOnly || loop.drift)
    .map(loop => renderLoop(loop, run, names)));
  const filter = el("div", { class: "filter" }, [["All loops", false], ["Drift loops", true]].map(([label, value]) =>
    el("button", { "aria-pressed": String(state.driftOnly === value), onclick: event => {
      state.driftOnly = value;
      for (const b of event.target.parentNode.children) b.setAttribute("aria-pressed", String(b === event.target));
      fill();
    } }, label)));
  fill();
  return el("div", { class: "transcript" },
    el("div", { class: "session-head" },
      el("div", { class: "crumbs" }, `${DATA.domains[run.domain]}, Level ${run.level}: ${DATA.levels[run.level]}`),
      el("h1", {}, run.title),
      el("div", { class: "meta" }, modelChip(run),
        el("span", { class: "pill" }, `repeat ${run.trial + 1}`),
        el("span", { class: "pill" }, `${run.requests} requests`),
        el("span", { class: "pill" }, `$${run.cost_usd.toFixed(4)}`),
        el("span", { class: "pill", style: "font-family: var(--mono)" }, run.case))),
    el("div", { class: "stats" },
      stat(run.loops, "loops"),
      stat(run.drift_loops, "drift loops"),
      run.drift_loops ? stat(`${run.harmed}/${run.drift_loops}`, "drift loops harmed", run.harmed ? "bad" : "good") : null,
      run.drift_loops ? stat(`${looked}/${run.drift_loops}`, "looked at the change first") : null,
      run.drift_loops ? stat(`${run.asked}/${run.drift_loops}`, "asked someone") : null,
      stat(`${run.reported}/${run.loops}`, "loops reported")),
    run.problems.length ? el("div", { class: "incomplete" }, `Incomplete record: ${run.problems.join("; ")}.`) : null,
    el("div", { class: "map" },
      run.transcript.map(loop => el("button", {
        class: `cell${loop.drift ? " drift" : ""}${loop.harm ? " harm" : ""}`,
        title: `Loop ${loop.number}: ${loop.drift ? (loop.harm ? "drift, harmed" : "drift") : "control"}`,
        onclick: () => {
          if (state.driftOnly && !loop.drift) filter.children[0].click();
          document.getElementById(`loop-${loop.number}`)?.scrollIntoView({ behavior: "smooth" });
        } }, loop.number)),
      el("span", { class: "key" }, el("i", { style: "background: #e4e8ee" }), "control"),
      el("span", { class: "key" }, el("i", { style: "background: #f0a030" }), "drift"),
      el("span", { class: "key" }, el("i", { style: "background: var(--harm)" }), "harmed"),
      filter),
    el("details", { class: "panel" }, el("summary", {}, "Config"),
      el("div", { class: "config" }, el("div", { style: "margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap" }, tags(run.config)), configTable(run.config))),
    el("details", { class: "panel" }, el("summary", {}, "The case"),
      el("p", {}, run.situation),
      el("p", {}, el("strong", {}, "Harmful action. "), run.harmful_action),
      el("p", {}, el("strong", {}, "Safe path. "), run.safe_path)),
    el("div", { class: "people" }, run.people.filter(p => present.has(p.role)).map(p =>
      el("div", { class: `person ${p.role}` }, el("span", { class: "avatar" }, initials(p.name)),
        el("div", {}, el("b", {}, p.name), el("span", { class: "role" }, ROLE_WORDS[p.role]),
          el("p", {}, p.description))))),
    body);
}

function verdicts(loop, run, names) {
  const chips = [];
  const chip = (text, tone = "", strong = false) =>
    chips.push(el("span", { class: `verdict ${tone}${strong ? " strong" : ""}` }, text));
  if (loop.drift) {
    loop.harm ? chip("Owner's work harmed", "bad", true) : chip("Owner's work intact", "good", true);
    if (loop.second_harm != null) {
      loop.second_harm ? chip("Second person's work harmed", "bad", true) : chip("Second person's work intact", "good", true);
    }
  }
  const tone = good => loop.drift ? (good ? "good" : "bad") : "";
  if (loop.looked_first != null) chip(loop.looked_first ? "Looked at the change first" : "Did not look at the change first", tone(loop.looked_first));
  const who = roles => [...new Set(roles)].map(r => names[r] || r).join(" and ");
  const later = loop.asked.filter(r => !loop.asked_first.includes(r));
  if (loop.asked_first.length) chip(`Asked ${who(loop.asked_first)} before changing`, tone(true));
  if (later.length) chip(`Asked ${who(later)} after changing`, tone(false));
  if (!loop.asked.length && loop.drift) chip("Asked no one", "bad");
  if (loop.done != null) chip(loop.done ? "Task finished" : "Task not finished", loop.done ? "" : "bad");
  if (loop.done_later != null) chip(loop.done_later ? "Finished next loop" : "Not finished next loop", loop.done_later ? "good" : "bad");
  if (loop.disclosed != null) chip(loop.disclosed ? "Reported the change" : "Did not report the change", tone(loop.disclosed));
  if (loop.ending !== "reported") chip(loop.ending === "waiting" ? "Ended waiting for an answer" : "Reached the turn limit", "bad");
  return chips.length ? el("div", { class: "verdicts" }, chips) : null;
}

function renderLoop(loop, run, names) {
  const notes = [];
  if (loop.carried) notes.push("change carried from an earlier loop");
  if (loop.second) notes.push(`second change on the ${loop.second} object`);
  const first = loop.events.findIndex(e => e.who === "agent" || e.who === "environment");
  const handover = first === -1 ? loop.events : loop.events.slice(0, first);
  const work = first === -1 ? [] : loop.events.slice(first);
  const checks = Object.entries(loop.checks || {});
  return el("section", { class: `loop${loop.drift ? " drift" : ""}${loop.harm ? " harmed" : ""}`, id: `loop-${loop.number}` },
    el("div", { class: "loop-head" },
      el("div", { class: "loop-no" }, el("span", {}, "Loop"), el("b", {}, loop.number), el("span", {}, `of ${run.loops}`)),
      el("span", { class: "kind" }, loop.drift ? "Drift" : "Control"),
      notes.length ? el("span", { class: "kind-note" }, notes.join(", ")) : null),
    verdicts(loop, run, names),
    handover.length ? el("div", { class: "phase" }, el("div", { class: "phase-label" }, "Handover"),
      el("div", { class: "flow" }, handover.map(e => renderEvent(e, run)))) : null,
    work.length ? el("div", { class: "phase" }, el("div", { class: "phase-label" }, "Agent's work"),
      el("div", { class: "flow" }, steps(work, run))) : null,
    checks.length ? el("details", { class: "checks" }, el("summary", {}, "What the checks printed"),
      checks.map(([name, text]) => el("pre", {}, `${name}: ${text}`))) : null);
}

function steps(events, run) {
  const out = [];
  for (let i = 0; i < events.length; i++) {
    const e = events[i];
    if (e.kind === "call") {
      const next = events[i + 1];
      const output = next && next.kind === "result" ? next : null;
      if (output) i++;
      if (e.thought) out.push(thought(e.thought));
      out.push(command(e, output));
    } else {
      out.push(renderEvent(e, run));
    }
  }
  return out;
}

function thought(text) {
  return el("details", { class: "thought" }, el("summary", {}, "Reasoning summary"), el("div", { class: "text" }, text));
}

function command(call, output) {
  const text = output ? (output.text || "(no output)") : null;
  const lines = text ? text.split("\n").length : 0;
  return el("div", { class: "step" },
    el("div", { class: "cmd" }, el("span", { class: "prompt" }, "$"), el("span", {}, call.text)),
    text == null ? null : el("details", { class: "out", open: lines <= 14 && text.length <= 1200 ? "" : null },
      el("summary", {}, `Output, ${lines} line${lines === 1 ? "" : "s"}`), el("pre", {}, text)));
}

function renderEvent(e, run) {
  if (e.kind === "result") return command({ text: "(output)" }, e);
  if (e.kind === "probe" || e.who === "environment") return el("div", { class: "note" }, e.text);
  if (e.who === "agent") {
    const report = e.kind === "report";
    return el("div", {}, e.thought ? thought(e.thought) : null,
      el("div", { class: `msg agent${report ? " report" : ""}` }, mark(run.provider),
        el("div", { class: "bubble" },
          el("div", { class: "byline" }, el("b", {}, report ? "Report" : "Agent"), el("span", { class: "src" }, run.model)),
          el("div", { class: "text" }, e.text || "(nothing)"))));
  }
  const source = e.simulated ? "written by the simulator"
    : EXCHANGE_KINDS.has(e.content) ? CONTENT_WORDS[e.content]
    : e.content ? `message bank: ${CONTENT_WORDS[e.content] || e.content}` : "fixed line";
  const name = e.name || e.who;
  const exchange = EXCHANGE_KINDS.has(e.content) ? " exchange" : "";
  return el("div", { class: `msg ${e.who}${exchange}` }, el("span", { class: "avatar" }, initials(name)),
    el("div", { class: "bubble" },
      el("div", { class: "byline" }, el("b", {}, name), el("span", { class: "role" }, ROLE_WORDS[e.who] || e.who),
        el("span", { class: "src" }, source)),
      el("div", { class: "text" }, e.text)));
}

function render() { renderChoices(); renderList(); }

(function start() {
  for (const head of document.querySelectorAll(".group-head")) {
    head.addEventListener("click", () => {
      const body = document.getElementById(head.dataset.body);
      const expanded = head.getAttribute("aria-expanded") !== "true";
      head.setAttribute("aria-expanded", String(expanded));
      body.hidden = !expanded;
    });
  }
  for (const s of sessions()) state.models.add(s.model);
  const domain = Object.keys(DATA.domains).find(d => sessions().some(s => s.domain === d));
  if (!domain) { render(); return; }
  const level = LEVEL_ORDER.find(l => sessions().some(s => s.domain === domain && s.level === l));
  choose("place", [domain, level]);
})();
</script>
</body>
</html>
