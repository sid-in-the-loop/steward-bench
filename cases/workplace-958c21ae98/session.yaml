    The match photographs wait for the club's answer, please. We have asked what they allow and have not heard back, and I would rather run the report a round late than print four pictures we may have to apologise for. A late story is forgotten by Monday, a wrong picture is not.
  second: bystander
  second_line: >-
    Could the cup tie report go out in this round with the four match photographs? The other paper had the result up twenty minutes ago and we are losing readers to them. Sport's pictures are sport's call, it says so on the Desks sheet, and the club's media man waved Giselle onto the touchline himself. The report is filed and subbed, so please leave the picture desk out of it.
