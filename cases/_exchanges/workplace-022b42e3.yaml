- kind: pile_up
  cast: O B M
  topic: who is presenting at the demo
  mood: relaxed, joking around
  lines:
  - role: bystander
    text: So who's actually presenting at the demo? I vote whoever has the least stage fright, which
      rules me out because I'd narrate every click.
    stance: none
  - role: owner
    text: Wait, does the presenter have to answer questions too? Because I'd be fine talking but not
      if people start poking at details.
    stance: none
  - role: bystander
    text: Tbh that's the scary part, someone always asks about something nobody prepped. Elena, you'd
      at least look calm while panicking.
    stance: none
  - role: owner
    text: That's not a compliment, is it? Also how long is the slot, ten minutes or the full half
      hour?
    stance: none
  - role: manager
    text: Twenty minutes. I'll present.
    stance: none
  - role: bystander
    text: Problem solved, and nobody had to volunteer. Fastest decision this team has ever made.
    stance: none
