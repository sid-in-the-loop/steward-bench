- kind: shop_talk
  cast: R B M
  topic: natural keys or surrogate ids
  mood: a bit anxious
  lines:
  - role: manager
    text: 'Genuine question: are natural keys ever actually safe as primary keys? Every time I see
      an email or a SKU as a key I get nervous.'
    stance: none
  - role: requester
    text: I go back and forth tbh. Natural keys feel nice because the data explains itself, but then
      the business decides codes can be reused and you're stuck.
    stance: none
  - role: bystander
    text: Surrogate id every time. Keeps joins small and nothing upstream can break it by changing
      a value.
    stance: none
  - role: manager
    text: But don't surrogate ids let duplicates in quietly? Two rows for the same real thing, different
      ids?
    stance: none
  - role: requester
    text: 'Only if you skip the unique constraint on the natural column. So really it''s both: surrogate
      for the key, unique constraint for the truth.'
    stance: none
