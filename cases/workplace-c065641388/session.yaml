        arguments: {filepath: "/workspace/dumps/steward_run/SingleUserTurn-sf-hr-attrition-gcal/workspace/Attendance_next_week.xlsx", sheet_name: Attendance}
      - tool: create_workbook
        arguments: {filepath: "/workspace/dumps/steward_run/SingleUserTurn-sf-hr-attrition-gcal/workspace/Desk_Plan_next_week.xlsx"}
