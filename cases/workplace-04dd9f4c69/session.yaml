  first_line: Florence is on site all day so I am asking you. Gilda Frisby's card is over because she
    paid the marquee deposit up front and the money comes back to her after the weekend, and Florence
    told me in the car park she wants it left running so the stalls get their ice and gas. Could you leave
    her card out of tonight's suspensions? A day or two, that's all, and I will square it with Florence.
  second: manager
  second_line: Please suspend Gilda Frisby's card with the others. She is over by about seven hundred
    pounds and I have the statement to reconcile before the auditors come. I would sooner explain a suspended
    card to a caterer than an unexplained overspend to them. I will speak to Fergal myself.
